          label: 'Удалить',
          icon: '✕',
          tooltip: 'Удалить',
          onClick: () => {
            ModalManager.confirm({
              title: 'Удалить заметку?',
              message: 'Заметка будет удалена безвозвратно.',
              okLabel: 'Удалить',
              cancelLabel: 'Отмена',
              variant: 'danger'
            }).then((ok) => {
              if (!ok) return;
              NotesSystem.remove(note.id);
              ScreenRouter.show('notes');
            });
          }
        }));

        row.appendChild(actions);
        listWrap.appendChild(row);
      }

      wrap.appendChild(listWrap);
    }

    return wrap;
  };

  /* ==========================================================================
     МОДУЛЬ 4. BoardGroups
     Connected components по GameState.boardConnections.
     Одиночные вершины (без связей) группами не считаются.
     ========================================================================== */

  const BoardGroups = (() => {
    const compute = (connections) => {
      const parent = Object.create(null);

      const find = (x) => {
        if (!(x in parent)) { parent[x] = x; return x; }
        // Path compression.
        let r = x;
        while (parent[r] !== r) r = parent[r];
        while (parent[x] !== r) { const nx = parent[x]; parent[x] = r; x = nx; }
        return r;
      };

      const union = (a, b) => {
        const ra = find(a), rb = find(b);
        if (ra !== rb) parent[ra] = rb;
      };

      const conns = Array.isArray(connections) ? connections : [];
      for (let i = 0; i < conns.length; i++) {
        const c = conns[i];
        if (!c || !c.from || !c.to) continue;
        union(c.from, c.to);
      }

      const groups = new Map();
      for (const key in parent) {
        const r = find(key);
        if (!groups.has(r)) groups.set(r, []);
        groups.get(r).push(key);
      }
      return groups;
    };

    const byEvidence = (connections) => {
      const groups = compute(connections);
      const result = Object.create(null);
      const roots = Array.from(groups.keys()).sort();
      let idx = 0;
      for (let i = 0; i < roots.length; i++) {
        const members = groups.get(roots[i]);
        if (members.length < 2) continue;
        for (let j = 0; j < members.length; j++) {
          result[members[j]] = idx;
        }
        idx++;
      }
      return result;
    };

    const listGroups = (connections) => {
      const groups = compute(connections);
      const out = [];
      for (const [root, members] of groups) {
        if (members.length < 2) continue;
        out.push({ root, members: members.slice() });
      }
      out.sort((a, b) => b.members.length - a.members.length);
      return out;
    };

    return { compute, byEvidence, listGroups };
  })();

  /* ==========================================================================
     МОДУЛЬ 5. BoardEnhancer
     Получает уже готовый DOM-узел от фабрики ч. 15 и аккуратно расширяет
     его: новые кнопки в тулбаре, кнопка «заметка» на карточке, подсветка
     групп. Никакой DOM-логики ч. 15 не переписывает.
     ========================================================================== */

  const BoardEnhancer = (() => {

    const applyNoteMarkers = (canvas) => {
      const cards = canvas.querySelectorAll('.mc-board__card');
      for (let i = 0; i < cards.length; i++) {
        const card = cards[i];
        const id = card.getAttribute('data-card-id');
        if (!id) continue;
        if (NotesSystem.hasForEvidence(id)) card.setAttribute('data-has-note', 'true');
        else card.removeAttribute('data-has-note');
      }
    };

    const applyGroupMarkers = (canvas) => {
      const conns = GameState.get().boardConnections;
      const groups = BoardGroups.byEvidence(conns);
      const cards = canvas.querySelectorAll('.mc-board__card');
      for (let i = 0; i < cards.length; i++) {
        const card = cards[i];
        const id = card.getAttribute('data-card-id');
        if (!id) continue;
        if (groups[id] != null) card.setAttribute('data-group', String(groups[id] % 8));
        else card.removeAttribute('data-group');
      }
    };

    const buildNoteButton = (canvas, card, evidenceId) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mc-board__card-note';
      btn.setAttribute('aria-label', 'Заметка к улике');
      btn.textContent = '📝';
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        ev.preventDefault();
        const existing = NotesSystem.getForEvidence(evidenceId);
        const def = EvidenceRegistry.get(evidenceId);
        ModalManager.prompt({
          title: 'Заметка к улике',
          message: 'Улика: ' + (def ? def.title : evidenceId) +
                   '. Пустая заметка удалит существующую.',
          defaultValue: existing,
          multiline: true,
          placeholder: 'Запишите наблюдение или гипотезу…',
          okLabel: 'Сохранить',
          cancelLabel: 'Отмена'
        }).then((value) => {
          if (value == null) return;
          if (!String(value).trim()) {
            if (existing) NotesSystem.remove(NotesSystem.EVIDENCE_PREFIX + evidenceId);
          } else {
            NotesSystem.addForEvidence(evidenceId, value);
          }
          applyNoteMarkers(canvas);
        });
      });
      return btn;
    };

    /** Основная точка входа: расширяет DOM доски ч. 15. */
    const enhance = (node) => {
      if (!(node instanceof Node)) return node;

      const canvas  = node.querySelector('.mc-board__canvas');
      const toolbar = node.querySelector('.mc-board__toolbar');
      if (!canvas || !toolbar) return node;

      /* ----- Кнопки в тулбар (перед «← В меню») ----- */
      const backBtn = toolbar.lastElementChild; // «← В меню» по верстке ч.15

      let groupsOn = false;
      const btnGroups = UIComponents.button({
        label: 'Группы',
        variant: 'ghost',
        tooltip: 'Показать группы связанных карточек',
        onClick: () => {
          groupsOn = !groupsOn;
          if (groupsOn) canvas.setAttribute('data-groups', 'on');
          else canvas.removeAttribute('data-groups');
          applyGroupMarkers(canvas);
          A11y.announce(groupsOn ? 'Группы показаны' : 'Группы скрыты');
        }
      });

      const btnNotes = UIComponents.button({
        label: 'Заметки',
        variant: 'ghost',
        tooltip: 'Открыть заметки',
        onClick: () => ScreenRouter.show('notes')
      });

      if (backBtn) {
        toolbar.insertBefore(btnGroups, backBtn);
        toolbar.insertBefore(btnNotes, backBtn);
      } else {
        toolbar.appendChild(btnGroups);
        toolbar.appendChild(btnNotes);
      }

      /* ----- Кнопка «заметка» на каждой карточке ----- */
      const cards = canvas.querySelectorAll('.mc-board__card');
      for (let i = 0; i < cards.length; i++) {
        const card = cards[i];
        const id = card.getAttribute('data-card-id');
        if (!id) continue;
        if (!card.querySelector('.mc-board__card-note')) {
          card.appendChild(buildNoteButton(canvas, card, id));
        }
      }

      /* ----- Первичная раскраска ----- */
      applyNoteMarkers(canvas);
      applyGroupMarkers(canvas);

      /* ----- Обновляем группы при изменениях структуры связей -----
         Ловим всплывающие pointerup и click по canvas и пересчитываем
         разметку на следующем тике — так не мешаем собственным
         обработчикам ч. 15.
      ----------------------------------------------------------------- */
      const scheduleGroups = () => {
        const raf = global.requestAnimationFrame || ((fn) => setTimeout(fn, 0));
        raf(() => { applyGroupMarkers(canvas); });
      };
      canvas.addEventListener('pointerup', scheduleGroups);
      canvas.addEventListener('click', scheduleGroups);

      return node;
    };

    return { enhance, applyGroupMarkers, applyNoteMarkers };
  })();

  /* ==========================================================================
     МОДУЛЬ 6. NotesAndBoardWiring
     - Регистрирует экран 'notes'.
     - Оборачивает фабрику 'board' ч. 15 через публичную ссылку MC.BoardScreen.
     - Слушает notes:*, чтобы обновлять маркеры на доске, если она открыта.
     ========================================================================== */

  const NotesAndBoardWiring = (() => {
    let installed = false;

    const install = () => {
      if (installed) return;
      installed = true;

      /* ----- Экран заметок ----- */
      ScreenRouter.register('notes', makeNotesScreen, {
        title: 'Заметки',
        cache: false
      });

      /* ----- Обёртка экрана доски -----
         ScreenRouter.register в ч. 6 перезаписывает регистрацию и логирует
         предупреждение. Это допустимо: регистрация 'board' была сделана
         частью 15, и мы осознанно заменяем её расширенной версией,
         которая использует ровно тот же исходный код.
      ----------------------------------------------------------------- */
      const original = MC.BoardScreen && typeof MC.BoardScreen.make === 'function'
        ? MC.BoardScreen.make
        : null;

      if (!original) {
        Logger.warn('part16', 'MC.BoardScreen.make не найден; доска не обёрнута');
      } else {
        ScreenRouter.register('board', (params) => {
          let node = null;
          try { node = original(params); }
          catch (e) {
            Logger.error('part16', 'original board factory failed', e);
            return document.createElement('div');
          }
          try { BoardEnhancer.enhance(node); }
          catch (e) { Logger.error('part16', 'enhance failed', e); }
          return node;
        }, { title: 'Доска связей', cache: false });
      }

      /* ----- Реакция на изменения заметок: если доска открыта — обновим ----- */
      const refreshBoardIfOpen = () => {
        if (ScreenRouter.current() !== 'board') return;
        const canvas = document.querySelector('.mc-board__canvas');
        if (!canvas) return;
        try { BoardEnhancer.applyNoteMarkers(canvas); }
        catch (e) { Logger.error('part16', 'applyNoteMarkers failed', e); }
      };
      EventBus.on('notes:added',   refreshBoardIfOpen);
      EventBus.on('notes:updated', refreshBoardIfOpen);
      EventBus.on('notes:removed', refreshBoardIfOpen);
    };

    return { install };
  })();

  /* ==========================================================================
     ИНИЦИАЛИЗАЦИЯ ЧАСТИ 16
     ========================================================================== */

  Part16Styles.install();
  NotesAndBoardWiring.install();

  Object.assign(MC, {
    NotesSystem,
    NotesScreen: { make: makeNotesScreen },
    BoardGroups,
    BoardEnhancer,
    NotesAndBoardWiring
  });

  Logger.info('app', 'Часть 16 инициализирована: NotesSystem, NotesScreen, BoardGroups, BoardEnhancer');
  EventBus.emit('part16:ready', { at: Date.now(), profile: UIProfileManager.current() });

})(typeof window !== 'undefined' ? window : this);

/* ============================================================================
   КОНЕЦ ЧАСТИ 16.
   Тег <script> остаётся ОТКРЫТЫМ.
   Следующая часть (Часть 17) добавит систему временной шкалы: экран
   с хронологией событий и улик, использующий уже существующий
   GameState.timeline (части 1) и EvidenceAPI (части 8).
   Закрытие <\/script><\/body><\/html> произойдёт в Части 20.
   ========================================================================== */
<script>
'use strict';
/* ============================================================================
   MIND CASE — Часть 17. Хронология событий.
   Продолжение того же встроенного модуля. Никаких внешних загрузок.
   Модули:
     - Part17Styles    (CSS экрана хронологии)
     - TimelineAPI     (чтение/запись поверх существующего GameState.timeline;
                        единый источник — GameState, второй не создаём)
     - TimelineRecorder(подписки на существующие события и запись их в
                        хронологию; дубли исключаются через storyFlags)
     - TimelineScreen  (экран 'timeline' для ScreenRouter ч. 6)
     - TimelineWiring  (регистрация экрана, обёртка экрана 'journal' ч. 8
                        без переписывания её кода — добавляет кнопку
                        «Хронология» в существующий тулбар журнала)
   Правила:
     - новых глобальных переменных нет, только Object.assign(MC, {...});
     - второй RAF, второй GameState не создаются;
     - код ч. 8 не переписывается: используется публичная ссылка
       MC.JournalScreen.make для обёртки;
     - хронология пополняется только по уже существующим каналам
       частей 1–16; новых каналов не вводим (кроме ui:open-timeline);
     - сюжетных имён и событий не вводим.
   ========================================================================== */
(function (global) {
  'use strict';

  const MC = global.MindCaseApp;
  if (!MC) {
    try { console.error('[MC][Part17] MindCaseApp не найден. Части 1–16 должны быть загружены раньше.'); }
    catch (_) {}
    return;
  }
  if (MC.__part17Initialized) {
    try { console.warn('[MC][Part17] Часть 17 уже инициализирована, повторный запуск пропущен.'); }
    catch (_) {}
    return;
  }
  Object.defineProperty(MC, '__part17Initialized', {
    value: true, enumerable: false, writable: false, configurable: false
  });

  const { Logger, EventBus, GameState, UIComponents, A11y, ScreenRouter,
          EvidenceRegistry, EvidenceViewer, CharacterRegistry,
          UIProfileManager } = MC;

  /* ==========================================================================
     МОДУЛЬ 1. Part17Styles
     ========================================================================== */

  const Part17Styles = (() => {
    const ID = 'mc-part17-styles';

    const CSS = [
      '.mc-timeline{max-width:840px;margin:0 auto;padding:var(--mc-s-4);',
      'display:flex;flex-direction:column;gap:var(--mc-s-3);}',
      '.mc-timeline__head{display:flex;justify-content:space-between;',
      'align-items:baseline;gap:var(--mc-s-3);flex-wrap:wrap;}',
      '.mc-timeline__title{margin:0;font-family:var(--mc-font-mono);',
      'letter-spacing:.2em;color:var(--mc-fg-0);font-size:var(--mc-fs-xl);}',
      '.mc-timeline__count{color:var(--mc-fg-2);font-family:var(--mc-font-mono);',
      'font-size:var(--mc-fs-xs);letter-spacing:.06em;}',

      '.mc-timeline__filters{display:flex;gap:4px;flex-wrap:wrap;}',
      '.mc-timeline__filter{padding:6px 12px;background:transparent;',
      'border:1px solid var(--mc-line-0);border-radius:var(--mc-r-pill);',

      'letter-spacing:.08em;text-transform:uppercase;cursor:pointer;',
      'transition:background var(--mc-t-fast) var(--mc-ease),',
      'color var(--mc-t-fast) var(--mc-ease),',
      'border-color var(--mc-t-fast) var(--mc-ease);}',
      '.mc-timeline__filter:hover{color:var(--mc-fg-0);}',
      '.mc-timeline__filter:focus-visible{outline:none;box-shadow:var(--mc-focus);}',
      '.mc-timeline__filter[aria-pressed="true"]{background:var(--mc-bg-2);',
      'border-color:var(--mc-line-1);color:var(--mc-fg-0);}',

      '.mc-timeline__list{position:relative;display:flex;flex-direction:column;',
      'padding-left:22px;}',
      '.mc-timeline__list::before{content:"";position:absolute;left:7px;top:6px;',
      'bottom:6px;width:1px;background:var(--mc-line-0);}',

      '.mc-timeline__item{position:relative;display:flex;flex-direction:column;',
      'gap:2px;padding:10px 12px 10px 8px;margin-bottom:6px;',
      'background:var(--mc-bg-1);border:1px solid var(--mc-line-0);',
      'border-radius:var(--mc-r-2);cursor:default;',
      'transition:border-color var(--mc-t-fast) var(--mc-ease),',
      'background var(--mc-t-fast) var(--mc-ease);}',
      '.mc-timeline__item[data-clickable="true"]{cursor:pointer;}',
      '.mc-timeline__item[data-clickable="true"]:hover{',
      'border-color:var(--mc-line-1);background:var(--mc-bg-2);}',
      '.mc-timeline__item:focus-visible{outline:none;box-shadow:var(--mc-focus);}',
      '.mc-timeline__item::before{content:"";position:absolute;left:-19px;top:16px;',

      'box-shadow:0 0 0 3px var(--mc-bg-0);}',
      '.mc-timeline__item[data-kind="evidence"]::before{background:var(--mc-accent);}',
      '.mc-timeline__item[data-kind="dialogue"]::before{background:var(--mc-warn);}',
      '.mc-timeline__item[data-kind="manual"]::before{background:var(--mc-fg-2);}',
      '.mc-timeline__item[data-kind="system"]::before{background:var(--mc-ok);}',

      '.mc-timeline__time{font-family:var(--mc-font-mono);font-size:var(--mc-fs-xs);',
      'color:var(--mc-fg-2);letter-spacing:.06em;}',
      '.mc-timeline__label{color:var(--mc-fg-0);font-size:var(--mc-fs-sm);',
      'line-height:1.45;}',
      '.mc-timeline__hint{color:var(--mc-fg-3);font-family:var(--mc-font-mono);',
      'font-size:var(--mc-fs-xs);}',

      '.mc-timeline__empty{padding:var(--mc-s-6) var(--mc-s-4);text-align:center;',
      'color:var(--mc-fg-2);}',
      '.mc-timeline__empty h3{margin:0 0 var(--mc-s-2);color:var(--mc-fg-1);',
      'font-family:var(--mc-font-mono);letter-spacing:.18em;}',
      '.mc-timeline__empty p{margin:0;font-size:var(--mc-fs-sm);}',

      '.mc-journal__head-extra{display:flex;gap:6px;flex-wrap:wrap;}',

      '[data-mc-profile="mobile"] .mc-timeline{padding:var(--mc-s-3);}',
      '[data-mc-profile="mobile"] .mc-timeline__title{font-size:var(--mc-fs-lg);}',
      '[data-mc-profile="tv"] .mc-timeline{max-width:1180px;padding:var(--mc-s-5);}',
      '[data-mc-profile="tv"] .mc-timeline__title{font-size:var(--mc-fs-2xl);}',
      '[data-mc-profile="tv"] .mc-timeline__label{font-size:var(--mc-fs-md);}'
    ].join('');

    const install = () => {
      if (document.getElementById(ID)) return;
      const st = document.createElement('style');
      st.id = ID;
      st.textContent = CSS;
      document.head.appendChild(st);
    };

    return { install };
  })();

  /* ==========================================================================
     МОДУЛЬ 2. TimelineAPI
     Тонкая обёртка над существующим GameState.timeline и addTimeline.
     Ничего не дублирует: единое хранилище — GameState.
     ========================================================================== */

  const TimelineAPI = (() => {
    const addEntry = (label, meta) => {
      if (!label) return null;
      return GameState.addTimeline(String(label), meta || null);
    };

    const list = (opts) => {
      const o = opts || {};
      const arr = GameState.get().timeline.slice();
      // Свежие сверху.
      arr.sort((a, b) => (b.t || 0) - (a.t || 0));
      if (o.kind) {
        return arr.filter((e) => e && e.meta && e.meta.kind === o.kind);
      }
      return arr;
    };

    const count = () => GameState.get().timeline.length;

    return { addEntry, list, count };
  })();

  /* ==========================================================================
     МОДУЛЬ 3. TimelineRecorder
     Подписки на существующие события частей 1–16. Дубли исключаем через
     GameState.storyFlags (никаких новых полей не заводим).
     ========================================================================== */

  const TimelineRecorder = (() => {
    let installed = false;

    // Метка «первый диалог с персонажем уже записан в хронологию».
    const dialogueFlag = (charId) => 'timeline.dlg.' + charId;

    const onEvidenceDiscovered = (p) => {
      if (!p || !p.id) return;
      const def = p.def || EvidenceRegistry.get(p.id);
      const isTestimony = def && def.category === 'testimony';
      const label = isTestimony
        ? 'Получено показание: ' + (def ? def.title : p.id)
        : 'Обнаружена улика: ' + (def ? def.title : p.id);
      TimelineAPI.addEntry(label, {
        kind: 'evidence',
        id: p.id,
        category: def ? def.category : null
      });
    };

    const onDialogueStarted = (p) => {
      if (!p || !p.characterId) return;
      const flag = dialogueFlag(p.characterId);
      if (GameState.get().storyFlags[flag]) return;
      const ch = CharacterRegistry.get(p.characterId);
      const label = 'Начата беседа: ' + (ch ? ch.name : p.characterId);
      TimelineAPI.addEntry(label, {
        kind: 'dialogue',
        id: p.characterId,
        graphId: p.graphId || null
      });
      GameState.setFlag(flag, true);
    };

    const onZoneChanged = (p) => {
      // Записываем только первую смену зоны пролога — иначе шумно.
      if (!p || !p.zoneId) return;
      if (GameState.get().storyFlags['timeline.zone.first']) return;
      GameState.setFlag('timeline.zone.first', true);
      // Ничего в хронологию не пишем по смене зон — это не событие сюжета.
    };

    const install = () => {
      if (installed) return;
      installed = true;

      EventBus.on('evidence:discovered', onEvidenceDiscovered);
      EventBus.on('dialogue:started',    onDialogueStarted);
      EventBus.on('prologue:zone-changed', onZoneChanged);
    };

    return { install };
  })();

  /* ==========================================================================
     МОДУЛЬ 4. TimelineScreen
     Экран 'timeline'. Показывает элементы GameState.timeline.
     ========================================================================== */

  const makeTimelineScreen = (params) => {
    const initialFilter = (params && params.filter) || 'all';

    const wrap = document.createElement('div');
    wrap.className = 'mc-timeline';

    /* ---- Заголовок ---- */
    const head = document.createElement('div');
    head.className = 'mc-timeline__head';

    head.appendChild(UIComponents.el('h2', {
      className: 'mc-timeline__title', text: 'Хронология'
    }));

    head.appendChild(UIComponents.el('div', {
      className: 'mc-timeline__count',
      text: 'Записей: ' + TimelineAPI.count()
    }));

    wrap.appendChild(head);

    /* ---- Фильтры ---- */
    const filters = document.createElement('div');
    filters.className = 'mc-timeline__filters';

    const filterDefs = [
      { id: 'all',      label: 'Все' },
      { id: 'evidence', label: 'Улики' },
      { id: 'dialogue', label: 'Беседы' },
      { id: 'manual',   label: 'Заметки' }
    ];

    let activeFilter = initialFilter;
    const filterButtons = [];

    const applyFilter = (id) => {
      activeFilter = id;
      for (let i = 0; i < filterButtons.length; i++) {
        const b = filterButtons[i];
        b.setAttribute('aria-pressed', b.getAttribute('data-filter') === id ? 'true' : 'false');
      }
      ScreenRouter.show('timeline', { filter: id });
    };

    for (let i = 0; i < filterDefs.length; i++) {
      const def = filterDefs[i];
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'mc-timeline__filter';
      b.setAttribute('data-filter', def.id);
      b.setAttribute('aria-pressed', def.id === activeFilter ? 'true' : 'false');
      b.textContent = def.label;
      b.addEventListener('click', () => applyFilter(def.id));
      filters.appendChild(b);
      filterButtons.push(b);
    }
    wrap.appendChild(filters);

    /* ---- Список ---- */
    const items = (activeFilter === 'all')
      ? TimelineAPI.list()
      : TimelineAPI.list({ kind: activeFilter });

    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'mc-timeline__empty';
      empty.innerHTML = '<h3>ХРОНОЛОГИЯ ПОКА ПУСТА</h3>' +
        '<p>Здесь появятся события по мере расследования: обнаруженные улики, ' +
        'проведённые беседы, показания.</p>';
      wrap.appendChild(empty);
    } else {
      const list = document.createElement('div');
      list.className = 'mc-timeline__list';

      for (let i = 0; i < items.length; i++) {
        const entry = items[i];
        const kind = (entry.meta && entry.meta.kind) || 'system';

        const row = document.createElement('div');
        row.className = 'mc-timeline__item';
        row.setAttribute('data-kind', kind);
        row.setAttribute('tabindex', '0');

        // Время.
        const time = document.createElement('div');
        time.className = 'mc-timeline__time';
        time.textContent = formatTime(entry.t);
        row.appendChild(time);

        // Текст.
        const label = document.createElement('div');
        label.className = 'mc-timeline__label';
        label.textContent = entry.label || '(без описания)';
        row.appendChild(label);

        // Если улика — можно открыть просмотрщик.
        if (kind === 'evidence' && entry.meta && entry.meta.id &&
            EvidenceRegistry.has(entry.meta.id)) {
          row.setAttribute('data-clickable', 'true');
          row.setAttribute('role', 'button');
          row.setAttribute('aria-label', 'Открыть улику: ' + entry.label);
          const hint = document.createElement('div');
          hint.className = 'mc-timeline__hint';
          hint.textContent = 'Открыть улику →';
          row.appendChild(hint);

          const open = () => EvidenceViewer.open(entry.meta.id);
          row.addEventListener('click', open);
          row.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
          });
        } else if (kind === 'dialogue' && entry.meta && entry.meta.id &&
                   CharacterRegistry.has(entry.meta.id)) {
          // Беседа — просто индикатор, диалог не перезапускаем.
          const hint = document.createElement('div');
          hint.className = 'mc-timeline__hint';
          const ch = CharacterRegistry.get(entry.meta.id);
          hint.textContent = 'участник: ' + (ch ? ch.name : entry.meta.id);
          row.appendChild(hint);
        }

        list.appendChild(row);
      }

      wrap.appendChild(list);
    }

    /* ---- Нижняя панель ---- */
    const footer = document.createElement('div');
    footer.style.display = 'flex';
    footer.style.gap = 'var(--mc-s-2)';
    footer.style.flexWrap = 'wrap';
    footer.style.justifyContent = 'space-between';

    footer.appendChild(UIComponents.button({
      label: '← К журналу',
      variant: 'ghost',
      onClick: () => ScreenRouter.show('journal')
    }));

    footer.appendChild(UIComponents.button({
      label: 'Доска связей',
      variant: 'ghost',
      onClick: () => ScreenRouter.show('board')
    }));

    wrap.appendChild(footer);
    return wrap;
  };

  /* --------------------------------------------------------------------------
     Вспомогательная функция форматирования времени. Локальная для части 17.
     -------------------------------------------------------------------------- */
  const formatTime = (ts) => {
    try {
      const d = new Date(ts);
      const pad = (n) => String(n).padStart(2, '0');
      const now = new Date();
      const sameDay = d.getFullYear() === now.getFullYear() &&
                      d.getMonth() === now.getMonth() &&
                      d.getDate() === now.getDate();
      if (sameDay) return pad(d.getHours()) + ':' + pad(d.getMinutes());
      return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + ' ' +
             pad(d.getHours()) + ':' + pad(d.getMinutes());
    } catch (_) { return '—'; }
  };

  /* ==========================================================================
     МОДУЛЬ 5. TimelineWiring
     - Регистрирует экран 'timeline'.
     - Оборачивает фабрику 'journal' из ч. 8 (без переписывания её кода),
       добавляя кнопку «Хронология» в существующий заголовок журнала.
     - Слушает ui:open-timeline (новый канал).
     ========================================================================== */

  const TimelineWiring = (() => {
    let installed = false;

    /** Добавляет кнопку «Хронология» в шапку журнала (максимально неинвазивно). */
    const enhanceJournal = (node) => {
      if (!(node instanceof Node)) return node;
      const head = node.querySelector('.mc-journal__head');
      if (!head) return node;
      if (head.querySelector('[data-mc-id="journal-open-timeline"]')) return node;

      const btn = UIComponents.button({
        label: 'Хронология',
        variant: 'ghost',
        onClick: () => ScreenRouter.show('timeline')
      });
      btn.setAttribute('data-mc-id', 'journal-open-timeline');

      // Кнопку кладём справа в шапке журнала.
      let right = head.querySelector('.mc-journal__head-extra');
      if (!right) {
        right = document.createElement('div');
        right.className = 'mc-journal__head-extra';
        head.appendChild(right);
      }
      right.appendChild(btn);
      return node;
    };

    const install = () => {
      if (installed) return;
      installed = true;

      // Записываем события в хронологию.
      TimelineRecorder.install();

      // Регистрируем сам экран.
      ScreenRouter.register('timeline', makeTimelineScreen, {
        title: 'Хронология',
        cache: false
      });

      // Канал открытия извне.
      EventBus.on('ui:open-timeline', () => ScreenRouter.show('timeline'));

      // Обёртка экрана 'journal' — не переписывая ч. 8.
      const originalJournal = MC.JournalScreen && typeof MC.JournalScreen.make === 'function'
        ? MC.JournalScreen.make
        : null;

      if (!originalJournal) {
        Logger.warn('part17', 'MC.JournalScreen.make не найден; журнал не обёрнут');
      } else {
        ScreenRouter.register('journal', (params) => {
          let node = null;
          try { node = originalJournal(params); }
          catch (e) {
            Logger.error('part17', 'original journal factory failed', e);
            return document.createElement('div');
          }
          try { enhanceJournal(node); }
          catch (e) { Logger.error('part17', 'journal enhance failed', e); }
          return node;
        }, { title: 'Журнал', cache: false });
      }

      // Если хронология открыта, а в неё прилетело новое событие —
      // перерисуем экран, чтобы запись сразу появилась.
      const refreshIfOpen = () => {
        if (ScreenRouter.current() === 'timeline') ScreenRouter.show('timeline');
      };
      EventBus.on('state:timeline', refreshIfOpen);
    };

    return { install };
  })();

  /* ==========================================================================
     ИНИЦИАЛИЗАЦИЯ ЧАСТИ 17
     ========================================================================== */

  Part17Styles.install();
  TimelineWiring.install();

  Object.assign(MC, {
    TimelineAPI,
    TimelineRecorder,
    TimelineScreen: { make: makeTimelineScreen },
    TimelineWiring
  });

  Logger.info('app', 'Часть 17 инициализирована: TimelineAPI, TimelineRecorder, TimelineScreen (журнал обёрнут)');
  EventBus.emit('part17:ready', { at: Date.now(), profile: UIProfileManager.current() });

})(typeof window !== 'undefined' ? window : this);

/* ============================================================================
   КОНЕЦ ЧАСТИ 17.
   Тег <script> остаётся ОТКРЫТЫМ.
   Следующая часть (Часть 18) добавит финальную сцену пролога — короткий
   сюжетный поворот и переход к первой настоящей главе (маркер в GameState,
   не выдумывая событий сверх того, что уже установлено ч. 9–14).
   Закрытие <\/script><\/body><\/html> произойдёт в Части 20.
   ========================================================================== */
<script>
(function(global) {
  'use strict';

  const MC = global.MC || (global.MC = {});

  /* ==========================================================================
     МОДУЛЬ 5. CorridorScene
     CanvasScene для коридора (1920×1080). Оформление через RoomDrawer
     (без окон, с дверью кабинета и стойкой дежурного).
     ========================================================================== */

  const CorridorScene = (() => {
    const WORLD = Object.freeze({ w: 1920, h: 1080 });

    const create = (container) => {
      const scene = CanvasScene.create({
        parent: container,
        worldWidth: WORLD.w,
        worldHeight: WORLD.h,
        background: '#05080d',
        camera: { initialZoom: 0.65, minZoom: 0.5, maxZoom: 1.4, smoothing: 0.12 },
        lighting: {
          ambient: 'rgba(4,7,12,0.5)',
          vignette: 0.65,
          lights: [
            { x: WORLD.w * 0.50, y: WORLD.h * 0.20, radius: 280, color: 'rgba(217,164,65,0.45)', intensity: 0.8 },
            { x: WORLD.w * 0.22, y: WORLD.h * 0.35, radius: 220, color: 'rgba(140,170,210,0.35)', intensity: 0.5 }
          ],
          rainGlass: false
        }
      });

      if (!scene) return null;
      if (scene._fallback) return scene;

      // Отрисовка мира коридора.
      scene.onDraw((ctx, cam) => {
        // Коридор: комната без окон, с деревянными панелями и дверями.
        MC.RoomDrawer.drawRoom(ctx, {
          x: 0, y: 0, w: WORLD.w, h: WORLD.h,
          horizon: 0.45,
          wall: {
            color: '#111620',
            panelLines: 6,
            panelColor: 'rgba(25,35,50,0.65)',
            doors: [
              { x: WORLD.w * 0.12, y: WORLD.h * 0.25, w: WORLD.w * 0.08, h: WORLD.h * 0.48 },
              { x: WORLD.w * 0.80, y: WORLD.h * 0.25, w: WORLD.w * 0.08, h: WORLD.h * 0.48 }
            ]
          },
          floor: { color: '#090d14', boardRows: 5 },
          seed: 'corridor-interior'
        });

        // Стойка дежурного — в левой части.
        const sx = WORLD.w * 0.32;
        const sy = WORLD.h * 0.62;
        const sw = WORLD.w * 0.26;
        const sh = WORLD.h * 0.18;
        ctx.save();
        ctx.fillStyle = 'rgba(20,26,36,0.95)';
        ctx.fillRect(sx, sy, sw, sh);
        ctx.strokeStyle = 'rgba(70,90,120,0.4)';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx + 1, sy + 1, sw - 2, sh - 2);
        ctx.restore();
      });

      // Хотспоты коридора.
      const inspect = (id) => {
        const wasNew = EvidenceAPI.discover(id);
        if (wasNew) {
          TopBar.setSaveStatus('Новая улика', 'saved');
          setTimeout(() => TopBar.setSaveStatus('Готово', 'idle'), 1600);
          A11y.announce('Обнаружена улика');
        }
        EvidenceViewer.open(id);
      };

      // Журнал на стойке.
      scene.addHotspot(Hotspot.create({
        id: 'hs-logbook',
        kind: 'prop',
        tooltip: 'Журнал дежурств',
        rect: { x: WORLD.w * 0.38, y: WORLD.h * 0.64, w: WORLD.w * 0.08, h: WORLD.h * 0.08 },
        onInspect: () => inspect(CorridorEvidence.IDS.LOGBOOK)
      }));

      // Дежурный за стойкой.
      scene.addHotspot(Hotspot.create({
        id: 'hs-duty-officer',
        kind: 'character',
        tooltip: 'Дежурный',
        rect: { x: WORLD.w * 0.40, y: WORLD.h * 0.45, w: WORLD.w * 0.12, h: WORLD.h * 0.22 },
        onClick: () => {
          EventBus.emit('ui:start-dialogue', {
            characterId: DutyOfficerCharacter.ID,
            graphId: DutyOfficerDialogue.GRAPH_ID,
            title: 'Дежурный'
          });
          A11y.announce('Начата беседа с дежурным');
        },
        onInspect: () => {
          TopBar.setSaveStatus('Дежурный следит за порядком', 'idle');
          setTimeout(() => TopBar.setSaveStatus('Готово', 'idle'), 1400);
        }
      }));

      // Дверь назад в кабинет (возврат в пролог).
      scene.addHotspot(Hotspot.create({
        id: 'hs-back-to-office',
        kind: 'scenery',
        tooltip: 'Вернуться в кабинет',
        rect: { x: WORLD.w * 0.12, y: WORLD.h * 0.25, w: WORLD.w * 0.08, h: WORLD.h * 0.48 },
        onClick: () => {
          ScreenRouter.show('game');
          A11y.announce('Возврат в кабинет');
        },
        onInspect: () => {
          ScreenRouter.show('game');
        }
      }));

      scene.start();
      return scene;
    };

    return { create, WORLD };
  })();

  /* ==========================================================================
     МОДУЛЬ 6. CorridorScreen
     Фабрика для ScreenRouter под id 'corridor'.
     ========================================================================== */

  const makeCorridorScreen = () => {
    const wrap = document.createElement('div');
    wrap.className = 'mc-corridor';

    const stage = document.createElement('div');
    stage.className = 'mc-corridor__stage';
    stage.setAttribute('data-mc-corridor-stage', '1');
    wrap.appendChild(stage);

    const overlay = document.createElement('div');
    overlay.className = 'mc-corridor__overlay';

    const banner = document.createElement('div');
    banner.className = 'mc-corridor__banner';
    banner.appendChild(UIComponents.el('div', { className: 'mc-corridor__kicker', text: 'Коридор' }));
    banner.appendChild(UIComponents.el('h2', { className: 'mc-corridor__title', text: 'Пост дежурного' }));
    banner.appendChild(UIComponents.el('p', { className: 'mc-corridor__text',
      text: 'Тусклый свет ламп отражается на полу. За стойкой дежурный просматривает бумаги. ' +
            'Журнал дежурств лежит прямо перед вами.' }));
    overlay.appendChild(banner);

    overlay.appendChild(document.createElement('div'));

    const bottom = document.createElement('div');
    bottom.style.display = 'flex';
    bottom.style.flexDirection = 'column';
    bottom.style.gap = 'var(--mc-s-2)';

    const hint = document.createElement('div');
    hint.className = 'mc-corridor__hint';
    hint.textContent = 'Кликните по дежурному, чтобы начать беседу. Дверь слева — обратно в кабинет.';
    bottom.appendChild(hint);

    const actions = document.createElement('div');
    actions.className = 'mc-corridor__actions';

    actions.appendChild(UIComponents.button({
      label: 'В кабинет',
      variant: 'primary',
      onClick: () => ScreenRouter.show('game')
    }));

    actions.appendChild(UIComponents.button({
      label: 'Журнал',
      variant: 'ghost',
      onClick: () => ScreenRouter.show('journal')
    }));

    actions.appendChild(UIComponents.button({
      label: 'В меню',
      variant: 'ghost',
      onClick: () => ScreenRouter.show('menu')
    }));

    bottom.appendChild(actions);
    overlay.appendChild(bottom);

    wrap.appendChild(overlay);
    return wrap;
  };

  /* ==========================================================================
     МОДУЛЬ 7. CorridorWiring
     - Регистрация экрана 'corridor' в ScreenRouter.
     - Жизненный цикл CanvasScene коридора.
     - Добавление хотспота «Выйти в коридор» в существующую сцену пролога (ч. 9).
     ========================================================================== */

  const CorridorWiring = (() => {
    let installed = false;
    let currentCorridorScene = null;
    let addedDoorToPrologue = false;

    const destroyScene = () => {
      if (currentCorridorScene) {
        try { currentCorridorScene.dispose(); } catch (_) {}
      }
      currentCorridorScene = null;
    };

    const buildScene = () => {
      if (currentCorridorScene) return;
      const stage = document.querySelector('.mc-corridor [data-mc-corridor-stage]');
      if (!stage) return;
      currentCorridorScene = CorridorScene.create(stage);
    };

    const onSlotShown = (p) => {
      const id = p && p.id;
      if (id === 'corridor') {
        const raf = (global.requestAnimationFrame || ((fn) => setTimeout(fn, 16)));
        raf(() => buildScene());
      } else {
        destroyScene();
      }
    };

    // Добавляем дверь в коридор на сцену пролога (в зону cabinet).
    const addCorridorDoorToPrologue = () => {
      if (addedDoorToPrologue) return;
      const prologueScene = MC.PrologueWiring && typeof MC.PrologueWiring.scene === 'function'
        ? MC.PrologueWiring.scene()
        : null;
      if (!prologueScene) return;

      const WORLD = (MC.PrologueScene && MC.PrologueScene.WORLD) || { w: 1920, h: 1080 };

      prologueScene.addHotspot(Hotspot.create({
        id: 'hs-to-corridor',
        kind: 'scenery',
        tooltip: 'Выйти в коридор',
        rect: {
          x: WORLD.w * 0.06,
          y: WORLD.h * 0.30,
          w: WORLD.w * 0.06,
          h: WORLD.h * 0.42
        },
        onClick: () => {
          ScreenRouter.show('corridor');
          A11y.announce('Переход в коридор');
        },
        onInspect: () => {
          ScreenRouter.show('corridor');
        }
      }));

      addedDoorToPrologue = true;
    };

    const install = () => {
      if (installed) return;
      installed = true;

      CorridorEvidence.register();
      DutyOfficerCharacter.register();
      DutyOfficerDialogue.register();

      ScreenRouter.register('corridor', makeCorridorScreen, {
        title: 'Коридор',
        cache: false
      });

      EventBus.on('ui:slot-shown', onSlotShown);
      EventBus.on('prologue:scene-ready', addCorridorDoorToPrologue);

      // Догоняем, если сцена пролога уже была готова.
      const existing = MC.PrologueWiring && typeof MC.PrologueWiring.scene === 'function'
        ? MC.PrologueWiring.scene()
        : null;
      if (existing) addCorridorDoorToPrologue();
    };

    return { install, scene: () => currentCorridorScene };
  })();

  /* ==========================================================================
     ИНИЦИАЛИЗАЦИЯ ЧАСТИ 14
     ========================================================================== */

  Part14Styles.install();
  CorridorWiring.install();

  Object.assign(MC, {
    CorridorEvidence,
    DutyOfficerCharacter,
    DutyOfficerDialogue,
    CorridorScene,
    CorridorScreen: { make: makeCorridorScreen },
    CorridorWiring
  });

  Logger.info('app', 'Часть 14 инициализирована: CorridorEvidence, DutyOfficerCharacter, DutyOfficerDialogue, CorridorScene, CorridorWiring');
  EventBus.emit('part14:ready', { at: Date.now(), profile: UIProfileManager.current() });

})(typeof window !== 'undefined' ? window : this);
</script>
</body>
</html>
