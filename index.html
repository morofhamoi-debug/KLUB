<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Ambience TV</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: 'Segoe UI', 'Roboto', -apple-system, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #app { position: fixed; inset: 0; overflow: hidden; background: #000; }
  canvas.scene {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
    will-change: transform;
    backface-visibility: hidden;
  }
  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 3.5vh 4vw;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 100;
    transition: opacity 0.8s ease;
  }
  .hud.hidden { opacity: 0; }
  .clock { text-align: right; text-shadow: 0 2px 14px rgba(0,0,0,0.95); }
  .time {
    font-size: 4.2vh;
    font-weight: 300;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .date {
    font-size: 1.6vh;
    opacity: 0.72;
    margin-top: 0.5vh;
    letter-spacing: 0.02em;
  }
  .scene-info { text-align: left; text-shadow: 0 2px 14px rgba(0,0,0,0.95); }
  .scene-name {
    font-size: 2.2vh;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.92;
  }
  .scene-counter {
    font-size: 1.4vh;
    opacity: 0.6;
    margin-top: 0.5vh;
    letter-spacing: 0.1em;
    font-variant-numeric: tabular-nums;
  }
  .audio-badge {
    display: inline-block;
    margin-left: 1vh;
    font-size: 1.3vh;
    opacity: 0.5;
    letter-spacing: 0.08em;
  }
  .hint {
    position: absolute;
    bottom: 3.5vh;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.4vh;
    opacity: 0.42;
    text-align: center;
    pointer-events: none;
    letter-spacing: 0.14em;
    transition: opacity 1.2s ease;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    white-space: nowrap;
  }
  .hint.hidden { opacity: 0; }
  .fallback {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #fff; font-size: 3vh; text-align: center; padding: 4vw;
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="canvasA" class="scene"></canvas>
  <canvas id="canvasB" class="scene"></canvas>

  <div class="hud" id="hud">
    <div class="scene-info">
      <div class="scene-name" id="sceneName">Камин</div>
      <div class="scene-counter">
        <span id="sceneCounter">1 / 7</span>
        <span class="audio-badge" id="audioBadge">· звук выкл</span>
      </div>
    </div>
    <div class="clock">
      <div class="time" id="clockTime">--:--:--</div>
      <div class="date" id="clockDate">—</div>
    </div>
  </div>

  <div class="hint" id="hint">← → сцены · ↑ ↓ переходы · M звук</div>
</div>

<script>
(function () {
  'use strict';

  // ============================================================
  // 1. SHADER SOURCE
  // ============================================================

  const VERTEX_SRC = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const COMMON = `
    precision highp float;
    uniform vec2 u_resolution;
    uniform float u_time;
    uniform float u_quality;

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }

    float fbm(vec2 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 6; i++) {
        v += a * noise(p);
        p *= 2.02;
        a *= 0.5;
      }
      return v;
    }
  `;

  // -------- 1. FIREPLACE --------
  const FIRE_FRAG = COMMON + `
    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution;
      float aspect = u_resolution.x / u_resolution.y;
      float t = u_time;

      vec3 col = vec3(0.010, 0.005, 0.003);

      float d = length((uv - vec2(0.5, 0.20)) * vec2(aspect, 1.0));
      float ambient = exp(-d * 4.5);
      col += vec3(0.19, 0.065, 0.012) * ambient * (0.82 + 0.18 * sin(t * 4.1 + uv.y * 7.0 + uv.x * 3.0));

      // Logs
      float logRegion = smoothstep(0.22, 0.17, uv.y);
      if (logRegion > 0.0) {
        vec2 logUV = uv;
        float wood = fbm(logUV * vec2(28.0, 7.0) + vec2(t * 0.03, 0.0));
        float wood2 = fbm(logUV * vec2(14.0, 4.0) + 5.0);
        vec3 logColor = vec3(0.055, 0.028, 0.014) * (0.45 + wood * 0.9);
        logColor *= (0.65 + wood2 * 0.7);

        float ember = pow(fbm(logUV * vec2(45.0, 22.0) + vec2(t * 0.35, 0.0)), 4.0) * 3.2;
        ember *= smoothstep(0.2, 0.0, uv.y);
        ember *= 0.7 + 0.3 * sin(t * 8.0 + uv.x * 34.0);
        logColor += vec3(1.0, 0.28, 0.06) * ember;

        col = mix(col, logColor, logRegion);
      }

      // Flames
      float flameBaseY = 0.18;
      float flameTopY = 0.93;
      if (uv.y > flameBaseY) {
        float fy = clamp((uv.y - flameBaseY) / (flameTopY - flameBaseY), 0.0, 1.0);

        vec2 nUV = vec2(uv.x * 3.0, uv.y * 5.0 - t * 2.1);
        float n1 = fbm(nUV + vec2(0.0, -t * 0.85));
        float n2 = fbm(nUV * 2.0 + vec2(t * 0.32, -t * 1.6) + 3.7);
        float n3 = fbm(nUV * 4.0 + vec2(-t * 0.22, -t * 2.6) + 7.1);
        float n = n1 * 0.55 + n2 * 0.30 + n3 * 0.15;

        float warpX = (n - 0.5) * 0.20 * fy;
        float dx = abs(uv.x - 0.5 - warpX) * aspect;
        float taper = mix(0.44, 0.055, pow(fy, 0.75));
        float shape = clamp(1.0 - dx / taper, 0.0, 1.0);
        shape = pow(shape, 1.3);

        float vFade = smoothstep(1.0, 0.42, fy) * smoothstep(0.0, 0.14, fy);
        float intensity = max(shape * (n * 1.75 + 0.22) * vFade * 1.35, 0.0);

        vec3 flame = vec3(0.0);
        flame.r = smoothstep(0.02, 0.30, intensity);
        flame.g = smoothstep(0.30, 0.60, intensity) * 0.9;
        flame.b = smoothstep(0.68, 1.02, intensity) * 0.7;
        flame = mix(flame, vec3(1.0, 0.95, 0.75), smoothstep(0.84, 1.10, intensity) * 0.82);

        col = mix(col, col + flame * 1.55, shape * vFade);
        col += vec3(1.0, 0.42, 0.10) * intensity * 0.5 * (1.0 - fy);
      }

      // Sparks
      for (int i = 0; i < 25; i++) {
        float fi = float(i);
        float h1 = hash(vec2(fi, 1.7));
        float h2 = hash(vec2(fi, 3.3));
        float h3 = hash(vec2(fi, 5.9));
        float h4 = hash(vec2(fi, 7.1));

        float lifeTime = 2.2 + h1 * 3.0;
        float phase = mod(t / lifeTime + h2, 1.0);

        float px = 0.26 + h3 * 0.48 + 0.028 * sin(t * (1.0 + h4 * 3.2) + fi * 10.0);
        float py = flameBaseY + phase * 0.76;

        vec2 sp = vec2(px, py);
        float dist = length((uv - sp) * vec2(aspect, 1.0));
        float size = 0.0022 + h4 * 0.0042;
        float spark = smoothstep(size, 0.0, dist);
        spark *= smoothstep(0.0, 0.14, phase) * smoothstep(1.0, 0.65, phase);

        vec3 sparkCol = mix(vec3(1.0, 0.58, 0.18), vec3(1.0, 1.0, 0.72), h1);
        col += sparkCol * spark * 2.0;
      }

      vec2 vc = uv - 0.5;
      float vig = 1.0 - dot(vc, vc) * 0.85;
      col *= vig;

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  // -------- 2. RAIN WINDOW --------
  const RAIN_WINDOW_FRAG = COMMON + `
    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution;
      float aspect = u_resolution.x / u_resolution.y;
      float t = u_time;

      // Blurred background: dark city at night
      vec3 bg = vec3(0.02, 0.03, 0.055);
      bg += vec3(0.04, 0.05, 0.09) * smoothstep(0.8, 0.2, uv.y);

      // Distant lights (bokeh)
      for (int i = 0; i < 12; i++) {
        float fi = float(i);
        vec2 lp = vec2(
          fract(hash(vec2(fi, 1.3)) * 1.3),
          0.25 + hash(vec2(fi, 2.7)) * 0.45
        );
        float ld = length((uv - lp) * vec2(aspect, 1.0));
        float bokeh = smoothstep(0.09, 0.0, ld);
        vec3 lc = mix(vec3(0.6, 0.5, 0.9), vec3(0.9, 0.7, 0.4), hash(vec2(fi, 4.1)));
        bg += lc * bokeh * 0.4;
      }

      // Glass fog / condensation
      float fog = fbm(uv * 3.0 + vec2(0.0, t * 0.05));
      bg += vec3(0.06, 0.07, 0.10) * smoothstep(0.4, 0.7, fog);

      // Raindrops on glass
      vec3 drops = vec3(0.0);
      for (int i = 0; i < 40; i++) {
        float fi = float(i);
        float hx = hash(vec2(fi, 1.1));
        float hy = hash(vec2(fi, 2.3));
        float hs = hash(vec2(fi, 3.7));
        float hv = hash(vec2(fi, 4.9));

        float fallSpeed = 0.02 + hv * 0.06;
        float dy = mod(hy + t * fallSpeed, 1.2) - 0.1;

        vec2 dp = vec2(hx, 1.0 - dy);

        // Distortion around drop
        float dist = length((uv - dp) * vec2(aspect, 1.0));
        float radius = 0.004 + hs * 0.008;
        float drop = smoothstep(radius, radius * 0.6, dist);

        // Refraction highlight
        vec2 refr = (uv - dp) / radius;
        float refrPow = 1.0 - length(refr);
        vec3 dropCol = vec3(0.5, 0.6, 0.75) * refrPow * 0.6;
        dropCol += vec3(0.9, 0.95, 1.0) * smoothstep(0.15, 0.0, abs(length(refr) - 0.7)) * 0.3;

        drops += dropCol * drop * 0.7;
      }

      // Rain streaks on glass
      for (int i = 0; i < 18; i++) {
        float fi = float(i);
        float hx = hash(vec2(fi, 6.1));
        float hy = hash(vec2(fi, 8.3));
        float hs = hash(vec2(fi, 9.7));

        float speed = 0.08 + hs * 0.15;
        float y = mod(hy + t * speed, 1.4) - 0.2;
        float xWobble = hx + 0.02 * sin(t * 0.8 + fi);

        float dx = abs(uv.x - xWobble);
        float streakWidth = 0.0015 + hs * 0.0015;
        float streak = smoothstep(streakWidth, 0.0, dx);
        streak *= smoothstep(y + 0.001, y + 0.12, uv.y) * smoothstep(y - 0.01, y + 0.005, uv.y);
        streak *= 0.4 + 0.6 * hs;

        vec3 streakCol = vec3(0.55, 0.65, 0.78) * 0.5;
        drops += streakCol * streak;
      }

      vec3 col = bg * (0.7 + fbm(uv * 8.0 + t * 0.2) * 0.4) + drops;

      // Subtle overall cool tint
      col *= vec3(0.88, 0.94, 1.05);

      // Vignette
      vec2 vc = uv - 0.5;
      col *= 1.0 - dot(vc, vc) * 0.7;

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  // -------- 3. NIGHT RAIN STREET --------
  const NIGHT_RAIN_FRAG = COMMON + `
    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution;
      float aspect = u_resolution.x / u_resolution.y;
      float t = u_time;

      // Sky (upper portion)
      vec3 col = mix(vec3(0.02, 0.025, 0.06), vec3(0.008, 0.012, 0.03), uv.y);

      // Distant building silhouettes
      float buildings = 0.0;
      for (int i = 0; i < 12; i++) {
        float fi = float(i);
        float bx = fi / 12.0 + hash(vec2(fi, 1.0)) * 0.05;
        float bw = 0.06 + hash(vec2(fi, 2.0)) * 0.08;
        float bh = 0.15 + hash(vec2(fi, 3.0)) * 0.35;
        float inX = smoothstep(bx - bw * 0.02, bx, uv.x) * smoothstep(bx + bw, bx + bw * 0.98, uv.x);
        float inY = smoothstep(0.55, 0.56, uv.y) * smoothstep(0.55 + bh, 0.55 + bh * 0.98, uv.y);
        // Windows (tiny lit rectangles)
        float wx = fract((uv.x - bx) / bw * 8.0);
        float wy = fract((uv.y - 0.55) / bh * 12.0);
        float lit = step(0.65, hash(vec2(floor((uv.x - bx) / bw * 8.0), floor((uv.y - 0.55) / bh * 12.0)) + fi * 100.0));
        lit *= step(0.2, wx) * step(wx, 0.8) * step(0.2, wy) * step(wy, 0.8);
        col += vec3(0.9, 0.75, 0.4) * inX * inY * lit * 0.6;
        buildings = max(buildings, inX * inY);
      }

      // Street lamps
      vec3 lamps = vec3(0.0);
      for (int i = 0; i < 3; i++) {
        float fi = float(i);
        float lx = 0.2 + fi * 0.3;
        vec2 lp = vec2(lx, 0.42);
        float ld = length((uv - lp) * vec2(aspect, 1.0));
        float halo = exp(-ld * 12.0);
        lamps += vec3(1.0, 0.75, 0.35) * halo * 0.7;
        float core = smoothstep(0.012, 0.0, ld);
        lamps += vec3(1.0, 0.95, 0.8) * core * 1.4;
      }

      // Wet road (lower portion)
      float roadStart = 0.45;
      if (uv.y < roadStart) {
        float roadY = (roadStart - uv.y) / roadStart;
        vec3 road = vec3(0.03, 0.035, 0.045);

        // Reflections of street lamps on wet surface
        vec3 refl = vec3(0.0);
        for (int i = 0; i < 3; i++) {
          float fi = float(i);
          float lx = 0.2 + fi * 0.3;
          float dx = uv.x - lx;
          float stretched = exp(-abs(dx) * 5.0 - roadY * 2.0);
          float flicker = 0.85 + 0.15 * sin(t * 3.0 + fi);
          refl += vec3(1.0, 0.65, 0.28) * stretched * flicker * 0.9;
        }

        // Puddle distortions (using noise)
        vec2 pn = vec2(uv.x * 6.0, roadY * 6.0);
        float ripple = fbm(pn + vec2(0.0, t * 0.3)) - 0.5;
        refl *= 1.0 + ripple * 0.6;

        col = mix(col, road + refl, smoothstep(0.0, 0.05, roadStart - uv.y));
      }

      // Rain drops (falling, perspective)
      for (int i = 0; i < 180; i++) {
        float fi = float(i);
        float hx = hash(vec2(fi, 1.0));
        float hy = hash(vec2(fi, 2.0));
        float hs = hash(vec2(fi, 3.0));
        float hv = hash(vec2(fi, 4.0));

        // Depth: closer = bigger and faster
        float depth = 0.2 + hv * 0.8;
        float speed = (0.8 + hs * 0.5) * (0.5 + depth);
        float dropY = mod(hy + t * speed, 1.4) - 0.2;
        float dropX = hx + 0.03 * (0.5 - uv.y);

        float dx = abs(uv.x - dropX) * aspect;
        float dy = abs(uv.y - (1.0 - dropY));
        float streakLen = 0.015 + depth * 0.04;
        float w = 0.0006 + depth * 0.0012;
        float streak = smoothstep(w, 0.0, dx) * smoothstep(streakLen, streakLen * 0.2, dy) * smoothstep(0.0, 0.02, dy);
        streak *= depth * 0.9;

        col += vec3(0.6, 0.7, 0.85) * streak;
      }

      // Add lamps overlay
      col += lamps;

      // Vignette
      vec2 vc = uv - 0.5;
      col *= 1.0 - dot(vc, vc) * 0.6;

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  // -------- 4. LIGHTNING STORM --------
  const LIGHTNING_FRAG = COMMON + `
    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution;
      float aspect = u_resolution.x / u_resolution.y;
      float t = u_time;

      // Sky with dark clouds
      vec2 cloudUV = vec2(uv.x * 3.0, uv.y * 2.0 + t * 0.05);
      float clouds = fbm(cloudUV);
      float clouds2 = fbm(cloudUV * 2.0 + 5.0);
      vec3 col = mix(vec3(0.02, 0.02, 0.04), vec3(0.08, 0.08, 0.14), clouds * 0.6 + clouds2 * 0.4);

      // Lightning flashes
      float flash = 0.0;
      // Multiple independent flashes
      float c1 = mod(t, 7.3);
      if (c1 < 0.15) flash = max(flash, sin(c1 / 0.15 * 3.14159));
      if (c1 > 0.35 && c1 < 0.45) flash = max(flash, sin((c1 - 0.35) / 0.10 * 3.14159) * 0.6);

      float c2 = mod(t + 3.1, 11.7);
      if (c2 < 0.12) flash = max(flash, sin(c2 / 0.12 * 3.14159) * 0.9);

      float c3 = mod(t + 6.5, 17.2);
      if (c3 < 0.25) flash = max(flash, sin(c3 / 0.25 * 3.14159) * 0.8);

      // Lightning bolt shape (occasional)
      float bolt = 0.0;
      float c4 = mod(t, 7.3);
      if (c4 < 0.2) {
        float bx = 0.3 + hash(vec2(floor(t * 10.0), 1.0)) * 0.4;
        float boltNoise = noise(vec2(uv.y * 30.0 + t * 20.0, 1.0)) * 0.3;
        float bdx = abs(uv.x - bx - boltNoise);
        bolt = smoothstep(0.005, 0.0, bdx) * smoothstep(0.0, 0.4, uv.y) * smoothstep(0.8, 0.5, uv.y);
        bolt *= 1.0 - c4 / 0.2;
      }

      col += vec3(0.8, 0.85, 1.0) * flash * 0.9;
      col += vec3(1.0, 0.95, 0.85) * bolt * 2.0;

      // Rain
      for (int i = 0; i < 150; i++) {
        float fi = float(i);
        float hx = hash(vec2(fi, 1.0));
        float hy = hash(vec2(fi, 2.0));
        float hs = hash(vec2(fi, 3.0));
        float hv = hash(vec2(fi, 4.0));

        float speed = (0.9 + hs * 0.6);
        float dropY = mod(hy + t * speed, 1.3) - 0.15;
        float dropX = hx + 0.04 * (0.5 - uv.y) + 0.01 * sin(t * 0.5 + fi);

        float dx = abs(uv.x - dropX) * aspect;
        float dy = abs(uv.y - (1.0 - dropY));
        float streakLen = 0.012 + hv * 0.035;
        float w = 0.0005 + hv * 0.0010;
        float streak = smoothstep(w, 0.0, dx) * smoothstep(streakLen, streakLen * 0.2, dy) * smoothstep(0.0, 0.02, dy);
        streak *= 0.7 + hv * 0.4;

        col += vec3(0.55, 0.65, 0.85) * streak * (0.7 + flash * 2.0);
      }

      // Ground (dark wet)
      if (uv.y < 0.15) {
        vec3 ground = vec3(0.02, 0.025, 0.035) + vec3(0.15, 0.16, 0.22) * flash * 0.4;
        col = mix(col, ground, smoothstep(0.15, 0.05, uv.y));
      }

      vec2 vc = uv - 0.5;
      col *= 1.0 - dot(vc, vc) * 0.55;

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  // -------- 5. SNOW --------
  const SNOW_FRAG = COMMON + `
    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution;
      float aspect = u_resolution.x / u_resolution.y;
      float t = u_time;

      // Cold night sky
      vec3 col = mix(vec3(0.03, 0.04, 0.09), vec3(0.01, 0.02, 0.05), uv.y);

      // Distant mountain silhouettes
      float mountain = 0.5 + 0.15 * sin(uv.x * 3.0) + 0.08 * sin(uv.x * 7.0 + 1.3);
      if (uv.y < mountain) {
        float layer = smoothstep(mountain, mountain - 0.02, uv.y);
        vec3 mColor = vec3(0.04, 0.06, 0.12) * (0.6 + 0.4 * fbm(vec2(uv.x * 8.0, uv.y * 8.0)));
        col = mix(col, mColor, layer);
      }

      // Moon glow
      vec2 moonPos = vec2(0.75, 0.78);
      float moonDist = length((uv - moonPos) * vec2(aspect, 1.0));
      col += vec3(0.6, 0.7, 0.9) * exp(-moonDist * 5.0) * 0.35;
      col += vec3(0.9, 0.95, 1.0) * smoothstep(0.035, 0.025, moonDist) * 0.9;

      // Snowflakes (three layers for parallax)
      for (int layer = 0; layer < 3; layer++) {
        float flayer = float(layer);
        float density = 40.0 + flayer * 30.0;
        float speedBase = 0.04 + flayer * 0.05;
        float sizeBase = 0.0015 + flayer * 0.002;

        for (int i = 0; i < 60; i++) {
          float fi = float(i);
          float hx = hash(vec2(fi, 1.0 + flayer));
          float hy = hash(vec2(fi, 2.0 + flayer));
          float hs = hash(vec2(fi, 3.0 + flayer));
          float hv = hash(vec2(fi, 4.0 + flayer));

          float speed = speedBase * (0.7 + hs * 0.6);
          float y = mod(hy + t * speed, 1.3) - 0.15;
          float x = hx + 0.03 * sin(t * (0.3 + hv) + fi * 2.0);

          float d = length((uv - vec2(x, y)) * vec2(aspect, 1.0));
          float size = sizeBase * (0.6 + hs * 0.8);
          float flake = smoothstep(size, 0.0, d);

          vec3 flakeCol = mix(vec3(0.85, 0.92, 1.0), vec3(1.0, 1.0, 1.0), hs);
          col += flakeCol * flake * (0.6 + flayer * 0.2);
        }
      }

      // Ground snow
      if (uv.y < 0.15) {
        vec3 ground = vec3(0.25, 0.30, 0.42);
        float gnoise = fbm(vec2(uv.x * 20.0, uv.y * 8.0));
        ground *= 0.8 + gnoise * 0.4;
        col = mix(col, ground, smoothstep(0.15, 0.05, uv.y));
      }

      vec2 vc = uv - 0.5;
      col *= 1.0 - dot(vc, vc) * 0.55;

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  // -------- 6. FOREST --------
  const FOREST_FRAG = COMMON + `
    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution;
      float aspect = u_resolution.x / u_resolution.y;
      float t = u_time;

      // Sky through trees (filtered green/gold)
      vec3 col = mix(vec3(0.22, 0.30, 0.18), vec3(0.14, 0.20, 0.12), uv.y);

      // Distant fog
      float fog = fbm(vec2(uv.x * 2.0, uv.y * 1.5 + t * 0.02));
      col = mix(col, vec3(0.35, 0.40, 0.30), fog * 0.4 * smoothstep(0.7, 0.2, uv.y));

      // Sun rays through canopy
      vec3 rays = vec3(0.0);
      for (int i = 0; i < 5; i++) {
        float fi = float(i);
        float rayX = 0.2 + fi * 0.15 + 0.03 * sin(t * 0.3 + fi);
        float ray = smoothstep(0.05, 0.0, abs(uv.x - rayX - uv.y * 0.15));
        ray *= smoothstep(0.4, 0.9, uv.y);
        rays += vec3(1.0, 0.85, 0.4) * ray * 0.12;
      }
      col += rays;

      // Tree trunks (vertical lines)
      for (int i = 0; i < 8; i++) {
        float fi = float(i);
        float hx = hash(vec2(fi, 1.0));
        float tx = hx;
        float tw = 0.02 + hash(vec2(fi, 2.0)) * 0.04;
        float tHeight = 0.9 + hash(vec2(fi, 3.0)) * 0.1;

        float dx = abs(uv.x - tx);
        float trunk = smoothstep(tw, tw * 0.7, dx);
        trunk *= smoothstep(tHeight, tHeight - 0.3, uv.y) * smoothstep(0.0, 0.05, uv.y);
        trunk *= 0.6 + 0.4 * noise(vec2(uv.y * 20.0, fi * 10.0));

        // Darker closer to camera
        float depth = 0.5 + hx * 0.5;
        vec3 trunkCol = vec3(0.08, 0.07, 0.05) * depth;

        col = mix(col, trunkCol, trunk * 0.9);
      }

      // Leaves (bottom corners, swaying)
      float leafIntensity = 0.0;
      float leafColor = 0.0;
      for (int i = 0; i < 3; i++) {
        float fi = float(i);
        vec2 lp = vec2(fi == 0.0 ? 0.05 : fi == 1.0 ? 0.95 : 0.5, fi == 0.0 ? 0.85 : fi == 1.0 ? 0.85 : 0.0);
        float d = length((uv - lp) * vec2(aspect, 1.0));
        float sway = 0.01 * sin(t * 1.2 + fi * 3.0);
        d += sway;
        float leaves = smoothstep(0.25 + fi * 0.05, 0.1, d);
        float leafTex = fbm(uv * 15.0 + vec2(t * 0.1, 0.0) + fi * 10.0);
        leaves *= 0.6 + 0.6 * leafTex;

        vec3 leafCol = mix(vec3(0.10, 0.20, 0.08), vec3(0.25, 0.35, 0.10), leafTex);
        col = mix(col, leafCol, leaves * 0.85);
      }

      // Ambient fog overlay
      col = mix(col, vec3(0.4, 0.45, 0.35), smoothstep(0.5, 0.0, uv.y) * 0.15);

      vec2 vc = uv - 0.5;
      col *= 1.0 - dot(vc, vc) * 0.5;

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  // -------- 7. OCEAN --------
  const OCEAN_FRAG = COMMON + `
    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution;
      float aspect = u_resolution.x / u_resolution.y;
      float t = u_time;

      float horizon = 0.42;

      // Sky
      vec3 sky = mix(vec3(0.35, 0.45, 0.60), vec3(0.75, 0.72, 0.68), smoothstep(0.42, 1.0, uv.y));
      // Sunset tint
      sky = mix(sky, vec3(0.95, 0.65, 0.42), smoothstep(0.42, 0.55, uv.y) * 0.5);

      // Sun glow near horizon
      float sun = exp(-length((uv - vec2(0.7, 0.46)) * vec2(aspect, 1.0)) * 8.0);
      sky += vec3(1.0, 0.7, 0.4) * sun * 0.6;

      // Ocean below horizon
      if (uv.y < horizon) {
        float depthFactor = (horizon - uv.y) / horizon;
        vec3 water = mix(vec3(0.10, 0.22, 0.32), vec3(0.04, 0.08, 0.15), depthFactor);

        // Waves (multiple layers, perspective)
        float wave = 0.0;
        float foam = 0.0;
        for (int i = 0; i < 4; i++) {
          float fi = float(i);
          float scale = pow(2.0, fi);
          vec2 wuv = vec2(uv.x * scale * 2.0, uv.y * scale * 4.0 + t * 0.3);
          float n = fbm(wuv);
          wave += n / scale;

          // Foam on peaks
          foam += smoothstep(0.7, 0.9, n) / scale;
        }

        // Add wave highlights
        float highlight = pow(wave, 2.0) * (1.0 - depthFactor * 0.6);
        water += vec3(0.4, 0.55, 0.7) * highlight * 0.5;
        water += vec3(0.9, 0.95, 1.0) * foam * 0.3;

        // Horizon glow
        float horizonGlow = exp(-abs(uv.y - horizon) * 40.0);
        water += vec3(1.0, 0.6, 0.3) * horizonGlow * 0.4;

        col = water;
      } else {
        col = sky;
      }

      // Sun reflection on water
      if (uv.y < horizon) {
        float reflX = abs(uv.x - 0.7);
        float reflY = horizon - uv.y;
        float refl = exp(-reflX * reflX * 15.0 - reflY * 3.0);
        refl *= 0.7 + 0.3 * sin(uv.y * 40.0 + t * 2.0);
        col += vec3(1.0, 0.7, 0.4) * refl * 0.5;
      }

      vec2 vc = uv - 0.5;
      col *= 1.0 - dot(vc, vc) * 0.55;

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  // ============================================================
  // 2. SCENE REGISTRY
  // ============================================================

  const SCENES = [
    { name: 'Камин',           frag: FIRE_FRAG,         audio: 'fire'  },
    { name: 'Дождь за окном',  frag: RAIN_WINDOW_FRAG,  audio: 'rain'  },
    { name: 'Ночной дождь',    frag: NIGHT_RAIN_FRAG,   audio: 'rain'  },
    { name: 'Гроза',           frag: LIGHTNING_FRAG,    audio: 'storm' },
    { name: 'Снегопад',        frag: SNOW_FRAG,         audio: 'snow'  },
    { name: 'Лес',             frag: FOREST_FRAG,       audio: 'forest'},
    { name: 'Океан',           frag: OCEAN_FRAG,        audio: 'ocean' }
  ];

  // ============================================================
  // 3. WEBGL SETUP
  // ============================================================

  const canvasA = document.getElementById('canvasA');
  const canvasB = document.getElementById('canvasB');

  function getGL(canvas) {
    const opts = { antialias: false, alpha: false, powerPreference: 'high-performance', preserveDrawingBuffer: false };
    return canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
  }

  const glA = getGL(canvasA);
  const glB = getGL(canvasB);

  if (!glA || !glB) {
    document.body.innerHTML = '<div class="fallback">WebGL не поддерживается на этом устройстве.<br>Попробуйте обновить браузер.</div>';
    return;
  }

  function compileShader(gl, type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error('Shader compile error:', gl.getShaderInfoLog(sh));
      console.error(src);
      gl.deleteShader(sh);
      return null;
    }
    return sh;
  }

  function createProgram(gl, fragSrc) {
    const vs = compileShader(gl, gl.VERTEX_SHADER, VERTEX_SRC);
    const fs = compileShader(gl, gl.FRAGMENT_SHADER, fragSrc);
    if (!vs || !fs) return null;
    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.error('Link error:', gl.getProgramInfoLog(prog));
      gl.deleteProgram(prog);
      return null;
    }
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    return prog;
  }

  class SceneRenderer {
    constructor(gl) {
      this.gl = gl;
      this.programs = {};
      this.buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      gl.disable(gl.DEPTH_TEST);
      gl.disable(gl.BLEND);
    }

    getProgram(index) {
      if (!this.programs[index]) {
        const gl = this.gl;
        const prog = createProgram(gl, SCENES[index].frag);
        if (!prog) return null;
        this.programs[index] = {
          program: prog,
          u_resolution: gl.getUniformLocation(prog, 'u_resolution'),
          u_time: gl.getUniformLocation(prog, 'u_time'),
          u_quality: gl.getUniformLocation(prog, 'u_quality'),
          a_position: gl.getAttribLocation(prog, 'a_position')
        };
      }
      return this.programs[index];
    }

    render(sceneIndex, time) {
      const gl = this.gl;
      const p = this.getProgram(sceneIndex);
      if (!p) {
        gl.clearColor(0, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        return;
      }

      gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
      gl.useProgram(p.program);

      gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
      gl.enableVertexAttribArray(p.a_position);
      gl.vertexAttribPointer(p.a_position, 2, gl.FLOAT, false, 0, 0);

      gl.uniform2f(p.u_resolution, gl.canvas.width, gl.canvas.height);
      gl.uniform1f(p.u_time, time);
      gl.uniform1f(p.u_quality, QUALITY);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    dispose() {
      const gl = this.gl;
      Object.keys(this.programs).forEach(k => {
        gl.deleteProgram(this.programs[k].program);
      });
      this.programs = {};
      gl.deleteBuffer(this.buffer);
    }
  }

  const rendererA = new SceneRenderer(glA);
  const rendererB = new SceneRenderer(glB);

  // ============================================================
  // 4. STATE
  // ============================================================

  let QUALITY = 1.0; // 0..1 multiplier for shader detail (also affects resolution scale)
  let resolutionScale = 1.0;

  let activeCanvas = canvasA;
  let activeRenderer = rendererA;
  let inactiveCanvas = canvasB;
  let inactiveRenderer = rendererB;

  let currentScene = 0;
  let nextSceneIndex = 0;

  let sceneStartTime = performance.now() / 1000;
  let globalStartTime = sceneStartTime;

  let transitioning = false;
  let transitionKind = null; // 'quick' | 'cinematic'
  let transitionStartTime = 0;
  let transitionDuration = 0;
  let queuedScene = null;

  let lastNavTime = 0;
  const NAV_COOLDOWN = 250;

  // Canvas sizes
  let dpr = 1;

  function resizeCanvases() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const scale = resolutionScale * dpr;
    const w = Math.max(1, Math.floor(window.innerWidth * scale));
    const h = Math.max(1, Math.floor(window.innerHeight * scale));

    [canvasA, canvasB].forEach(c => {
      if (c.width !== w || c.height !== h) {
        c.width = w;
        c.height = h;
      }
    });
  }

  // ============================================================
  // 5. UI ELEMENTS
  // ============================================================

  const hud = document.getElementById('hud');
  const sceneName = document.getElementById('sceneName');
  const sceneCounter = document.getElementById('sceneCounter');
  const clockTimeEl = document.getElementById('clockTime');
  const clockDateEl = document.getElementById('clockDate');
  const hint = document.getElementById('hint');
  const audioBadge = document.getElementById('audioBadge');

  let hudHideTimer = null;
  let hintHideTimer = null;

  function updateSceneLabels() {
    sceneName.textContent = SCENES[currentScene].name;
    sceneCounter.textContent = (currentScene + 1) + ' / ' + SCENES.length;
  }

  function showHudTemporarily() {
    hud.classList.remove('hidden');
    if (hudHideTimer) clearTimeout(hudHideTimer);
    hudHideTimer = setTimeout(() => {
      if (!transitioning) hud.classList.add('hidden');
    }, 6000);
  }

  function showHintTemporarily() {
    hint.classList.remove('hidden');
    if (hintHideTimer) clearTimeout(hintHideTimer);
    hintHideTimer = setTimeout(() => {
      hint.classList.add('hidden');
    }, 6000);
  }

  // Clock
  const WEEKDAYS = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
  const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

  function updateClock() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    clockTimeEl.textContent = hh + ':' + mm + ':' + ss;
    clockDateEl.textContent = WEEKDAYS[now.getDay()] + ', ' + now.getDate() + ' ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();
  }

  function updateAudioBadge() {
    audioBadge.textContent = audioEnabled ? '· звук вкл' : '· звук выкл';
  }

  // ============================================================
  // 6. AUDIO (procedural, optional)
  // ============================================================

  let audioCtx = null;
  let audioSource = null;
  let audioFilter = null;
  let audioGain = null;
  let audioEnabled = false;

  function ensureAudioCtx() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      audioCtx = null;
    }
  }

  function stopSceneSound() {
    if (audioSource) {
      try { audioSource.stop(); } catch (e) {}
      audioSource = null;
    }
    if (audioFilter) { try { audioFilter.disconnect(); } catch (e) {} audioFilter = null; }
    if (audioGain) { try { audioGain.disconnect(); } catch (e) {} audioGain = null; }
  }

  function startSceneSound(kind) {
    if (!audioCtx) return;
    stopSceneSound();

    const bufferSize = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.loop = true;

    const filter = audioCtx.createBiquadFilter();
    const gain = audioCtx.createGain();

    switch (kind) {
      case 'fire':
        filter.type = 'lowpass';
        filter.frequency.value = 700;
        gain.gain.value = 0.035;
        break;
      case 'rain':
      case 'storm':
        filter.type = 'lowpass';
        filter.frequency.value = 3200;
        gain.gain.value = 0.055;
        break;
      case 'snow':
        filter.type = 'lowpass';
        filter.frequency.value = 1800;
        gain.gain.value = 0.012;
        break;
      case 'forest':
        filter.type = 'lowpass';
        filter.frequency.value = 1400;
        gain.gain.value = 0.022;
        break;
      case 'ocean':
        filter.type = 'lowpass';
        filter.frequency.value = 350;
        gain.gain.value = 0.07;
        break;
      default:
        filter.frequency.value = 1000;
        gain.gain.value = 0.03;
    }

    src.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    src.start();

    audioSource = src;
    audioFilter = filter;
    audioGain = gain;
  }

  function toggleAudio() {
    ensureAudioCtx();
    if (!audioCtx) {
      audioBadge.textContent = '· звук недоступен';
      return;
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();

    audioEnabled = !audioEnabled;
    if (audioEnabled) {
      startSceneSound(SCENES[currentScene].audio);
    } else {
      stopSceneSound();
    }
    updateAudioBadge();
  }

  function restartSceneSoundIfNeeded() {
    if (audioEnabled) {
      startSceneSound(SCENES[currentScene].audio);
    }
  }

  // ============================================================
  // 7. SCENE SWITCHING
  // ============================================================

  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function swapRoles() {
    const tmpC = activeCanvas;
    activeCanvas = inactiveCanvas;
    inactiveCanvas = tmpC;
    const tmpR = activeRenderer;
    activeRenderer = inactiveRenderer;
    inactiveRenderer = tmpR;
  }

  function applySceneInstant(sceneIndex) {
    currentScene = sceneIndex;
    sceneStartTime = performance.now() / 1000;
    updateSceneLabels();
    restartSceneSoundIfNeeded();
    showHudTemporarily();
  }

  // Quick crossfade transition (used for Left/Right)
  function doQuickTransition(targetScene) {
    if (transitioning) {
      queuedScene = targetScene;
      return;
    }
    transitioning = true;
    transitionKind = 'quick';
    transitionStartTime = performance.now();
    transitionDuration = 380;

    // Prepare next canvas
    inactiveCanvas.style.transform = 'translateY(0)';
    inactiveCanvas.style.opacity = '0';
    inactiveCanvas.style.zIndex = '3';
    activeCanvas.style.zIndex = '2';
    nextSceneIndex = targetScene;

    function tick() {
      const elapsed = performance.now() - transitionStartTime;
      const t = Math.min(1, elapsed / transitionDuration);
      const eased = easeInOutCubic(t);

      inactiveCanvas.style.opacity = String(eased);

      if (t < 1) {
        requestAnimationFrame(tick);
      } else {
        // Finalize
        swapRoles();
        activeCanvas.style.opacity = '1';
        activeCanvas.style.zIndex = '2';
        inactiveCanvas.style.opacity = '1';
        inactiveCanvas.style.zIndex = '1';
        currentScene = targetScene;
        sceneStartTime = performance.now() / 1000;
        transitioning = false;
        transitionKind = null;

        updateSceneLabels();
        restartSceneSoundIfNeeded();
        showHudTemporarily();

        if (queuedScene !== null && queuedScene !== currentScene) {
          const q = queuedScene;
          queuedScene = null;
          doQuickTransition(q);
        } else {
          queuedScene = null;
        }
      }
    }
    requestAnimationFrame(tick);
  }

  // Cinematic slide transition (used for Up/Down)
  function doCinematicTransition(targetScene, direction) {
    // direction: +1 = down key (next), -1 = up key (previous)
    // Both scenes slide downward: current exits bottom, next enters from top.
    if (transitioning) {
      queuedScene = targetScene;
      return;
    }
    transitioning = true;
    transitionKind = 'cinematic';
    transitionStartTime = performance.now();
    transitionDuration = 1500;

    // Set up next canvas
    inactiveCanvas.style.transform = 'translateY(-100%)';
    inactiveCanvas.style.opacity = '1';
    inactiveCanvas.style.zIndex = '3';
    activeCanvas.style.zIndex = '2';
    nextSceneIndex = targetScene;

    function tick() {
      const elapsed = performance.now() - transitionStartTime;
      const t = Math.min(1, elapsed / transitionDuration);
      const eased = easeInOutCubic(t);

      activeCanvas.style.transform = 'translateY(' + (eased * 100) + '%)';
      inactiveCanvas.style.transform = 'translateY(' + ((eased - 1) * 100) + '%)';

      if (t < 1) {
        requestAnimationFrame(tick);
      } else {
        // Finalize
        swapRoles();
        activeCanvas.style.transform = 'translateY(0)';
        activeCanvas.style.zIndex = '2';
        inactiveCanvas.style.transform = 'translateY(100%)';
        inactiveCanvas.style.zIndex = '1';
        currentScene = targetScene;
        sceneStartTime = performance.now() / 1000;
        transitioning = false;
        transitionKind = null;

        updateSceneLabels();
        restartSceneSoundIfNeeded();
        showHudTemporarily();

        if (queuedScene !== null && queuedScene !== currentScene) {
          const q = queuedScene;
          queuedScene = null;
          doCinematicTransition(q, direction);
        } else {
          queuedScene = null;
        }
      }
    }
    requestAnimationFrame(tick);
  }

  function navigate(delta, kind) {
    if (transitioning) return;
    const now = performance.now();
    if (now - lastNavTime < NAV_COOLDOWN) return;
    lastNavTime = now;

    let target = currentScene + delta;
    if (target < 0) target = SCENES.length - 1;
    if (target >= SCENES.length) target = 0;

    if (kind === 'cinematic') {
      doCinematicTransition(target, delta);
    } else {
      doQuickTransition(target);
    }
  }

  // ============================================================
  // 8. RENDER LOOP
  // ============================================================

  function renderFrame() {
    requestAnimationFrame(renderFrame);

    const now = performance.now() / 1000;
    const sceneTime = now - sceneStartTime;

    if (transitioning) {
      activeRenderer.render(currentScene, sceneTime);
      // Next scene time starts fresh
      const nextSceneTime = (performance.now() - transitionStartTime) / 1000;
      inactiveRenderer.render(nextSceneIndex, nextSceneTime);
    } else {
      activeRenderer.render(currentScene, sceneTime);
    }
  }

  // ============================================================
  // 9. INPUT HANDLING
  // ============================================================

  function onKeyDown(e) {
    const key = e.key;
    const isNav = key === 'ArrowLeft' || key === 'ArrowRight' || key === 'ArrowUp' || key === 'ArrowDown' || key === ' ' || key === 'Spacebar';
    if (isNav) {
      e.preventDefault();
      e.stopPropagation();
    }

    if (e.repeat) return;

    // First user action can unlock audio if desired
    if (key === 'm' || key === 'M' || key === 'ь' || key === 'Ь') {
      e.preventDefault();
      toggleAudio();
      showHudTemporarily();
      return;
    }

    if (key === 'f' || key === 'F' || key === 'а' || key === 'А') {
      e.preventDefault();
      toggleFullscreen();
      return;
    }

    switch (key) {
      case 'ArrowLeft':
        showHintTemporarily();
        navigate(-1, 'quick');
        break;
      case 'ArrowRight':
        showHintTemporarily();
        navigate(1, 'quick');
        break;
      case 'ArrowUp':
        showHintTemporarily();
        navigate(-1, 'cinematic');
        break;
      case 'ArrowDown':
        showHintTemporarily();
        navigate(1, 'cinematic');
        break;
      case ' ':
      case 'Spacebar':
        // Toggle HUD visibility
        if (hud.classList.contains('hidden')) {
          showHudTemporarily();
        } else {
          hud.classList.add('hidden');
        }
        break;
    }
  }

  window.addEventListener('keydown', onKeyDown, { passive: false });

  // Prevent scrolling on TVs / arrow keys
  window.addEventListener('keyup', (e) => {
    if (e.key && e.key.indexOf('Arrow') === 0) e.preventDefault();
  }, { passive: false });

  // Prevent drag / context menu on TV
  window.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('dragstart', (e) => e.preventDefault());

  // ============================================================
  // 10. FULLSCREEN
  // ============================================================

  function toggleFullscreen() {
    const el = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
      } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }
  }

  // ============================================================
  // 11. RESIZE / QUALITY ADJUSTMENT
  // ============================================================

  function detectQuality() {
    // Estimate device capability
    const gl = glA;
    let score = 1.0;

    try {
      const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
      if (maxTex < 4096) score *= 0.7;
    } catch (e) {}

    const mem = navigator.deviceMemory || 4;
    if (mem < 2) score *= 0.55;
    else if (mem < 4) score *= 0.75;

    const cores = navigator.hardwareConcurrency || 4;
    if (cores < 3) score *= 0.7;
    else if (cores < 5) score *= 0.85;

    // Small screens (mobile) get reduced
    if (window.innerWidth < 800) score *= 0.85;

    QUALITY = Math.max(0.45, Math.min(1.0, score));
    resolutionScale = 0.6 + QUALITY * 0.4;
  }

  function onResize() {
    resizeCanvases();
  }

  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  // ============================================================
  // 12. BOOT
  // ============================================================

  function boot() {
    detectQuality();
    resizeCanvases();

    // Initial canvas state
    canvasA.style.transform = 'translateY(0)';
    canvasA.style.zIndex = '2';
    canvasA.style.opacity = '1';
    canvasB.style.transform = 'translateY(100%)';
    canvasB.style.zIndex = '1';
    canvasB.style.opacity = '1';

    activeCanvas = canvasA;
    activeRenderer = rendererA;
    inactiveCanvas = canvasB;
    inactiveRenderer = rendererB;

    currentScene = 0;
    sceneStartTime = performance.now() / 1000;

    updateSceneLabels();
    updateAudioBadge();
    updateClock();
    setInterval(updateClock, 1000);

    // Precompile fire shader on both renderers to warm up
    rendererA.getProgram(0);
    rendererB.getProgram(0);

    // Show HUD briefly on startup, then fade
    showHudTemporarily();
    showHintTemporarily();

    renderFrame();
  }

  boot();

  // Clean up on unload
  window.addEventListener('beforeunload', () => {
    stopSceneSound();
    if (audioCtx && audioCtx.state !== 'closed') audioCtx.close().catch(() => {});
  });

  // ============================================================
  // 13. FPS monitor — adapt quality if needed
  // ============================================================

  let frameCount = 0;
  let fpsMeasureStart = performance.now();
  let fpsMeasured = 0;
  let qualityAdapted = false;

  function monitorFPS() {
    if (qualityAdapted) return;
    frameCount++;
    const now = performance.now();
    if (now - fpsMeasureStart >= 4000) {
      fpsMeasured = frameCount / ((now - fpsMeasureStart) / 1000);
      if (fpsMeasured < 24 && QUALITY > 0.55) {
        QUALITY = Math.max(0.5, QUALITY - 0.2);
        resolutionScale = 0.6 + QUALITY * 0.4;
        resizeCanvases();
        qualityAdapted = true;
      } else if (fpsMeasured < 18) {
        QUALITY = 0.45;
        resolutionScale = 0.6;
        resizeCanvases();
        qualityAdapted = true;
      } else {
        qualityAdapted = true;
      }
    }
    requestAnimationFrame(monitorFPS);
  }
  monitorFPS();

})();
</script>
