<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIND CASE</title>
<style>
:root{
  --bg:#08090d; --pn:#12151c; --pn2:#181c26; --pn3:#1e2330; --ln:#272c3a;
  --tx:#e8eaf0; --mu:#8a93a8; --dim:#5a6377;
  --rd:#e0433b; --rd2:#ff5c4d; --gd:#c9a35a; --gn:#3ecf8e; --bl:#5b8def;
  --fs:15px; --rad:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(ellipse at top,#141a26 0%,#05060a 75%);
  color:var(--tx);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:var(--fs);line-height:1.5;
}
#app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--rd);outline-offset:2px}

/* ═══ Common ═══ */
.panel{background:linear-gradient(180deg,var(--pn) 0%,var(--pn2) 100%);border:1px solid var(--ln);border-radius:var(--rad)}
.btn{padding:10px 16px;border-radius:8px;border:1px solid var(--ln);background:var(--pn2);transition:.15s;font-size:14px}
.btn:hover{border-color:var(--rd);background:var(--pn3)}
.btn.primary{background:linear-gradient(180deg,#b8322b,#8f231d);border-color:#d04038;color:#fff;font-weight:600}
.btn.primary:hover{background:linear-gradient(180deg,#d04038,#a82a23)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
h1,h2,h3{font-weight:600;letter-spacing:.2px}
h1{font-size:28px}
h2{font-size:20px}
h3{font-size:16px}
.mu{color:var(--mu)} .dim{color:var(--dim)} .rd{color:var(--rd2)} .gd{color:var(--gd)} .gn{color:var(--gn)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--pn3);border:1px solid var(--ln);font-size:11px;color:var(--mu);letter-spacing:.4px;text-transform:uppercase}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.hr{height:1px;background:var(--ln);margin:12px 0}

/* ═══ Screens ═══ */
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
.fade-in{animation:fi .35s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ═══ Menu ═══ */
#s-menu{align-items:center;justify-content:center;padding:24px;text-align:center;position:absolute;inset:0}
.menu-logo{font-size:clamp(44px,9vw,96px);font-weight:800;letter-spacing:14px;color:var(--tx);position:relative;text-shadow:0 0 40px rgba(224,67,59,.35)}
.menu-logo span{color:var(--rd2)}
.menu-sub{color:var(--mu);letter-spacing:6px;text-transform:uppercase;font-size:12px;margin-top:8px}
.menu-line{width:120px;height:2px;background:var(--rd);margin:22px auto}
.menu-btns{display:flex;flex-direction:column;gap:10px;width:min(320px,86vw);margin-top:12px}
.menu-btns .btn{width:100%;padding:14px;font-size:15px;text-align:left}
.menu-foot{position:absolute;bottom:14px;left:0;right:0;color:var(--dim);font-size:11px;letter-spacing:1px}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(224,67,59,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(224,67,59,.04) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;mask-image:radial-gradient(ellipse at center,black 20%,transparent 75%)}

/* ═══ Topbar ═══ */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--ln);background:rgba(10,12,18,.85);backdrop-filter:blur(8px);z-index:5}
.topbar .logo{font-weight:800;letter-spacing:3px;font-size:14px}
.topbar .logo span{color:var(--rd2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;background:var(--pn2);border:1px solid var(--ln);font-size:12px;color:var(--mu)}
.chip b{color:var(--tx)}

/* ═══ App body ═══ */
.body{flex:1;display:grid;grid-template-columns:220px 1fr;overflow:hidden}
.sidenav{background:var(--pn);border-right:1px solid var(--ln);padding:14px 10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.navbtn{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;color:var(--mu);transition:.15s;text-align:left;font-size:14px;position:relative}
.navbtn:hover{background:var(--pn2);color:var(--tx)}
.navbtn.on{background:linear-gradient(90deg,rgba(224,67,59,.15),transparent);color:var(--tx)}
.navbtn.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--rd);border-radius:2px}
.navbtn .ic{width:20px;text-align:center;font-size:16px}
.navbtn .badge{margin-left:auto;background:var(--rd);color:#fff;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:600}
.content{overflow-y:auto;padding:20px;background:rgba(6,8,12,.5)}
.content::-webkit-scrollbar,.sidenav::-webkit-scrollbar{width:8px}
.content::-webkit-scrollbar-thumb,.sidenav::-webkit-scrollbar-thumb{background:var(--ln);border-radius:4px}

/* ═══ Cards ═══ */
.card{padding:14px;background:var(--pn2);border:1px solid var(--ln);border-radius:var(--rad);transition:.15s;cursor:pointer;position:relative}
.card:hover{border-color:var(--rd);transform:translateY(-2px)}
.card.locked{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.card.locked:hover{transform:none;border-color:var(--ln)}
.card.sel{border-color:var(--rd);background:linear-gradient(180deg,rgba(224,67,59,.08),var(--pn2))}
.card h4{font-size:15px;margin-bottom:6px;color:var(--tx)}
.card p{font-size:13px;color:var(--mu);line-height:1.45}
.grid{display:grid;gap:12px}
.grid.c2{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:2px;color:var(--dim);margin:22px 0 10px;font-weight:600}
.section-title:first-child{margin-top:0}

/* ═══ Evidence icons ═══ */
.ev-icon{font-size:22px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--pn3);border-radius:8px;flex-shrink:0}
.char-row{display:flex;gap:12px;align-items:flex-start}
.char-avatar{width:52px;height:52px;font-size:26px;border-radius:50%;background:linear-gradient(135deg,#232838,#141824);display:flex;align-items:center;justify-content:center;border:1px solid var(--ln);flex-shrink:0}
.char-avatar.lg{width:80px;height:80px;font-size:40px}

/* ═══ Board ═══ */
.board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.board-node{padding:10px;border-radius:8px;background:var(--pn2);border:1px solid var(--ln);cursor:pointer;font-size:13px;text-align:center;transition:.15s;position:relative}
.board-node:hover{border-color:var(--rd)}
.board-node.sel{border-color:var(--rd2);box-shadow:0 0 0 2px rgba(224,67,59,.3);background:rgba(224,67,59,.1)}
.board-node.linked{border-color:var(--gn);color:var(--gn)}
.links-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.link-item{padding:10px 14px;background:rgba(62,207,142,.06);border-left:3px solid var(--gn);border-radius:6px;font-size:13px;color:var(--tx)}
.link-item .mu{display:block;font-size:11px;margin-bottom:4px;letter-spacing:1px;text-transform:uppercase}

/* ═══ Dialogue ═══ */
.dlg-head{display:flex;gap:16px;align-items:center;padding:16px;border-bottom:1px solid var(--ln);background:var(--pn)}
.dlg-body{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;background:rgba(8,10,16,.6)}
.dlg-text{max-width:820px;padding:14px 18px;border-radius:12px;background:var(--pn2);border-left:3px solid var(--rd);line-height:1.65;animation:fi .3s ease-out}
.dlg-text.narr{border-left-color:var(--mu);color:var(--mu);font-style:italic}
.dlg-opts{display:flex;flex-direction:column;gap:8px;max-width:820px;margin-top:8px}
.dlg-opt{padding:12px 16px;border-radius:8px;border:1px solid var(--ln);background:var(--pn);text-align:left;transition:.15s;font-size:14px}
.dlg-opt:hover{border-color:var(--rd);background:var(--pn2);transform:translateX(4px)}
.dlg-opt.present{border-color:var(--gd);color:var(--gd)}
.dlg-opt.end{color:var(--mu)}

/* ═══ Modal ═══ */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.on{display:flex}
.modal-box{max-width:640px;width:100%;max-height:88vh;overflow:auto;background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:22px;animation:fi .25s ease-out}

/* ═══ Toast ═══ */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;pointer-events:none;align-items:center}
.toast{padding:10px 18px;border-radius:10px;background:var(--pn3);border:1px solid var(--ln);font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tin .3s ease-out;max-width:90vw;text-align:center}
.toast.ok{border-color:var(--gn);color:var(--gn)}
.toast.err{border-color:var(--rd);color:var(--rd2)}
.toast.ev{border-color:var(--gd);color:var(--gd)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* ═══ Chapters ═══ */
.chapter-banner{padding:18px;border-radius:12px;background:linear-gradient(135deg,rgba(224,67,59,.12),transparent 70%);border:1px solid var(--ln);margin-bottom:20px}
.chapter-banner .tag{margin-bottom:8px}
.chapter-banner h2{margin-bottom:6px}
.chapter-banner p{color:var(--mu);font-size:14px;max-width:680px}

/* ═══ End screen ═══ */
#s-end{align-items:center;justify-content:center;padding:24px;text-align:center;overflow-y:auto}
.end-title{font-size:clamp(28px,6vw,56px);font-weight:800;letter-spacing:6px;margin-bottom:8px}
.end-stat{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;max-width:420px;margin:20px auto;font-size:14px;text-align:left}
.end-stat .k{color:var(--mu)}
.end-stat .v{text-align:right}

/* ═══ Device layouts ═══ */
body.dev-pc .body{grid-template-columns:220px 1fr}
body.dev-tv{--fs:18px}
body.dev-tv .body{grid-template-columns:280px 1fr}
body.dev-tv .content{padding:36px;max-width:1600px;margin:0 auto;width:100%}
body.dev-tv .topbar{padding:16px 28px}
body.dev-tv .topbar .logo{font-size:18px;letter-spacing:6px}
body.dev-tv .btn{padding:14px 22px;font-size:16px}
body.dev-tv .card{padding:20px}
body.dev-tv .card h4{font-size:19px}
body.dev-tv .card p{font-size:15px}

body.dev-tablet .body{grid-template-columns:190px 1fr}

body.dev-phone .body{grid-template-columns:1fr;grid-template-rows:1fr auto}
body.dev-phone .sidenav{order:2;flex-direction:row;padding:6px 8px;border-right:none;border-top:1px solid var(--ln);overflow-x:auto;gap:2px;background:var(--pn)}
body.dev-phone .navbtn{flex-direction:column;gap:3px;font-size:10px;padding:8px 10px;min-width:64px;text-align:center;justify-content:center}
body.dev-phone .navbtn .ic{font-size:20px}
body.dev-phone .navbtn.on::before{left:10px;right:10px;top:auto;bottom:2px;width:auto;height:2px}
body.dev-phone .navbtn .badge{position:absolute;top:2px;right:6px;font-size:9px;padding:1px 5px}
body.dev-phone .content{padding:14px;padding-bottom:14px}
body.dev-phone .topbar{padding:8px 12px;gap:8px;flex-wrap:wrap}
body.dev-phone .topbar .chip{padding:4px 8px;font-size:11px}
body.dev-phone h1{font-size:22px}
body.dev-phone h2{font-size:18px}
body.dev-phone .grid.c2,body.dev-phone .grid.c3{grid-template-columns:1fr}
body.dev-phone .board-grid{grid-template-columns:repeat(2,1fr)}
body.dev-phone .dlg-head{padding:12px}
body.dev-phone .dlg-body{padding:14px}
body.dev-phone .char-avatar{width:44px;height:44px;font-size:22px}

/* ═══ Loading / overlay ═══ */
#loading{position:fixed;inset:0;background:#05060a;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:500}
#loading.on{display:flex}
.spinner{width:44px;height:44px;border:2px solid var(--ln);border-top-color:var(--rd);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div id="toast"></div>
  <div id="loading"><div class="spinner"></div><div class="mu" id="loading-text">ЗАГРУЗКА…</div></div>

  <!-- MENU -->
  <section class="screen on" id="s-menu">
    <div class="bg-grid"></div>
    <div class="menu-logo">MIND<span>CASE</span></div>
    <div class="menu-sub">Детективный триллер</div>
    <div class="menu-line"></div>
    <div class="menu-btns">
      <button class="btn primary" id="btn-new">▸ Новая игра</button>
      <button class="btn" id="btn-continue" disabled>↻ Продолжить</button>
      <button class="btn ghost" id="btn-settings">⚙ Настройки</button>
      <button class="btn ghost" id="btn-about">ℹ Об игре</button>
    </div>
    <div class="menu-foot">MIND CASE · версия 1.0</div>
  </section>

  <!-- INTRO -->
  <section class="screen" id="s-intro">
    <div class="topbar"><div class="logo">MIND<span>CASE</span></div><div class="grow"></div><span class="chip" id="intro-chip">Пролог</span></div>
    <div class="content fade-in" id="intro-content" style="max-width:820px;margin:auto;padding:30px"></div>
  </section>

  <!-- GAME HUB -->
  <section class="screen" id="s-hub">
    <div class="topbar">
      <div class="logo">MIND<span>CASE</span></div>
      <div class="chip">Дело <b id="hud-ch">1</b>/3</div>
      <div class="chip">Репутация <b id="hud-rep">100</b></div>
      <div class="chip" id="hud-loc">—</div>
      <div class="grow"></div>
      <button class="btn ghost" id="btn-hint" title="Подсказка">💡</button>
      <button class="btn ghost" id="btn-save" title="Сохранить">💾</button>
      <button class="btn ghost" id="btn-pause" title="Пауза">⏸</button>
    </div>
    <div class="body">
      <nav class="sidenav" id="sidenav"></nav>
      <main class="content" id="hub-content"></main>
    </div>
  </section>

  <!-- DIALOGUE -->
  <section class="screen" id="s-dlg">
    <div class="topbar">
      <button class="btn ghost" id="btn-dlg-back">← Назад</button>
      <div class="grow"></div>
      <div class="chip">Допрос</div>
    </div>
    <div class="body" style="grid-template-columns:1fr">
      <div style="display:flex;flex-direction:column;overflow:hidden">
        <div class="dlg-head" id="dlg-head"></div>
        <div class="dlg-body" id="dlg-body"></div>
      </div>
    </div>
  </section>

  <!-- END -->
  <section class="screen" id="s-end">
    <div class="content fade-in" style="max-width:760px;margin:auto;padding:32px;text-align:center" id="end-content"></div>
  </section>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════
   MIND CASE — детективная игра
   ═══════════════════════════════════════════════════════════ */

/* ─────────── DATA ─────────── */
const EV = {
  /* Глава 1 */
  ev_syringe:{n:'Шприц',i:'💉',ch:1,d:'Одноразовый шприц с остатками бледно-жёлтой жидкости. Найден под столом в кабинете Волкова.'},
  ev_broken:{n:'Разбитая чашка',i:'☕',ch:1,d:'Чашка разбита, но кофе вытек не полностью — значит, падение было неслучайным.'},
  ev_log:{n:'Журнал входа',i:'📖',ch:1,d:'В 22:47 в клинику вошёл человек, скрывший лицо. Пропуск не зарегистрирован.'},
  ev_autopsy:{n:'Заключение морга',i:'🧬',ch:1,d:'Смерть от асфиксии. На шее — след от инъекции миорелаксанта. Самоубийство исключено.'},
  ev_notebook:{n:'Тетрадь Волкова',i:'📓',ch:1,d:'Личные записи о пациенте №7 и проекте «Mindcase». Эксперименты по стиранию памяти.'},
  ev_patient:{n:'Записка пациента',i:'✉️',ch:1,d:'«Доктор М. обещал, что я забуду. Но я не хочу забывать. Я спрячу это».'},
  /* Глава 2 */
  ev_photo:{n:'Фотография',i:'📷',ch:2,d:'Из квартиры Орлова. Круглова садится в машину к мужчине в форме комиссара.'},
  ev_tape:{n:'Диктофон Орлова',i:'🎙',ch:2,d:'Запись: «Убери журналиста, пока он не заговорил». Голос — Кругловой.'},
  ev_letter:{n:'Анонимное письмо',i:'✉️',ch:2,d:'«Не лезь в клинику. Mindcase — не миф. Тебя предупредили». Адресовано Орлову.'},
  ev_key:{n:'Ключ от архива',i:'🔑',ch:2,d:'Ключ с биркой «АРХ. 3». Был спрятан в сливном бачке в квартире Орлова.'},
  ev_contract:{n:'Контракт',i:'📄',ch:2,d:'Договор между клиникой и «Рябов Б.С.» на «исследовательскую программу». Сумма — 47 млн.'},
  ev_cross:{n:'Перекрёстная сверка',i:'🔎',ch:2,d:'Сопоставление дат: Орлов погиб через 4 часа после звонка из кабинета Кругловой.'},
  /* Глава 3 */
  ev_drive:{n:'Флешка',i:'💾',ch:3,d:'Зашифрованные данные. Файлы «стирание памяти пациента №7». Куратор — Рябов.'},
  ev_diary:{n:'Дневник пациента №7',i:'📔',ch:3,d:'Многолетние записи. Последняя: «Он снова приходил. Комиссар Рябов. Я видел его лицо».'},
  ev_badge:{n:'Значок комиссара',i:'🎖',ch:3,d:'Найден в лаборатории. Принадлежит Б.С. Рябову. На обороте — следы крови.'},
  ev_photo2:{n:'Фото Рябова',i:'📸',ch:3,d:'Рябов в лаборатории рядом с пациентом №7. Датировано вчера.'},
  ev_confess:{n:'Финансовая расписка',i:'📝',ch:3,d:'Рябов признаёт: проект финансировался из «служебных фондов» МВД.'}
};

const CH = {
  sokolova:{n:'Вера Соколова',r:'Старшая медсестра',i:'👩‍⚕️',d:'12 лет в клинике. Спокойна, наблюдательна. Была на смене в ночь убийства.'},
  moroz:{n:'Игорь Мороз',r:'Психиатр',i:'👨‍⚕️',d:'Коллега и соавтор Волкова по проекту «Mindcase». Внешне невозмутим.'},
  lebedeva:{n:'Анна Лебедева',r:'Сестра пациента',i:'👩',d:'Её брат — пациент №7 — умер в клинике два года назад. Винит Волкова.'},
  orlov:{n:'Кирилл Орлов',r:'Журналист',i:'🕵️',d:'Погиб в главе II. Расследовал деятельность клиники.'},
  kruglova:{n:'Марина Круглова',r:'Директор клиники',i:'👩‍💼',d:'Холодна, расчётлива. Управляет «Новым Рассветом» шесть лет.'},
  ryabov:{n:'Борис Рябов',r:'Комиссар полиции',i:'🎖',d:'Ваш начальник. Патронирует клинику как «социальный проект».'},
  volkov:{n:'Антон Волков',r:'Жертва (гл. I)',i:'👨‍🔬',d:'Ведущий психиатр. Изучал стирание травматической памяти.'},
  kane:{n:'Алекс Кейн',r:'Следователь (вы)',i:'🔍',d:'12 лет в отделе. Убеждён: за клиникой стоит большее, чем кажется.'}
};

const LOC = {

/* ─────────── STATE ─────────── */
const DEFAULT_STATE = () => ({
  chapter:0,
  tab:'case',
  evidence:[],
  visited:[],
  met:[],
  links:[],       // массив пар "a|b"
  flags:{},
  rep:100,
  hintsUsed:0,
  device:'auto',
  sound:true,
  started:false
});
let S = DEFAULT_STATE();
let CUR_DLG = null;

/* ─────────── UTIL ─────────── */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
const el = (tag, attrs={}, ...kids) => {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const k of kids) {
    if (k == null || k === false) continue;
    e.appendChild(typeof k === 'string' ? document.createTextNode(k) : k);
  }
  return e;
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ─────────── AUDIO ─────────── */
let AC = null;
function sfx(kind) {
  if (!S.sound) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    const t = AC.currentTime;
    if (kind === 'click') { o.type='sine'; o.frequency.value=520; g.gain.setValueAtTime(0.03,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.08); o.start(t); o.stop(t+0.09); }
    else if (kind === 'ok') { o.type='triangle'; o.frequency.setValueAtTime(523,t); o.frequency.linearRampToValueAtTime(784,t+0.14); g.gain.setValueAtTime(0.06,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.28); o.start(t); o.stop(t+0.3); }
    else if (kind === 'err') { o.type='sawtooth'; o.frequency.setValueAtTime(200,t); o.frequency.linearRampToValueAtTime(90,t+0.2); g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.26); o.start(t); o.stop(t+0.28); }
    else if (kind === 'ev') { o.type='sine'; o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(880,t+0.1); g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.32); o.start(t); o.stop(t+0.34); }
  } catch (e) {}
}

/* ─────────── TOAST ─────────── */
function toast(msg, kind='') {
  const t = el('div', { class: 'toast ' + kind }, msg);
  $('#toast').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 2200);
  setTimeout(() => t.remove(), 2600);
}

/* ─────────── SAVE/LOAD ─────────── */
const SAVE_KEY = 'mindcase_save_v1';
function saveGame(silent) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); if (!silent) toast('Игра сохранена', 'ok'); return true; }
  catch (e) { if (!silent) toast('Не удалось сохранить', 'err'); return false; }
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object') return false;
    S = Object.assign(DEFAULT_STATE(), data);
    if (!Array.isArray(S.evidence)) S.evidence = [];
    if (!Array.isArray(S.visited)) S.visited = [];
    if (!Array.isArray(S.met)) S.met = [];
    if (!Array.isArray(S.links)) S.links = [];
    return true;
  } catch (e) { return false; }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
let saveTimer = null;
function autoSave() { clearTimeout(saveTimer); saveTimer = setTimeout(() => saveGame(true), 400); }

/* ─────────── HELPERS ─────────── */
function currentChapter() { return CHAPTERS[S.chapter] || CHAPTERS[0]; }
function hasEv(id) { return S.evidence.includes(id); }
function hasFlag(k) { return !!S.flags[k]; }
function setFlag(k) { if (!S.flags[k]) { S.flags[k] = true; autoSave(); } }
function addEv(id) {
  if (!id || hasEv(id)) return false;
  S.evidence.push(id); autoSave(); sfx('ev');
  const e = EV[id];
  if (e) toast('✦ Найдено: ' + e.n, 'ev');
  return true;
}
function isLocUnlocked(id) {
  const l = LOC[id]; if (!l) return false;
  if (l.ch !== currentChapter().n) return false;
  if (l.req && !hasEv(l.req)) return false;
  return true;
}
function hasLink(a, b) {
  return S.links.some(p => (p[0]===a && p[1]===b) || (p[0]===b && p[1]===a));
}
function chapterComplete() {
  const ch = currentChapter();
  return ch.keyEv.every(hasEv);
}
function linkCount(chN) {
  const evIds = new Set(Object.keys(EV).filter(k => EV[k].ch === chN));
  return S.links.filter(p => evIds.has(p[0]) && evIds.has(p[1])).length;
}

/* ─────────── DEVICE DETECTION ─────────── */
function detectDevice() {
  if (S.device !== 'auto') return S.device;
  const w = window.innerWidth, h = window.innerHeight;
  const touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (w >= 1600 && !touch) return 'tv';
  if (w >= 1024) return 'pc';
  if (w >= 700) return 'tablet';
  return 'phone';
}
function applyDevice() {
  const d = detectDevice();
  document.body.classList.remove('dev-pc','dev-phone','dev-tablet','dev-tv');
  document.body.classList.add('dev-' + d);
}

/* ─────────── SCREEN ─────────── */
function show(screenId) {
  $$('.screen').forEach(s => s.classList.remove('on'));
  const s = document.getElementById(screenId);
  if (s) { s.classList.add('on'); const f = s.querySelector('.fade-in'); if (f) { f.classList.remove('fade-in'); void f.offsetWidth; f.classList.add('fade-in'); } }
}

      const unvis = ch.locs.filter(id => isLocUnlocked(id) && !S.visited.includes(id)).length;
      if (unvis > 0) badge = String(unvis);
    }
    if (t.id === 'ev') {
      const unch = S.evidence.filter(k => EV[k] && EV[k].ch === ch.n && !S._evSeen?.[k]).length;

    );
    nav.appendChild(b);
  });

  // content
  const c = $('#hub-content');
  c.innerHTML = '';
  const renderer = { case:renderCase, loc:renderLocations, ev:renderEvidence, sus:renderSuspects, board:renderBoard, accuse:renderAccuse }[S.tab];

    card.appendChild(el('div', { class:'mu', style:'font-size:12px;text-transform:uppercase;letter-spacing:1px' }, label));
    card.appendChild(el('div', { style:'font-size:22px;font-weight:600;margin-top:6px' }, val + ' / ' + total));
    const bar = el('div', { style:'height:4px;background:#0a0d14;border-radius:2px;margin-top:10px;overflow:hidden' });
    const fill = el('div', { style:`height:100%;width:${(val/total*100).toFixed(0)}%;background:linear-gradient(90deg,#e0433b,#ff5c4d);transition:width .4s` });
    bar.appendChild(fill); card.appendChild(bar);
    return card;
  };
  prog.appendChild(stat('Ключевые улики', evDone, evTotal));
  prog.appendChild(stat('Осмотрено локаций', locVisited, locTotal));
  prog.appendChild(stat('Допросов', dlgMet, dlgTotal));
  prog.appendChild(stat('Связей на доске', linkCount(ch.n), linksTotal));
  c.appendChild(prog);

  if (chapterComplete()) {
    c.appendChild(el('div', { class:'section-title' }, 'Готово к обвинению'));
    const card = el('div', { class:'panel', style:'padding:16px;border-color:#e0433b' });
    card.appendChild(el('p', { style:'margin-bottom:12px' }, 'Вы собрали достаточно доказательств. Переходите к выдвижению обвинения.'));
    card.appendChild(el('button', { class:'btn primary', onclick: () => { S.tab='accuse'; renderHub(); } }, '⚖ Выдвинуть обвинение'));
    c.appendChild(card);
  }
}

  // Модальное окно с описанием

  box.appendChild(el('div', { class:'row', style:'margin-bottom:12px' },

  ));

/* ─────────── BOARD ─────────── */
let boardSel = [];
function renderBoard(c, ch) {
  c.appendChild(el('h2', {}, 'Доска расследования'));
  c.appendChild(el('p', { class:'mu', style:'margin-top:6px;margin-bottom:16px' }, 'Выберите две улики, чтобы установить связь. Правильные пары откроют новые выводы.'));

  const evIds = S.evidence.filter(k => EV[k] && EV[k].ch <= ch.n);
  if (evIds.length < 2) { c.appendChild(el('p', { class:'dim' }, 'Нужно как минимум две улики.')); return; }

  const grid = el('div', { class:'board-grid' });
  evIds.forEach(id => {
    const e = EV[id];
    const sel = boardSel.includes(id);
    const isLinked = S.links.some(p => p[0] === id || p[1] === id);
    const node = el('div', { class:'board-node' + (sel ? ' sel' : '') + (isLinked ? ' linked' : ''), onclick: () => toggleBoard(id) },
      el('div', { style:'font-size:20px;margin-bottom:4px' }, e.i),
      el('div', {}, e.n)
    );
    grid.appendChild(node);
  });
  c.appendChild(grid);

  c.appendChild(el('div', { class:'section-title' }, 'Установленные связи (' + S.links.length + ')'));
  if (!S.links.length) {
    c.appendChild(el('p', { class:'dim' }, 'Связей пока нет.'));
  } else {
    const list = el('div', { class:'links-list' });
    S.links.forEach(p => {
      const link = LINKS.find(L => (L.a===p[0] && L.b===p[1]) || (L.a===p[1] && L.b===p[0]));
      if (!link) return;
      const item = el('div', { class:'link-item' });
      item.appendChild(el('div', { class:'mu' }, link.t));
      item.appendChild(el('div', {}, link.d));
      list.appendChild(item);
    });
    c.appendChild(list);
  }

  if (boardSel.length) {
    const row = el('div', { class:'row', style:'margin-top:14px' });
    row.appendChild(el('span', { class:'mu' }, 'Выбрано: ' + boardSel.map(id => EV[id].n).join(' + ')));
    row.appendChild(el('button', { class:'btn primary', onclick: tryLink }, 'Связать'));
    row.appendChild(el('button', { class:'btn ghost', onclick: () => { boardSel=[]; renderHub(); } }, 'Сбросить'));
    c.appendChild(row);
  }
}
function toggleBoard(id) {
  sfx('click');
  if (boardSel.includes(id)) boardSel = boardSel.filter(x => x !== id);
  else { if (boardSel.length >= 2) boardSel.shift(); boardSel.push(id); }
  renderHub();
}
function tryLink() {
  if (boardSel.length !== 2) return;
  const [a, b] = boardSel;
  if (hasLink(a, b)) { toast('Связь уже установлена', 'err'); sfx('err'); boardSel=[]; renderHub(); return; }
  const link = LINKS.find(L => (L.a===a && L.b===b) || (L.a===b && L.b===a));
  if (!link) { toast('Между этими уликами нет прямой связи', 'err'); sfx('err'); S.rep = Math.max(0, S.rep - 2); boardSel=[]; autoSave(); renderHub(); return; }
  S.links.push([a, b]);
  sfx('ok');
  toast('✦ Установлена связь: ' + link.t, 'ok');
  boardSel = [];
  autoSave();
  renderHub();
}

function submitAccusation() {
  const ch = currentChapter();
  const sus = S.accuseSuspect, ev = S.accuseEv;
  if (!sus || !ev) return;
  if (sus === ch.culprit && ev === ch.proof) {
    sfx('ok');
    showChapterEnding(true, ch);
  } else {
    sfx('err');
    S.rep = Math.max(0, S.rep - 15);
    toast('✖ Обвинение отклонено. Суд не принял доводы.', 'err');
    autoSave();
    renderHub();
  }
}

function showChapterEnding(success, ch) {

  box.appendChild(el('div', { class:'tag' }, 'Глава ' + ch.n + ' завершена'));

  else { title = 'ТЕНЬ СОМНЕНИЯ'; color = '#e0433b'; text = 'Суд признал Рябова виновным, но приговор обжалован. Круглова оправдана за недостатком доказательств. Проект «Mindcase» официально «не существовал». Вы остались с ощущением, что не всё сказали.'; }

  const rows = [
    ['Глав завершено', CHAPTERS.length + ' / 3'],
    ['Улик собрано', S.evidence.length + ' / ' + Object.keys(EV).length],
    ['Связей установлено', S.links.length + ' / ' + LINKS.length],
    ['Подозреваемых опрошено', S.met.length],
    ['Подсказок использовано', String(S.hintsUsed)],

  ];

/* ─────────── DIALOGUE ─────────── */
function startDialogue(id) {
  const dlg = DLG[id];
  if (!dlg) return;
  CUR_DLG = { id, dlg, node: dlg.start };
  if (!S.met.includes(dlg.char)) { S.met.push(dlg.char); autoSave(); }
  renderDialogue();
  show('s-dlg');
  sfx('click');
}

function renderDialogue() {
  if (!CUR_DLG) return;
  const { dlg, node } = CUR_DLG;
  const person = CH[dlg.char];
  const head = $('#dlg-head');
  head.innerHTML = '';
  head.appendChild(el('div', { class:'char-avatar lg' }, person.i));
  head.appendChild(el('div', {},
    el('h3', {}, person.n),
    el('div', { class:'mu', style:'font-size:12px' }, person.r)
  ));

  const body = $('#dlg-body');
  body.innerHTML = '';

  const cur = dlg.nodes[node];
  if (!cur) { endDialogue(); return; }

  const text = el('div', { class:'dlg-text' }, cur.t);
  body.appendChild(text);

  if (cur.flag) setFlag(cur.flag);

  const opts = el('div', { class:'dlg-opts' });

  if (cur.o) {
    cur.o.forEach(o => {
      const b = el('button', { class:'dlg-opt', onclick: () => {
        sfx('click');
        if (o.end) { endDialogue(); return; }
        if (o.present) { openPresentPicker(); return; }
        if (o.n) { CUR_DLG.node = o.n; renderDialogue(); }
      }}, o.t);
      opts.appendChild(b);
    });
  }
  body.appendChild(opts);
  body.scrollTop = 0;
}

function openPresentPicker() {
  const box = createModal();
  box.innerHTML = '';
  box.appendChild(el('h2', { style:'margin-bottom:6px' }, 'Предъявить улику'));
  box.appendChild(el('p', { class:'mu', style:'margin-bottom:14px' }, 'Какую улику показать?'));
  const wrap = el('div', { class:'grid c2' });
  S.evidence.filter(k => EV[k]).forEach(id => {
    const e = EV[id];
    const card = el('div', { class:'card', onclick: () => { closeModal(); presentEvidence(id); } },
      el('div', { class:'row' }, el('div', { class:'ev-icon' }, e.i), el('div', {}, el('h4', {}, e.n))));
    wrap.appendChild(card);
  });
  if (!S.evidence.length) box.appendChild(el('p', { class:'dim' }, 'У вас нет улик.'));
  else box.appendChild(wrap);
  box.appendChild(el('div', { class:'hr' }));
  box.appendChild(el('button', { class:'btn', onclick: closeModal }, 'Отмена'));
  openModal();
}

function presentEvidence(id) {
  if (!CUR_DLG) return;
  const { dlg, node } = CUR_DLG;
  const cur = dlg.nodes[node];
  if (!cur || !cur.present) return;
  const p = cur.present[id];
  const e = EV[id];
  if (p) {
    // Ответ на улику
    if (p.flag) setFlag(p.flag);
    // Показать реакцию в тексте, потом перейти к узлу
    const body = $('#dlg-body');
    const reaction = el('div', { class:'dlg-text narr' }, 'Вы предъявляете: ' + e.n);
    body.appendChild(reaction);
    const next = dlg.nodesPresent && dlg.nodesPresent[p.n];
    if (next) {
      CUR_DLG.node = 'PRESENT_' + p.n;
      // подменяем на узел
      dlg.nodes['PRESENT_' + p.n] = next;
      setTimeout(() => { CUR_DLG.node = 'PRESENT_' + p.n; renderDialogue(); }, 400);
    }
    sfx('ok');
  } else {
    const body = $('#dlg-body');
    body.appendChild(el('div', { class:'dlg-text narr' }, '— ' + dlg.char + ' не реагирует. Эта улика здесь ни к чему.'));
    sfx('err');
    S.rep = Math.max(0, S.rep - 1);
    autoSave();
    setTimeout(() => { CUR_DLG.node = dlg.start; renderDialogue(); }, 900);
  }
}

function endDialogue() {
  CUR_DLG = null;
  autoSave();
  show('s-hub');
  renderHub();
}

/* ─────────── HINTS ─────────── */
function giveHint() {
  const ch = currentChapter();
  const missingEv = ch.keyEv.filter(k => !hasEv(k));
  if (missingEv.length) { toast('Подсказка: найдите «' + EV[missingEv[0]].n + '».', 'ok'); S.hintsUsed++; autoSave(); return; }
  const missingLinks = LINKS.filter(L => (EV[L.a]?.ch === ch.n || EV[L.b]?.ch === ch.n) && !hasLink(L.a, L.b));
  if (missingLinks.length) {
    const L = missingLinks[0];
    toast('Подсказка: свяжите «' + EV[L.a].n + '» и «' + EV[L.b].n + '».', 'ok');
    S.hintsUsed++; autoSave(); return;
  }
  const unvisited = ch.locs.filter(id => isLocUnlocked(id) && !S.visited.includes(id));
  if (unvisited.length) { toast('Подсказка: осмотрите «' + LOC[unvisited[0]].n + '».', 'ok'); S.hintsUsed++; autoSave(); return; }
  const unMet = ch.suspects.filter(id => !S.met.includes(id));
  if (unMet.length) { toast('Подсказка: допросите ' + CH[unMet[0]].n + '.', 'ok'); S.hintsUsed++; autoSave(); return; }
  toast('Подсказка: вы готовы выдвинуть обвинение.', 'ok');
  S.hintsUsed++; autoSave();
}

/* ─────────── MODAL ─────────── */
function createModal() {
  let m = document.getElementById('game-modal');
  if (m) m.remove();
  m = el('div', { class:'modal', id:'game-modal', onclick: (e) => { if (e.target === m) closeModal(); } });
  const box = el('div', { class:'modal-box', id:'modal-box' });
  m.appendChild(box);
  document.body.appendChild(m);
  return box;
}
function openModal() { const m = document.getElementById('game-modal'); if (m) m.classList.add('on'); }
function closeModal() { const m = document.getElementById('game-modal'); if (m) { m.classList.remove('on'); setTimeout(() => m.remove(), 200); } }

/* ─────────── SETTINGS ─────────── */
function openSettings() {
  const box = createModal();
  box.innerHTML = '';
  box.appendChild(el('h2', { style:'margin-bottom:14px' }, '⚙ Настройки'));
  box.appendChild(el('div', { class:'row', style:'margin-bottom:14px' },
    el('span', { class:'grow' }, 'Звук'),
    el('button', { class:'btn', onclick: (e) => { S.sound = !S.sound; e.target.textContent = S.sound ? 'Вкл' : 'Выкл'; autoSave(); } }, S.sound ? 'Вкл' : 'Выкл')
  ));
  box.appendChild(el('div', { class:'section-title' }, 'Устройство интерфейса'));
  const devices = [['auto','Авто'], ['pc','ПК'], ['phone','Телефон'], ['tablet','Планшет'], ['tv','ТВ']];
  const row = el('div', { class:'row' });
  devices.forEach(([k, t]) => {
    const b = el('button', { class:'btn' + (S.device === k ? ' primary' : ''), onclick: () => { S.device = k; autoSave(); applyDevice(); closeModal(); openSettings(); } }, t);
    row.appendChild(b);
  });
  box.appendChild(row);
  box.appendChild(el('div', { class:'hr' }));
  box.appendChild(el('button', { class:'btn', onclick: closeModal }, 'Закрыть'));
  openModal();
}

function openAbout() {
  const box = createModal();
  box.innerHTML = '';
  box.appendChild(el('h2', { style:'margin-bottom:14px' }, 'О игре'));
  box.appendChild(el('p', { style:'line-height:1.7;color:#cfd5e2' }, 'MIND CASE — детективный триллер о следователе Алексе Кейне и его расследовании, которое вскрывает тайный проект по стиранию памяти.'));
  box.appendChild(el('p', { style:'margin-top:10px;line-height:1.7;color:#cfd5e2' }, 'Три главы. Три дела. Одна правда.'));
  box.appendChild(el('div', { class:'hr' }));
  box.appendChild(el('button', { class:'btn', onclick: closeModal }, 'Закрыть'));
  openModal();
}

function openPause() {
  const box = createModal();
  box.innerHTML = '';
  box.appendChild(el('h2', { style:'margin-bottom:14px' }, '⏸ Пауза'));
  box.appendChild(el('button', { class:'btn primary', style:'width:100%;margin-bottom:8px', onclick: () => { saveGame(); closeModal(); } }, '💾 Сохранить'));
  box.appendChild(el('button', { class:'btn', style:'width:100%;margin-bottom:8px', onclick: () => { closeModal(); openSettings(); } }, '⚙ Настройки'));
  box.appendChild(el('button', { class:'btn', style:'width:100%;margin-bottom:8px', onclick: () => { if (confirm('Вернуться в меню? Несохранённый прогресс будет потерян.')) { closeModal(); renderMenu(); } } }, '⌂ В главное меню'));
  box.appendChild(el('button', { class:'btn ghost', style:'width:100%', onclick: closeModal }, 'Продолжить'));
  openModal();
}

/* ─────────── INIT / EVENTS ─────────── */
function bindEvents() {
  $('#btn-new').addEventListener('click', () => {
    sfx('click');
    if (hasSave() && !confirm('Начать новую игру? Текущее сохранение будет удалено.')) return;
    try { localStorage.removeItem(SAVE_KEY); } catch(e){}
    startIntro();
    show('s-intro');
  });
  $('#btn-continue').addEventListener('click', () => {
    sfx('click');
    if (loadGame()) { renderHub(); show('s-hub'); }
    else toast('Сохранение не найдено', 'err');
  });
  $('#btn-settings').addEventListener('click', () => { sfx('click'); openSettings(); });
  $('#btn-about').addEventListener('click', () => { sfx('click'); openAbout(); });

  $('#btn-save').addEventListener('click', () => { sfx('click'); saveGame(); });
  $('#btn-hint').addEventListener('click', () => { sfx('click'); giveHint(); });
  $('#btn-pause').addEventListener('click', () => { sfx('click'); openPause(); });
  $('#btn-dlg-back').addEventListener('click', () => { sfx('click'); endDialogue(); });

  window.addEventListener('resize', () => {
    applyDevice();
    if ($('#s-hub').classList.contains('on')) renderHub();
  });
  window.addEventListener('beforeunload', () => { if (S.started) saveGame(true); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const m = document.getElementById('game-modal');
      if (m && m.classList.contains('on')) { closeModal(); return; }
      if ($('#s-hub').classList.contains('on')) openPause();
    }
  });
}

function init() {
  applyDevice();
  bindEvents();
  renderMenu();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
