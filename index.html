<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>3D-скан головы</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    color: #dff6ff;
  }
  #stage { position: fixed; inset: 0; }

  #video, #scan {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1);   /* зеркалим, как в селфи */
  }
  #scan { pointer-events: none; }

  #viewer { position: absolute; inset: 0; display: none; background: #000; }
  #viewer canvas { display: block; }

  #ui {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 22px 22px calc(22px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    z-index: 10; pointer-events: none;
  }
  #status {
    font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
    opacity: .75; text-shadow: 0 0 12px #000;
  }
  button {
    pointer-events: auto;
    padding: 14px 34px; border-radius: 999px; border: 1px solid rgba(0,229,255,.55);
    background: rgba(0, 40, 60, .55); backdrop-filter: blur(10px);
    color: #bff4ff; font-size: 15px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; cursor: pointer;
    transition: background .2s, box-shadow .2s, opacity .2s;
  }
  button:hover:not(:disabled) { background: rgba(0,120,170,.55); box-shadow: 0 0 24px rgba(0,229,255,.35); }
  button:disabled { opacity: .3; cursor: default; }

  #loader {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 14px; letter-spacing: .1em; text-transform: uppercase; opacity: .7;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="scan"></canvas>
  <div id="viewer"></div>

  <div id="loader">Загрузка модели…</div>

  <div id="ui">
    <div id="status">Ищу лицо…</div>
    <button id="saveBtn" disabled>Сохранить</button>
    <button id="resetBtn" style="display:none">Сканировать заново</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FaceLandmarker, FilesetResolver } from
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

/* ------------------------------------------------------------------ */
/*  КОНСТАНТЫ                                                          */
/* ------------------------------------------------------------------ */
const WASM_PATH  = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MODEL_PATH = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

// Каноническая топология лица: 468 вершин, 898 треугольников.
// Скачай файл локально, если не хочешь зависеть от CDN.
const OBJ_URL = 'https://cdn.jsdelivr.net/gh/google/mediapipe@master/mediapipe/modules/face_geometry/data/canonical_face_model.obj';

/* ------------------------------------------------------------------ */
/*  DOM                                                                */
/* ------------------------------------------------------------------ */
const videoEl  = document.getElementById('video');
const scanEl   = document.getElementById('scan');
const scanCtx  = scanEl.getContext('2d');
const viewerEl = document.getElementById('viewer');
const statusEl = document.getElementById('status');
const saveBtn  = document.getElementById('saveBtn');
const resetBtn = document.getElementById('resetBtn');
const loaderEl = document.getElementById('loader');

/* ------------------------------------------------------------------ */
/*  СОСТОЯНИЕ                                                          */
/* ------------------------------------------------------------------ */
let faceLandmarker = null;
let stream         = null;
let triangles      = null;      // [[a,b,c], ...]
let landmarks      = null;      // текущий кадр (468 точек)
let scanning       = true;
let lastVideoTime  = -1;

/* ------------------------------------------------------------------ */
/*  1. ТОПОЛОГИЯ ЛИЦА                                                  */
/* ------------------------------------------------------------------ */
async function loadTopology() {
  const res  = await fetch(OBJ_URL);
  const text = await res.text();
  const tris = [];

  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (line[0] !== 'f' || line[1] !== ' ') continue;
    // "f 12/12/12 13/13/13 14/14/14"
    const idx = line.split(/\s+/).slice(1).map(s => parseInt(s, 10) - 1);
    for (let i = 1; i < idx.length - 1; i++) {
      tris.push([idx[0], idx[i], idx[i + 1]]);
    }
  }
  return tris;
}

/* ------------------------------------------------------------------ */
/*  2. КАМЕРА + MEDIAPIPE                                              */
/* ------------------------------------------------------------------ */
async function startCamera() {
  stream = await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
    audio: false
  });
  videoEl.srcObject = stream;
  await videoEl.play();

  scanEl.width  = videoEl.videoWidth;
  scanEl.height = videoEl.videoHeight;
}

async function startLandmarker() {
  const fileset = await FilesetResolver.forVisionTasks(WASM_PATH);

  const opts = {
    baseOptions: { modelAssetPath: MODEL_PATH, delegate: 'GPU' },
    runningMode: 'VIDEO',
    numFaces: 1,
    minFaceDetectionConfidence: 0.4,
    minFacePresenceConfidence: 0.4,
    minTrackingConfidence: 0.4
  };

  try {
    faceLandmarker = await FaceLandmarker.createFromOptions(fileset, opts);
  } catch (e) {
    // некоторые устройства/браузеры не тянут GPU-делегат
    opts.baseOptions.delegate = 'CPU';
    faceLandmarker = await FaceLandmarker.createFromOptions(fileset, opts);
  }
}

/* ------------------------------------------------------------------ */
/*  3. ЦИКЛ СКАНИРОВАНИЯ                                               */
/* ------------------------------------------------------------------ */
function loop() {
  if (!scanning) return;
  requestAnimationFrame(loop);

  if (videoEl.readyState < 2) return;
  if (videoEl.currentTime === lastVideoTime) return;
  lastVideoTime = videoEl.currentTime;

  const res = faceLandmarker.detectForVideo(videoEl, performance.now());

  if (res.faceLandmarks && res.faceLandmarks.length > 0) {
    landmarks = res.faceLandmarks[0];
    statusEl.textContent = 'Лицо захвачено — держи голову ровно';
    saveBtn.disabled = false;
  } else {
    landmarks = null;
    statusEl.textContent = 'Ищу лицо…';
    saveBtn.disabled = true;
  }
  drawOverlay();
}

function drawOverlay() {
  const w = scanEl.width, h = scanEl.height;
  scanCtx.clearRect(0, 0, w, h);
  if (!landmarks) return;

  // Сетка
  scanCtx.lineWidth = Math.max(1, w / 900);
  scanCtx.strokeStyle = 'rgba(0, 235, 255, 0.22)';
  scanCtx.beginPath();
  for (const t of triangles) {
    const p0 = landmarks[t[0]], p1 = landmarks[t[1]], p2 = landmarks[t[2]];
    scanCtx.moveTo(p0.x * w, p0.y * h);
    scanCtx.lineTo(p1.x * w, p1.y * h);
    scanCtx.lineTo(p2.x * w, p2.y * h);
    scanCtx.lineTo(p0.x * w, p0.y * h);
  }
  scanCtx.stroke();

  // Точки
  scanCtx.fillStyle = 'rgba(150, 255, 245, 0.95)';
  const r = Math.max(1.2, w / 1000);
  for (const p of landmarks) {
    scanCtx.beginPath();
    scanCtx.arc(p.x * w, p.y * h, r, 0, Math.PI * 2);
    scanCtx.fill();
  }

  // Бегущая «сканирующая» линия
  const t   = (performance.now() % 2600) / 2600;
  const y   = t * h;
  const grd = scanCtx.createLinearGradient(0, y - 40, 0, y + 40);
  grd.addColorStop(0,   'rgba(0,255,220,0)');
  grd.addColorStop(0.5, 'rgba(0,255,220,0.35)');
  grd.addColorStop(1,   'rgba(0,255,220,0)');
  scanCtx.fillStyle = grd;
  scanCtx.fillRect(0, y - 40, w, 80);
}

/* ------------------------------------------------------------------ */
/*  4. ПОСТРОЕНИЕ 3D-МОДЕЛИ                                            */
/* ------------------------------------------------------------------ */
function buildHeadMesh(frameLandmarks) {
  const aspect = videoEl.videoWidth / videoEl.videoHeight;
  const n = frameLandmarks.length;

  const positions = new Float32Array(n * 3);
  const uvs       = new Float32Array(n * 2);

  for (let i = 0; i < n; i++) {
    const lm = frameLandmarks[i];

    // x нормирован по ширине, y — по высоте, z — по ширине
    positions[i * 3 + 0] =  (lm.x - 0.5);
    positions[i * 3 + 1] = -(lm.y - 0.5) / aspect;
    positions[i * 3 + 2] = -lm.z;

    // экранные UV = «фотография» лица
    uvs[i * 2 + 0] = lm.x;
    uvs[i * 2 + 1] = 1 - lm.y;
  }

  const indices = new Uint16Array(triangles.length * 3);
  for (let i = 0; i < triangles.length; i++) {
    indices[i * 3 + 0] = triangles[i][0];
    indices[i * 3 + 1] = triangles[i][1];
    indices[i * 3 + 2] = triangles[i][2];
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setAttribute('uv',       new THREE.BufferAttribute(uvs, 2));
  geom.setIndex(new THREE.BufferAttribute(indices, 1));

  // Центрируем модель в начале координат
  geom.computeBoundingBox();
  const c = new THREE.Vector3();
  geom.boundingBox.getCenter(c);
  geom.translate(-c.x, -c.y, -c.z);

  geom.computeVertexNormals();
  geom.computeBoundingSphere();
  return geom;
}

function grabFrameTexture() {
  const fc = document.createElement('canvas');
  fc.width  = videoEl.videoWidth;
  fc.height = videoEl.videoHeight;
  fc.getContext('2d').drawImage(videoEl, 0, 0);

  const tex = new THREE.CanvasTexture(fc);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  tex.flipY = true;               // UV мы считаем как (x, 1-y) — совпадает
  return tex;
}

/* ------------------------------------------------------------------ */
/*  5. ПЕРЕХОД В 3D-ПРОСМОТР                                           */
/* ------------------------------------------------------------------ */
function show3D() {
  scanning = false;
  saveBtn.style.display  = 'none';
  resetBtn.style.display = '';
  statusEl.textContent   = 'Вращай мышью · колесо — зум';

  videoEl.style.display = 'none';
  scanEl.style.display  = 'none';
  viewerEl.style.display = 'block';

  const geom = buildHeadMesh(landmarks);
  const tex  = grabFrameTexture();

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  viewerEl.appendChild(renderer.domElement);

  const scene  = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.001, 100);
  const r = geom.boundingSphere.radius;
  const dist = r / Math.sin(THREE.MathUtils.degToRad(32 / 2)) * 1.5;
  camera.position.set(0, 0, dist);
  camera.near = dist / 200;
  camera.far  = dist * 20;
  camera.updateProjectionMatrix();

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = dist * 0.35;
  controls.maxDistance = dist * 2.5;
  controls.target.set(0, 0, 0);

  // Свет: текстура уже содержит запечённое освещение, поэтому мягко
  scene.add(new THREE.AmbientLight(0xffffff, 1.5));
  const key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(0.6, 1.0, 1.8);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x66aaff, 0.7);
  rim.position.set(-1.2, 0.4, -1.0);
  scene.add(rim);

  const mat = new THREE.MeshStandardMaterial({
    map: tex,
    roughness: 0.9,
    metalness: 0.0,
    side: THREE.DoubleSide   // мы инвертировали Y → меняется обход вершин
  });

  const head = new THREE.Mesh(geom, mat);
  scene.add(head);

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', onResize);

  (function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  })();

  // Легальный ре-скан
  resetBtn.onclick = () => {
    window.removeEventListener('resize', onResize);
    renderer.dispose();
    geom.dispose();
    tex.dispose();
    mat.dispose();
    viewerEl.innerHTML = '';
    viewerEl.style.display = 'none';
    videoEl.style.display  = '';
    scanEl.style.display   = '';
    saveBtn.style.display  = '';
    resetBtn.style.display = 'none';
    scanning = true;
    lastVideoTime = -1;
    loop();
  };
}

/* ------------------------------------------------------------------ */
/*  6. СТАРТ                                                           */
/* ------------------------------------------------------------------ */
(async function init() {
  try {
    // Топологию можно грузить параллельно с камерой
    const [topo] = await Promise.all([ loadTopology(), startCamera() ]);
    triangles = topo;

    await startLandmarker();

    loaderEl.style.display = 'none';
    statusEl.textContent = 'Ищу лицо…';
    loop();
  } catch (err) {
    console.error(err);
    loaderEl.textContent = 'Ошибка: ' + err.message +
      ' (нужен HTTPS или localhost и доступ к камере)';
  }
})();

saveBtn.addEventListener('click', () => {
  if (!landmarks) return;
  show3D();
});
</script>
</body>
</html>
