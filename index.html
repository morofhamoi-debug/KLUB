<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Главная</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --accent:#6366f1;--accent2:#8b5cf6;--accent3:#ec4899;
    --text:#0b1220;--muted:#64748b;
  }
  html,body{height:100%;overflow:hidden;background:#fff;color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  body::before{
    content:'';position:fixed;inset:-10%;z-index:0;pointer-events:none;
    background:
      radial-gradient(500px circle at 15% 10%,rgba(99,102,241,.14),transparent 55%),
      radial-gradient(700px circle at 95% 95%,rgba(139,92,246,.12),transparent 55%),
      radial-gradient(400px circle at 50% 50%,rgba(236,72,153,.06),transparent 60%);
    animation:float 22s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(-30px,-25px) scale(1.06)}
  }
  .wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
    padding:clamp(20px,5vw,60px);overflow-y:auto}
  .top{display:flex;justify-content:space-between;align-items:center;
    animation:dropIn .8s cubic-bezier(.2,.9,.2,1) both}
  @keyframes dropIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:44px;height:44px;border-radius:14px;
    background:conic-gradient(from 180deg,var(--accent),var(--accent2),var(--accent3),var(--accent));
    box-shadow:0 8px 24px rgba(99,102,241,.35);
    animation:spin 8s linear infinite;position:relative}
  .logo::after{content:'';position:absolute;inset:6px;border-radius:9px;background:#fff}
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .brand p{font-size:12px;color:var(--muted);font-weight:500}
  .clock{font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  .hero{margin:clamp(30px,7vh,80px) 0 clamp(20px,4vh,40px)}
  .hero h2{font-size:clamp(32px,7vw,64px);font-weight:800;letter-spacing:-.04em;line-height:1;
    animation:rise .9s .15s cubic-bezier(.2,.9,.2,1) both}
  .hero h2 span{background:linear-gradient(120deg,var(--accent),var(--accent2),var(--accent3));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:200% 200%;animation:shimmer 4s ease-in-out infinite}
  @keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .hero p{margin-top:14px;color:var(--muted);font-size:clamp(14px,2vw,17px);font-weight:500;
    animation:rise .9s .25s cubic-bezier(.2,.9,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    padding-bottom:40px}
  .card{position:relative;overflow:hidden;cursor:pointer;text-decoration:none;color:inherit;
    background:rgba(255,255,255,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(15,23,42,.06);border-radius:24px;padding:26px;
    box-shadow:0 4px 20px rgba(15,23,42,.04);
    transition:transform .5s cubic-bezier(.2,.9,.2,1),box-shadow .5s,border-color .5s;
    animation:pop .7s cubic-bezier(.2,.9,.2,1) both}
  @keyframes pop{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
  .card:hover{transform:translateY(-6px) scale(1.015);
    box-shadow:0 24px 60px -20px rgba(99,102,241,.35);border-color:rgba(99,102,241,.2)}
  .card:active{transform:scale(.98)}
  .card::before{content:'';position:absolute;inset:0;opacity:0;
    background:radial-gradient(400px circle at var(--mx,50%) var(--my,50%),rgba(99,102,241,.12),transparent 40%);
    transition:opacity .4s}
  .card:hover::before{opacity:1}
  .icon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;
    font-size:26px;margin-bottom:18px;position:relative;
    transition:transform .5s cubic-bezier(.2,.9,.2,1)}
  .card:hover .icon{transform:scale(1.1) rotate(-4deg)}
  .i1{background:linear-gradient(135deg,#eef2ff,#e0e7ff);color:#4f46e5}
  .i2{background:linear-gradient(135deg,#fdf2f8,#fce7f3);color:#db2777}
  .i3{background:linear-gradient(135deg,#f0fdf4,#dcfce7);color:#16a34a}
  .card h3{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
  .card p{font-size:13px;color:var(--muted);font-weight:500;line-height:1.5}
  .arrow{position:absolute;top:24px;right:24px;font-size:18px;color:var(--muted);
    opacity:0;transform:translateX(-8px);transition:all .4s cubic-bezier(.2,.9,.2,1)}
  .card:hover .arrow{opacity:1;transform:none;color:var(--accent)}
  .ripple{position:absolute;border-radius:50%;background:rgba(99,102,241,.25);
    transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
  @keyframes rip{to{transform:scale(4);opacity:0}}
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="logo"></div>
        <div><h1>Studio</h1><p>Мини-приложения</p></div>
      </div>
      <div class="clock" id="clock"></div>
    </header>

    <section class="hero">
      <h2>Привет, <span>друг</span></h2>
      <p>Выбирай приложение и начинай</p>
    </section>

    <div class="grid">
      <a class="card" href="piano.html" style="animation-delay:.35s">
        <div class="arrow">→</div>
        <div class="icon i1">🎹</div>
        <h3>Пианино</h3>
        <p>Мультитач, октавы, реалистичный звук</p>
      </a>
      <a class="card" href="settings.html" style="animation-delay:.45s">
        <div class="arrow">→</div>
        <div class="icon i2">⚙️</div>
        <h3>Настройки</h3>
        <p>Внешний вид, звук, язык, данные</p>
      </a>
      <div class="card" style="animation-delay:.55s;opacity:.55">
        <div class="icon i3">✨</div>
        <h3>Скоро</h3>
        <p>Новые приложения уже в разработке</p>
      </div>
    </div>
  </div>

<script>
  const clk = document.getElementById('clock');
  const tick = () => clk.textContent = new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  tick(); setInterval(tick, 1000);

  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('mousemove', e=>{
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX-r.left)+'px');
      card.style.setProperty('--my', (e.clientY-r.top)+'px');
    });
    card.addEventListener('pointerdown', e=>{
      const r = card.getBoundingClientRect();
      const rip = document.createElement('span');
      rip.className = 'ripple';
      const s = Math.max(r.width, r.height);
      rip.style.width = rip.style.height = s+'px';
      rip.style.left = (e.clientX-r.left-s/2)+'px';
      rip.style.top  = (e.clientY-r.top -s/2)+'px';
      card.appendChild(rip);
      setTimeout(()=>rip.remove(), 600);
    });
  });
</script>
</body>
</html>
