  const DialogueGraph = (() => {
    const graphs = new Map();

    const register = (id, def) => {
      if (!id || !isPlainObject(def) || !isPlainObject(def.nodes)) {
        Logger.warn('dialogue', 'register: некорректный граф', id);
        return false;
      }
      graphs.set(String(id), def);
      EventBus.emit('dialogue:graph-registered', { id: String(id) });
      return true;
    };

    const unregister = (id) => graphs.delete(String(id));
    const get = (id) => graphs.get(String(id)) || null;
    const has = (id) => graphs.has(String(id));
    const list = () => Array.from(graphs.keys());

    return { register, unregister, get, has, list };
  })();

  /* ==========================================================================
     МОДУЛЬ 5. DialogueAPI
     Всё, что связано с жизненным циклом одной беседы.
     Сессия — обычный объект, живёт внутри экрана и не публикуется в GameState.
     В GameState попадают только устойчивые факты:
       - storyFlags (через setFlag),
       - discoveredEvidence (через EvidenceAPI.discover),
       - testimonies (массив { id, charId, t }),
       - interviews[charId].askedIds — какие реплики уже выбирались.
     ========================================================================== */

  const DialogueAPI = (() => {

    const st = () => GameState.get();

    const checkRequire = (req, session) => {
      if (!req || !isPlainObject(req)) return { ok: true };
      const state = st();

      if (req.flag && !state.storyFlags[req.flag]) {
        return { ok: false, reason: 'flag:' + req.flag };
      }
      if (req.notFlag && state.storyFlags[req.notFlag]) {
        return { ok: false, reason: 'notFlag:' + req.notFlag };
      }
      if (req.evidence && !EvidenceAPI.isDiscovered(req.evidence)) {
        return { ok: false, reason: 'evidence:' + req.evidence };
      }
      if (Array.isArray(req.anyEvidence) && req.anyEvidence.length) {
        const any = req.anyEvidence.some((id) => EvidenceAPI.isDiscovered(id));
        if (!any) return { ok: false, reason: 'anyEvidence' };
      }
      if (typeof req.check === 'function') {
        try {
          const ok = !!req.check(state, session);
          if (!ok) return { ok: false, reason: 'custom' };
        } catch (e) {
          Logger.error('dialogue', 'require.check threw', e);
          return { ok: false, reason: 'custom-error' };
        }
      }
      return { ok: true };
    };

    const applyEffects = (effects, session, publicApi) => {
      if (typeof effects !== 'function') return;
      try { effects(publicApi, session); }
      catch (e) { Logger.error('dialogue', 'effects threw', e); }
    };

    // Регистрирует показание как улику категории 'testimony' и добавляет
    // в GameState.testimonies, если её там ещё нет.
    const addTestimony = (charId, testimony) => {
      if (!isPlainObject(testimony) || !testimony.id) return false;
      if (!EvidenceRegistry.has(testimony.id)) {
        EvidenceRegistry.register({
          id: testimony.id,
          title: String(testimony.title || testimony.id),
          category: 'testimony',
          icon: '💬',
          summary: String(testimony.summary || ''),
          detail: String(testimony.detail || ''),
          tags: ['testimony', 'from:' + (charId || 'unknown')]
        });
      }
      const wasNew = EvidenceAPI.discover(testimony.id, { silent: true });
      const state = st();
      if (!state.testimonies.some((t) => t.id === testimony.id)) {
        state.testimonies.push({ id: testimony.id, charId: charId || null, t: Date.now() });
        GameState.touch();
      }
      if (wasNew) {
        EventBus.emit('dialogue:testimony-added', { id: testimony.id, charId });
        EventBus.emit('evidence:discovered', {
          id: testimony.id,
          def: EvidenceRegistry.get(testimony.id)
        });
      }
      return wasNew;
    };

    const setFlag = (name, value) => GameState.setFlag(name, value);

    // Публичный API, который передаётся в effects/onEnter.
    const buildPublicApi = (session) => ({
      setFlag,
      addTestimony: (t) => addTestimony(session.characterId, t),
      discover: (id, opts) => EvidenceAPI.discover(id, opts),
      isDiscovered: (id) => EvidenceAPI.isDiscovered(id),
      getFlag: (name) => !!st().storyFlags[name],
      end: () => { session.ended = true; },
      goTo: (nodeId) => { session.pendingNodeId = nodeId; }
    });

    const createSession = (characterId, graphId) => {
      const graph = DialogueGraph.get(graphId);
      if (!graph) {
        Logger.warn('dialogue', 'createSession: граф не найден ' + graphId);
        return null;
      }
      const char = CharacterRegistry.get(characterId);
      if (!char) {
        Logger.warn('dialogue', 'createSession: персонаж не найден ' + characterId);
        return null;
      }
      const state = st();
      const interview = state.interviews[characterId] || { askedIds: [], shownEvidence: [] };

      const session = {
        characterId,
        graphId,
        char,
        graph,
        currentNodeId: graph.entry || null,
        history: [],
        askedChoiceIds: new Set(interview.askedIds || []),
        shownEvidenceIds: new Set(interview.shownEvidence || []),
        ended: false,
        pendingNodeId: null,
        _api: null
      };
      session._api = buildPublicApi(session);
      return session;
    };

    const getNode = (session, nodeId) => {
      if (!session || !session.graph || !session.graph.nodes) return null;
      return session.graph.nodes[nodeId] || null;
    };

    const resolveText = (node, session) => {
      if (!node) return '';
      if (typeof node.text === 'function') {
        try { return String(node.text(session) || ''); }
        catch (e) { Logger.error('dialogue', 'text fn threw', e); return ''; }
      }
      return String(node.text || '');
    };

    const resolveChoices = (session) => {
      const node = getNode(session, session.currentNodeId);
      if (!node || !Array.isArray(node.choices)) return [];
      const out = [];
      for (let i = 0; i < node.choices.length; i++) {
        const c = node.choices[i];
        if (!c || !c.id) continue;
        if (c.once && session.askedChoiceIds.has(c.id)) continue;
        if (typeof c.hideIf === 'function') {
          try { if (c.hideIf(st(), session)) continue; }
          catch (e) { Logger.error('dialogue', 'hideIf threw', e); }
        }
        const chk = checkRequire(c.require, session);
        out.push({
          id: c.id,
          label: String(c.label || c.id),
          next: c.next || null,
          ok: chk.ok,
          reason: chk.reason || null,
          raw: c
        });
      }
      return out;
    };

    const enter = (session, nodeId) => {
      const node = getNode(session, nodeId);
      if (!node) return false;
      session.currentNodeId = nodeId;
      session.history.push(nodeId);
      if (typeof node.onEnter === 'function') {
        try { node.onEnter(session, session._api); }
        catch (e) { Logger.error('dialogue', 'onEnter threw', e); }
      }
      if (node.endsDialogue) session.ended = true;
      EventBus.emit('dialogue:node-changed', { characterId: session.characterId, nodeId });
      return true;
    };

    const choose = (session, choiceId) => {
      const node = getNode(session, session.currentNodeId);
      if (!node || !Array.isArray(node.choices)) return false;
      const choice = node.choices.find((c) => c && c.id === choiceId);
      if (!choice) return false;

      const chk = checkRequire(choice.require, session);
      if (!chk.ok) return false;

      session.askedChoiceIds.add(choiceId);
      // Фиксируем в GameState.interviews.
      const state = st();
      if (!state.interviews[session.characterId]) {
        state.interviews[session.characterId] = { askedIds: [], shownEvidence: [] };
      }
      const iv = state.interviews[session.characterId];
      if (!iv.askedIds.includes(choiceId)) iv.askedIds.push(choiceId);
      GameState.touch();

      if (typeof choice.effects === 'function') applyEffects(choice.effects, session, session._api);

      // Если эффект попросил конкретный узел — идём туда.
      if (session.pendingNodeId) {
        const target = session.pendingNodeId;
        session.pendingNodeId = null;
        if (target === '__end__') { session.ended = true; return true; }
        return enter(session, target);
      }
      if (choice.next) return enter(session, choice.next);
      // Если next не указан — просто остаёмся на месте, но choiceOnce скроет его.
      return true;
    };

    /** Показать улику персонажу. Возвращает узел-ответ или null. */
    const showEvidence = (session, evidenceId) => {
      if (!session || !evidenceId) return false;
      if (!EvidenceAPI.isDiscovered(evidenceId)) return false;

      session.shownEvidenceIds.add(evidenceId);
      const state = st();
      if (!state.interviews[session.characterId]) {
        state.interviews[session.characterId] = { askedIds: [], shownEvidence: [] };
      }
      const iv = state.interviews[session.characterId];
      if (!iv.shownEvidence.includes(evidenceId)) iv.shownEvidence.push(evidenceId);
      GameState.touch();

      const node = getNode(session, session.currentNodeId);
      const map = node && node.evidenceResponses;
      if (isPlainObject(map) && map[evidenceId]) {
        return enter(session, map[evidenceId]);
      }
      // Дефолтная реакция — отдельный "узел", если задан.
      const fallback = session.graph.defaultEvidenceResponse;
      if (fallback) return enter(session, fallback);
      return false;
    };

    const end = (session) => {
      if (!session) return;
      session.ended = true;
      EventBus.emit('dialogue:ended', { characterId: session.characterId, graphId: session.graphId });
    };

    /** Управляет авто-переходом. Вызывается экраном после отрисовки узла. */
    const maybeAutoAdvance = (session) => {
      const node = getNode(session, session.currentNodeId);
      if (!node) return false;
      const hasChoices = Array.isArray(node.choices) && node.choices.length > 0;
      const auto = node.autoNext;
      if (auto && !hasChoices) {
        return enter(session, auto);
      }
      return false;
    };

    return {
      createSession,
      getNode,
      resolveText,
      resolveChoices,
      enter,
      choose,
      showEvidence,
      end,
      addTestimony,
      maybeAutoAdvance
    };
  })();

  /* ==========================================================================
     МОДУЛЬ 6. DialogueScreen
     Фабрика для ScreenRouter: id = 'dialogue'.
     Параметры: { characterId, graphId }
     ========================================================================== */

  const makeDialogueScreen = (params) => {
    const characterId = params && params.characterId;
    const graphId = params && params.graphId;

    const wrap = document.createElement('div');
    wrap.className = 'mc-dialogue';

    // Пустое состояние — если персонаж/граф не переданы или не найдены.
    const session = characterId && graphId ? DialogueAPI.createSession(characterId, graphId) : null;

    if (!session) {
      const empty = document.createElement('div');
      empty.className = 'mc-dialogue__empty';
      empty.style.gridColumn = '1 / -1';
      empty.innerHTML = ''
        + '<h3>ДИАЛОГ</h3>'
        + '<p>Персонажи и графы диалогов будут подключены в следующих частях.</p>';
      wrap.appendChild(empty);

      const backRow = document.createElement('div');
      backRow.className = 'mc-settings__footer';
      backRow.style.gridColumn = '1 / -1';
      backRow.appendChild(UIComponents.button({
        label: '← Назад в меню',
        variant: 'ghost',
        onClick: () => ScreenRouter.show('menu')
      }));
      wrap.appendChild(backRow);
      return wrap;
    }

    /* -------- Портрет -------- */
    const portraitCol = document.createElement('div');
    portraitCol.className = 'mc-dialogue__portrait';

    const canvas = document.createElement('canvas');
    portraitCol.appendChild(canvas);
    PortraitRenderer.draw(canvas, session.char);

    const meta = document.createElement('div');
    meta.className = 'mc-dialogue__meta';
    meta.appendChild(UIComponents.el('div', { className: 'mc-dialogue__name', text: session.char.name }));
    if (session.char.title) {
      meta.appendChild(UIComponents.el('div', { className: 'mc-dialogue__title', text: session.char.title }));
    }
    portraitCol.appendChild(meta);

    /* -------- Диалоговое поле -------- */
    const flow = document.createElement('div');
    flow.className = 'mc-dialogue__flow';

    const textBox = document.createElement('div');
    textBox.className = 'mc-dialogue__text';

    const choicesBox = document.createElement('div');
    choicesBox.className = 'mc-dialogue__choices';

    const actionsRow = document.createElement('div');
    actionsRow.className = 'mc-dialogue__actions';

    const btnShowEvidence = UIComponents.button({
      label: 'Показать улику',
      variant: 'ghost',
      onClick: () => openEvidencePicker()
    });

    const btnEnd = UIComponents.button({
      label: 'Завершить беседу',
      variant: 'ghost',
      onClick: () => {
        DialogueAPI.end(session);
        ScreenRouter.show('menu');
      }
    });

    actionsRow.appendChild(btnShowEvidence);
    actionsRow.appendChild(btnEnd);

    flow.appendChild(textBox);
    flow.appendChild(choicesBox);
    flow.appendChild(actionsRow);

    wrap.appendChild(portraitCol);
    wrap.appendChild(flow);

    /* -------- Внутренние функции экрана -------- */

    const renderNode = () => {
      if (session.ended) {
        A11y.announce('Разговор завершён');
        ScreenRouter.show('menu');
        return;
      }

      const node = DialogueAPI.getNode(session, session.currentNodeId);
      if (!node) {
        // Нет узла — считаем беседу завершённой.
        DialogueAPI.end(session);
        ScreenRouter.show('menu');
        return;
      }

      // Обновление говорящего: если узел говорит от лица другого персонажа,
      // портрет и имя меняются, но граф остаётся тот же.
      const speakerId = node.speaker || session.characterId;
      if (speakerId !== session.char.id) {
        const sp = CharacterRegistry.get(speakerId);
        if (sp) {
          PortraitRenderer.draw(canvas, sp);
          meta.textContent = '';
          meta.appendChild(UIComponents.el('div', { className: 'mc-dialogue__name', text: sp.name }));
          if (sp.title) {
            meta.appendChild(UIComponents.el('div', { className: 'mc-dialogue__title', text: sp.title }));
          }
        }
      } else if (session.char) {
        PortraitRenderer.draw(canvas, session.char);
        meta.textContent = '';
        meta.appendChild(UIComponents.el('div', { className: 'mc-dialogue__name', text: session.char.name }));
        if (session.char.title) {
          meta.appendChild(UIComponents.el('div', { className: 'mc-dialogue__title', text: session.char.title }));
        }
      }

      // Текст узла: поддержка абзацев через пустые строки.
      const rawText = DialogueAPI.resolveText(node, session);
      textBox.textContent = '';
      const paragraphs = rawText.split(/\n{2,}/);
      for (let i = 0; i < paragraphs.length; i++) {
        const p = document.createElement('p');
        p.textContent = paragraphs[i];
        textBox.appendChild(p);
      }

      // Автопереход, если у узла нет выборов и есть autoNext.
      if ((!node.choices || node.choices.length === 0) && node.autoNext) {
        DialogueAPI.enter(session, node.autoNext);
        renderNode();
        return;
      }

      // Если у узла нет выборов и нет autoNext — считаем конец беседы.
      if ((!node.choices || node.choices.length === 0) && !node.autoNext && !node.endsDialogue) {
        DialogueAPI.end(session);
      }

      // Выборы.
      choicesBox.textContent = '';
      const choices = DialogueAPI.resolveChoices(session);
      if (choices.length === 0 && !session.ended) {
        // Нечего выбирать — предложим просто закрыть.
        const btn = UIComponents.button({
          label: 'Продолжить',
          variant: 'primary',
          onClick: () => {
            DialogueAPI.end(session);
            ScreenRouter.show('menu');
          }
        });
        choicesBox.appendChild(btn);
      } else {
        for (let i = 0; i < choices.length; i++) {
          const c = choices[i];
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'mc-dialogue__choice';
          btn.setAttribute('data-choice-id', c.id);
          if (!c.ok) {
            btn.setAttribute('disabled', '');
            btn.setAttribute('aria-disabled', 'true');
          }
          const lbl = document.createElement('span');
          lbl.textContent = c.label;
          btn.appendChild(lbl);
          if (!c.ok) {
            const tag = document.createElement('span');
            tag.className = 'mc-dialogue__choice-tag';
            tag.textContent = 'недоступно';
            btn.appendChild(tag);
          }
          btn.addEventListener('click', () => {
            if (!c.ok) return;
            DialogueAPI.choose(session, c.id);
            renderNode();
          });
          choicesBox.appendChild(btn);
        }
      }
    };

    /* -------- Модалка «Показать улику» -------- */
    const openEvidencePicker = () => {
      const discovered = EvidenceAPI.listDiscovered();
      if (discovered.length === 0) {
        ModalManager.alert({
          title: 'Показать нечего',
          message: 'Вы пока не обнаружили ни одной улики.'
        });
        return;
      }

      const listWrap = document.createElement('div');
      listWrap.className = 'mc-evidence-picker';

      for (let i = 0; i < discovered.length; i++) {
        const it = discovered[i];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-label', 'Показать улику: ' + it.def.title);
        const left = document.createElement('span');
        left.textContent = (it.def.icon ? it.def.icon + ' ' : '') + it.def.title;
        const right = document.createElement('span');
        right.className = 'mc-evidence-picker__meta';
        right.textContent = session.shownEvidenceIds.has(it.def.id) ? 'уже показано' : 'показать';
        btn.appendChild(left);
        btn.appendChild(right);

        btn.addEventListener('click', () => {
          ModalManager.close(pickerId);
          const moved = DialogueAPI.showEvidence(session, it.def.id);
          if (!moved) {
            // Дефолтная реакция.
            ModalManager.alert({
              title: 'Реакция',
              message: session.char.name + ' бросает короткий взгляд на улику и качает головой: «Пока ничего не могу сказать».'
            });
          } else {
            renderNode();
          }
        });
        listWrap.appendChild(btn);
      }

      const pickerId = 'evidence-picker-' + uid('p').split('-').pop();
      ModalManager.open({
        id: pickerId,
        title: 'Показать улику',
        body: listWrap,
        width: 'min(560px, 92vw)',
        closableByBackdrop: true,
        closableByEsc: true,
        actions: [
          { label: 'Отмена', variant: 'ghost', onClick: () => ModalManager.close(pickerId) }
        ]
      });
    };

    /* -------- Старт -------- */
    // Сохраняем сессию в замыкании экрана, чтобы внешние части могли
    // (при необходимости) узнать её через публичный API ниже.
    wrap.__mcSession = session;

    renderNode();
    EventBus.emit('dialogue:started', { characterId, graphId });
    return wrap;
  };

  /* ==========================================================================
     МОДУЛЬ 7. DialogueWiring
     - Регистрирует экран 'dialogue' в ScreenRouter.
     - Подписывается на новый канал 'ui:start-dialogue'.
     - Не трогает существующие каналы частей 1–9.
     ========================================================================== */

  const DialogueWiring = (() => {
    let installed = false;

    const install = () => {
      if (installed) return;
      installed = true;

      ScreenRouter.register('dialogue', makeDialogueScreen, {
        title: 'Беседа',
        cache: false
      });

      EventBus.on('ui:start-dialogue', (p) => {
        if (!p || !p.characterId || !p.graphId) {
          Logger.warn('dialogue', 'ui:start-dialogue: не хватает characterId/graphId');
          return;
        }
        if (!CharacterRegistry.has(p.characterId)) {
          Logger.warn('dialogue', 'персонаж не зарегистрирован: ' + p.characterId);
          return;
        }
        if (!DialogueGraph.has(p.graphId)) {
          Logger.warn('dialogue', 'граф не зарегистрирован: ' + p.graphId);
          return;
        }
        ScreenRouter.show('dialogue', {
          characterId: p.characterId,
          graphId: p.graphId,
          title: p.title || 'Беседа'
        });
      });
    };

    return { install };
  })();

  /* ==========================================================================
     ИНИЦИАЛИЗАЦИЯ ЧАСТИ 10
     ========================================================================== */

  Part10Styles.install();
  DialogueWiring.install();

  Object.assign(MC, {
    CharacterRegistry,
    PortraitRenderer,
    DialogueGraph,
    DialogueAPI,
    DialogueScreen: { make: makeDialogueScreen },
    DialogueWiring
  });

  Logger.info('app', 'Часть 10 инициализирована: CharacterRegistry, PortraitRenderer, DialogueGraph, DialogueAPI, DialogueScreen');
  EventBus.emit('part10:ready', { at: Date.now(), profile: UIProfileManager.current() });

})(typeof window !== 'undefined' ? window : this);

/* ============================================================================
   КОНЕЦ ЧАСТИ 10.
   Тег <script> остаётся ОТКРЫТЫМ.
   Следующая часть (Часть 11) начнёт первую сюжетную линию: первый персонаж
   в CharacterRegistry, первый граф диалога в DialogueGraph, связка с прологом
   из части 9 через уже существующие улики и канал ui:start-dialogue.
   Закрытие <\/script><\/body><\/html> произойдёт в Части 20.
   ========================================================================== */
<script>
'use strict';
/* ============================================================================
   MIND CASE — Часть 11. Первый персонаж и первый диалог.
   Продолжение того же встроенного модуля. Никаких внешних загрузок.
   Модули:
     - Part11Styles      (CSS маркера хотспота «посетитель»)
     - CourierCharacter  (регистрация персонажа «Курьер»)
     - CourierDialogue   (регистрация графа диалога «courier-first-visit»)
     - PrologueVisitor   (добавляет хотспот «Кто-то у двери» в существующую
                          сцену пролога из части 9 по событию
                          prologue:scene-ready; запускает диалог через уже
                          существующий канал ui:start-dialogue части 10)
     - CourierWiring     (подписки на события диалога: эхо в шапке, фиксация
                          финального флага, чтобы хотспот исчез после визита)
   Правила:
     - новых глобальных переменных нет, только Object.assign(MC, {...});
     - сюжетных имён, локаций и событий сверх минимально нужного не вводим:
       персонаж назван по роли (курьер), без имени, без биографии;
     - улики-показания регистрируются внутри диалога через уже существующий
       DialogueAPI.addTestimony (категория 'testimony' уже поддержана ч. 8);
     - сцена пролога НЕ пересоздаётся, только дополняется одним хотспотом
       поверх уже существующих.
   ========================================================================== */
(function (global) {
  'use strict';

  const MC = global.MindCaseApp;
  if (!MC) {
    try { console.error('[MC][Part11] MindCaseApp не найден. Части 1–10 должны быть загружены раньше.'); }
    catch (_) {}
    return;
  }
  if (MC.__part11Initialized) {
    try { console.warn('[MC][Part11] Часть 11 уже инициализирована, повторный запуск пропущен.'); }
    catch (_) {}
    return;
  }
  Object.defineProperty(MC, '__part11Initialized', {
    value: true, enumerable: false, writable: false, configurable: false
  });

  const { Logger, EventBus, GameState, CharacterRegistry, DialogueGraph,
          DialogueAPI, Hotspot, A11y, TopBar, ScreenRouter, UIProfileManager } = MC;

  /* ==========================================================================
     МОДУЛЬ 1. Part11Styles
     Рисует мягкий пульсирующий маркер рядом с дверью, чтобы игрок
     заметил посетителя. Никаких новых токенов, только --mc-accent.
     ========================================================================== */

  const Part11Styles = (() => {
    const ID = 'mc-part11-styles';
    const CSS = [
      /* маркер рисуется на canvas, CSS здесь — только на случай будущих
         UI-подсказок, если часть 12+ захочет добавить визуальный отклик
         вне canvas, не меняя существующие классы. */
      '.mc-prologue__visitor-ping{}'
    ].join('');
    const install = () => {
      if (document.getElementById(ID)) return;
      const st = document.createElement('style');
      st.id = ID;
      st.textContent = CSS;
      document.head.appendChild(st);
    };
    return { install };
  })();

  /* ==========================================================================
     МОДУЛЬ 2. CourierCharacter
     Персонаж без имени: только роль. Палитра — холодная, нейтральная.
     Портрет рисуется PortraitRenderer по умолчанию (силуэт).
     ========================================================================== */

  const CourierCharacter = (() => {
    const ID = 'courier';
    let registered = false;

    const register = () => {
      if (registered) return;
      registered = true;
      CharacterRegistry.register({
        id: ID,
        name: 'Курьер',
        title: 'ночная доставка',
        description: 'Молодой человек в куртке с капюшоном. Держится ровно, но не смотрит в глаза.',
        seed: 'courier-v1',
        palette: { bg: '#141b26', fg: '#e6edf6', accent: '#7fa8c9' }
      });
    };

    return { ID, register };
  })();

  /* ==========================================================================
     МОДУЛЬ 3. CourierDialogue
     Первый граф диалога. Сюжет намеренно минимальный:
       — курьер приносит закрытый пакет;
       — игрок может узнать, что отправитель не назвался;
       — если у игрока уже есть «Записка с номером» / «Фотография на столе»
         (улики из части 9), появляются реплики «показать улику» с реакцией;
       — при принятии пакета добавляются два показания (testimony);
       — курьер уходит, устанавливается флаг courier-left-package.
     Имена и подробности биографии НЕ вводятся.
     ========================================================================== */

  const CourierDialogue = (() => {
    const GRAPH_ID = 'courier-first-visit';

    // Ссылки на id улик из части 9 — читаем из MC, если присутствуют,
    // иначе используем заведомо известные значения. Это сохраняет связность
    // с уже зарегистрированными уликами без перезаписи их определений.
    const IDS = (MC.PrologueEvidence && MC.PrologueEvidence.IDS) || {
      FOLDER: 'prologue.folder',
      MUG:    'prologue.mug',
      PHOTO:  'prologue.photo',
      NOTE:   'prologue.note'
    };

    const register = () => {
      DialogueGraph.register(GRAPH_ID, {
        entry: 'arrival',

        defaultEvidenceResponse: 'evidence-generic',

        nodes: {

          /* -------- Приход -------- */
          arrival: {
            speaker: CourierCharacter.ID,
            text: 'Прошу прощения за поздний визит. Вы ведёте это дело? ' +
                  'Мне велели передать пакет лично в руки. Оставить его здесь?',
            onEnter: (session, api) => {
              if (!api.getFlag('met-courier')) {
                api.setFlag('met-courier', true);
              }
            },
            choices: [
              { id: 'who-are-you',    label: 'Вы кто?',                next: 'who',           once: true },
              { id: 'about-package',  label: 'Что в пакете?',          next: 'package-info' },
              { id: 'ask-time',       label: 'Во сколько вы пришли?',  next: 'time' },
              { id: 'accept-package', label: 'Оставьте на столе.',     next: 'accept' },
              { id: 'refuse-package', label: 'Заберите пакет с собой.', next: 'refuse' }
            ]
          },

          who: {
            speaker: CourierCharacter.ID,
            text: 'Курьер. Ночная смена. Имени не назову — мне за это не платят.',
            choices: [
              { id: 'who-sent',     label: 'Кто вас послал?',     next: 'sender' },
              { id: 'back-arrival', label: 'По делу.',            next: 'arrival' }
            ]
          },

          sender: {
            speaker: CourierCharacter.ID,
            text: 'Отправитель не назвался. Заплатили наличными, без адреса. ' +
                  'Такое бывает, если не хотят, чтобы имя всплыло.',
            choices: [
              {
                id: 'show-note',
                label: 'Показать записку с номером',
                next: 'reaction-note',
                require: { evidence: IDS.NOTE },
                effects: (api) => {
                  api.addTestimony({
                    id: 'testimony.courier.note-reaction',
                    title: 'Показание: реакция курьера на записку',
                    summary: 'Курьер узнал почерк, но вслух не признался.',
                    detail: 'Он на мгновение замер. Потом коротко кивнул и перевёл взгляд.'
                  });
                }
              },
              {
                id: 'show-photo',
                label: 'Показать фотографию',
                next: 'reaction-photo',
                require: { evidence: IDS.PHOTO },
                effects: (api) => {
                  api.addTestimony({
                    id: 'testimony.courier.photo-reaction',
                    title: 'Показание: реакция курьера на фотографию',
                    summary: 'Курьер сказал, что не знает людей на снимке, но отвёл взгляд.',
                    detail: 'Он смотрел на фотографию не больше секунды.'
                  });
                }
              },
              { id: 'back-arrival', label: 'Продолжайте.', next: 'arrival' }
            ]
          },

          'package-info': {
            speaker: CourierCharacter.ID,
            text: 'Не знаю. Запечатан. Я такие не открываю — за это не платят.',
            choices: [
              { id: 'back-arrival', label: 'Хорошо.', next: 'arrival' }
            ]
          },

          time: {
            speaker: CourierCharacter.ID,
            text: 'Около сорока минут назад. По журналу въезда будет точнее, ' +
                  'но журнал не у меня.',
            effects: (api) => {
              api.addTestimony({
                id: 'testimony.courier.arrival-time',
                title: 'Показание: время прихода курьера',
                summary: 'Курьер пришёл примерно за 40 минут до визита к вам.',
                detail: 'Точное время можно уточнить по журналу въезда.'

  /* ==========================================================================
     МОДУЛЬ 4. PrologueVisitor
     Добавляет хотспот к уже построенной сцене пролога. Слушает
     prologue:scene-ready (событие из части 9) и на каждое построение
     добавляет ровно один хотспот. Хотспот становится недоступным, если
     курьер уже приходил (flag met-courier + flag courier-left-package).
     ========================================================================== */

  const PrologueVisitor = (() => {
    let addedForScene = null;

    const isCourierGone = () => {
      const flags = GameState.get().storyFlags;
      return !!(flags['met-courier'] && flags['courier-left-package']);
    };

    const buildMarker = () => ({
      draw: (ctx, rect, active) => {
        // Мягкая пульсация: без RAF — CanvasScene вызывает draw каждый кадр.
        const t = (Date.now() % 2000) / 2000;
        const pulse = 0.5 + 0.5 * Math.sin(t * Math.PI * 2);
        const cx = rect.x + rect.w / 2;
        const cy = rect.y + rect.h * 0.30;
        ctx.save();
        // Внешнее кольцо.
        ctx.globalAlpha = 0.25 + pulse * 0.35;
        ctx.strokeStyle = 'rgba(79,179,201,0.9)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(cx, cy, 8 + pulse * 4, 0, Math.PI * 2);
        ctx.stroke();
        // Точка в центре.
        ctx.globalAlpha = active ? 0.95 : 0.65;
        ctx.fillStyle = '#4fb3c9';
        ctx.beginPath();
        ctx.arc(cx, cy, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    });

    const startDialogue = () => {
      // Запускаем диалог через уже существующий канал части 10.
      EventBus.emit('ui:start-dialogue', {
        characterId: CourierCharacter.ID,
        graphId: CourierDialogue.GRAPH_ID,
        title: 'Посетитель'
      });
    };

    const addVisitorHotspot = (scene) => {
      if (!scene) return;
      // Защита от повторного добавления в одну и ту же сцену.
      if (addedForScene === scene) return;

      const WORLD = (MC.PrologueScene && MC.PrologueScene.WORLD) || { w: 1920, h: 1080 };

      scene.addHotspot(Hotspot.create({
        id: 'hs-visitor',
        kind: 'character',
        tooltip: 'Кто-то у двери',
        marker: buildMarker(),
        rect: {
          x: WORLD.w * 0.13,
          y: WORLD.h * 0.52,
          w: WORLD.w * 0.09,
          h: WORLD.h * 0.30
        },
        isAvailable: () => !isCourierGone(),
        onClick: () => {
          if (isCourierGone()) return;
          startDialogue();
          A11y.announce('Начата беседа с курьером');
        },
        onInspect: () => {
          if (isCourierGone()) {
            TopBar.setSaveStatus('У двери никого нет', 'idle');
            setTimeout(() => TopBar.setSaveStatus('Готово', 'idle'), 1400);
            return;
          }
          TopBar.setSaveStatus('Силуэт за дверью ждёт', 'idle');
          setTimeout(() => TopBar.setSaveStatus('Готово', 'idle'), 1400);
        }
      }));

      addedForScene = scene;
    };

    const install = () => {
      // Сцена может быть уже построена к моменту инициализации части 11,
      // если игрок быстро прошёл в пролог. Подписываемся и дополнительно
      // пробуем добавить хотспот к текущей сцене, если она есть.
      EventBus.on('prologue:scene-ready', () => {
        const scene = MC.PrologueWiring && MC.PrologueWiring.scene
          ? MC.PrologueWiring.scene()
          : null;
        if (scene) addVisitorHotspot(scene);
      });

      // На случай, если часть 9 уже успела построить сцену до нас.
      const existing = MC.PrologueWiring && MC.PrologueWiring.scene
        ? MC.PrologueWiring.scene()
        : null;
      if (existing) addVisitorHotspot(existing);
    };

    return { install, isCourierGone, startDialogue };
  })();

  /* ==========================================================================
     МОДУЛЬ 5. CourierWiring
     Точечные подписки на события диалога:
       - при выборе недоступных улик — ничего не делаем (обработано API ч.10);
       - по завершении беседы — мягкое сообщение в шапке;
       - по добавлению показаний — короткий статус, чтобы игрок заметил.
     Никаких переопределений существующих каналов нет.
     ========================================================================== */

  const CourierWiring = (() => {
    let installed = false;

    const install = () => {
      if (installed) return;
      installed = true;

      EventBus.on('dialogue:testimony-added', (p) => {
        if (!p || !p.id) return;
        // Показываем только показания курьера, чтобы не шуметь в будущих главах.
        if (String(p.id).indexOf('testimony.courier.') !== 0) return;
        TopBar.setSaveStatus('Новое показание', 'saved');
        setTimeout(() => TopBar.setSaveStatus('Готово', 'idle'), 1600);
      });

      EventBus.on('dialogue:ended', (p) => {
        if (!p || p.characterId !== CourierCharacter.ID) return;
        // Если курьер ушёл — подсветим исчезновение хотспота.
        if (GameState.get().storyFlags['courier-left-package']) {
          A11y.announce('Курьер ушёл');
        }
      });
    };

    return { install };
  })();

  /* ==========================================================================
     ИНИЦИАЛИЗАЦИЯ ЧАСТИ 11
     ========================================================================== */

  Part11Styles.install();

  CourierCharacter.register();
  CourierDialogue.register();

  PrologueVisitor.install();
  CourierWiring.install();

  Object.assign(MC, {
    CourierCharacter,
    CourierDialogue,
    PrologueVisitor,
    CourierWiring
  });

  Logger.info('app', 'Часть 11 инициализирована: CourierCharacter, CourierDialogue, PrologueVisitor (хотспот hs-visitor)');
  EventBus.emit('part11:ready', { at: Date.now(), profile: UIProfileManager.current() });

})(typeof window !== 'undefined' ? window : this);

   Следующая часть (Часть 12) расширит сцену пролога: вторая зона осмотра

<script>
'use strict';
/* ============================================================================
   MIND CASE — Часть 12. Зоны осмотра в кабинете.
   Продолжение того же встроенного модуля. Никаких внешних загрузок.
   Модули:
     - Part12Styles       (CSS панели переключения зон)

     - PrologueZones      (реестр зон: камера, свет, состав хотспотов,

     - PrologueZoneSwitcher (UI-панель; при переключении меняет видимость

   Правила:

(function (global) {

    catch (_) {}

  const { Logger, EventBus, GameState, Hotspot, EvidenceRegistry,

  /* ==========================================================================
     МОДУЛЬ 2. ZoneEvidence

    });

      EvidenceRegistry.register({

        icon: '◯',
        summary: 'В пепельнице — два окурка. Кто-то ждал здесь не один час.',
        detail: 'Пепел свежий. На краю — след тёмно-красной помады.',
        tags: ['office', 'atmosphere']
      });

      EvidenceRegistry.register({
        id: IDS.SECOND_GLASS,
        title: 'Второй стакан',

        tags: ['office', 'atmosphere']
      });

  /* ==========================================================================
     МОДУЛЬ 3. PrologueZones
     Реестр зон осмотра. Каждая зона описывает:
       - cam:      целевая позиция и зум камеры
       - lights:   источники света, активные только в этой зоне
       - hotspotIds: id существующих хотспотов (части 9, 11), которые видны
                     в этой зоне; остальные скрываются
       - newHotspots: новые хотспоты этой зоны, создаваемые частью 12
     ========================================================================== */

  const PrologueZones = (() => {
    const WORLD = Object.freeze({ w: 1920, h: 1080 });

    const zones = Object.freeze([
      /* -------- 1. Общий вид кабинета -------- */
      {
        id: 'cabinet',
        label: 'Кабинет',
        cam: { x: WORLD.w * 0.50, y: WORLD.h * 0.50, zoom: 0.62 },
        lights: [
          { x: WORLD.w * 0.30, y: WORLD.h * 0.18, radius: 260,
            color: 'rgba(255,220,160,0.55)', intensity: 0.9, flicker: 0.05 },
          { x: WORLD.w * 0.72, y: WORLD.h * 0.22, radius: 200,
            color: 'rgba(140,180,220,0.45)', intensity: 0.55 }
        ],
        hotspotIds: [
          'hs-folder', 'hs-mug', 'hs-photo', 'hs-note',
          'hs-window', 'hs-door', 'hs-visitor'
        ],
        newHotspots: []
      },

      /* -------- 2. Рабочий стол -------- */
      {
        id: 'desk',
        label: 'Стол',
        cam: { x: WORLD.w * 0.50, y: WORLD.h * 0.68, zoom: 1.15 },
        lights: [
          { x: WORLD.w * 0.50, y: WORLD.h * 0.68, radius: 380,
            color: 'rgba(255,220,160,0.60)', intensity: 1.05, flicker: 0.02 }
        ],
        hotspotIds: ['hs-folder', 'hs-mug', 'hs-note', 'hs-photo'],
        newHotspots: [
          {
            id: 'hs-ashtray',
            tooltip: 'Пепельница',
            evidence: ZoneEvidence.IDS.ASHTRAY,
            rect: { x: WORLD.w * 0.30, y: WORLD.h * 0.72,
                    w: WORLD.w * 0.05, h: WORLD.h * 0.05 }
          },
          {
            id: 'hs-second-glass',
            tooltip: 'Второй стакан',
            evidence: ZoneEvidence.IDS.SECOND_GLASS,
            rect: { x: WORLD.w * 0.62, y: WORLD.h * 0.72,
                    w: WORLD.w * 0.05, h: WORLD.h * 0.05 }
          }
        ]
      },

      /* -------- 3. Окно -------- */
      {

        label: 'Окно',

  /* ==========================================================================
     МОДУЛЬ 4. PrologueZoneSwitcher
     Управляет переключением зон у уже созданной CanvasScene.
     Сцена НЕ пересоздаётся; камера и свет меняются у существующих модулей.
     ========================================================================== */

  const PrologueZoneSwitcher = (() => {
    let sceneRef = null;            // текущая CanvasScene
    let activeZoneId = null;        // id активной зоны
    let panel = null;               // DOM-панель переключателя
    const createdNewHotspotIds = new Set();  // наши новые хотспоты
    let activeLightIds = [];        // id наших источников света (управляемых ч.12)

    /* ---- Прокрутка света в сцене -------------------------------------
       SceneLighting из ч. 3 не умеет менять ambient извне; но умеет
       добавлять/удалять источники. Свет, добавленный в ч. 9 при создании
       сцены, остаётся неизменным — мы к нему добавляем свой слой на время
       активной зоны, а при переключении удаляем только свои источники.
       Это даёт разный акцент освещения для каждой зоны без изменения ч. 9.
    ------------------------------------------------------------------- */

    const clearOwnLights = (scene) => {
      if (!scene || !scene.lighting) return;
      for (let i = 0; i < activeLightIds.length; i++) {
        try { scene.lighting.removeLight(activeLightIds[i]); } catch (_) {}
      }
      activeLightIds = [];
    };

    const applyOwnLights = (scene, zone) => {
      if (!scene || !scene.lighting || !zone) return;
      const list = Array.isArray(zone.lights) ? zone.lights : [];
      for (let i = 0; i < list.length; i++) {
        try {
          const id = scene.lighting.addLight(list[i]);
          if (id) activeLightIds.push(id);
        } catch (e) { Logger.warn('zone-switcher', 'addLight failed', e); }
      }
    };

    /* ---- Видимость хотспотов ------------------------------------------
       Проходим по всем хотспотам сцены и включаем видимость только тем,
       что перечислены в активной зоне. Работает и для хотспотов части 9
       (hs-folder, hs-mug, hs-photo, hs-note, hs-window, hs-door),
       и для хотспота части 11 (hs-visitor), и для наших новых.
    ------------------------------------------------------------------- */

    const applyHotspotVisibility = (scene, zone) => {
      if (!scene || !zone) return;
      const visible = new Set(zone.hotspotIds || []);
      const newIds = (zone.newHotspots || []).map((h) => h.id);
      for (let i = 0; i < newIds.length; i++) visible.add(newIds[i]);

      const all = scene.getHotspots();
      for (let i = 0; i < all.length; i++) {
        const hs = all[i];
        if (!hs || !hs.meta) continue;
        hs.meta.visible = visible.has(hs.id);
        // Снимем hover/focus с тех, что стали невидимы.
        if (!hs.meta.visible) {
          try { hs.setHover(false); hs.setFocus(false); } catch (_) {}
        }
      }
    };

    /* ---- Создание новых хотспотов ч.12 (один раз на сцену) ----------- */

    const inspectEvidence = (evidenceId) => {
      const wasNew = EvidenceAPI.discover(evidenceId);
      if (wasNew) {
        TopBar.setSaveStatus('Новая улика', 'saved');
        setTimeout(() => TopBar.setSaveStatus('Готово', 'idle'), 1600);
        A11y.announce('Обнаружена улика');
      }
      EvidenceViewer.open(evidenceId);
    };

    const buildNewHotspots = (scene) => {
      const allZones = PrologueZones.all();
      for (let zi = 0; zi < allZones.length; zi++) {
        const zone = allZones[zi];
        const list = Array.isArray(zone.newHotspots) ? zone.newHotspots : [];
        for (let hi = 0; hi < list.length; hi++) {
          const def = list[hi];
          if (!def || !def.id) continue;
          if (createdNewHotspotIds.has(def.id)) continue;

          const hs = Hotspot.create({
            id: def.id,
            kind: 'prop',
            tooltip: def.tooltip || '',
            rect: def.rect,
            visible: false,                 // активируется через applyHotspotVisibility

  const CorridorEvidence = (() => {

  /* ==========================================================================
     МОДУЛЬ 5. CorridorScene
     Собственный CanvasScene для коридора. Создаётся по запросу экрана
     'corridor' и освобождается при уходе. Единый активный RAF — как в ч. 9.
     ========================================================================== */

  const CorridorScene = (() => {
    const WORLD = Object.freeze({ w: 1920, h: 1080 });

    const drawCorridor = (ctx) => {
      const W = WORLD.w;
      const H = WORLD.h;
      const farL = W * 0.30, farR = W * 0.70;
      const farT = H * 0.22, farB = H * 0.68;

      // Потолок.
      ctx.fillStyle = '#080c12';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(W, 0);
      ctx.lineTo(farR, farT);
      ctx.lineTo(farL, farT);
      ctx.closePath();
      ctx.fill();

      // Пол.
      ctx.fillStyle = '#0b1119';
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(W, H);
      ctx.lineTo(farR, farB);
      ctx.lineTo(farL, farB);
      ctx.closePath();
      ctx.fill();

      // Левая стена.
      ctx.fillStyle = '#131a26';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(farL, farT);
      ctx.lineTo(farL, farB);
      ctx.lineTo(0, H);
      ctx.closePath();
      ctx.fill();

      // Правая стена — темнее.
      ctx.fillStyle = '#0f161f';
      ctx.beginPath();
      ctx.moveTo(W, 0);
      ctx.lineTo(farR, farT);
      ctx.lineTo(farR, farB);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();

      // Дальняя стена.
      ctx.fillStyle = '#1a222e';
      ctx.fillRect(farL, farT, farR - farL, farB - farT);

      // Дверь на дальней стене — закрыта, полоска света под ней.
      const doorW = (farR - farL) * 0.40;
      const doorH = (farB - farT) * 0.82;
      const doorX = farL + (farR - farL) * 0.30;
      const doorY = farB - doorH;
      ctx.fillStyle = '#05080e';
      ctx.fillRect(doorX, doorY, doorW, doorH);
      ctx.fillStyle = 'rgba(220,200,160,0.35)';
      ctx.fillRect(doorX + 4, doorY + doorH - 3, doorW - 8, 1.5);
      ctx.strokeStyle = 'rgba(100,120,150,0.55)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(doorX + 0.5, doorY + 0.5, doorW - 1, doorH - 1);

      // Потолочные плафоны (перспективно).
      const lamps = [
        { t: 0.10, s: 1.00 },
        { t: 0.30, s: 0.70 },
        { t: 0.50, s: 0.50 }
      ];
      for (let i = 0; i < lamps.length; i++) {
        const lamp = lamps[i];
        const lx = W * 0.50;
        const ty = 0 + (farT - 0) * (1 - lamp.t);
        const lw = W * 0.15 * lamp.s;
        const lh = 4 * lamp.s;
        const grad = ctx.createRadialGradient(lx, ty, 0, lx, ty, lw * 2);
        grad.addColorStop(0, 'rgba(180,200,230,0.26)');
        grad.addColorStop(1, 'rgba(180,200,230,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(lx - lw * 2, ty - lw * 0.3, lw * 4, lw * 0.6);
        ctx.fillStyle = 'rgba(230,240,255,0.55)';
        ctx.fillRect(lx - lw / 2, ty - lh / 2, lw, lh);
      }

      // Панельные линии левой стены.
      ctx.strokeStyle = 'rgba(50,70,100,0.35)';
      ctx.lineWidth = 1;
      for (let i = 1; i <= 3; i++) {
        const t = i / 4;
        const lx = farL * t;
        const lyTop = farT * t;
        const lyBot = farB + (H - farB) * t;
        ctx.beginPath();
        ctx.moveTo(lx, lyTop);
        ctx.lineTo(lx, lyBot);
        ctx.stroke();
      }

      // Доска объявлений на левой стене.
      ctx.fillStyle = '#1a1408';
      ctx.beginPath();
      ctx.moveTo(W * 0.09, H * 0.30);
      ctx.lineTo(W * 0.20, H * 0.26);
      ctx.lineTo(W * 0.20, H * 0.46);
      ctx.lineTo(W * 0.09, H * 0.50);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,90,50,0.55)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Бумаги на доске.
      ctx.fillStyle = 'rgba(230,225,210,0.55)';
      ctx.fillRect(W * 0.11, H * 0.32, W * 0.03, H * 0.06);
      ctx.fillRect(W * 0.15, H * 0.30, W * 0.03, H * 0.08);
      ctx.fillRect(W * 0.12, H * 0.41, W * 0.05, H * 0.04);

      // Табличка «ВЫХОД» на правой стене.
      ctx.fillStyle = 'rgba(60,140,80,0.75)';
      ctx.fillRect(W * 0.86, H * 0.30, W * 0.06, H * 0.05);
      ctx.fillStyle = 'rgba(240,255,240,0.92)';
      ctx.font = 'bold 18px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('ВЫХОД', W * 0.89, H * 0.325);

      // Столик с журналом справа, ближе к двери.
      ctx.fillStyle = '#221a12';
      ctx.fillRect(W * 0.72, H * 0.64, W * 0.14, H * 0.03);
      ctx.fillStyle = '#1a1209';
      ctx.fillRect(W * 0.73, H * 0.67, W * 0.01, H * 0.08);
      ctx.fillRect(W * 0.84, H * 0.67, W * 0.01, H * 0.08);

      // Журнал на столике.
      ctx.fillStyle = '#ece6d6';
      ctx.fillRect(W * 0.76, H * 0.60, W * 0.06, H * 0.035);
      ctx.fillStyle = '#8a7a60';
      ctx.fillRect(W * 0.76, H * 0.60, W * 0.06, 2);

      // Силуэт дежурного.
      const ox = W * 0.58;
      const oy = H * 0.42;
      const oh = H * 0.30;
      ctx.fillStyle = 'rgba(8,10,14,0.94)';
      ctx.beginPath();
      ctx.moveTo(ox - W * 0.05, oy + oh);
      ctx.lineTo(ox - W * 0.04, oy + oh * 0.30);
      ctx.quadraticCurveTo(ox - W * 0.03, oy, ox, oy);
      ctx.quadraticCurveTo(ox + W * 0.03, oy, ox + W * 0.04, oy + oh * 0.30);
      ctx.lineTo(ox + W * 0.05, oy + oh);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ox, oy - H * 0.06, H * 0.06, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(217,164,65,0.28)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(ox - W * 0.04, oy + oh * 0.40);
      ctx.quadraticCurveTo(ox - W * 0.03, oy + H * 0.02, ox, oy - H * 0.10);
      ctx.stroke();
    };

    const buildHotspots = (scene) => {
      const W = WORLD.w, H = WORLD.h;

      const inspectEvidence = (id) => {
        const wasNew = EvidenceAPI.discover(id);
        if (wasNew) {
          TopBar.setSaveStatus('Новая улика', 'saved');
          setTimeout(() => TopBar.setSaveStatus('Готово', 'idle'), 1600);
          A11y.announce('Обнаружена улика');
        }
        EvidenceViewer.open(id);
      };

      // Доска объявлений.
      scene.addHotspot(Hotspot.create({
        id: 'hs-corridor-notice',
        kind: 'prop',
        tooltip: 'Доска объявлений',
        rect: { x: W * 0.08, y: H * 0.24, w: W * 0.14, h: H * 0.28 },
        onInspect: () => inspectEvidence(CorridorEvidence.IDS.NOTICE)
      }));

      // Табличка «ВЫХОД».
      scene.addHotspot(Hotspot.create({
        id: 'hs-corridor-exit-sign',
        kind: 'scenery',
        tooltip: 'Аварийный выход',
        rect: { x: W * 0.84, y: H * 0.28, w: W * 0.10, h: H * 0.10 },
        onInspect: () => {
          TopBar.setSaveStatus('Заперто на ночь', 'idle');
          setTimeout(() => TopBar.setSaveStatus('Готово', 'idle'), 1400);
        }
      }));

      // Журнал дежурств.
      scene.addHotspot(Hotspot.create({
        id: 'hs-corridor-logbook',
        kind: 'prop',
        tooltip: 'Журнал дежурств',
        rect: { x: W * 0.74, y: H * 0.56, w: W * 0.12, h: H * 0.12 },
        onInspect: () => inspectEvidence(CorridorEvidence.IDS.LOGBOOK)
      }));

      // Дежурный.
      scene.addHotspot(Hotspot.create({
        id: 'hs-corridor-officer',
        kind: 'character',
        tooltip: 'Дежурный',
        rect: { x: W * 0.50, y: H * 0.28, w: W * 0.16, h: H * 0.50 },
        onClick: () => {
          EventBus.emit('ui:start-dialogue', {
            characterId: DutyOfficerCharacter.ID,
            graphId: DutyOfficerDialogue.GRAPH_ID,
            title: 'Дежурный'
          });
        }
      }));

      // Дверь на дальнем конце — просто проверка, что закрыто.
      scene.addHotspot(Hotspot.create({
        id: 'hs-corridor-far-door',
        kind: 'scenery',
        tooltip: 'Дверь в конце коридора',
        rect: { x: W * 0.42, y: H * 0.24, w: W * 0.16, h: H * 0.44 },
        onInspect: () => {
          TopBar.setSaveStatus('Не сегодня. Сперва — до утра', 'idle');
          setTimeout(() => TopBar.setSaveStatus('Готово', 'idle'), 1400);
        }
      }));
    };

    const create = (container) => {
      const scene = CanvasScene.create({
        parent: container,
        worldWidth: WORLD.w,
        worldHeight: WORLD.h,
        background: '#05080d',
        camera: { initialZoom: 0.65, minZoom: 0.55, maxZoom: 1.4, smoothing: 0.14 },
        lighting: {
          ambient: 'rgba(4,8,14,0.40)',
          vignette: 0.65,
          lights: [
            { x: WORLD.w * 0.50, y: WORLD.h * 0.20, radius: 420, color: 'rgba(200,220,240,0.55)', intensity: 0.85, flicker: 0.03 },
            { x: WORLD.w * 0.60, y: WORLD.h * 0.55, radius: 220, color: 'rgba(217,164,65,0.35)', intensity: 0.55 }
          ]
        }
      });

      if (!scene) return null;
      if (scene._fallback) return scene;

      scene.onDraw((ctx) => { drawCorridor(ctx); });

      // Подсказка снизу при наведении.
      scene.onDrawUI((ctx, cam, vw, vh) => {
        const m = scene.metrics();
        if (!m.hovered) return;
        const hs = scene.findHotspotById(m.hovered);
        if (!hs) return;
        const text = hs.getMeta().tooltip;
        if (!text) return;

        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.font = '12px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace';
        const tw = ctx.measureText(text).width;
        const pad = 10;
        const bw = tw + pad * 2;
        const bh = 26;
        const bx = (vw - tw) / 2 - pad;
        const by = vh - 46;
        ctx.fillStyle = 'rgba(5,8,13,0.82)';
        ctx.strokeStyle = 'rgba(79,179,201,0.55)';
        ctx.lineWidth = 1;
        const r = 6;
        ctx.beginPath();
        ctx.moveTo(bx + r, by);
        ctx.lineTo(bx + bw - r, by);
        ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + r);
        ctx.lineTo(bx + bw, by + bh - r);
        ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - r, by + bh);
        ctx.lineTo(bx + r, by + bh);
        ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - r);
        ctx.lineTo(bx, by + r);
        ctx.quadraticCurveTo(bx, by, bx + r, by);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#e6edf6';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, vw / 2, by + bh / 2);
        ctx.restore();
      });

      buildHotspots(scene);
      scene.start();
      return scene;
    };

    return { create, WORLD };
  })();

  /* ==========================================================================
     МОДУЛЬ 7. CorridorWiring
     - Регистрирует экран 'corridor'.
     - Создаёт и освобождает сцену по ui:slot-shown.
     - Добавляет в пролог хотспот «Выйти в коридор» (по паттерну ч. 11 и 13)

     ========================================================================== */

  const CorridorWiring = (() => {
    let installed = false;
    let corridorScene = null;
    let prologueSceneRef = null;
    let prologueHotspotAdded = null;

    const raf = global.requestAnimationFrame || ((fn) => setTimeout(fn, 16));

    const buildCorridorScene = () => {
      if (corridorScene) return;
      const stage = document.querySelector('.mc-corridor [data-mc-corridor-stage]');
      if (!stage) {
        Logger.warn('corridor', 'не найден контейнер для сцены');
        return;
      }
      corridorScene = CorridorScene.create(stage);
      if (corridorScene) EventBus.emit('corridor:scene-ready');
    };

    const destroyCorridorScene = () => {
      if (!corridorScene) return;
      try { corridorScene.dispose(); }
      catch (e) { Logger.warn('corridor', 'dispose failed', e); }
      corridorScene = null;
    };

    const onSlotShown = (p) => {
      const id = p && p.id;
      if (id === 'corridor') {
        raf(() => buildCorridorScene());
      } else {
        destroyCorridorScene();
      }
    };

    /* ---- Хотспот в прологе: выйти в коридор ------------------------- */
    const addPrologueCorridorHotspot = (scene) => {
      if (!scene) return;
      if (prologueHotspotAdded === scene) return;

      const WORLD = (MC.PrologueScene && MC.PrologueScene.WORLD) || { w: 1920, h: 1080 };

      scene.addHotspot(Hotspot.create({
        id: 'hs-corridor-exit',
        kind: 'scenery',
        tooltip: 'Выйти в коридор',
        visible: false, // управляется через prologue:zone-changed
        rect: {
          x: WORLD.w * 0.06,
          y: WORLD.h * 0.30,
          w: WORLD.w * 0.06,
          h: WORLD.h * 0.42
        },
        onClick: () => ScreenRouter.show('corridor'),
        onInspect: () => {
          TopBar.setSaveStatus('Тишина в коридоре', 'idle');
          setTimeout(() => TopBar.setSaveStatus('Готово', 'idle'), 1400);
        }
      }));

      prologueHotspotAdded = scene;
    };

    const onPrologueSceneReady = () => {
      const scene = MC.PrologueWiring && typeof MC.PrologueWiring.scene === 'function'
        ? MC.PrologueWiring.scene()
        : null;
      if (!scene) return;
      if (scene === prologueSceneRef) return;

      prologueSceneRef = scene;
      addPrologueCorridorHotspot(scene);
    };

    const onPrologueZoneChanged = (p) => {
      if (!prologueSceneRef || !p) return;
      const hs = prologueSceneRef.findHotspotById('hs-corridor-exit');
      if (!hs || !hs.meta) return;
      hs.meta.visible = (p.zoneId === 'cabinet');
    };

    /* ---- Уборка при уходе из пролога -------------------------------- */
    const resetPrologue = () => {
      prologueSceneRef = null;
      prologueHotspotAdded = null;
    };

    const install = () => {
      if (installed) return;
      installed = true;

      ScreenRouter.register('corridor', makeCorridorScreen, {
        title: 'Коридор',
        cache: false
      });

      EventBus.on('ui:slot-shown', onSlotShown);
      EventBus.on('prologue:scene-ready', onPrologueSceneReady);
      EventBus.on('prologue:zone-changed', onPrologueZoneChanged);
      EventBus.on('scene:disposed', resetPrologue);

      // Догоняем уже построенную сцену пролога, если она есть.
      const existing = MC.PrologueWiring && typeof MC.PrologueWiring.scene === 'function'
        ? MC.PrologueWiring.scene()
        : null;
      if (existing) onPrologueSceneReady();
    };

    return { install, scene: () => corridorScene };
  })();

  /* ==========================================================================
     ИНИЦИАЛИЗАЦИЯ ЧАСТИ 14

  Part14Styles.install();

  DutyOfficerCharacter.register();
  DutyOfficerDialogue.register();
  CorridorEvidence.register();

  CorridorWiring.install();

  Object.assign(MC, {
    DutyOfficerCharacter,
    DutyOfficerDialogue,
    CorridorEvidence,
    CorridorScene,
    CorridorScreen: { make: makeCorridorScreen },
    CorridorWiring
  });

  Logger.info('app', 'Часть 14 инициализирована: DutyOfficerCharacter, DutyOfficerDialogue, CorridorEvidence, CorridorScene, CorridorScreen');

  const CANVAS_W = 2000;
  const CANVAS_H = 1200;
  const CARD_W = 200;
  const CARD_H = 96;
  const GRID_X0 = 60;
  const GRID_Y0 = 60;
  const GRID_DX = 260;
  const GRID_DY = 180;
  const GRID_COLS = 7;

  /* ==========================================================================
     МОДУЛЬ 2. BoardScreen
     ========================================================================== */

  const makeBoardScreen = () => {
    const st = GameState.get();
    const items = EvidenceAPI.listDiscovered();

    const wrap = document.createElement('div');
    wrap.className = 'mc-board';

    /* ---- Тулбар ---- */
    const toolbar = document.createElement('div');
    toolbar.className = 'mc-board__toolbar';
    toolbar.appendChild(UIComponents.el('div', {
      className: 'mc-board__toolbar-title', text: 'Доска связей'

    toolbar.appendChild(UIComponents.el('div', {
      className: 'mc-board__toolbar-count',

      className: 'mc-board__hint',
      text: 'Клик — выбрать, повторный клик по другой — связать. Двойной клик по связи — удалить.'
    }));

    // Авторазложить
    const btnLayout = UIComponents.button({
      label: 'Авторазложить',
      variant: 'ghost',
      onClick: () => {
        const layout = GameState.get().boardLayout;
        for (let i = 0; i < items.length; i++) {
          const col = i % GRID_COLS;
          const row = Math.floor(i / GRID_COLS);
          layout[items[i].def.id] = {
            x: GRID_X0 + col * GRID_DX,
            y: GRID_Y0 + row * GRID_DY
          };
        }
        GameState.touch();
        // Перерисовка — проще всего через повторный вход в экран.
        ScreenRouter.show('board');
        A11y.announce('Карточки разложены по сетке');
      }
    });
    toolbar.appendChild(btnLayout);

    // Очистить связи
    const btnClear = UIComponents.button({
      label: 'Очистить связи',
      variant: 'ghost',
      disabled: GameState.get().boardConnections.length === 0,
      onClick: () => {
        ModalManager.confirm({
          title: 'Очистить все связи?',
          message: 'Все линии между карточками будут удалены. Позиции карточек сохранятся.',
          okLabel: 'Очистить',
          cancelLabel: 'Отмена',
          variant: 'danger'
        }).then((ok) => {
          if (!ok) return;
          GameState.get().boardConnections.length = 0;
          GameState.touch();
          ScreenRouter.show('board');
        });
      }
    });

    // Назад
    toolbar.appendChild(UIComponents.button({
      label: '← В меню',
      variant: 'ghost',
      onClick: () => {
        const id = GameState.get().slotId;
        if (id && MC.SaveSystem && GameState.isDirty()) MC.SaveSystem.save(id);
        ScreenRouter.show('menu');
      }
    }));

    wrap.appendChild(toolbar);

    /* ---- Область доски ---- */
    const viewport = document.createElement('div');
    viewport.className = 'mc-board__viewport';

    const canvas = document.createElement('div');
    canvas.className = 'mc-board__canvas';
    canvas.style.width = CANVAS_W + 'px';
    canvas.style.height = CANVAS_H + 'px';

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'mc-board__svg');
    svg.setAttribute('viewBox', '0 0 ' + CANVAS_W + ' ' + CANVAS_H);
    svg.setAttribute('preserveAspectRatio', 'none');
    canvas.appendChild(svg);

    // Пустое состояние.
    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'mc-board__empty';
      empty.innerHTML = ''
        + '<div><h3>ДОСКА ПУСТА</h3>'
        + '<p>Обнаружьте улики в игре — они появятся здесь как карточки.</p></div>';
      canvas.appendChild(empty);
    }

    wrap.appendChild(viewport);
    viewport.appendChild(canvas);

    // --- SVG namespace helpers ---
    const NS = 'http://www.w3.org/2000/svg';
    const elSVG = (tag, attrs) => {
      const n = document.createElementNS(NS, tag);
      if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
      return n;
    };

    /* ---- Раскладка по умолчанию: если позиции карточки нет — ставим в сетку ---- */
    const ensureLayout = () => {
      const layout = GameState.get().boardLayout;
      for (let i = 0; i < items.length; i++) {
        const id = items[i].def.id;
        if (!layout[id] || typeof layout[id].x !== 'number' || typeof layout[id].y !== 'number') {
          const col = i % GRID_COLS;
          const row = Math.floor(i / GRID_COLS);
          layout[id] = { x: GRID_X0 + col * GRID_DX, y: GRID_Y0 + row * GRID_DY };

      GameState.touch();
    };
    ensureLayout();

    const cards = new Map();   // evidenceId → DOM

    const buildCard = (it) => {
      const def = it.def;
      const pos = GameState.get().boardLayout[def.id];

      const card = document.createElement('div');
      card.className = 'mc-board__card';
      card.setAttribute('data-card-id', def.id);
      card.setAttribute('data-analysed', it.analysed ? 'true' : 'false');
      card.style.left = pos.x + 'px';
      card.style.top = pos.y + 'px';
      card.setAttribute('tabindex', '0');
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', 'Улика: ' + def.title);

      ic.className = 'mc-board__card-icon';
      ic.setAttribute('aria-hidden', 'true');
      ic.textContent = def.icon;
      card.appendChild(ic);

      const title = document.createElement('div');
      title.className = 'mc-board__card-title';
      title.textContent = def.title;
      card.appendChild(title);

      const meta = document.createElement('div');
      meta.className = 'mc-board__card-meta';
      meta.textContent = it.analysed ? 'изучено' : 'не изучено';

      // Кнопка «открыть просмотрщик».

      openBtn.className = 'mc-board__card-open';
      openBtn.setAttribute('aria-label', 'Открыть улику');
      openBtn.textContent = '🔍';
      openBtn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        EvidenceViewer.open(def.id);
      });
      card.appendChild(openBtn);

      return card;
    };

    for (let i = 0; i < items.length; i++) {
      const card = buildCard(items[i]);
      cards.set(items[i].def.id, card);
      canvas.appendChild(card);
    }

    /* ---- Линии связей ---- */
    let selectedCardId = null;
    const dragState = { active: false, cardId: null, pointerId: null,
                        startX: 0, startY: 0, startLeft: 0, startTop: 0, moved: false };

    const cardCenter = (evidenceId) => {
      const pos = GameState.get().boardLayout[evidenceId];
      if (!pos) return null;
      return { x: pos.x + CARD_W / 2, y: pos.y + CARD_H / 2 };
    };

    const renderLines = () => {
      // Сносим только то, что мы нарисовали; ничего другого в SVG нет.
      while (svg.firstChild) svg.removeChild(svg.firstChild);

      const conns = GameState.get().boardConnections;
      for (let i = 0; i < conns.length; i++) {
        const c = conns[i];
        const a = cardCenter(c.from);
        const b = cardCenter(c.to);
        if (!a || !b) continue;

        const g = elSVG('g', { class: 'conn', 'data-conn-id': c.id });

        // Хит-область.
        const hit = elSVG('line', {
          class: 'mc-conn__hit',
          x1: a.x, y1: a.y, x2: b.x, y2: b.y
        });
        // Видимая линия.
        const line = elSVG('line', {
          class: 'mc-conn__line',
          x1: a.x, y1: a.y, x2: b.x, y2: b.y
        });
        // Точки на концах.
        const dotA = elSVG('circle', { class: 'mc-conn__dot', cx: a.x, cy: a.y, r: 4 });
        const dotB = elSVG('circle', { class: 'mc-conn__dot', cx: b.x, cy: b.y, r: 4 });

        g.appendChild(hit);
        g.appendChild(line);
        g.appendChild(dotA);
        g.appendChild(dotB);

        const connId = c.id;
        const removeConn = () => {
          ModalManager.confirm({
            title: 'Удалить связь?',
            message: 'Связь между двумя карточками будет удалена. Позиции карточек сохранятся.',
            okLabel: 'Удалить',
            cancelLabel: 'Отмена',
            variant: 'danger'
          }).then((ok) => {
            if (!ok) return;
            const arr = GameState.get().boardConnections;
            const idx = arr.findIndex((x) => x.id === connId);
            if (idx >= 0) { arr.splice(idx, 1); GameState.touch(); }
            renderLines();
          });
        };
        g.addEventListener('click', removeConn);

        svg.appendChild(g);
      }
    };
    renderLines();

    /* ---- Выделение / связывание ---- */
    const setSelected = (cardId) => {
      selectedCardId = cardId;
      for (const [id, el] of cards) {
        el.setAttribute('data-selected', id === cardId ? 'true' : 'false');
      }
    };

    const toggleSelection = (cardId) => {
      if (selectedCardId === null) {
        setSelected(cardId);
        A11y.announce('Карточка выбрана. Клик по другой — создать связь.');
        return;
      }
      if (selectedCardId === cardId) {
        setSelected(null);
        A11y.announce('Выбор снят.');
        return;
      }
      // Пытаемся создать связь.
      const arr = GameState.get().boardConnections;
      const exists = arr.some((c) =>
        (c.from === selectedCardId && c.to === cardId) ||
        (c.from === cardId && c.to === selectedCardId)
      );
      if (exists) {
        A11y.announce('Связь уже существует.');
      } else {
        arr.push({
          id: uid('conn'),
          from: selectedCardId,
          to: cardId,
          type: 'manual',
          t: Date.now()
        });
        GameState.touch();
        renderLines();
        A11y.announce('Связь создана.');
      }
      setSelected(null);
    };

    /* ---- Перетаскивание ---- */
    const clampPos = (x, y) => ({
      x: Math.max(0, Math.min(CANVAS_W - CARD_W, x)),
      y: Math.max(0, Math.min(CANVAS_H - CARD_H, y))
    });

    const onPointerDown = (cardId, ev) => {
      // Только ЛКМ/касание основной кнопкой.
      if (ev.button !== undefined && ev.button !== 0) return;
      const el = cards.get(cardId);
      if (!el) return;
      const pos = GameState.get().boardLayout[cardId];
      if (!pos) return;

      dragState.active = true;
      dragState.cardId = cardId;
      dragState.pointerId = ev.pointerId;
      dragState.startX = ev.clientX;
      dragState.startY = ev.clientY;
      dragState.startLeft = pos.x;
      dragState.startTop = pos.y;
      dragState.moved = false;

      try { el.setPointerCapture(ev.pointerId); } catch (_) {}
      el.setAttribute('data-dragging', 'true');

      // Также выведем карточку вперёд по z-index.
      el.style.zIndex = String(10 + cards.size);

      ev.preventDefault();
    };

    const onPointerMove = (ev) => {
      if (!dragState.active) return;
      if (ev.pointerId !== dragState.pointerId) return;
      const el = cards.get(dragState.cardId);
      if (!el) return;

      const dx = ev.clientX - dragState.startX;
      const dy = ev.clientY - dragState.startY;
      if (!dragState.moved && Math.hypot(dx, dy) < 4) return;
      dragState.moved = true;

      const next = clampPos(dragState.startLeft + dx, dragState.startTop + dy);
      el.style.left = next.x + 'px';
      el.style.top = next.y + 'px';

      // Обновим позицию в GameState сразу, но без touch() — по факту отпускания.
      const layout = GameState.get().boardLayout;
      if (layout[dragState.cardId]) {
        layout[dragState.cardId].x = next.x;
        layout[dragState.cardId].y = next.y;
      }

      // Перерисуем только линии, без перерисовки карточек.
      renderLines();
    };

    const onPointerUp = (ev) => {
      if (!dragState.active) return;
      if (ev.pointerId !== dragState.pointerId) return;
      const el = cards.get(dragState.cardId);
      if (el) {
        try { el.releasePointerCapture(ev.pointerId); } catch (_) {}
        el.removeAttribute('data-dragging');
      }

      const cardId = dragState.cardId;
      const moved = dragState.moved;

      dragState.active = false;
      dragState.cardId = null;
      dragState.pointerId = null;
      dragState.moved = false;

      if (moved) {
        // Персистим позицию и подсветим «dirty».
        GameState.touch();
      } else {
        // Клик — выделение/связывание.
        toggleSelection(cardId);
      }
    };

    // Клик по пустому месту — снять выделение.
    viewport.addEventListener('pointerdown', (ev) => {
      const t = ev.target;
      if (t === canvas || t === viewport || t === svg) {
        setSelected(null);
      }
    });

    // Подключаем обработчики на каждую карточку.
    for (const [id, el] of cards) {
      el.addEventListener('pointerdown', (ev) => onPointerDown(id, ev));
      el.addEventListener('pointermove', onPointerMove);
      el.addEventListener('pointerup',   onPointerUp);
      el.addEventListener('pointercancel', onPointerUp);
      el.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          toggleSelection(id);
        }
      });
    }

    // Карточки рисуем поверх svg — z-index уже абсолютный.
    EventBus.emit('board:opened', { count: items.length });
    return wrap;
  };

  /* ==========================================================================
     МОДУЛЬ 3. BoardWiring
     ========================================================================== */

  const BoardWiring = (() => {
    let installed = false;

    const install = () => {
      if (installed) return;
      installed = true;

      ScreenRouter.register('board', makeBoardScreen, {
        title: 'Доска связей',
        cache: false
      });

      // Осознанная замена заглушки ч. 6 только для канала ui:open-board.
      EventBus.clear('ui:open-board');
      EventBus.on('ui:open-board', () => ScreenRouter.show('board'));

      // Если обнаружена новая улика, а доска уже открыта — перерисуем.
      EventBus.on('evidence:discovered', () => {
        if (ScreenRouter.current() === 'board') ScreenRouter.show('board');
      });
    };

    return { install };
  })();

  /* ==========================================================================
     ИНИЦИАЛИЗАЦИЯ ЧАСТИ 15
     ========================================================================== */

  Part15Styles.install();
  BoardWiring.install();

  Object.assign(MC, {
    BoardScreen: { make: makeBoardScreen },
    BoardWiring
  });

  Logger.info('app', 'Часть 15 инициализирована: BoardScreen, BoardWiring (канал ui:open-board переназначен)');
  EventBus.emit('part15:ready', { at: Date.now(), profile: UIProfileManager.current() });

})(typeof window !== 'undefined' ? window : this);

<script>

(function (global) {

  Object.defineProperty(MC, '__part16Initialized', {

  /* ==========================================================================
     МОДУЛЬ 1. Part16Styles

  const Part16Styles = (() => {

      '.mc-board__canvas[data-groups="on"] .mc-board__card[data-group="2"]{border-left-color:#4bbf7b;}',
      '.mc-board__canvas[data-groups="on"] .mc-board__card[data-group="3"]{border-left-color:#c8424b;}',
      '.mc-board__canvas[data-groups="on"] .mc-board__card[data-group="4"]{border-left-color:#9d7bbf;}',
      '.mc-board__canvas[data-groups="on"] .mc-board__card[data-group="5"]{border-left-color:#bf9b4b;}',
      '.mc-board__canvas[data-groups="on"] .mc-board__card[data-group="6"]{border-left-color:#7fa8c9;}',
      '.mc-board__canvas[data-groups="on"] .mc-board__card[data-group="7"]{border-left-color:#bf6b4b;}',

      '[data-mc-profile="mobile"] .mc-notes{padding:var(--mc-s-3);}',

  /* ==========================================================================
     МОДУЛЬ 2. NotesSystem
     Работает с существующим GameState.notes ({ [id]: string }).
     Ключи:
       - 'free:<uid>'                — свободная заметка игрока
       - 'evidence:<evidenceId>'     — заметка, привязанная к улике
     Не создаём отдельного хранилища; не вводим новых полей GameState.
     ========================================================================== */

  const NotesSystem = (() => {
    const FREE_PREFIX = 'free:';
    const EVIDENCE_PREFIX = 'evidence:';

    const store = () => GameState.get().notes;

    const parse = (id, text) => {
      const info = { id, text: String(text == null ? '' : text) };
      if (id.indexOf(FREE_PREFIX) === 0) {
        info.kind = 'free';
        info.uid = id.slice(FREE_PREFIX.length);
      } else if (id.indexOf(EVIDENCE_PREFIX) === 0) {
        info.kind = 'evidence';
        info.evidenceId = id.slice(EVIDENCE_PREFIX.length);
      } else {
        info.kind = 'unknown';
      }
      return info;
    };

    const listAll = () => {
      const notes = store();
      const out = [];
      for (const id in notes) {
        if (!Object.prototype.hasOwnProperty.call(notes, id)) continue;
        out.push(parse(id, notes[id]));
      }
      return out;
    };

    const addFree = (text) => {
      const t = String(text == null ? '' : text).trim();
      if (!t) return null;
      const id = FREE_PREFIX + uid('n');
      store()[id] = t;
      GameState.touch();
      EventBus.emit('notes:added', { id, text: t, kind: 'free' });
      return id;
    };

    const addForEvidence = (evidenceId, text) => {
      if (!evidenceId) return null;
      const t = String(text == null ? '' : text).trim();
      if (!t) return null;
      const id = EVIDENCE_PREFIX + evidenceId;
      store()[id] = t;
      GameState.touch();
      EventBus.emit('notes:added', { id, text: t, kind: 'evidence', evidenceId });
      return id;
    };

    const update = (id, text) => {
      if (!id) return false;
      const notes = store();
      if (!Object.prototype.hasOwnProperty.call(notes, id)) return false;
      const t = String(text == null ? '' : text);
      if (!t.trim()) return remove(id);
      notes[id] = t;
      GameState.touch();
      EventBus.emit('notes:updated', { id, text: t });
      return true;
    };

    const remove = (id) => {
      const notes = store();
      if (!Object.prototype.hasOwnProperty.call(notes, id)) return false;
      delete notes[id];
      GameState.touch();
      EventBus.emit('notes:removed', { id });
      return true;
    };

    const getForEvidence = (evidenceId) => {
      if (!evidenceId) return '';
      return store()[EVIDENCE_PREFIX + evidenceId] || '';
    };

    const hasForEvidence = (evidenceId) => !!getForEvidence(evidenceId);

    const count = () => {
      const notes = store();
      let n = 0;
      for (const id in notes) {
        if (Object.prototype.hasOwnProperty.call(notes, id)) n++;
      }
      return n;
    };

    return {
      FREE_PREFIX, EVIDENCE_PREFIX,
      listAll, addFree, addForEvidence, update, remove,
      getForEvidence, hasForEvidence, count, parse
    };
  })();

  /* ==========================================================================
     МОДУЛЬ 3. NotesScreen
     ========================================================================== */

  const makeNotesScreen = () => {

    addRow.style.gap = 'var(--mc-s-2)';
    addRow.appendChild(UIComponents.button({

    wrap.appendChild(addRow);

    const list = NotesSystem.listAll();
    if (list.length === 0) {

      empty.className = 'mc-notes__empty';
      empty.innerHTML = '<h3>ЗАМЕТОК НЕТ</h3>' +
        '<p>Здесь можно записывать наблюдения и рабочие гипотезы. ' +
