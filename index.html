      };

      const panBy = (dx, dy, animate) => moveTo(state.targetX + dx, state.targetY + dy, animate);
      const zoomBy = (factor, animate) => zoomTo(state.targetZoom * factor, animate);

      /**
       * Зум с сохранением точки (sx, sy) экранного пространства под курсором.
       * Работает в целевых координатах, чтобы анимация сглаживания вела камеру
       * сразу в правильное конечное положение.
       */
      const zoomAtPoint = (factor, sx, sy) => {
        const before = screenToWorld(sx, sy, /*useTarget=*/true);
        state.targetZoom = clamp(state.targetZoom * factor, state.minZoom, state.maxZoom);
        // Из формулы worldToScreen: sx = (wx - camX) * zoom + vw/2
        // => camX = wx - (sx - vw/2) / zoom
        state.targetX = before.x - (sx - state.viewport.w / 2) / state.targetZoom;
        state.targetY = before.y - (sy - state.viewport.h / 2) / state.targetZoom;
        clampToWorld();
      };

      const tick = (dtMs) => {
        // Экспоненциальное сглаживание, независимое от частоты кадров.
        const k = 1 - Math.pow(1 - state.smoothing, Math.max(1, dtMs) / 16.6667);
        state.x += (state.targetX - state.x) * k;
        state.y += (state.targetY - state.y) * k;
        state.zoom += (state.targetZoom - state.zoom) * k;
      };

      const apply = (ctx) => {
        ctx.translate(state.viewport.w / 2, state.viewport.h / 2);
        ctx.scale(state.zoom, state.zoom);
        ctx.translate(-state.x, -state.y);
      };

      const screenToWorld = (sx, sy, useTarget) => {
        const z = useTarget ? state.targetZoom : state.zoom;
        const cx = useTarget ? state.targetX : state.x;
        const cy = useTarget ? state.targetY : state.y;
        const wx = (sx - state.viewport.w / 2) / z + cx;
        const wy = (sy - state.viewport.h / 2) / z + cy;
        return { x: wx, y: wy };
      };

      const worldToScreen = (wx, wy) => {
        const sx = (wx - state.x) * state.zoom + state.viewport.w / 2;
        const sy = (wy - state.y) * state.zoom + state.viewport.h / 2;
        return { x: sx, y: sy };
      };

      const get = () => ({
        x: state.x, y: state.y, zoom: state.zoom,
        targetX: state.targetX, targetY: state.targetY, targetZoom: state.targetZoom,
        world: Object.assign({}, state.world),
        viewport: Object.assign({}, state.viewport)
      });

      return {
        setViewport, setWorld, moveTo, zoomTo, panBy, zoomBy, zoomAtPoint,
        tick, apply, screenToWorld, worldToScreen, get
      };
    };
    return { create };
  })();

  /* ==========================================================================
     МОДУЛЬ 2. SceneLighting
     Процедурное освещение: радиальные градиенты, виньетка, дождь на стекле.
     ========================================================================== */

  const SceneLighting = (() => {
    const create = (opts) => {
      const o = Object.assign({
        ambient: 'rgba(6,10,18,0.35)',
        vignette: 0.55,
        vignetteColor: 'rgba(0,0,0,0.85)',
        lights: [],
        rainGlass: false,
        rainDensity: 26,
        quality: 'auto'
      }, opts || {});

      const state = {
        lights: o.lights.slice(),
        rain: [],
        time: 0
      };

      const seedRain = (w, h) => {
        state.rain.length = 0;
        if (!o.rainGlass) return;
        const count = Math.floor((w * h) / 42000) + o.rainDensity;
        for (let i = 0; i < count; i++) {
          state.rain.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: 1 + Math.random() * 2.2,
            v: 0.6 + Math.random() * 1.6,
            trail: 6 + Math.random() * 18
          });
        }
      };

      const addLight = (light) => {
        if (!isPlainObject(light)) return null;
        const L = Object.assign({
          id: uid('light'),
          x: 0, y: 0,
          radius: 200,
          color: 'rgba(255,220,160,0.55)',
          intensity: 1,
          flicker: 0
        }, light);
        state.lights.push(L);
        return L.id;
      };

      const removeLight = (lightId) => {
        const before = state.lights.length;
        state.lights = state.lights.filter(l => l.id !== lightId);
        return state.lights.length !== before;
      };

      const updateLight = (lightId, patch) => {
        const L = state.lights.find(l => l.id === lightId);
        if (!L || !isPlainObject(patch)) return false;
        Object.assign(L, patch);
        return true;
      };

      const tick = (dtMs) => {
        state.time += dtMs / 1000;
        if (o.rainGlass && state.rain.length) {
          const k = dtMs / 16.6667;
          for (let i = 0; i < state.rain.length; i++) {
            const d = state.rain[i];
            d.y += d.v * k;
            if (d.y - d.trail > 2400) {
              d.y = -d.trail;
              d.x = Math.random() * 2600 - 200;
            }
          }
        }
      };

      const parseRgba = (str) => {
        const s = String(str == null ? '' : str).trim();
        let m = s.match(/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([\d.]+)\s*)?\)$/i);
        if (m) {
          return {
            r: +m[1], g: +m[2], b: +m[3],
            a: m[4] != null ? +m[4] : 1
          };
        }
        m = s.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
        if (m) {
          let hex = m[1];
          if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
          return {
            r: parseInt(hex.slice(0, 2), 16),
            g: parseInt(hex.slice(2, 4), 16),
            b: parseInt(hex.slice(4, 6), 16),
            a: 1
          };
        }
        return { r: 255, g: 220, b: 160, a: 0.5 };
      };

      const draw = (ctx, cam, viewW, viewH) => {
        // Амбиентная заливка (в экранных координатах).
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = o.ambient;
        ctx.fillRect(0, 0, viewW, viewH);
        ctx.restore();

        // Источники света в мире.
        ctx.save();
        cam.apply(ctx);
        for (let i = 0; i < state.lights.length; i++) {
          const L = state.lights[i];
          let intensity = L.intensity;
          if (L.flicker > 0) {
            const t = state.time * (4 + L.flicker * 4);
            intensity *= 0.85 + 0.15 * Math.sin(t) + 0.05 * Math.sin(t * 2.3);
          }
          const c = parseRgba(L.color);
          const grad = ctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.radius);
          grad.addColorStop(0, 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + (c.a * intensity).toFixed(3) + ')');
          grad.addColorStop(0.65, 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + (c.a * intensity * 0.35).toFixed(3) + ')');
          grad.addColorStop(1, 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(L.x, L.y, L.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Виньетка.
        if (o.vignette > 0) {
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          const vg = ctx.createRadialGradient(
            viewW / 2, viewH / 2, Math.min(viewW, viewH) * 0.35,
            viewW / 2, viewH / 2, Math.max(viewW, viewH) * 0.75
          );
          vg.addColorStop(0, 'rgba(0,0,0,0)');
          vg.addColorStop(1, o.vignetteColor);
          ctx.globalAlpha = o.vignette;
          ctx.fillStyle = vg;
          ctx.fillRect(0, 0, viewW, viewH);
          ctx.restore();
        }

        // Капли на стекле.
        if (o.rainGlass && state.rain.length) {
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalAlpha = 0.35;
          ctx.lineCap = 'round';
          for (let i = 0; i < state.rain.length; i++) {
            const d = state.rain[i];
            const grad = ctx.createLinearGradient(d.x, d.y - d.trail, d.x, d.y);
            grad.addColorStop(0, 'rgba(160,200,230,0)');
            grad.addColorStop(1, 'rgba(180,215,240,0.45)');
            ctx.strokeStyle = grad;
            ctx.lineWidth = d.r;
            ctx.beginPath();
            ctx.moveTo(d.x, d.y - d.trail);
            ctx.lineTo(d.x, d.y);
            ctx.stroke();
          }
          ctx.restore();
        }
      };

      const resize = (w, h) => { seedRain(w, h); };
      const getLights = () => state.lights.slice();

      return { addLight, removeLight, updateLight, getLights, tick, draw, resize };
    };
    return { create };
  })();

  /* ==========================================================================
     МОДУЛЬ 3. Hotspot
     Интерактивная прямоугольная зона в мировых координатах.
     ========================================================================== */

  const Hotspot = (() => {
    let counter = 0;
    const nextId = () => 'hs-' + (++counter).toString(36) + '-' + uid().split('-').pop();

    const safeCall = (fn, a, b) => {
      try { fn(a, b); }
      catch (e) { Logger.error('hotspot', 'callback error', e); }
    };

    const create = (opts) => {
      const o = Object.assign({
        id: null,
        rect: { x: 0, y: 0, w: 100, h: 100 },
        label: '',
        tooltip: '',
        enabled: true,
        visible: true,
        kind: 'prop',
        data: null,
        onEnter: null,
        onLeave: null,
        onClick: null,
        onInspect: null,
        inspected: false,
        marker: null,
        isAvailable: null
      }, opts || {});

      if (!o.id) o.id = nextId();

      const s = { hover: false, focused: false };

      const contains = (wx, wy) => {
        const r = o.rect;
        return wx >= r.x && wx <= r.x + r.w && wy >= r.y && wy <= r.y + r.h;
      };

      const isUsable = () => {
        if (!o.enabled || !o.visible) return false;
        if (typeof o.isAvailable === 'function') {
          try { return !!o.isAvailable(); }
          catch (_) { return false; }
        }
        return true;
      };

      const hitTest = (wx, wy) => isUsable() && contains(wx, wy);

      const setHover = (v) => {
        if (s.hover === v) return;
        s.hover = v;
        if (v && typeof o.onEnter === 'function') safeCall(o.onEnter, o);
        if (!v && typeof o.onLeave === 'function') safeCall(o.onLeave, o);
      };

      const setFocus = (v) => { s.focused = !!v; };

      const inspect = () => {
        if (!isUsable()) return false;
        o.inspected = true;
        EventBus.emit('hotspot:inspected', { id: o.id, kind: o.kind, data: o.data });
        if (typeof o.onInspect === 'function') safeCall(o.onInspect, o);
        return true;
      };

      const click = (ev) => {
        if (!isUsable()) return false;
        if (typeof o.onClick === 'function') safeCall(o.onClick, ev, o);
        EventBus.emit('hotspot:clicked', { id: o.id, kind: o.kind });
        return true;
      };

      const draw = (ctx, cam) => {
        if (!isUsable()) return;
        const r = o.rect;
        const active = s.hover || s.focused;
        if (!active && !o.inspected && !o.marker) return;

        const zoom = cam.get().zoom;
        ctx.save();
        if (active) {
          ctx.strokeStyle = 'rgba(79,179,201,0.9)';
          ctx.lineWidth = 1.5 / zoom;
          ctx.setLineDash([6 / zoom, 4 / zoom]);
          ctx.strokeRect(r.x, r.y, r.w, r.h);
          ctx.setLineDash([]);
          ctx.fillStyle = 'rgba(79,179,201,0.08)';
          ctx.fillRect(r.x, r.y, r.w, r.h);
        } else if (o.inspected) {
          ctx.strokeStyle = 'rgba(120,140,160,0.35)';
          ctx.lineWidth = 1 / zoom;
          ctx.strokeRect(r.x, r.y, r.w, r.h);
        }
        if (o.marker && typeof o.marker.draw === 'function') {
          try { o.marker.draw(ctx, r, active, cam); }
          catch (e) { Logger.error('hotspot', 'marker draw failed', e); }
        }
        ctx.restore();
      };

      const getBounds = () => Object.assign({}, o.rect);
      const setBounds = (rect) => { if (isPlainObject(rect)) Object.assign(o.rect, rect); };
      const getMeta = () => ({
        id: o.id, kind: o.kind, label: o.label, tooltip: o.tooltip,
        inspected: o.inspected, enabled: o.enabled, visible: o.visible,
        rect: Object.assign({}, o.rect)
      });

      return {
        id: o.id,
        data: o.data,
        kind: o.kind,
        meta: o,
        contains, hitTest, setHover, setFocus, inspect, click, draw,
        getBounds, setBounds, getMeta,
        isHover: () => s.hover,
        isFocused: () => s.focused
      };
    };

    return { create };
  })();

  /* ==========================================================================
     МОДУЛЬ 4. CanvasScene
     ========================================================================== */

  const CanvasScene = (() => {
    let activeScene = null;

    const createFallback = (opts) => {
      const wrap = document.createElement('div');
      wrap.className = 'mc-nocanvas';
      wrap.style.position = 'absolute';
      wrap.style.inset = '0';
      wrap.style.display = 'grid';
      wrap.style.placeItems = 'center';
      wrap.style.padding = 'var(--mc-s-6)';

      const inner = document.createElement('div');
      inner.style.maxWidth = '520px';
      inner.style.textAlign = 'center';
      inner.style.fontFamily = 'var(--mc-font-mono)';
      inner.style.color = 'var(--mc-fg-1)';

      const title = document.createElement('div');
      title.style.fontSize = '22px';
      title.style.letterSpacing = '.2em';
      title.style.color = 'var(--mc-accent)';
      title.style.marginBottom = '12px';
      title.textContent = 'MIND CASE';

      const line1 = document.createElement('div');
      line1.textContent = 'Ваш браузер не предоставил 2D-контекст Canvas.';

      const line2 = document.createElement('div');
      line2.style.marginTop = '12px';
      line2.style.color = 'var(--mc-fg-2)';
      line2.style.fontSize = '12px';
      line2.textContent = 'Игра продолжит работу в текстовом режиме.';

      inner.appendChild(title);
      inner.appendChild(line1);
      inner.appendChild(line2);
      wrap.appendChild(inner);

      if (opts && opts.parent) opts.parent.appendChild(wrap);

      if (MC.Diagnostics) {
        MC.Diagnostics.push(Constants.ERR.CANVAS_UNAVAILABLE, 'scene', 'Canvas 2D недоступен');
      }

      return {
        id: opts && opts.id ? opts.id : uid('fallback-scene'),
        canvas: null,
        ctx: null,
        wrap,
        camera: Camera.create({}),
        lighting: SceneLighting.create({}),
        addHotspot: () => null,
        removeHotspot: () => {},
        getHotspots: () => [],
        findHotspotById: () => null,
        onDraw: () => null,
        offDraw: () => {},
        onDrawUI: () => null,
        onTick: () => null,
        start: () => {},
        stop: () => {},
        isRunning: () => false,
        resize: () => {},
        focusNextHotspot: () => {},
        focusPrevHotspot: () => {},
        activateFocused: () => false,
        inspectFocused: () => false,
        cameraMoveTo: () => {},
        cameraZoomTo: () => {},
        metrics: () => ({ fps: 0, frames: 0, hovered: null, focused: null, dpr: 1, viewW: 0, viewH: 0 }),
        dispose: () => { try { wrap.remove(); } catch (_) {} },
        _fallback: true
      };
    };

    const create = (opts) => {
      const o = Object.assign({
        id: uid('scene'),
        parent: document.getElementById('mc-scene-layer'),
        worldWidth: 1920,
        worldHeight: 1080,
        background: '#0b0f14',
        camera: {},
        lighting: {},
        interactive: true,
        quality: 'auto',
        maxDpr: 2,
        ariaLabel: 'Игровая сцена'
      }, opts || {});

      if (!FeatureDetect.has('canvas2d')) return createFallback(o);
      if (!o.parent) {
        Logger.warn('scene', 'родительский слой отсутствует, сцена не создана');
        return null;
      }

      // ---- DOM ----
      const wrap = document.createElement('div');
      wrap.className = 'mc-scene';
      wrap.style.position = 'absolute';
      wrap.style.inset = '0';
      wrap.style.overflow = 'hidden';
      wrap.style.background = o.background;
      wrap.setAttribute('data-scene-id', o.id);

      const canvas = document.createElement('canvas');
      canvas.className = 'mc-canvas';
      canvas.style.display = 'block';
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      canvas.style.touchAction = 'none';
      canvas.style.outline = 'none';
      canvas.setAttribute('tabindex', '0');
      canvas.setAttribute('aria-label', o.ariaLabel);
      wrap.appendChild(canvas);
      o.parent.appendChild(wrap);

      const ctx = canvas.getContext('2d', { alpha: false });
      if (!ctx) {
        try { wrap.remove(); } catch (_) {}
        return createFallback(o);
      }

      // ---- Camera / Lighting ----
      const cam = Camera.create(Object.assign({
        worldWidth: o.worldWidth,
        worldHeight: o.worldHeight
      }, o.camera || {}));

      const lighting = SceneLighting.create(Object.assign({
        quality: o.quality
      }, o.lighting || {}));

      // ---- State ----
      const hotspots = [];
      const drawList = [];
      const uiList = [];
      const tickList = [];

      let dpr = 1;
      let viewW = 1, viewH = 1;
      let running = true;
      let lastTs = 0;
      let hoveredHotspot = null;
      let focusedHotspotIndex = -1;
      let disposed = false;

      // FPS-счётчик (windowed 500ms) + общий счётчик кадров.
      let totalFrames = 0;
      let windowFrames = 0;
      let windowAccum = 0;
      let windowStart = 0;
      let lastFps = 60;

      const abortCtrl = (typeof AbortController === 'function') ? new AbortController() : null;
      const signal = abortCtrl ? abortCtrl.signal : undefined;
      const raf = global.requestAnimationFrame || ((fn) => setTimeout(() => fn(Date.now()), 16));
      const caf = global.cancelAnimationFrame || clearTimeout;
      let rafHandle = 0;
      let ro = null;

      // ---- API ----
      const api = {
        id: o.id,
        canvas, ctx, camera: cam, lighting, wrap,

        addHotspot(hs) {
          if (hs && typeof hs.draw === 'function') hotspots.push(hs);
          return hs;
        },
        removeHotspot(id) {
          const i = hotspots.findIndex(h => h.id === id);
          if (i >= 0) hotspots.splice(i, 1);
        },
        getHotspots() { return hotspots.slice(); },
        findHotspotById(id) { return hotspots.find(h => h.id === id) || null; },

        onDraw(fn) { if (typeof fn === 'function') drawList.push(fn); return fn; },
        offDraw(fn) { const i = drawList.indexOf(fn); if (i >= 0) drawList.splice(i, 1); },
        onDrawUI(fn) { if (typeof fn === 'function') uiList.push(fn); return fn; },
        offDrawUI(fn) { const i = uiList.indexOf(fn); if (i >= 0) uiList.splice(i, 1); },
        onTick(fn) { if (typeof fn === 'function') tickList.push(fn); return fn; },
        offTick(fn) { const i = tickList.indexOf(fn); if (i >= 0) tickList.splice(i, 1); },

        start() { if (running || disposed) return; running = true; lastTs = 0; requestFrame(); },
        stop() { running = false; if (rafHandle) { try { caf(rafHandle); } catch (_) {} rafHandle = 0; } },
        isRunning: () => running,

        resize: () => doResize(),

        focusNextHotspot() { moveFocus(1); },
        focusPrevHotspot() { moveFocus(-1); },
        activateFocused() {
          const hs = hotspots[focusedHotspotIndex];
          if (!hs) return false;
          hs.click({ kind: 'keyboard' });
          return true;
        },
        inspectFocused() {
          const hs = hotspots[focusedHotspotIndex];
          if (!hs) return false;
          return hs.inspect();
        },

        cameraMoveTo: (x, y, animate) => cam.moveTo(x, y, animate),
        cameraZoomTo: (z, animate) => cam.zoomTo(z, animate),
        cameraZoomAt: (f, sx, sy) => cam.zoomAtPoint(f, sx, sy),

        metrics: () => ({
          fps: lastFps,
          frames: totalFrames,
          hovered: hoveredHotspot ? hoveredHotspot.id : null,
          focused: focusedHotspotIndex >= 0 && hotspots[focusedHotspotIndex]
            ? hotspots[focusedHotspotIndex].id
            : null,
          dpr, viewW, viewH
        }),

        dispose() {
          if (disposed) return;
          disposed = true;
          running = false;
          if (rafHandle) { try { caf(rafHandle); } catch (_) {} rafHandle = 0; }
          if (ro) { try { ro.disconnect(); } catch (_) {} ro = null; }
          if (abortCtrl) { try { abortCtrl.abort(); } catch (_) {} }
          try { wrap.remove(); } catch (_) {}
          if (activeScene === api) activeScene = null;
          EventBus.emit('scene:disposed', { id: o.id });
        }
      };

      // ---- Resize ----
      const doResize = () => {
        if (disposed) return;
        const rect = wrap.getBoundingClientRect();
        const w = Math.max(1, Math.floor(rect.width));
        const h = Math.max(1, Math.floor(rect.height));
        dpr = clamp(global.devicePixelRatio || 1, 1, o.maxDpr);
        const dw = Math.floor(w * dpr);
        const dh = Math.floor(h * dpr);
        if (canvas.width !== dw) canvas.width = dw;
        if (canvas.height !== dh) canvas.height = dh;
        viewW = w; viewH = h;
        cam.setViewport(w, h);
        lighting.resize(w, h);
        EventBus.emit('scene:resized', { id: o.id, w, h, dpr });
      };

      if (FeatureDetect.has('resizeObserver')) {
        ro = new ResizeObserver(() => doResize());
        ro.observe(wrap);
      }
      const resizeOpts = signal ? { passive: true, signal } : { passive: true };
      global.addEventListener('resize', doResize, resizeOpts);
      global.addEventListener('orientationchange', doResize, resizeOpts);

      // ---- Render loop ----
      const requestFrame = () => {
        if (!running || disposed) return;
        rafHandle = raf(frame);
      };

      const frame = (ts) => {
        if (disposed || !running) return;
        const dt = lastTs ? clamp(ts - lastTs, 0, 80) : 16.6667;
        lastTs = ts;

        totalFrames++;
        windowFrames++;
        windowAccum += dt;
        if (!windowStart) windowStart = ts;
        if (ts - windowStart >= 500) {
          const avg = windowAccum / Math.max(1, windowFrames);
          lastFps = avg > 0 ? Math.round(1000 / avg) : 0;
          windowFrames = 0; windowAccum = 0; windowStart = ts;
        }

        cam.tick(dt);
        lighting.tick(dt);
        for (let i = 0; i < tickList.length; i++) {
          try { tickList[i](dt, ts); }
          catch (e) { Logger.error('scene', 'tick error', e); }
        }

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = o.background;
        ctx.fillRect(0, 0, viewW, viewH);

        // Мир.
        ctx.save();
        cam.apply(ctx);
        for (let i = 0; i < drawList.length; i++) {
          try { drawList[i](ctx, cam, viewW, viewH); }
          catch (e) { Logger.error('scene', 'draw error', e); }
        }

      const img = g.createImageData(w, h);
      const rng = Rand.fromSeed(seed);
      const amp = intensity == null ? 14 : intensity;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const n = (rng.next() * 2 - 1) * amp;
          const v = 128 + n;
          img.data[i] = v;
          img.data[i + 1] = v;
          img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
      }
      g.putImageData(img, 0, 0);
      return c;
    };

    const buildPaperCanvas = (w, h, seed) => {
      const c = makeCanvas(w, h);
      const g = c.getContext('2d');
      if (!g) return c;
      // База — молочный тон.
      g.fillStyle = '#ece6d6';
      g.fillRect(0, 0, w, h);
      // Лёгкий шум волокон.
      const n2 = Noise2D.create({ seed: seed + ':paper', frequency: 0.08, octaves: 3 });
      const img = g.getImageData(0, 0, w, h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const v = n2.at(x, y) * 12 - 6;
          img.data[i] = clamp(img.data[i] + v, 0, 255);
          img.data[i + 1] = clamp(img.data[i + 1] + v, 0, 255);
          img.data[i + 2] = clamp(img.data[i + 2] + v * 1.1, 0, 255);
        }
      }
      g.putImageData(img, 0, 0);
      // Несколько случайных пятен чая/кофе — очень слабых.
      const rng = Rand.fromSeed(seed + ':stains');
      const stains = 2 + rng.int(0, 3);
      for (let s = 0; s < stains; s++) {
        const x = rng.float(0, w);
        const y = rng.float(0, h);
        const r = rng.float(10, Math.min(w, h) * 0.15);
        const grad = g.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, 'rgba(140,110,60,0.08)');
        grad.addColorStop(1, 'rgba(140,110,60,0)');
        g.fillStyle = grad;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      }
      return c;
    };

    const buildConcreteCanvas = (w, h, seed) => {
      const c = makeCanvas(w, h);
      const g = c.getContext('2d');
      if (!g) return c;
      g.fillStyle = '#1a1e26';
      g.fillRect(0, 0, w, h);
      const n2 = Noise2D.create({ seed: seed + ':concrete', frequency: 0.15, octaves: 4 });
      const img = g.getImageData(0, 0, w, h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const v = n2.at(x, y) * 30 - 15;
          img.data[i] = clamp(img.data[i] + v, 0, 255);
          img.data[i + 1] = clamp(img.data[i + 1] + v, 0, 255);
          img.data[i + 2] = clamp(img.data[i + 2] + v * 1.05, 0, 255);
        }
      }
      g.putImageData(img, 0, 0);
      return c;
    };

    const buildWoodCanvas = (w, h, seed) => {
      const c = makeCanvas(w, h);
      const g = c.getContext('2d');
      if (!g) return c;
      g.fillStyle = '#3a2a1c';
      g.fillRect(0, 0, w, h);
      const n1 = Noise1D.create({ seed: seed + ':wood', frequency: 3.2, octaves: 4 });
      const img = g.getImageData(0, 0, w, h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const v = n1.at(x * 0.4 + y * 0.02) * 40 - 20;
          img.data[i] = clamp(img.data[i] + v, 0, 255);
          img.data[i + 1] = clamp(img.data[i + 1] + v * 0.7, 0, 255);
          img.data[i + 2] = clamp(img.data[i + 2] + v * 0.4, 0, 255);
        }
      }
      g.putImageData(img, 0, 0);
      return c;
    };

    const getPattern = (ctx, kind, opts) => {
      const o = Object.assign({ size: 256, seed: kind }, opts || {});
      const key = kind + '|' + o.size + '|' + o.seed;
      let entry = cache.get(key);
      if (!entry) {
        let canvas;
        switch (kind) {
          case 'paper':    canvas = buildPaperCanvas(o.size, o.size, o.seed); break;
          case 'concrete': canvas = buildConcreteCanvas(o.size, o.size, o.seed); break;
          case 'wood':     canvas = buildWoodCanvas(o.size, o.size, o.seed); break;
          case 'noise':    canvas = buildNoiseCanvas(o.size, o.size, o.seed, o.intensity); break;
          default:         canvas = buildNoiseCanvas(o.size, o.size, o.seed, o.intensity); break;
        }
        let pattern = null;
        try { pattern = ctx.createPattern(canvas, 'repeat'); }
        catch (e) { Logger.warn('textures', 'createPattern failed for ' + kind, e); }
        entry = { canvas, pattern };
        cache.set(key, entry);
      }
      return entry;
    };

    const clear = () => cache.clear();

    return { getPattern, clear, _builds: { buildPaperCanvas, buildConcreteCanvas, buildWoodCanvas, buildNoiseCanvas } };
  })();

  /* ==========================================================================
     МОДУЛЬ 5. DocumentRenderer
     Рисует документы: бланк, рукописные строки, машинописный текст, штамп,
     подпись, сгибы. Работает и с CanvasScene (в мировых координатах),
     и с любым другим контекстом.
     ========================================================================== */

  const DocumentRenderer = (() => {
    const drawPaper = (ctx, opts) => {
      const o = Object.assign({
        x: 0, y: 0,
        w: 400, h: 520,
        seed: 'doc-1',
        title: '',
        subtitle: '',
        lines: 0,
        lineStyle: 'typed',   // 'typed' | 'handwritten' | 'mixed'
        stamp: null,          // { text, color, angle, x, y }
        signature: null,      // { name, x, y }
        folds: 0,
        clipLabel: null
      }, opts || {});

      const { x, y, w, h } = o;
      const rng = Rand.fromSeed(o.seed);

      // Тень листа.
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 6;
      ctx.fillStyle = '#e8e2d1';
      ctx.fillRect(x, y, w, h);
      ctx.restore();

      // Бумажный паттерн.
      try {
        const { canvas } = TextureFactory.getPattern(ctx, 'paper', { size: 256, seed: o.seed + ':paper' });
        // Рисуем через временный паттерн из того же canvas.
        const p = ctx.createPattern(canvas, 'repeat');
        if (p) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(x, y, w, h);
          ctx.clip();
          ctx.globalAlpha = 0.55;
          ctx.translate(x, y);
          ctx.fillStyle = p;
          ctx.fillRect(0, 0, w, h);
          ctx.restore();
        }
      } catch (_) {}

      // Тонкая тёмная рамка.
      ctx.strokeStyle = 'rgba(60,50,30,0.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

      // Поля.
      const padX = Math.round(w * 0.09);
      const padY = Math.round(h * 0.08);
      const innerLeft = x + padX;
      const innerRight = x + w - padX;
      const innerTop = y + padY;
      const innerBottom = y + h - padY;

      // Заголовок.
      let cursorY = innerTop;
      if (o.title) {
        ctx.fillStyle = '#1c1a16';
        ctx.font = 'bold ' + Math.max(12, Math.round(h * 0.045)) + 'px Georgia, "Times New Roman", serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(String(o.title), (innerLeft + innerRight) / 2, cursorY + 6);
        cursorY += Math.round(h * 0.055);
        // Линия под заголовком.
        ctx.strokeStyle = 'rgba(30,25,15,0.65)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(innerLeft, cursorY);
        ctx.lineTo(innerRight, cursorY);
        ctx.stroke();
        cursorY += Math.round(h * 0.02);
      }
      if (o.subtitle) {
        ctx.fillStyle = '#3a332a';
        ctx.font = Math.round(h * 0.028) + 'px Georgia, "Times New Roman", serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(o.subtitle), (innerLeft + innerRight) / 2, cursorY + 4);
        cursorY += Math.round(h * 0.04);
      }

      // Линии текста.
      const lineCount = Math.max(0, (o.lines | 0));
      const availHeight = innerBottom - cursorY - (o.signature ? h * 0.12 : 0);
      if (lineCount > 0) {
        const lineStep = availHeight / lineCount;
        const fontPx = Math.round(h * 0.024);
        ctx.font = fontPx + 'px "Courier New", monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        for (let i = 0; i < lineCount; i++) {
          const ly = cursorY + lineStep * (i + 0.5);
          const style = o.lineStyle === 'mixed'
            ? (rng.chance(0.35) ? 'handwritten' : 'typed')
            : o.lineStyle;
          const marginL = rng.float(0, 8);
          const marginR = rng.float(0, 24);
          const startX = innerLeft + marginL;
          const endX = innerRight - marginR;
          if (style === 'handwritten') {
            // Волнистая «рукописная» линия.
            ctx.strokeStyle = 'rgba(20,30,60,0.72)';
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            const mid = (startX + endX) / 2;
            const wobble = rng.float(-1.5, 1.5);
            ctx.moveTo(startX, ly + wobble);
            const segments = 8;
            for (let k = 1; k <= segments; k++) {
              const t = k / segments;
              const px = startX + (endX - startX) * t;
              const py = ly + Math.sin(t * Math.PI * 2 + i) * rng.float(0.4, 1.2);
              ctx.lineTo(px, py);
            }
            ctx.stroke();
          } else {
            ctx.fillStyle = 'rgba(20,22,30,0.78)';
            // Имитация строки текста: набор коротких «слов».
            let cx = startX;
            while (cx < endX - 6) {
              const wordW = rng.float(14, Math.min(46, endX - cx));
              ctx.fillRect(cx, ly - 1, wordW, 1.4);
              cx += wordW + rng.float(3, 6);
            }
          }
        }
      }

      // Складки.
      const folds = Math.max(0, o.folds | 0);
      for (let f = 0; f < folds; f++) {
        const fy = y + (h / (folds + 1)) * (f + 1);
        ctx.strokeStyle = 'rgba(0,0,0,0.18)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, fy);
        ctx.lineTo(x + w, fy + rng.float(-1.5, 1.5));
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath();
        ctx.moveTo(x, fy + 1);
        ctx.lineTo(x + w, fy + 1 + rng.float(-1.5, 1.5));
        ctx.stroke();
      }

      // Штамп.
      if (o.stamp && o.stamp.text) {
        const s = o.stamp;
        const cx = s.x != null ? x + s.x : x + w * 0.68;
        const cy = s.y != null ? y + s.y : y + h * 0.72;
        const angle = (s.angle != null ? s.angle : -0.18);
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.strokeStyle = s.color || 'rgba(150,30,40,0.85)';
        ctx.lineWidth = 3;
        const boxW = Math.max(80, w * 0.44);
        const boxH = Math.max(38, h * 0.09);
        ctx.strokeRect(-boxW / 2, -boxH / 2, boxW, boxH);
        ctx.fillStyle = s.color || 'rgba(150,30,40,0.85)';
        ctx.font = 'bold ' + Math.round(boxH * 0.45) + 'px Georgia, serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(s.text).toUpperCase(), 0, 0);
        ctx.restore();
      }

      // Подпись.
      if (o.signature && o.signature.name) {
        const sx = o.signature.x != null ? x + o.signature.x : innerLeft;
        const sy = o.signature.y != null ? y + o.signature.y : innerBottom - 6;
        ctx.strokeStyle = 'rgba(20,30,60,0.9)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        const points = 18;
        let px = sx;
        let py = sy;
        ctx.moveTo(px, py);
        for (let i = 0; i < points; i++) {
          const dx = rng.float(4, 14);
          const dy = rng.float(-14, 14);
          px += dx;
          py += dy;
          ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.fillStyle = 'rgba(20,22,30,0.7)';
        ctx.font = Math.round(h * 0.02) + 'px Georgia, serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(o.signature.name, sx, sy + 6);
      }

      // Подпись-клип, например «ВЕЩДОК 01-А».
      if (o.clipLabel) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(x, y + h - 22, w, 22);
        ctx.fillStyle = 'rgba(230,240,255,0.85)';
        ctx.font = '11px "Courier New", monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(o.clipLabel), x + 8, y + h - 11);
      }

      return { x, y, w, h };
    };

    return { drawPaper };
  })();

  /* ==========================================================================
     МОДУЛЬ 6. PhotoRenderer
     Стилизованные фотографии: рамка, зерно, царапины, отметки.
     ========================================================================== */

  const PhotoRenderer = (() => {
    const drawPhoto = (ctx, opts) => {
      const o = Object.assign({
        x: 0, y: 0,
        w: 360, h: 260,
        seed: 'photo-1',
        // Базовая «сцена»: функция рисования внутри рамки.
        paint: null,
        border: 14,
        tint: 'rgba(70,60,40,0.10)',
        grain: 0.10,
        scratches: 3,
        caption: ''
      }, opts || {});

      const { x, y, w, h } = o;
      const rng = Rand.fromSeed(o.seed);

      // Внешняя рамка (картон).
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur = 14;
      ctx.shadowOffsetY = 5;
      ctx.fillStyle = '#efeadb';
      ctx.fillRect(x, y, w, h);
      ctx.restore();

      const bx = x + o.border;
      const by = y + o.border;
      const bw = w - o.border * 2;
      const bh = h - o.border * 2 - (o.caption ? 24 : 0);

      ctx.save();
      ctx.beginPath();
      ctx.rect(bx, by, bw, bh);
      ctx.clip();

      // Фон по умолчанию — глубокий серый.
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(bx, by, bw, bh);

      // Кастомная отрисовка.
      if (typeof o.paint === 'function') {
        try { o.paint(ctx, { x: bx, y: by, w: bw, h: bh, rng }); }
        catch (e) { Logger.error('photo', 'paint callback failed', e); }
      }

      // Тонирование.
      if (o.tint) {
        ctx.fillStyle = o.tint;
        ctx.fillRect(bx, by, bw, bh);
      }

      // Зерно.
      if (o.grain > 0) {
        const img = ctx.getImageData(bx, by, bw, bh);
        const d = img.data;
        const amp = 255 * o.grain;
        for (let i = 0; i < d.length; i += 4) {
          const n = (rng.next() - 0.5) * amp;
          d[i] = clamp(d[i] + n, 0, 255);
          d[i + 1] = clamp(d[i + 1] + n, 0, 255);
          d[i + 2] = clamp(d[i + 2] + n, 0, 255);
        }
        ctx.putImageData(img, bx, by);
      }

      // Царапины.
      const scratches = Math.max(0, o.scratches | 0);
      for (let s = 0; s < scratches; s++) {
        ctx.strokeStyle = 'rgba(255,255,255,' + rng.float(0.05, 0.18).toFixed(2) + ')';
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        const sx = rng.float(bx, bx + bw);
        const sy = by;
        const ex = sx + rng.float(-12, 12);
        const ey = by + bh;
        ctx.moveTo(sx, sy);
        ctx.lineTo(ex, ey);
        ctx.stroke();
      }

      ctx.restore();

      // Внутренняя тонкая рамка.
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);

      // Подпись.
      if (o.caption) {
        ctx.fillStyle = 'rgba(40,32,20,0.85)';
        ctx.font = '12px Georgia, serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(o.caption), x + w / 2, y + h - 12);
      }

      return { x, y, w, h };
    };

    return { drawPhoto };
  })();

  /* ==========================================================================
     МОДУЛЬ 7. WeatherEffects
     Дождь в мировых координатах, туман, конденсат на стекле, вспышки.
     ========================================================================== */

  const WeatherEffects = (() => {
    const create = (opts) => {
      const o = Object.assign({
        seed: 'weather',
        rainCount: 320,
        rainSpeed: 14,
        rainAngle: 0.14,       // радианы, наклон
        rainLength: 22,
        rainAlpha: 0.45,
        fogBands: 4,
        fogAlpha: 0.22,
        condensation: true,
        lightning: false,
        bounds: { x: 0, y: 0, w: 1920, h: 1080 }
      }, opts || {});

      const rng = Rand.fromSeed(o.seed);
      const drops = [];
      let time = 0;
      let lightningFlash = 0;
      let nextLightningAt = o.lightning ? rng.float(3, 8) : Infinity;

      const resetDrop = (d, initial) => {
        d.x = o.bounds.x + rng.float(-100, o.bounds.w + 100);
        d.y = initial ? o.bounds.y + rng.float(0, o.bounds.h) : o.bounds.y - rng.float(10, 120);
        d.v = o.rainSpeed * rng.float(0.75, 1.25);
        d.len = o.rainLength * rng.float(0.7, 1.4);
        d.alpha = o.rainAlpha * rng.float(0.5, 1.0);
      };

      for (let i = 0; i < o.rainCount; i++) {
        const d = {};
        resetDrop(d, true);
        drops.push(d);
      }

      const tick = (dtMs) => {
        const k = dtMs / 16.6667;
        time += dtMs / 1000;

        for (let i = 0; i < drops.length; i++) {
          const d = drops[i];
          d.y += d.v * k;
          d.x += Math.sin(o.rainAngle) * d.v * k;
          if (d.y - d.len > o.bounds.y + o.bounds.h) resetDrop(d, false);
        }

        if (o.lightning) {
          if (time >= nextLightningAt) {
            lightningFlash = rng.float(0.25, 0.7);
            nextLightningAt = time + rng.float(4, 12);
          }
          if (lightningFlash > 0) lightningFlash = Math.max(0, lightningFlash - dtMs / 240);
        }
      };

      const draw = (ctx, cam, viewW, viewH) => {
        // Дождь — в мировых координатах.
        ctx.save();
        cam.apply(ctx);
        ctx.lineWidth = 1;
        for (let i = 0; i < drops.length; i++) {
          const d = drops[i];
          ctx.strokeStyle = 'rgba(170,200,225,' + d.alpha.toFixed(3) + ')';
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x + Math.sin(o.rainAngle) * d.len, d.y + d.len);
          ctx.stroke();
        }
        ctx.restore();

        // Туман — в экранных координатах поверх.
        if (o.fogBands > 0) {
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          for (let b = 0; b < o.fogBands; b++) {
            const yBase = (viewH * (b + 1)) / (o.fogBands + 1);
            const drift = Math.sin(time * 0.35 + b * 1.3) * 22;
            const grad = ctx.createLinearGradient(0, yBase - 30, 0, yBase + 40);
            grad.addColorStop(0, 'rgba(140,160,180,0)');
            grad.addColorStop(0.5, 'rgba(140,160,180,' + (o.fogAlpha * (0.8 + 0.3 * Math.sin(time * 0.4 + b))).toFixed(3) + ')');
            grad.addColorStop(1, 'rgba(140,160,180,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(drift - 30, yBase - 30, viewW + 60, 70);
          }
          ctx.restore();
        }

        // Вспышка молнии.
        if (lightningFlash > 0) {
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.fillStyle = 'rgba(220,235,255,' + (lightningFlash * 0.55).toFixed(3) + ')';
          ctx.fillRect(0, 0, viewW, viewH);
          ctx.restore();
        }
      };

      const reseed = (seed) => {
        const nr = Rand.fromSeed(seed);
        for (let i = 0; i < drops.length; i++) {
          const d = drops[i];
          d.x = o.bounds.x + nr.float(-100, o.bounds.w + 100);
          d.y = o.bounds.y + nr.float(0, o.bounds.h);
        }
      };

      const setBounds = (b) => { Object.assign(o.bounds, b); };

      return { tick, draw, reseed, setBounds, count: () => drops.length };
    };
    return { create };
  })();

  /* ==========================================================================
     МОДУЛЬ 8. Reflections — мокрый асфальт и отражения огней.
     ========================================================================== */

  const Reflections = (() => {
    const drawWetAsphalt = (ctx, rect, opts) => {
      const o = Object.assign({
        baseColor: '#141b26',
        wetness: 0.55,
        seed: 'asphalt',
        lights: []     // [{ x, y, radius, color }] в мировых координатах
      }, opts || {});

      const { x, y, w, h } = rect;
      const rng = Rand.fromSeed(o.seed);

      // Базовая заливка.
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();

      ctx.fillStyle = o.baseColor;
      ctx.fillRect(x, y, w, h);

      // Пятна мокрого блеска.
      const patches = Math.floor((w * h) / 26000);
      for (let i = 0; i < patches; i++) {
        const px = x + rng.float(0, w);
        const py = y + rng.float(0, h);
        const pw = rng.float(20, 120);
        const ph = rng.float(3, 12);
        const grad = ctx.createLinearGradient(px, py, px, py + ph);
        grad.addColorStop(0, 'rgba(200,220,240,' + (o.wetness * 0.12).toFixed(3) + ')');
        grad.addColorStop(1, 'rgba(200,220,240,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(px, py, pw, ph, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Отражения огней — вертикальные полосы вниз.
      for (let i = 0; i < o.lights.length; i++) {
        const L = o.lights[i];
        const grad = ctx.createLinearGradient(L.x, L.y, L.x, L.y + L.radius * 3);
        const c = ColorUtil.parse(L.color || 'rgba(240,200,140,0.55)');
        grad.addColorStop(0, 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + (c.a * 0.7).toFixed(3) + ')');
        grad.addColorStop(0.4, 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + (c.a * 0.28).toFixed(3) + ')');
        grad.addColorStop(1, 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',0)');
        ctx.fillStyle = grad;
        ctx.fillRect(L.x - L.radius * 0.35, L.y, L.radius * 0.7, L.radius * 3);
      }

      ctx.restore();
    };

    const drawReflection = (ctx, opts) => {
      const o = Object.assign({
        rect: { x: 0, y: 0, w: 200, h: 80 },
        source: null,       // функция, рисующая исходный объект
        flip: true,
        alpha: 0.35,
        blur: 6
      }, opts || {});

      const r = o.rect;
      ctx.save();
      // Отражение — зеркальная копия снизу.
      ctx.beginPath();
      ctx.rect(r.x, r.y, r.w, r.h);
      ctx.clip();
      ctx.globalAlpha = o.alpha;
      ctx.translate(r.x, r.y + r.h);
      if (o.flip) ctx.scale(1, -1);
      ctx.translate(-r.x, -r.y);
      if (typeof o.source === 'function') {
        try { o.source(ctx, r); } catch (e) { Logger.error('reflection', 'source failed', e); }
      }
      ctx.restore();
    };

    return { drawWetAsphalt, drawReflection };
  })();

  /* ==========================================================================
     МОДУЛЬ 9. CitySkyline — многослойный силуэт города с параллаксом.
     ========================================================================== */

  const CitySkyline = (() => {
    const drawLayer = (ctx, opts) => {
      const o = Object.assign({
        x: 0, y: 0, w: 1920, h: 300,
        seed: 'skyline',
        buildingCount: 40,
        minHeight: 60,
        maxHeight: 260,
        width: 40,
        color: '#0e1620',
        windows: false,
        windowColor: 'rgba(220,190,120,0.75)',
        litChance: 0.35
      }, opts || {});

      const rng = Rand.fromSeed(o.seed);
      const baseline = o.y + o.h;
      const step = o.w / o.buildingCount;

      ctx.save();
      ctx.fillStyle = o.color;
      ctx.beginPath();
      ctx.moveTo(o.x, baseline);

      const tops = [];
      let cursorX = o.x;
      for (let i = 0; i < o.buildingCount; i++) {
        const bw = step * rng.float(0.55, 1.35);
        const bh = rng.float(o.minHeight, o.maxHeight);
        const topY = baseline - bh;
        ctx.lineTo(cursorX, topY);
        ctx.lineTo(cursorX + bw, topY);
        tops.push({ x: cursorX, y: topY, w: bw, h: bh });
        cursorX += bw;
        if (cursorX >= o.x + o.w) break;
      }
      ctx.lineTo(o.x + o.w, baseline);
      ctx.closePath();
      ctx.fill();

      // Окна.
      if (o.windows) {
        for (let i = 0; i < tops.length; i++) {
          const b = tops[i];
          const cols = Math.max(1, Math.floor(b.w / 9));
          const rows = Math.max(1, Math.floor(b.h / 12));
          const cw = b.w / (cols + 1);
          const chh = b.h / (rows + 1);
          for (let cxi = 1; cxi <= cols; cxi++) {
            for (let ryi = 1; ryi <= rows; ryi++) {
              if (!rng.chance(o.litChance)) continue;
              ctx.fillStyle = rng.chance(0.2)
                ? 'rgba(240,220,180,' + rng.float(0.5, 0.9).toFixed(2) + ')'
                : o.windowColor;
              ctx.fillRect(b.x + cxi * cw - 1.5, b.y + ryi * chh - 1.5, 2.5, 3.5);
            }
          }
        }
      }
      ctx.restore();
      return tops;
    };

    const drawSkyline = (ctx, opts) => {
      const o = Object.assign({
        x: 0, y: 0, w: 1920, h: 720,
        seed: 'city',
        layers: null // [{...}]
      }, opts || {});

      const layers = Array.isArray(o.layers) && o.layers.length ? o.layers : [
        { depth: 0.15, color: '#060a11', buildingCount: 55, minHeight: 80, maxHeight: 260, windows: false },
        { depth: 0.35, color: '#0a121d', buildingCount: 45, minHeight: 100, maxHeight: 300, windows: true, litChance: 0.28 },
        { depth: 0.65, color: '#0f1a28', buildingCount: 30, minHeight: 140, maxHeight: 340, windows: true, litChance: 0.42 }
      ];

      layers.forEach((L, i) => {
        const baseH = 240 + i * 60;
        drawLayer(ctx, Object.assign({
          x: o.x,
          y: o.y + o.h - baseH,
          w: o.w,
          h: baseH,
          seed: o.seed + ':layer' + i
        }, L));
      });
    };

    return { drawLayer, drawSkyline };
  })();

  /* ==========================================================================
     МОДУЛЬ 10. RoomDrawer
     Процедурная комната/кабинет. Рисует пол, заднюю стену, окна, мебель
     (простыми силуэтами). Опции позволяют менять тип и палитру.
     ========================================================================== */

  const RoomDrawer = (() => {
    const drawFloor = (ctx, rect, opts) => {
      const o = Object.assign({
        color: '#0d121a',
        perspective: 0.35,
        gridLines: true,
        lineColor: 'rgba(60,80,110,0.28)',
        seed: 'floor',
        boardRows: 6
      }, opts || {});

      const { x, y, w, h } = rect;
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();

      // Фон пола — градиент от тёмного к менее тёмному.
      const grad = ctx.createLinearGradient(x, y, x, y + h);
      grad.addColorStop(0, ColorUtil.toCss(ColorUtil.shade(o.color, 0.05)));
      grad.addColorStop(1, ColorUtil.toCss(ColorUtil.shade(o.color, -0.25)));
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);

      if (o.gridLines) {
        ctx.strokeStyle = o.lineColor;
        ctx.lineWidth = 1;
        // Горизонтальные линии, сгущающиеся к горизонту.
        for (let i = 1; i <= o.boardRows; i++) {
          const t = i / (o.boardRows + 1);
          const ly = y + h * Math.pow(t, 1.35);
          ctx.beginPath();
          ctx.moveTo(x, ly);
          ctx.lineTo(x + w, ly);
          ctx.stroke();
        }
        // Вертикальные — сходятся в точку схода.
        const vpX = x + w / 2;
        const vpY = y - h * o.perspective;
        const cols = 14;
        for (let i = 0; i <= cols; i++) {
          const t = i / cols;
          const bx = x + w * t;
          ctx.beginPath();
          ctx.moveTo(bx, y + h);
          ctx.lineTo(vpX + (bx - vpX) * 0.15, vpY + (y + h - vpY) * 0.18);
          ctx.stroke();
        }
      }
      ctx.restore();
    };

    const drawBackWall = (ctx, rect, opts) => {
      const o = Object.assign({
        color: '#141a26',
        panelLines: 4,
        panelColor: 'rgba(30,45,65,0.55)',
        windows: [],     // [{ x, y, w, h, tint, lit }]
        seed: 'wall',
        doors: []        // [{ x, y, w, h }]
      }, opts || {});

      const { x, y, w, h } = rect;
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();

      const grad = ctx.createLinearGradient(x, y, x, y + h);
      grad.addColorStop(0, ColorUtil.toCss(ColorUtil.shade(o.color, 0.06)));
      grad.addColorStop(1, ColorUtil.toCss(ColorUtil.shade(o.color, -0.15)));
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);

      // Вертикальные панели.
      if (o.panelLines > 0) {
        ctx.strokeStyle = o.panelColor;
        ctx.lineWidth = 1;
        for (let i = 1; i < o.panelLines; i++) {
          const px = x + (w / o.panelLines) * i;
          ctx.beginPath();
          ctx.moveTo(px, y);
          ctx.lineTo(px, y + h);
          ctx.stroke();
        }
      }

      // Окна: прямоугольник + переплёт + свет.
      for (let i = 0; i < o.windows.length; i++) {
        const win = o.windows[i];
        const wx = x + win.x, wy = y + win.y;
        const ww = win.w, wh = win.h;
        // Отражение/свет.
        const wg = ctx.createLinearGradient(wx, wy, wx, wy + wh);
        if (win.lit) {
          wg.addColorStop(0, 'rgba(190,210,240,0.65)');
          wg.addColorStop(1, 'rgba(120,150,190,0.35)');
        } else {
          wg.addColorStop(0, win.tint || 'rgba(60,80,110,0.55)');
          wg.addColorStop(1, 'rgba(20,30,45,0.65)');
        }
        ctx.fillStyle = wg;
        ctx.fillRect(wx, wy, ww, wh);

        // Переплёт.
        ctx.strokeStyle = 'rgba(20,26,38,0.9)';
        ctx.lineWidth = Math.max(2, wh * 0.03);
        ctx.strokeRect(wx, wy, ww, wh);
        ctx.beginPath();
        ctx.moveTo(wx + ww / 2, wy);
        ctx.lineTo(wx + ww / 2, wy + wh);
        ctx.moveTo(wx, wy + wh / 2);
        ctx.lineTo(wx + ww, wy + wh / 2);
        ctx.stroke();

        // Капли/отражение — мелкие пятна.
        const rng = Rand.fromSeed(o.seed + ':win' + i);
        for (let k = 0; k < 18; k++) {
          const px = wx + rng.float(2, ww - 4);
          const py = wy + rng.float(2, wh - 4);
          ctx.fillStyle = 'rgba(220,235,255,' + rng.float(0.05, 0.15).toFixed(3) + ')';
          ctx.fillRect(px, py, rng.float(1, 3), rng.float(1, 3));
        }
      }

      // Двери — как тёмные прямоугольники с ручкой.
      for (let i = 0; i < o.doors.length; i++) {
        const d = o.doors[i];
        const dx = x + d.x, dy = y + d.y;
        ctx.fillStyle = 'rgba(20,26,38,0.95)';
        ctx.fillRect(dx, dy, d.w, d.h);
        ctx.strokeStyle = 'rgba(80,100,130,0.5)';
        ctx.lineWidth = 1;
        ctx.strokeRect(dx + 0.5, dy + 0.5, d.w - 1, d.h - 1);
        // Ручка.
        ctx.fillStyle = 'rgba(200,190,150,0.65)';
        ctx.beginPath();
        ctx.arc(dx + d.w - 6, dy + d.h * 0.5, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    };

    const drawRoom = (ctx, opts) => {
      const o = Object.assign({
        x: 0, y: 0, w: 1920, h: 1080,
        horizon: 0.42,
        wall: { color: '#141a26', windows: [], doors: [] },
        floor: { color: '#0d121a' },
        seed: 'room'
      }, opts || {});

      const horizonY = o.y + o.h * o.horizon;
      drawBackWall(ctx, { x: o.x, y: o.y, w: o.w, h: horizonY - o.y }, Object.assign({ seed: o.seed + ':wall' }, o.wall));
      drawFloor(ctx, { x: o.x, y: horizonY, w: o.w, h: o.h - (horizonY - o.y) }, Object.assign({ seed: o.seed + ':floor' }, o.floor));
    };

    const drawCabinet = (ctx, opts) => {
      const o = Object.assign({
        x: 0, y: 0, w: 1920, h: 1080,
        seed: 'cab'
      }, opts || {});
      drawRoom(ctx, Object.assign({
        wall: {
          color: '#1a2130',
          windows: [{ x: o.w * 0.55, y: o.h * 0.10, w: o.w * 0.28, h: o.h * 0.20, lit: false }],
          doors: [{ x: o.w * 0.06, y: o.h * 0.30, w: o.w * 0.06, h: o.h * 0.42 }]
        },
        floor: { color: '#10141c' }
      }, o));
    };

    return { drawRoom, drawFloor, drawBackWall, drawCabinet };
  })();

  /* ==========================================================================
     ПУБЛИЧНАЯ РЕГИСТРАЦИЯ

      '[data-mc-profile="tv"] .mc-bottombar{padding:16px 40px calc(16px + var(--mc-safe-b));}',
      '[data-mc-profile="tv"] .mc-bottombar__btn{padding:14px 18px;max-width:220px;}',
      '[data-mc-profile="tv"] .mc-bottombar__icon{font-size:26px;}',
      '[data-mc-profile="tv"] .mc-bottombar__label{font-size:var(--mc-fs-md);letter-spacing:.08em;}',
      '[data-mc-profile="tv"] .mc-bottombar__btn:focus-visible{',
      'border-color:var(--mc-accent);background:var(--mc-bg-2);box-shadow:0 0 0 2px rgba(79,179,201,.35);}',
      '[data-mc-profile="tv"] .mc-shell{padding:var(--mc-s-6);}',

      /* ----- Индикатор ввода для разработки и отладки ----- */
      '[data-mc-input="touch"] .mc-bottombar__btn{min-height:56px;}',
      '[data-mc-input="remote"] .mc-bottombar__btn{min-height:72px;}'
    ].join('');

    const install = () => {
      if (document.getElementById(STYLE_ID)) return;
      const el = document.createElement('style');
      el.id = STYLE_ID;
      el.textContent = CSS;
      document.head.appendChild(el);
    };

    return { install };
  })();

  /* ==========================================================================
     МОДУЛЬ 2. UIProfileManager
     Единый источник активного профиля интерфейса. ВАЖНО: атрибут
     data-mc-profile на <html> уже управляется модулем DesignSystem (часть 2).
     Здесь мы его не дублируем на <html>, а:
       — вычисляем согласованный профиль;
       — ставим data-mc-profile на #mc-app (для локальных селекторов);
       — уведомляем подписчиков о смене.
     ========================================================================== */

  const UIProfileManager = (() => {
    let active = 'desktop';
    let initialized = false;
    const subs = new Set();

    const resolve = () => {
      const manual = SettingsStore.get('profile');
      if (manual && manual !== Constants.PROFILES.AUTO && VALID_PROFILES.includes(manual)) {
        return manual;
      }
      const info = PlatformDetector.current();
      return VALID_PROFILES.includes(info.profile) ? info.profile : 'desktop';
    };

    const notify = () => {
      for (const fn of subs) {
        try { fn(active); } catch (e) { Logger.error('ui-profile', 'subscriber failed', e); }
      }
    };

    const setActive = (next) => {
      if (!VALID_PROFILES.includes(next)) next = 'desktop';
      if (initialized && next === active) return active;
      const prev = active;
      active = next;
      const app = document.getElementById('mc-app');
      if (app) app.setAttribute('data-mc-profile', active);
      if (initialized && prev !== active) {
        EventBus.emit('ui:profile-changed', { from: prev, to: active });
        Logger.info('ui-profile', 'профиль интерфейса: ' + prev + ' → ' + active);
      }
      if (initialized) notify();
      return active;
    };

    const evaluate = () => setActive(resolve());

    // Однократные подписки на уже существующие источники.
    EventBus.on('settings:changed', () => evaluate());
    EventBus.on('settings:loaded',  () => evaluate());
    PlatformDetector.subscribe(() => evaluate());

    const init = () => {
      if (initialized) return active;
      initialized = true;
      active = resolve();
      const app = document.getElementById('mc-app');
      if (app) app.setAttribute('data-mc-profile', active);
      notify();
      EventBus.emit('ui:profile-init', { profile: active });
      Logger.info('ui-profile', 'профиль интерфейса инициализирован: ' + active);
      return active;
    };

    return {
      init,
      refresh: evaluate,
      current: () => active,
      isValid: (p) => VALID_PROFILES.includes(p),
      subscribe(fn) {
        if (typeof fn !== 'function') return () => {};
        subs.add(fn);
        try { fn(active); } catch (e) { Logger.error('ui-profile', 'subscriber failed on attach', e); }
        return () => subs.delete(fn);
      }
    };
  })();

  /* ==========================================================================
     МОДУЛЬ 3. TopBar
     Шапка приложения внутри существующего <header id="mc-topbar">.
     Не трогаем атрибуты (role="banner"), только наполняем содержимое.
     ========================================================================== */

  const TopBar = (() => {
    let host = null;
    let mounted = false;
    let els = { logo: null, title: null, status: null, menu: null };

    const buildStatus = () => {
      const s = document.createElement('div');
      s.className = 'mc-topbar__status';
      s.setAttribute('data-kind', 'idle');
      s.setAttribute('role', 'status');
      s.setAttribute('aria-live', 'polite');
      s.textContent = 'Готово';
      return s;
    };

    const buildMenuButton = () => {
      const btn = UIComponents.iconButton({
        label: 'Меню',
        icon: '≡',
        tooltip: 'Меню (Esc)',
        onClick: () => EventBus.emit('ui:open-menu')
      });
      btn.classList.add('mc-topbar__menu');
      btn.setAttribute('data-mc-id', 'topbar-menu');
      return btn;
    };

    const render = (profile) => {
      if (!host) return;
      host.classList.add('mc-topbar');
      host.classList.remove('mc-topbar--mobile', 'mc-topbar--tablet', 'mc-topbar--tv', 'mc-topbar--desktop');
      host.classList.add('mc-topbar--' + profile);
      host.textContent = '';

      const left = document.createElement('div');
      left.className = 'mc-topbar__left';

      const logo = document.createElement('div');
      logo.className = 'mc-topbar__logo';
      logo.textContent = Constants.APP_NAME;
      logo.setAttribute('aria-label', Constants.APP_NAME + ' — ' + Constants.APP_TAGLINE);
      left.appendChild(logo);

      const center = document.createElement('div');
      center.className = 'mc-topbar__center';
      center.id = 'mc-topbar-title';
      center.setAttribute('aria-live', 'polite');
      center.textContent = Constants.APP_TAGLINE;

      const right = document.createElement('div');
      right.className = 'mc-topbar__right';

      const status = buildStatus();
      right.appendChild(status);
      right.appendChild(buildMenuButton());

      host.appendChild(left);
      host.appendChild(center);
      host.appendChild(right);

      els = { logo, title: center, status, menu: right.lastChild };
    };

    const setTitle = (text) => {
      const value = String(text == null ? '' : text);
      if (els.title) els.title.textContent = value;
      EventBus.emit('ui:title-changed', { text: value });
    };

    const setSaveStatus = (text, kind) => {
      if (!els.status) return;
      els.status.textContent = String(text == null ? '' : text);
      els.status.setAttribute('data-kind', String(kind || 'idle'));
    };

    const mount = () => {
      if (mounted) return;
      host = document.getElementById('mc-topbar');
      if (!host) { Logger.warn('topbar', '#mc-topbar не найден'); return; }
      mounted = true;
      UIProfileManager.subscribe(render);

      EventBus.on('ui:set-title', (p) => setTitle(p && p.text));
      EventBus.on('ui:set-save-status', (p) => setSaveStatus(p && p.text, p && p.kind));
    };

    return {
      mount,
      setTitle: (t) => setTitle(t),
      setSaveStatus: (t, k) => setSaveStatus(t, k),
      isMounted: () => mounted
    };
  })();

  /* ==========================================================================
     МОДУЛЬ 4. BottomBar
     Нижняя панель внутри существующего <footer id="mc-bottombar">.
     На каждом профиле — своя компоновка (см. CSS выше).
     ========================================================================== */

  const BottomBar = (() => {
    let host = null;
    let mounted = false;
    let buttons = [];

    const items = Object.freeze([
      { id: 'menu',     label: 'Меню',     icon: '☰',  event: 'ui:open-menu',     hint: 'Открыть меню' },
      { id: 'journal',  label: 'Журнал',   icon: '✎',  event: 'ui:open-journal',  hint: 'Журнал расследования' },
      { id: 'board',    label: 'Доска',    icon: '❖',  event: 'ui:open-board',    hint: 'Доска связей' },
      { id: 'settings', label: 'Настройки', icon: '⚙',  event: 'ui:open-settings', hint: 'Настройки' }
    ]);

    const buildButton = (item, profile) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mc-bottombar__btn';
      btn.setAttribute('data-mc-id', 'bottombar-' + item.id);
      btn.setAttribute('aria-label', item.label);
      btn.setAttribute('data-mc-tooltip', item.hint);

      const ic = document.createElement('span');
      ic.className = 'mc-bottombar__icon';
      ic.setAttribute('aria-hidden', 'true');
      ic.textContent = item.icon;

      const lb = document.createElement('span');
      lb.className = 'mc-bottombar__label';
      lb.textContent = item.label;

      btn.appendChild(ic);
      btn.appendChild(lb);

      btn.addEventListener('click', () => {
        EventBus.emit(item.event);
        if (MC.A11y) A11y.announce(item.hint);
      });
      return btn;
    };

    const render = (profile) => {
      if (!host) return;
      host.classList.add('mc-bottombar');
      host.classList.remove('mc-bottombar--mobile', 'mc-bottombar--tablet', 'mc-bottombar--tv', 'mc-bottombar--desktop');
      host.classList.add('mc-bottombar--' + profile);
      host.textContent = '';

      const row = document.createElement('div');
      row.className = 'mc-bottombar__row';
      row.setAttribute('role', 'toolbar');
      row.setAttribute('aria-label', 'Основные действия');

      buttons = items.map((it) => {
        const b = buildButton(it, profile);
        row.appendChild(b);
        return b;
      });
      host.appendChild(row);
    };

    const mount = () => {
      if (mounted) return;
      host = document.getElementById('mc-bottombar');
      if (!host) { Logger.warn('bottombar', '#mc-bottombar не найден'); return; }
      mounted = true;
      UIProfileManager.subscribe(render);
    };

    return { mount, isMounted: () => mounted, buttons: () => buttons.slice() };
  })();

  /* ==========================================================================
     МОДУЛЬ 5. MainShell
     Управление содержимым <main id="mc-main">. Даёт простую систему слотов,
     чтобы части 6+ могли регистрировать собственные экраны (меню, глава,
     допрос, доска улик, документ) без создания второго движка.
     ========================================================================== */

  const MainShell = (() => {
    let host = null;
    let mounted = false;
    const slots = new Map();       // id → { node, title }
    let activeSlotId = null;
    let emptyNode = null;

    const buildEmpty = () => {
      if (emptyNode && emptyNode.parentNode) return emptyNode;
      const wrap = document.createElement('div');
      wrap.className = 'mc-shell-empty';

      const title = document.createElement('div');
      title.className = 'mc-shell-empty__title';
      title.textContent = Constants.APP_NAME;

      const sub = document.createElement('div');
      sub.className = 'mc-shell-empty__sub';
      sub.textContent = Constants.APP_TAGLINE;

      const hint = document.createElement('div');
      hint.className = 'mc-shell-empty__hint';
      hint.textContent = 'Разделы игры будут подключены в следующих частях разработки.';

      wrap.appendChild(title);
      wrap.appendChild(sub);
      wrap.appendChild(hint);
      emptyNode = wrap;
      return wrap;
    };

    const renderEmpty = () => {
      if (!host) return;
      host.textContent = '';
      host.appendChild(buildEmpty());
      activeSlotId = null;
    };

    const renderProfile = (profile) => {
      if (!host) return;
      host.classList.add('mc-shell');
      host.classList.remove('mc-shell--mobile', 'mc-shell--tablet', 'mc-shell--tv', 'mc-shell--desktop');
      host.classList.add('mc-shell--' + profile);
    };

    const register = (id, node, opts) => {
      if (!id || typeof id !== 'string') return false;
      if (!(node instanceof Node)) return false;
      const o = opts || {};
      if (slots.has(id)) {
        Logger.warn('shell', 'слот уже существует, перезаписан: ' + id);
      }
      slots.set(id, { node, title: o.title || '' });
      EventBus.emit('ui:slot-registered', { id });
      return true;
    };

    const unregister = (id) => {
      const had = slots.delete(id);
      if (had && activeSlotId === id) renderEmpty();
      return had;
    };

    const show = (id) => {
      if (!host) return false;
      if (id == null) { renderEmpty(); EventBus.emit('ui:slot-shown', { id: null }); return true; }
      if (!slots.has(id)) {
        Logger.warn('shell', 'слот не найден: ' + id);
        return false;
      }
      const entry = slots.get(id);
      // Отсоединяем предыдущий, если он есть, без его разрушения.
      host.textContent = '';
      host.appendChild(entry.node);
      activeSlotId = id;
      if (entry.title) TopBar.setTitle(entry.title);
      EventBus.emit('ui:slot-shown', { id });
      A11y.announce('Открыт раздел: ' + (entry.title || id));
      return true;
    };

    const mount = () => {
      if (mounted) return;
      host = document.getElementById('mc-main');
      if (!host) { Logger.warn('shell', '#mc-main не найден'); return; }
      mounted = true;
      UIProfileManager.subscribe(renderProfile);
      renderEmpty();
    };

    return {
      mount,
      register,
      unregister,
      show,
      showEmpty: () => show(null),
      active: () => activeSlotId,
      has: (id) => slots.has(id),
      list: () => Array.from(slots.keys()),
      isMounted: () => mounted
    };
  })();

  /* ==========================================================================
     МОДУЛЬ 6. OrientationAdapter
     Рекомендует ориентацию по профилю. Не блокирует игру, но показывает
     мягкий баннер, если ориентация неудобна (например, планшет в портрете).
     Телефон НЕ ограничиваем: на нём портрет — норма.
     ========================================================================== */

  const OrientationAdapter = (() => {
    let banner = null;
    let lastKey = '';
    let subscribed = false;

    const expected = (profile) => {
      switch (profile) {
        case 'tablet': return 'landscape';
        case 'tv':     return 'landscape';
        case 'desktop':return 'landscape';
        case 'mobile': return 'any';
        default:       return 'landscape';
      }
    };

    const ensureBanner = () => {
      if (banner && document.body.contains(banner)) return banner;
      banner = document.createElement('div');
      banner.className = 'mc-orient-banner';
      banner.setAttribute('role', 'status');
      banner.setAttribute('aria-live', 'polite');
      banner.textContent = 'Для удобства поверните устройство горизонтально.';
      banner.hidden = true;
      document.body.appendChild(banner);
      return banner;
    };

    const evaluate = () => {
      const profile = UIProfileManager.current();
      const info = PlatformDetector.current();
      const want = expected(profile);
      const key = profile + '|' + info.orientation + '|' + want;
      if (key === lastKey) return;
      lastKey = key;

      const showBanner = want !== 'any' && info.orientation !== want && profile !== 'desktop';
      const b = ensureBanner();
      b.hidden = !showBanner;

      EventBus.emit('ui:orientation', {
        orientation: info.orientation,
        recommended: want,
        profile,
        showBanner
      });
    };

    const init = () => {
      if (subscribed) return;
      subscribed = true;
      ensureBanner();
      UIProfileManager.subscribe(() => evaluate());
      PlatformDetector.subscribe(() => evaluate());
      evaluate();
    };

    return { init, evaluate };
  })();

  /* ==========================================================================
     МОДУЛЬ 7. SafeAreaGuard
     Работает с уже объявленными токенами --mc-safe-* (см. часть 1).
     Даёт числовые инсеты для canvas-сцены и помечает <html> атрибутом,
     чтобы CSS мог реагировать на устройства с вырезом.
     ========================================================================== */

  const SafeAreaGuard = (() => {
    const readPx = (name) => {
      try {
        const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        if (!v) return 0;
        const n = parseFloat(v);
        return isFinite(n) ? n : 0;
      } catch (_) { return 0; }
    };

    const getInsets = () => ({
      top: readPx('--mc-safe-t'),
      right: readPx('--mc-safe-r'),
      bottom: readPx('--mc-safe-b'),
      left: readPx('--mc-safe-l')
    });

    const hasAnyInset = () => {
      const i = getInsets();
      return i.top > 0 || i.right > 0 || i.bottom > 0 || i.left > 0;
    };

    const apply = () => {
      const present = hasAnyInset();
      const root = document.documentElement;
      root.setAttribute('data-mc-safe-area', present ? 'present' : 'none');
      // Пробрасываем на #mc-app, чтобы канвас и слои могли это учитывать.
      const app = document.getElementById('mc-app');
      if (app) app.setAttribute('data-mc-safe-area', present ? 'present' : 'none');
      EventBus.emit('ui:safe-area', getInsets());
    };

    const init = () => {
      apply();
      // Значения env() меняются при повороте — повторно применяем.
      global.addEventListener('orientationchange', () => setTimeout(apply, 60), { passive: true });
      global.addEventListener('resize', () => setTimeout(apply, 60), { passive: true });
    };

    return { init, apply, getInsets, hasAnyInset };
  })();

  /* ==========================================================================
     МОДУЛЬ 8. InputProfile
     Единая политика ввода по активному профилю. Части 6+ могут подписываться
     на 'input:profile' и учитывать primary-канал (touch | pointer | remote).
     ========================================================================== */

  const InputProfile = (() => {
    let policy = null;

    const forProfile = (profile) => {
      switch (profile) {
        case 'mobile':
          return { primary: 'touch',   pointer: true,  touch: true,  keyboard: false, gamepad: false, remote: false };
        case 'tablet':
          return { primary: 'touch',   pointer: true,  touch: true,  keyboard: false, gamepad: true,  remote: false };
        case 'tv':
          return { primary: 'remote',  pointer: false, touch: false, keyboard: false, gamepad: true,  remote: true  };
        case 'desktop':
        default:
          return { primary: 'pointer', pointer: true,  touch: false, keyboard: true,  gamepad: true,  remote: false };
      }
    };

    const apply = (profile) => {
      policy = forProfile(profile);
      document.documentElement.setAttribute('data-mc-input', policy.primary);
      EventBus.emit('input:profile', { profile, policy });
    };

    const init = () => {
      UIProfileManager.subscribe((p) => apply(p));
    };

    return { init, current: () => (policy ? clone(policy) : null), forProfile };
  })();

  /* ==========================================================================
     ИНИЦИАЛИЗАЦИЯ ЧАСТИ 5
     Порядок важен: сначала стили, потом профиль, потом компоненты.
     ========================================================================== */

  Part5Styles.install();
  UIProfileManager.init();

  TopBar.mount();
  BottomBar.mount();
  MainShell.mount();

  OrientationAdapter.init();
  SafeAreaGuard.init();
  InputProfile.init();

  // Базовая синхронизация шапки с уже существующим состоянием игры.
  TopBar.setTitle(Constants.APP_TAGLINE);
  TopBar.setSaveStatus('Готово', 'idle');

  // Реакция на смену профиля — обновим заголовок в шапке, если активен слот.
  EventBus.on('ui:profile-changed', () => {
    const slotId = MainShell.active();
    if (slotId && MainShell.has(slotId)) {
      // Пере-установим заголовок активного слота (мог быть пересоздан при render).
      // Не критично, если слот без заголовка.
      EventBus.emit('ui:slot-shown', { id: slotId, reason: 'profile-change' });
    }
  });

  // Публикуем модули в общий namespace без создания новых глобальных имён.
  Object.assign(MC, {
    UIProfileManager,
    TopBar,
    BottomBar,
    MainShell,
    OrientationAdapter,
    SafeAreaGuard,
    InputProfile
  });

  Logger.info('app', 'Часть 5 инициализирована: UIProfileManager, TopBar, BottomBar, MainShell, OrientationAdapter, SafeAreaGuard, InputProfile');
  EventBus.emit('part5:ready', { at: Date.now(), profile: UIProfileManager.current() });

})(typeof window !== 'undefined' ? window : this);

/* ============================================================================
   КОНЕЦ ЧАСТИ 5.
   Тег <script> остаётся ОТКРЫТЫМ.
   Следующая часть (Часть 6) добавит интерактивный рабочий стол следователя:
   стартовое меню, экран выбора сохранения и базовые экраны навигации.
   Закрытие <\/script><\/body><\/html> произойдёт в Части 20.
   ========================================================================== */
<script>
'use strict';
/* ============================================================================
   MIND CASE — Часть 6. Интерактивный рабочий стол следователя.
   Продолжение того же встроенного модуля. Никаких внешних загрузок.
   Модули:
     - Part6Styles     (внедряет CSS частей 6 в существующий head)
     - SaveSystem      (сохранение/загрузка/удаление слотов поверх
                        StorageAdapter + GameState, без второго состояния)
     - ScreenRouter    (тонкий роутер экранов поверх MainShell из части 5)
     - MenuScreen      (главное меню)
     - SaveSlotsScreen (выбор слота — «Новая игра» / «Загрузить»)
     - AboutScreen     (об игре, версия, автономность)
     - GameStubScreen  (заглушка экрана главы до появления сюжета в след. частях)
     - MenuWiring      (связка существующих событий BottomBar с роутером)
   Все модули продолжают namespace window.MindCaseApp и НЕ создают новых
   глобальных переменных, НЕ открывают новый <script>, НЕ переопределяют
   токены/классы/идентификаторы из частей 1–5.
   ========================================================================== */
(function (global) {
  'use strict';

  const MC = global.MindCaseApp;
  if (!MC) {
    try { console.error('[MC][Part6] MindCaseApp не найден. Части 1–5 должны быть загружены раньше.'); }
    catch (_) {}
    return;
  }
  if (MC.__part6Initialized) {
    try { console.warn('[MC][Part6] Часть 6 уже инициализирована, повторный запуск пропущен.'); }
    catch (_) {}
    return;
  }
  Object.defineProperty(MC, '__part6Initialized', {
    value: true, enumerable: false, writable: false, configurable: false
  });

  const { Logger, EventBus, Constants, GameState, StorageAdapter,
          UIComponents, ModalManager, A11y, MainShell, TopBar, UIProfileManager } = MC;
  const { isPlainObject } = MC.util;

  let saveStatusTimer = 0;

  /* ==========================================================================
     МОДУЛЬ 1. Part6Styles — стили экранов части 6.
     Добавляются один раз в существующий <head>, используют токены --mc-*.
     ========================================================================== */

  const Part6Styles = (() => {
    const ID = 'mc-part6-styles';

    const CSS = [
