<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GASPARD — конструктор бота</title>
<style>
  :root{
    --bg:#0e1621; --panel:#17212b; --bubble-in:#182533; --bubble-out:#2b5278;
    --accent:#5288c1; --accent-hover:#4a7ab0; --text:#e7eef5; --muted:#7d8e9e;
    --danger:#e0534a; --border:#253340;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
  .screen{position:fixed;inset:0;display:none;flex-direction:column}
  .screen.active{display:flex}

  /* --- Экран 1: ввод токена --- */
  #screenToken{justify-content:center;align-items:center;padding:24px}
  .logo{font-size:44px;font-weight:700;letter-spacing:6px;margin-bottom:8px}
  .sub{color:var(--muted);margin-bottom:32px;font-size:14px;text-align:center}
  .card{width:100%;max-width:380px;background:var(--panel);border-radius:16px;padding:24px}
  .card h2{margin:0 0 6px;font-size:18px}
  .card p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.5}
  input,textarea,select{width:100%;background:#0e1621;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:14px;font-family:inherit;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:70px}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
  .btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:20px;transition:.15s}
  .btn:hover{background:var(--accent-hover)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px;text-align:center}

  /* --- Экран 2: редактор --- */
  .header{background:var(--panel);padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0}
  .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#5288c1,#2b5278);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
  .header-info{flex:1;min-width:0}
  .header-info .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .header-info .status{font-size:12px;color:var(--muted)}
  .header-info .status.on{color:#57b85a}

  .chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .chat::-webkit-scrollbar{width:6px}
  .chat::-webkit-scrollbar-thumb{background:#253340;border-radius:3px}
  .empty{color:var(--muted);text-align:center;font-size:14px;margin:auto;max-width:260px;line-height:1.6}

  .msg{align-self:flex-start;max-width:88%;background:var(--bubble-in);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:14px;line-height:1.4;position:relative;animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg .tag{display:inline-block;background:#2b5278;color:#a9c8e8;font-size:11px;padding:2px 8px;border-radius:6px;margin-bottom:6px;font-family:monospace}
  .msg .text{white-space:pre-wrap;word-break:break-word}
  .msg .kb{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .msg .kb .kbtn{background:#233a52;color:#8ab4f8;font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid #2f4a66}

  .msg-actions{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed #253340}
  .msg-actions button{background:transparent;border:1px solid #2f4a66;color:#8ab4f8;font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer;transition:.15s}
  .msg-actions button:hover{background:#233a52}
  .msg-actions button.del{border-color:#5a2a2a;color:#e0534a}
  .msg-actions button.del:hover{background:#3a1f1f}

  /* --- Нижняя панель --- */
  .bottombar{background:var(--panel);border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;flex-shrink:0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .bottombar button{flex:1;padding:12px;border:none;border-radius:10px;background:#233a52;color:#a9c8e8;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  .bottombar button:hover{background:#2b5278;color:#fff}
  .bottombar button.primary{background:var(--accent);color:#fff}
  .bottombar button.primary:hover{background:var(--accent-hover)}
  .bottombar button.on{background:#57b85a;color:#fff}

  /* --- Bottom sheet --- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.2s;z-index:50}
  .overlay.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:18px 18px 0 0;padding:20px;transform:translateY(100%);transition:.25s cubic-bezier(.2,.8,.2,1);z-index:51;max-height:85vh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .sheet.show{transform:none}
  .sheet h3{margin:0 0 16px;font-size:17px}
  .sheet-actions{display:flex;gap:10px;margin-top:20px}
  .sheet-actions .btn{margin-top:0}
  .btn.secondary{background:#233a52;color:#a9c8e8}
  .btn.secondary:hover{background:#2b5278;color:#fff}
  .btn.danger{background:var(--danger)}
  .btn.danger:hover{background:#c94b42}

  .btn-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;background:#0e1621;border:1px solid var(--border);border-radius:10px;padding:8px}
  .btn-row input{flex:1;border:none;background:transparent;padding:6px 4px;font-size:13px}
  .btn-row input:focus{border:none}
  .btn-row .rm{background:transparent;border:none;color:var(--danger);font-size:18px;cursor:pointer;padding:0 6px;line-height:1}
  .add-btn{background:transparent;border:1px dashed #2f4a66;color:#8ab4f8;padding:10px;border-radius:10px;width:100%;font-size:13px;cursor:pointer;margin-top:4px}
  .add-btn:hover{background:#1a2836}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#233a52;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:100;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<!-- ЭКРАН 1 -->
<div id="screenToken" class="screen active">
  <div class="logo">GASPARD</div>
  <div class="sub">Конструктор Telegram-бота</div>
  <div class="card">
    <h2>Введите токен бота</h2>
    <p>Получите его у <b>@BotFather</b> в Telegram → <code>/newbot</code> или <code>/mybots</code> → API Token.</p>
    <label>Токен</label>
    <input id="tokenInput" type="text" placeholder="1234567890:AA..." autocomplete="off" spellcheck="false">
    <label>Ссылка на мини-приложение</label>
    <input id="urlInput" type="text" value="https://morofhamoi-debug.github.io/GASPARD-/">
    <button class="btn" id="confirmBtn">Подтвердить</button>
    <div class="err" id="tokenErr"></div>
  </div>
</div>

<!-- ЭКРАН 2 -->
<div id="screenEditor" class="screen">
  <div class="header">
    <div class="avatar" id="botAvatar">G</div>
    <div class="header-info">
      <div class="name" id="botName">@bot</div>
      <div class="status" id="botStatus">Остановлен</div>
    </div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="bottombar">
    <button id="addMsgBtn">+ Сообщение</button>
    <button id="startBtn" class="primary">▶ Запустить</button>
  </div>
</div>

<!-- OVERLAY + SHEET -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet"></div>

<div class="toast" id="toast"></div>

<script>
/* ============ STATE ============ */
const state = {
  token: localStorage.getItem('bot_token') || '',
  menuUrl: localStorage.getItem('menu_url') || 'https://morofhamoi-debug.github.io/GASPARD-/',
  botName: '',
  messages: JSON.parse(localStorage.getItem('bot_messages') || '[]'),
  polling: false,
  offset: 0,
  editingId: null
};

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function save(){
  localStorage.setItem('bot_token', state.token);
  localStorage.setItem('menu_url', state.menuUrl);
  localStorage.setItem('bot_messages', JSON.stringify(state.messages));
}

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============ TELEGRAM API ============ */
async function tg(method, body){
  const r = await fetch(`https://api.telegram.org/bot${state.token}/${method}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body || {})
  });
  return r.json();
}

/* ============ ЭКРАН 1 ============ */
$('#tokenInput').value = state.token;
$('#urlInput').value = state.menuUrl;

$('#confirmBtn').onclick = async () => {
  const tok = $('#tokenInput').value.trim();
  const url = $('#urlInput').value.trim();
  const err = $('#tokenErr');
  err.textContent = '';

  if(!tok){ err.textContent = 'Введите токен'; return; }
  if(!/^https:\/\//.test(url)){ err.textContent = 'Ссылка должна начинаться с https://'; return; }

  $('#confirmBtn').disabled = true;
  $('#confirmBtn').textContent = 'Проверяем...';

  state.token = tok;
  state.menuUrl = url;

  const me = await tg('getMe');
  if(!me.ok){
    err.textContent = 'Неверный токен: ' + (me.description || 'ошибка');
    $('#confirmBtn').disabled = false;
    $('#confirmBtn').textContent = 'Подтвердить';
    return;
  }

  state.botName = me.result.username;
  $('#botName').textContent = '@' + me.result.username;
  $('#botAvatar').textContent = (me.result.first_name || 'G')[0].toUpperCase();

  // Синяя кнопка меню
  await tg('setChatMenuButton', {
    menu_button: {
      type: 'web_app',
      text: '🛍️ Каталог',
      web_app: { url: state.menuUrl }
    }
  });

  save();
  $('#screenToken').classList.remove('active');
  $('#screenEditor').classList.add('active');
  render();
};

/* ============ РЕНДЕР ЧАТА ============ */
function render(){
  const chat = $('#chat');
  chat.innerHTML = '';

  if(state.messages.length === 0){
    chat.innerHTML = `<div class="empty">Пока нет сообщений.<br>Нажмите «+ Сообщение», чтобы добавить первое — например, ответ на <code>/start</code>.</div>`;
    return;
  }

  state.messages.forEach(m => {
    const el = document.createElement('div');
    el.className = 'msg';

    const tag = m.triggerType === 'any'
      ? 'любое сообщение'
      : m.triggerType === 'text'
        ? '«' + m.trigger + '»'
        : m.trigger;

    let kbHTML = '';
    if(m.buttons && m.buttons.length){
      kbHTML = '<div class="kb">' + m.buttons.map(b =>
        `<span class="kbtn">${esc(b.text)}${b.type==='url' ? ' 🔗' : ''}</span>`
      ).join('') + '</div>';
    }

    el.innerHTML = `
      <div class="tag">${esc(tag)}</div>
      <div class="text">${esc(m.response)}</div>
      ${kbHTML}
      <div class="msg-actions">
        <button data-act="edit">✏️ Изменить</button>
        <button data-act="btn">➕ Кнопка</button>
        <button data-act="del" class="del">🗑 Удалить</button>
      </div>
    `;

    el.querySelector('[data-act="edit"]').onclick = e => { e.stopPropagation(); openEdit(m.id); };
    el.querySelector('[data-act="btn"]').onclick = e => { e.stopPropagation(); openEdit(m.id, true); };
    el.querySelector('[data-act="del"]').onclick = e => {
      e.stopPropagation();
      if(confirm('Удалить это сообщение?')){
        state.messages = state.messages.filter(x => x.id !== m.id);
        save(); render();
      }
    };

    chat.appendChild(el);
  });

  chat.scrollTop = chat.scrollHeight;
}

function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ============ КНОПКА "+ СООБЩЕНИЕ" ============ */
$('#addMsgBtn').onclick = () => {
  const id = Date.now();
  state.messages.push({
    id,
    triggerType: 'command',
    trigger: '/start',
    response: 'Здравствуйте! Нажмите на кнопку ниже, чтобы открыть каталог товаров в наличии 👇',
    buttons: [
      { text: '🛍️ Открыть каталог', type: 'url', value: state.menuUrl }
    ]
  });
  save();
  render();
  openEdit(id);
};

/* ============ BOTTOM SHEET ============ */
const overlay = $('#overlay');
const sheet = $('#sheet');

function closeSheet(){
  overlay.classList.remove('show');
  sheet.classList.remove('show');
  state.editingId = null;
}
overlay.onclick = closeSheet;

function openEdit(id, focusButtons){
  const m = state.messages.find(x => x.id === id);
  if(!m) return;
  state.editingId = id;

  sheet.innerHTML = `
    <h3>Редактировать сообщение</h3>

    <label>Тип триггера</label>
    <select id="f_type">
      <option value="command" ${m.triggerType==='command'?'selected':''}>Команда (например /start)</option>
      <option value="text" ${m.triggerType==='text'?'selected':''}>Точный текст</option>
      <option value="any" ${m.triggerType==='any'?'selected':''}>Любое сообщение</option>
    </select>

    <div id="triggerWrap" style="display:${m.triggerType==='any'?'none':'block'}">
      <label>Триггер</label>
      <input id="f_trigger" value="${esc(m.trigger)}" placeholder="/start">
    </div>

    <label>Ответ бота</label>
    <textarea id="f_response" placeholder="Введите текст ответа...">${esc(m.response)}</textarea>

    <label>Инлайн-кнопки (необязательно)</label>
    <div id="buttonsList"></div>
    <button class="add-btn" id="addBtn">+ Добавить кнопку</button>

    <div class="sheet-actions">
      <button class="btn secondary" id="cancelBtn">Отмена</button>
      <button class="btn" id="saveBtn">Сохранить</button>
    </div>
  `;

  // Триггер видимость
  $('#f_type').onchange = e => {
    $('#triggerWrap').style.display = e.target.value === 'any' ? 'none' : 'block';
  };

  // Кнопки
  function renderButtons(){
    const wrap = $('#buttonsList');
    wrap.innerHTML = '';
    m.buttons.forEach((b, i) => {
      const row = document.createElement('div');
      row.className = 'btn-row';
      row.innerHTML = `
        <input data-i="${i}" data-k="text" value="${esc(b.text)}" placeholder="Текст кнопки">
        <select data-i="${i}" data-k="type" style="width:100px;flex:none">
          <option value="url" ${b.type==='url'?'selected':''}>URL</option>
          <option value="callback" ${b.type==='callback'?'selected':''}>Callback</option>
        </select>
        <button class="rm" data-i="${i}">✕</button>
      `;
      row.querySelectorAll('input,select').forEach(inp => {
        inp.oninput = inp.onchange = () => {
          const idx = +inp.dataset.i;
          m.buttons[idx][inp.dataset.k] = inp.value;
        };
      });
      row.querySelector('.rm').onclick = () => {
        m.buttons.splice(i, 1);
        renderButtons();
      };
      wrap.appendChild(row);

      // Доп. строка для value
      const vrow = document.createElement('div');
      vrow.className = 'btn-row';
      vrow.style.marginTop = '-4px';
      vrow.innerHTML = `
        <input data-i="${i}" data-k="value" value="${esc(b.value)}" placeholder="${b.type==='url'?'https://...':'callback_data'}">
      `;
      vrow.querySelector('input').oninput = e => {
        m.buttons[+e.target.dataset.i].value = e.target.value;
      };
      wrap.appendChild(vrow);
    });
  }
  renderButtons();

  $('#addBtn').onclick = () => {
    m.buttons.push({ text: 'Кнопка', type: 'url', value: state.menuUrl });
    renderButtons();
  };

  $('#cancelBtn').onclick = closeSheet;

  $('#saveBtn').onclick = () => {
    m.triggerType = $('#f_type').value;
    m.trigger = $('#f_trigger').value.trim() || '/start';
    m.response = $('#f_response').value.trim() || '...';
    save();
    render();
    closeSheet();
    toast('Сохранено');
  };

  overlay.classList.add('show');
  sheet.classList.add('show');

  if(focusButtons){
    setTimeout(()=>$('#buttonsList').scrollIntoView({behavior:'smooth'}), 300);
  }
}

/* ============ ЗАПУСК БОТА ============ */
$('#startBtn').onclick = () => {
  if(state.polling){
    state.polling = false;
    $('#startBtn').textContent = '▶ Запустить';
    $('#startBtn').classList.remove('on');
    $('#botStatus').textContent = 'Остановлен';
    $('#botStatus').classList.remove('on');
    toast('Бот остановлен');
  } else {
    if(state.messages.length === 0){ toast('Добавьте хотя бы одно сообщение'); return; }
    state.polling = true;
    $('#startBtn').textContent = '⏸ Стоп';
    $('#startBtn').classList.add('on');
    $('#botStatus').textContent = 'Работает (вкладка должна быть открыта)';
    $('#botStatus').classList.add('on');
    toast('Бот запущен');
    pollLoop();
  }
};

async function pollLoop(){
  while(state.polling){
    try {
      const r = await fetch(
        `https://api.telegram.org/bot${state.token}/getUpdates?offset=${state.offset}&timeout=25`
      );
      const data = await r.json();
      if(!data.ok){ await sleep(3000); continue; }
      for(const up of data.result){
        state.offset = up.update_id + 1;
        await handleUpdate(up);
      }
    } catch(e){
      await sleep(2000);
    }
  }
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function handleUpdate(up){
  const msg = up.message || up.edited_message;
  if(!msg || !msg.text) return;
  const text = msg.text.trim();
  const chatId = msg.chat.id;

  // Ищем совпадение
  let match = state.messages.find(m => {
    if(m.triggerType === 'any') return true;
    if(m.triggerType === 'command') return text === m.trigger || text.startsWith(m.trigger + ' ');
    if(m.triggerType === 'text') return text.toLowerCase() === m.trigger.toLowerCase();
    return false;
  });

  // Приоритет: команды и точный текст выше "любое"
  const specific = state.messages.find(m => m.triggerType !== 'any' && (
    (m.triggerType === 'command' && (text === m.trigger || text.startsWith(m.trigger + ' '))) ||
    (m.triggerType === 'text' && text.toLowerCase() === m.trigger.toLowerCase())
  ));
  if(specific) match = specific;

  if(!match) return;

  const body = { chat_id: chatId, text: match.response };

  if(match.buttons && match.buttons.length){
    const kb = match.buttons
      .filter(b => b.text && b.value)
      .map(b => b.type === 'url'
        ? [{ text: b.text, url: b.value }]
        : [{ text: b.text, callback_data: b.value }]
      );
    if(kb.length) body.reply_markup = { inline_keyboard: kb };
  }

  await tg('sendMessage', body);
}

/* ============ ИНИЦИАЛИЗАЦИЯ ============ */
if(state.token){
  tg('getMe').then(me => {
    if(me.ok){
      state.botName = me.result.username;
      $('#botName').textContent = '@' + me.result.username;
      $('#botAvatar').textContent = (me.result.first_name || 'G')[0].toUpperCase();
      $('#screenToken').classList.remove('active');
      $('#screenEditor').classList.add('active');
      render();
    }
  });
}
</script>
</body>
</html>
