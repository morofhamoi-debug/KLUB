<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>EARTH 3D ULTRA</title>
  <style>
    /* ========== БАЗОВЫЕ СТИЛИ ========== */
    :root {
      --bg: #03060c;
      --panel: rgba(8, 16, 30, 0.82);
      --panel-border: rgba(90, 170, 255, 0.18);
      --accent: #4da6ff;
      --accent-dim: #1a5a9a;
      --text: #e8f0fa;
      --text-dim: #8fa8c8;
      --danger: #ff5566;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #app {
      position: relative;
      width: 100%; height: 100dvh;
      overflow: hidden;
    }
    /* ========== 3D-ГЛОБУС ========== */
    #globe-container {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    #globe-container canvas { display: block; }
    /* ========== ЗАГРУЗКА ========== */
    #loader {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #0a1428 0%, #03060c 70%);
      transition: opacity 0.6s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 64px; height: 64px;
      border: 3px solid rgba(77, 166, 255, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader-text {
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }
    #loader-error {
      display: none;
      margin-top: 16px;
      max-width: 80%;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      color: var(--danger);
    }
    /* ========== ПАНЕЛИ ========== */
    .panel {
      position: absolute;
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      z-index: 10;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
    }
    .panel.hidden {
      opacity: 0;
      pointer-events: none;
    }
    /* Верхняя панель поиска */
    #search-bar {
      top: calc(12px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(520px, calc(100% - 160px));
      display: flex;
      align-items: center;
      padding: 0 14px;
      height: 46px;
      gap: 10px;
    }
    #search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      font-family: var(--font);
    }
    #search-input::placeholder { color: var(--text-dim); }
    .search-icon {
      width: 18px; height: 18px;
      fill: none; stroke: var(--text-dim); stroke-width: 2;
      flex-shrink: 0;
    }
    #search-results {
      top: calc(66px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(520px, calc(100% - 160px));
      max-height: 300px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 6px;
      display: none;
    }
    #search-results.active { display: block; }
    .search-result-item {
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
    }
    .search-result-item:hover, .search-result-item:active {
      background: rgba(77, 166, 255, 0.12);
    }
    .search-result-item .result-type {
      font-size: 11px;
      color: var(--text-dim);
      margin-left: 8px;
    }
    /* Левая панель инструментов */
    #toolbar {
      left: calc(12px + var(--safe-left));
      top: 50%;
      transform: translateY(-50%);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tool-btn {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .tool-btn:hover, .tool-btn:active {
      background: rgba(77, 166, 255, 0.12);
      color: var(--accent);
      border-color: var(--panel-border);
    }
    .tool-btn.active {
      background: rgba(77, 166, 255, 0.18);
      color: var(--accent);
      border-color: var(--accent-dim);
    }
    .tool-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    /* Правая информационная панель */
    #info-panel {
      right: calc(12px + var(--safe-right));
      top: calc(70px + var(--safe-top));
      width: min(360px, calc(100% - 140px));
      max-height: calc(100dvh - 140px - var(--safe-top) - var(--safe-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px;
      display: none;
    }
    #info-panel.active { display: block; }
    #info-panel .close-btn {
      position: absolute;
      top: 12px; right: 12px;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      color: var(--text-dim);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #info-panel .close-btn:active { background: rgba(255, 255, 255, 0.15); }
    #info-panel h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
      padding-right: 32px;
    }
    #info-panel .subtitle {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 14px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13px;
    }
    .info-row .label { color: var(--text-dim); }
    .info-row .value { color: var(--text); text-align: right; max-width: 60%; word-break: break-word; }
    .flag-img {
      width: 48px; height: 32px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    /* Нижняя панель управления */
    #bottom-bar {
      bottom: calc(12px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      padding: 6px;
    }
    #bottom-bar .tool-btn { width: 40px; height: 40px; }
    /* Настройки */
    #settings-panel {
      right: calc(12px + var(--safe-right));
      bottom: calc(70px + var(--safe-bottom));
      width: 260px;
      padding: 16px;
      display: none;
    }
    #settings-panel.active { display: block; }
    .setting-group {
      margin-bottom: 14px;
    }
    .setting-group:last-child { margin-bottom: 0; }
    .setting-group label {
      display: block;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .setting-group select, .setting-group input[type="range"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      padding: 8px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .setting-group input[type="range"] { padding: 0; height: 28px; }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 13px;
    }
    .toggle-switch {
      position: relative;
      width: 42px; height: 24px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 18px; height: 18px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle-switch.on { background: var(--accent-dim); }
    .toggle-switch.on::after { transform: translateX(18px); }
    /* Статистика */
    #stats-panel {
      left: calc(12px + var(--safe-left));
      bottom: calc(12px + var(--safe-bottom));
      padding: 12px 16px;
      font-size: 11px;
      color: var(--text-dim);
      display: none;
    }
    #stats-panel.active { display: block; }
    /* Адаптивность */
    @media (max-aspect-ratio: 1/1) {
      #search-bar, #search-results {
        width: calc(100% - 120px);
      }
      #info-panel {
        width: min(320px, calc(100% - 120px));
      }
      #toolbar {
        gap: 4px;
        padding: 6px;
      }
      .tool-btn { width: 40px; height: 40px; }
    }
    @media (max-width: 600px) {
      #search-bar, #search-results { width: calc(100% - 96px); }
      #info-panel { width: calc(100% - 96px); }
      #bottom-bar .tool-btn { width: 36px; height: 36px; }
    }
    /* Скрытие скроллбара */
    ::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</head>
<body>
<div id="app">
  <!-- 3D-глобус -->
  <div id="globe-container"></div>

  <!-- Загрузка -->
  <div id="loader">
    <div class="spinner"></div>
    <div id="loader-text">Загрузка Земли…</div>
    <div id="loader-error"></div>
  </div>

  <!-- Поиск -->
  <div id="search-bar" class="panel">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    <input id="search-input" type="search" placeholder="Поиск стран и городов…" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <div id="search-results" class="panel"></div>

  <!-- Левая панель инструментов -->
  <div id="toolbar" class="panel">
    <button class="tool-btn" id="btn-countries" title="Список стран">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button class="tool-btn" id="btn-cities" title="Города">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 0-8 8c0 5 8 12 8 12s8-7 8-12a8 8 0 0 0-8-8z"/></svg>
    </button>
    <button class="tool-btn" id="btn-random" title="Случайная страна">
      <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
    </button>
    <button class="tool-btn" id="btn-settings" title="Настройки">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button class="tool-btn" id="btn-stats" title="О Земле">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
    </button>
  </div>

  <!-- Правая информационная панель -->
  <div id="info-panel" class="panel">
    <button class="close-btn" id="info-close">×</button>
    <div id="info-content"></div>
  </div>

  <!-- Настройки -->
  <div id="settings-panel" class="panel">
    <div class="setting-group">
      <label>Режим поверхности</label>
      <select id="surface-mode">
        <option value="realistic">Реалистичная</option>
        <option value="political">Политическая</option>
        <option value="physical">Физическая</option>
        <option value="night">Ночные огни</option>
      </select>
    </div>
    <div class="setting-group">
      <label>Качество графики</label>
      <select id="quality-mode">
        <option value="low">Низкое</option>
        <option value="medium" selected>Среднее</option>
        <option value="high">Высокое</option>
      </select>
    </div>
    <div class="setting-group">
      <label>Скорость вращения</label>
      <input type="range" id="rotation-speed" min="0" max="2" step="0.1" value="0.5">
    </div>
    <div class="toggle-row">
      <span>Автоматическое вращение</span>
      <div class="toggle-switch on" id="toggle-rotation" role="switch" aria-checked="true"></div>
    </div>
    <div class="toggle-row">
      <span>Границы стран</span>
      <div class="toggle-switch on" id="toggle-borders" role="switch" aria-checked="true"></div>
    </div>
    <div class="toggle-row">
      <span>Столицы и города</span>
      <div class="toggle-switch on" id="toggle-cities" role="switch" aria-checked="true"></div>
    </div>
    <div class="toggle-row">
      <span>Звёздный фон</span>
      <div class="toggle-switch on" id="toggle-stars" role="switch" aria-checked="true"></div>
    </div>
  </div>

  <!-- Статистика -->
  <div id="stats-panel" class="panel"></div>

  <!-- Нижняя панель -->
  <div id="bottom-bar" class="panel">
    <button class="tool-btn" id="btn-reset" title="Сброс камеры">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <button class="tool-btn active" id="btn-rotate" title="Автоматическое вращение">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>
    </button>
    <button class="tool-btn" id="btn-explore" title="Режим исследования">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2v20M2 12h20"/></svg>
    </button>
  </div>
</div>

<!-- ==================== БИБЛИОТЕКИ ==================== -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<script>
'use strict';

/* ============================================================
   EARTH 3D ULTRA — основной модуль
   ============================================================ */

// ---------- КОНФИГУРАЦИЯ ----------
const CONFIG = {
  textures: {
    day: '//cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg',
    bump: '//cdn.jsdelivr.net/npm/three-globe/example/img/earth-topology.png',
    night: '//cdn.jsdelivr.net/npm/three-globe/example/img/earth-night.jpg',
    clouds: '//cdn.jsdelivr.net/npm/three-globe/example/img/clouds.png',
    stars: '//cdn.jsdelivr.net/npm/three-globe/example/img/night-sky.png',
  },
  data: {
    countriesTopo: 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json',
    countriesApi: 'https://restcountries.com/v3.1/all?fields=name,translations,capital,region,subregion,population,area,languages,currencies,cca2,cca3,flags,borders,latlng,timezones,tld',
    cities: 'https://raw.githubusercontent.com/Kerrick/cities15k.json/master/cities.json',
  },
  defaultRotationSpeed: 0.5,
  maxSearchResults: 12,
};

// ---------- СОСТОЯНИЕ ----------
const State = {
  globe: null,
  countries: [],
  countriesByIso: {},
  countriesGeo: null,
  cities: [],
  cityMarkers: [],
  selectedCountry: null,
  selectedCity: null,
  autoRotate: true,
  rotationSpeed: CONFIG.defaultRotationSpeed,
  showBorders: true,
  showCities: true,
  showStars: true,
  surfaceMode: 'realistic',
  quality: 'medium',
  exploreMode: false,
  searchTimeout: null,
  settings: {},
  statsOpen: false,
  listOpen: false,
};

// ---------- DOM ----------
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

const dom = {
  globeContainer: $('#globe-container'),
  loader: $('#loader'),
  loaderText: $('#loader-text'),
  loaderError: $('#loader-error'),
  searchBar: $('#search-bar'),
  searchInput: $('#search-input'),
  searchResults: $('#search-results'),
  infoPanel: $('#info-panel'),
  infoContent: $('#info-content'),
  infoClose: $('#info-close'),
  settingsPanel: $('#settings-panel'),
  statsPanel: $('#stats-panel'),
  toolbar: $('#toolbar'),
  bottomBar: $('#bottom-bar'),
};

// ---------- УТИЛИТЫ ----------
function safeStorage(key, val) {
  try {
    if (val === undefined) {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) { /* приватный режим Safari */ }
}

function debounce(fn, ms) {
  return function(...args) {
    clearTimeout(State.searchTimeout);
    State.searchTimeout = setTimeout(() => fn.apply(this, args), ms);
  };
}

function escapeHtml(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}

function formatNumber(n) {
  if (n == null || isNaN(n)) return 'Нет данных';
  return Number(n).toLocaleString('ru-RU');
}

async function fetchWithTimeout(url, opts = {}, timeoutMs = 15000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { ...opts, signal: controller.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status} для ${url}`);
    return res;
  } finally {
    clearTimeout(timer);
  }
}

// ---------- ИНИЦИАЛИЗАЦИЯ 3D-СЦЕНЫ ----------
class GlobeEngine {
  constructor(container) {
    this.container = container;
    this.globe = null;
    this.rotationAnim = null;
    this.init();
  }

  init() {
    const el = this.container;
    this.globe = new Globe(el)
      .globeImageUrl(CONFIG.textures.day)
      .bumpImageUrl(CONFIG.textures.bump)
      .backgroundImageUrl(CONFIG.textures.stars)
      .atmosphereColor('#4da6ff')
      .atmosphereAltitude(0.22);

    // Материал: блики океанов
    const mat = this.globe.globeMaterial();
    mat.bumpScale = 8;
    mat.specular = new THREE.Color('grey');
    mat.shininess = 12;

    // Размеры и камера
    this.globe.width(el.clientWidth || window.innerWidth);
    this.globe.height(el.clientHeight || window.innerHeight);
    this.globe.camera().position.set(0, 0, 280);
    this.globe.pointOfView({ lat: 20, lng: 0, altitude: 2.2 }, 0);

    // Сенсорное управление: Globe.gl уже поддерживает OrbitControls с touch.
    // Настроим скорость и инерцию.
    const controls = this.globe.controls();
    if (controls) {
      controls.autoRotate = false; // управляем вручную
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.rotateSpeed = 0.9;
      controls.zoomSpeed = 0.9;
      controls.minDistance = 110;
      controls.maxDistance = 600;
    }

    // Анимация вращения
    this.startRotation();

    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => {
      setTimeout(() => this.resize(), 250);
    });
    this.resize();
  }

  resize() {
    const w = this.container.clientWidth || window.innerWidth;
    const h = this.container.clientHeight || window.innerHeight;
    this.globe.width(w).height(h);
    const cam = this.globe.camera();
    if (cam) {
      cam.aspect = w / h;
      cam.updateProjectionMatrix();
    }
  }

  startRotation() {
    if (this.rotationAnim) cancelAnimationFrame(this.rotationAnim);
    const step = () => {
      if (State.autoRotate && State.rotationSpeed > 0) {
        const pov = this.globe.pointOfView();
        const lng = (pov.lng || 0) + State.rotationSpeed * 0.15;
        this.globe.pointOfView({ ...pov, lng }, 0);
      }
      this.rotationAnim = requestAnimationFrame(step);
    };
    step();
  }

  stopRotation() {
    if (this.rotationAnim) {
      cancelAnimationFrame(this.rotationAnim);
      this.rotationAnim = null;
    }
  }

  flyTo(lat, lng, altitude = 0.6, duration = 1200) {
    State.autoRotate = false;
    this.globe.pointOfView({ lat, lng, altitude }, duration);
    // Через duration снова включим, если нужно
    setTimeout(() => {
      if (State.autoRotate !== false) State.autoRotate = true;
    }, duration + 100);
  }

  setSurface(mode) {
    switch (mode) {
      case 'realistic':
        this.globe.globeImageUrl(CONFIG.textures.day);
        break;
      case 'political':
        // Политический режим: слегка приглушаем текстуру, границы остаются
        this.globe.globeImageUrl(CONFIG.textures.day);
        break;
      case 'physical':
        this.globe.globeImageUrl(CONFIG.textures.day);
        break;
      case 'night':
        this.globe.globeImageUrl(CONFIG.textures.night);
        break;
    }
  }

  setQuality(q) {
    const dpr = q === 'high' ? Math.min(3, window.devicePixelRatio) : q === 'low' ? 1 : Math.min(2, window.devicePixelRatio);
    const renderer = this.globe.renderer();
    if (renderer) renderer.setPixelRatio(dpr);
    this.resize();
  }

  dispose() {
    this.stopRotation();
    if (this.globe) {
      // Globe.gl не предоставляет явного dispose, но мы можем очистить контейнер
      this.container.innerHTML = '';
      this.globe = null;
    }
  }
}

// ---------- ЗАГРУЗКА ДАННЫХ ----------
class DataLoader {
  static async loadAll() {
    const results = { countries: null, geo: null, cities: null };
    try {
      dom.loaderText.textContent = 'Загрузка границ стран…';
      const topoRes = await fetchWithTimeout(CONFIG.data.countriesTopo);
      const topo = await topoRes.json();
      // Преобразуем TopoJSON в GeoJSON
      const countriesGeo = topojson.feature(topo, topo.objects.countries);
      results.geo = countriesGeo;

      dom.loaderText.textContent = 'Загрузка данных о странах…';
      const apiRes = await fetchWithTimeout(CONFIG.data.countriesApi);
      results.countries = await apiRes.json();

      dom.loaderText.textContent = 'Загрузка городов…';
      const citiesRes = await fetchWithTimeout(CONFIG.data.cities);
      results.cities = await citiesRes.json();
    } catch (err) {
      console.error('Ошибка загрузки данных:', err);
      dom.loaderError.style.display = 'block';
      dom.loaderError.textContent =
        'Не удалось загрузить часть данных. Проверьте интернет-соединение и обновите страницу.';
    }
    return results;
  }
}

// ---------- ПОИСК ----------
class SearchEngine {
  static search(query) {
    const q = query.trim().toLowerCase();
    if (q.length < 2) return [];
    const results = [];
    const seen = new Set();

    // Страны
    for (const c of State.countries) {
      const names = [
        c.name?.common,
        c.name?.official,
        c.translations?.rus?.common,
        c.translations?.rus?.official,
      ].filter(Boolean);
      for (const n of names) {
        if (n.toLowerCase().includes(q) && !seen.has('c:' + c.cca2)) {
          seen.add('c:' + c.cca2);
          results.push({
            type: 'country',
            label: c.translations?.rus?.common || c.name?.common || c.cca2,
            sub: c.name?.common !== (c.translations?.rus?.common) ? c.name?.common : '',
            country: c,
          });
          break;
        }
      }
    }

    // Города
    for (const city of State.cities) {
      if (city.name.toLowerCase().includes(q)) {
        const key = 'city:' + city.name + ':' + city.lat + ':' + city.lng;
        if (!seen.has(key)) {
          seen.add(key);
          results.push({
            type: 'city',
            label: city.name,
            sub: city.country,
            city,
          });
        }
      }
      if (results.length > 200) break;
    }

    return results.slice(0, CONFIG.maxSearchResults);
  }
}

// ---------- UI ----------
class UI {
  static showLoaderError(msg) {
    dom.loaderError.style.display = 'block';
    dom.loaderError.textContent = msg;
  }

  static hideLoader() {
    dom.loader.classList.add('hidden');
  }

  static renderSearchResults(results) {
    const el = dom.searchResults;
    if (!results.length) {
      el.innerHTML = '<div class="search-result-item">Ничего не найдено</div>';
      el.classList.add('active');
      return;
    }
    el.innerHTML = results.map((r, i) => `
      <div class="search-result-item" data-idx="${i}">
        ${escapeHtml(r.label)}
        <span class="result-type">${r.type === 'country' ? 'страна' : 'город'}</span>
        ${r.sub ? `<span class="result-type">${escapeHtml(r.sub)}</span>` : ''}
      </div>
    `).join('');
    el.classList.add('active');

    el.querySelectorAll('.search-result-item').forEach((item) => {
      item.addEventListener('click', () => {
        const idx = Number(item.dataset.idx);
        const r = results[idx];
        if (!r) return;
        el.classList.remove('active');
        dom.searchInput.value = '';
        if (r.type === 'country') {
          App.selectCountry(r.country, true);
        } else if (r.type === 'city') {
          App.selectCity(r.city, true);
        }
      });
    });
  }

  static renderInfoCountry(country) {
    const c = country;
    const flag = c.flags?.svg || c.flags?.png || '';
    const capital = c.capital?.[0] || 'Нет данных';
    const languages = c.languages ? Object.values(c.languages).join(', ') : 'Нет данных';
    const currencies = c.currencies
      ? Object.values(c.currencies).map((cur) => `${cur.name} (${cur.symbol || ''})`).join(', ')
      : 'Нет данных';
    const borders = c.borders?.length ? c.borders.join(', ') : 'Нет данных';
    const tld = c.tld?.join(', ') || 'Нет данных';
    const region = c.region || 'Нет данных';
    const subregion = c.subregion || '';

    dom.infoContent.innerHTML = `
      ${flag ? `<img class="flag-img" src="${flag}" alt="Флаг" onerror="this.style.display='none'">` : ''}
      <h2>${escapeHtml(c.translations?.rus?.common || c.name?.common || 'Неизвестно')}</h2>
      <div class="subtitle">${escapeHtml(c.name?.official || '')}</div>
      <div class="info-row"><span class="label">Столица</span><span class="value">${escapeHtml(capital)}</span></div>
      <div class="info-row"><span class="label">Регион</span><span class="value">${escapeHtml(region)}${subregion ? ' / ' + escapeHtml(subregion) : ''}</span></div>
      <div class="info-row"><span class="label">Население</span><span class="value">${formatNumber(c.population)}</span></div>
      <div class="info-row"><span class="label">Площадь</span><span class="value">${formatNumber(c.area)} км²</span></div>
      <div class="info-row"><span class="label">Языки</span><span class="value">${escapeHtml(languages)}</span></div>
      <div class="info-row"><span class="label">Валюта</span><span class="value">${escapeHtml(currencies)}</span></div>
      <div class="info-row"><span class="label">Код</span><span class="value">${escapeHtml(c.cca2 || '')} / ${escapeHtml(c.cca3 || '')}</span></div>
      <div class="info-row"><span class="label">Домен</span><span class="value">${escapeHtml(tld)}</span></div>
      <div class="info-row"><span class="label">Границы</span><span class="value">${escapeHtml(borders)}</span></div>
    `;
    dom.infoPanel.classList.add('active');
  }

  static renderInfoCity(city) {
    const country = State.countriesByIso[city.country] || {};
    dom.infoContent.innerHTML = `
      <h2>${escapeHtml(city.name)}</h2>
      <div class="subtitle">${escapeHtml(country.translations?.rus?.common || country.name?.common || city.country || '')}</div>
      <div class="info-row"><span class="label">Координаты</span><span class="value">${city.lat.toFixed(4)}, ${city.lng.toFixed(4)}</span></div>
      ${country.capital ? `<div class="info-row"><span class="label">Столица страны</span><span class="value">${escapeHtml(country.capital[0] || '')}</span></div>` : ''}
      ${country.population ? `<div class="info-row"><span class="label">Население страны</span><span class="value">${formatNumber(country.population)}</span></div>` : ''}
    `;
    dom.infoPanel.classList.add('active');
  }

  static renderStats() {
    const totalArea = 510072000; // км², справочное значение
    const landArea = 148940000;
    const waterPct = ((totalArea - landArea) / totalArea * 100).toFixed(1);
    const countryCount = State.countries.length;

    dom.statsPanel.innerHTML = `
      <strong>О Земле</strong><br>
      Средний радиус: 6 371 км<br>
      Экваториальный диаметр: 12 742 км<br>
      Площадь поверхности: ${formatNumber(totalArea)} км²<br>
      Вода: ~${waterPct}% поверхности<br>
      Материков: 6 (модель)<br>
      Государств в наборе: ${countryCount}
    `;
    dom.statsPanel.classList.add('active');
  }

  static toggleSettings(force) {
    const isActive = dom.settingsPanel.classList.contains('active');
    if (force === undefined) {
      dom.settingsPanel.classList.toggle('active');
    } else {
      dom.settingsPanel.classList.toggle('active', force);
    }
  }

  static toggleStats() {
    State.statsOpen = !State.statsOpen;
    if (State.statsOpen) {
      UI.renderStats();
    } else {
      dom.statsPanel.classList.remove('active');
    }
  }

  static closeInfo() {
    dom.infoPanel.classList.remove('active');
    State.selectedCountry = null;
    State.selectedCity = null;
    // Убираем выделение
    if (State.globe) {
      State.globe.polygonsData([]);
    }
  }

  static setToggle(el, on) {
    el.classList.toggle('on', on);
    el.setAttribute('aria-checked', String(on));
  }
}

// ---------- ОСНОВНОЙ КЛАСС ПРИЛОЖЕНИЯ ----------
class App {
  static engine = null;

  static async init() {
    // Загрузка настроек
    App.loadSettings();

    // 3D-сцена
    try {
      App.engine = new GlobeEngine(dom.globeContainer);
      State.globe = App.engine.globe;
    } catch (e) {
      console.error('Не удалось создать 3D-сцену:', e);
      UI.showLoaderError('WebGL не поддерживается или произошла ошибка инициализации 3D.');
      return;
    }

    // Данные
    const data = await DataLoader.loadAll();
    if (data.geo) {
      State.countriesGeo = data.geo;
      App.buildCountriesLayer(data.geo);
    }
    if (data.countries) {
      State.countries = data.countries.filter((c) => c.cca2 && c.name?.common);
      State.countries.forEach((c) => { State.countriesByIso[c.cca2] = c; });
    }
    if (data.cities) {
      State.cities = data.cities.filter((c) => c.lat && c.lng && c.name);
      App.buildCitiesLayer();
    }

    // Настройки UI
    App.applySettingsToUI();
    App.bindEvents();

    UI.hideLoader();
    setTimeout(() => UI.renderStats(), 500);
  }

  // ---------- СЛОИ ----------
  static buildCountriesLayer(geo) {
    if (!State.globe) return;
    const polygons = geo.features
      .filter((f) => f.geometry && (f.geometry.type === 'Polygon' || f.geometry.type === 'MultiPolygon'))
      .map((f) => ({
        type: 'Feature',
        properties: f.properties,
        geometry: f.geometry,
      }));

    State.globe
      .polygonsData(polygons)
      .polygonCapColor(() => 'rgba(77,166,255,0.04)')
      .polygonSideColor(() => 'rgba(77,166,255,0.02)')
      .polygonStrokeColor(() => 'rgba(77,166,255,0.35)')
      .polygonAltitude(0.004)
      .onPolygonClick((polygon) => {
        if (!State.exploreMode && !State.selectedCountry) return;
        const iso = polygon.properties?.ISO_A2 || polygon.properties?.iso_a2;
        if (iso && State.countriesByIso[iso]) {
          App.selectCountry(State.countriesByIso[iso], true);
        }
      });
  }

  static buildCitiesLayer() {
    if (!State.globe) return;
    // Показываем только крупные города, чтобы не перегружать
    const majorCities = State.cities
      .filter((c) => c.population && c.population > 500000)
      .slice(0, 800)
      .map((c) => ({
        lat: c.lat,
        lng: c.lng,
        name: c.name,
        country: c.country,
        population: c.population,
      }));

    State.globe
      .pointsData(majorCities)
      .pointLat('lat')
      .pointLng('lng')
      .pointRadius(0.15)
      .pointAltitude(0.01)
      .pointColor(() => '#4da6ff')
      .pointLabel((d) => `<div style="font-size:12px;padding:4px 8px;background:rgba(0,0,0,0.7);border-radius:6px">${d.name}</div>`)
      .onPointClick((point) => {
        App.selectCity(point, true);
      });

    State.cityMarkers = majorCities;
  }

  // ---------- ВЫБОР ----------
  static selectCountry(country, fly = false) {
    State.selectedCountry = country;
    State.selectedCity = null;
    UI.renderInfoCountry(country);

    if (fly && country.latlng) {
      App.engine.flyTo(country.latlng[0], country.latlng[1], 0.8);
    }

    // Визуальное выделение: подсветим границы
    if (State.globe) {
      const iso = country.cca2;
      // Можно выделить через фильтр полигонов
      const features = State.countriesGeo?.features || [];
      const target = features.filter((f) => {
        const code = f.properties?.ISO_A2 || f.properties?.iso_a2;
        return code === iso;
      });
      if (target.length) {
        State.globe.polygonsData(target)
          .polygonCapColor(() => 'rgba(77,166,255,0.18)')
          .polygonStrokeColor(() => '#4da6ff')
          .polygonAltitude(0.008);
      }
    }
  }

  static selectCity(city, fly = false) {
    State.selectedCity = city;
    State.selectedCountry = null;
    UI.renderInfoCity(city);
    if (fly) {
      App.engine.flyTo(city.lat, city.lng, 0.4);
    }
  }

  // ---------- СЛУЧАЙНАЯ СТРАНА ----------
  static randomCountry() {
    if (!State.countries.length) return;
    const idx = Math.floor(Math.random() * State.countries.length);
    const c = State.countries[idx];
    App.selectCountry(c, true);
  }

  // ---------- НАСТРОЙКИ ----------
  static loadSettings() {
    const saved = safeStorage('earth3d_settings');
    if (saved) {
      State.autoRotate = saved.autoRotate !== undefined ? saved.autoRotate : true;
      State.rotationSpeed = saved.rotationSpeed !== undefined ? saved.rotationSpeed : CONFIG.defaultRotationSpeed;
      State.showBorders = saved.showBorders !== undefined ? saved.showBorders : true;
      State.showCities = saved.showCities !== undefined ? saved.showCities : true;
      State.showStars = saved.showStars !== undefined ? saved.showStars : true;
      State.surfaceMode = saved.surfaceMode || 'realistic';
      State.quality = saved.quality || 'medium';
    }
  }

  static saveSettings() {
    safeStorage('earth3d_settings', {
      autoRotate: State.autoRotate,
      rotationSpeed: State.rotationSpeed,
      showBorders: State.showBorders,
      showCities: State.showCities,
      showStars: State.showStars,
      surfaceMode: State.surfaceMode,
      quality: State.quality,
    });
  }

  static applySettingsToUI() {
    // Режим поверхности
    const selSurface = $('#surface-mode');
    if (selSurface) selSurface.value = State.surfaceMode;

    // Качество
    const selQuality = $('#quality-mode');
    if (selQuality) selQuality.value = State.quality;

    // Скорость
    const rangeSpeed = $('#rotation-speed');
    if (rangeSpeed) rangeSpeed.value = State.rotationSpeed;

    // Переключатели
    const tRot = $('#toggle-rotation');
    if (tRot) UI.setToggle(tRot, State.autoRotate);
    const tBorders = $('#toggle-borders');
    if (tBorders) UI.setToggle(tBorders, State.showBorders);
    const tCities = $('#toggle-cities');
    if (tCities) UI.setToggle(tCities, State.showCities);
    const tStars = $('#toggle-stars');
    if (tStars) UI.setToggle(tStars, State.showStars);

    // Применяем
    if (App.engine) {
      App.engine.setSurface(State.surfaceMode);
      App.engine.setQuality(State.quality);
    }
    if (State.globe) {
      State.globe.showAtmosphere(State.showStars);
      // Границы: если скрыты, убираем обводку
      if (!State.showBorders) {
        State.globe.polygonStrokeColor(() => 'rgba(77,166,255,0)');
      } else {
        State.globe.polygonStrokeColor(() => 'rgba(77,166,255,0.35)');
      }
    }
  }

  // ---------- СОБЫТИЯ ----------
  static bindEvents() {
    // Поиск
    const doSearch = debounce(() => {
      const q = dom.searchInput.value;
      if (q.trim().length < 2) {
        dom.searchResults.classList.remove('active');
        return;
      }
      const results = SearchEngine.search(q);
      UI.renderSearchResults(results);
    }, 300);

    dom.searchInput.addEventListener('input', doSearch);
    dom.searchInput.addEventListener('focus', () => {
      if (dom.searchInput.value.trim().length >= 2) doSearch();
    });

    // Закрыть результаты при клике вне
    document.addEventListener('click', (e) => {
      if (!dom.searchBar.contains(e.target) && !dom.searchResults.contains(e.target)) {
        dom.searchResults.classList.remove('active');
      }
    });

    // Информационная панель
    dom.infoClose.addEventListener('click', UI.closeInfo);

    // Инструменты
    $('#btn-countries').addEventListener('click', () => App.toggleCountryList());
    $('#btn-cities').addEventListener('click', () => App.toggleCities());
    $('#btn-random').addEventListener('click', () => App.randomCountry());
    $('#btn-settings').addEventListener('click', () => UI.toggleSettings());
    $('#btn-stats').addEventListener('click', () => UI.toggleStats());

    // Нижняя панель
    $('#btn-reset').addEventListener('click', () => {
      State.autoRotate = true;
      App.engine.flyTo(20, 0, 2.2, 1000);
    });
    $('#btn-rotate').addEventListener('click', () => {
      State.autoRotate = !State.autoRotate;
      $('#btn-rotate').classList.toggle('active', State.autoRotate);
      UI.setToggle($('#toggle-rotation'), State.autoRotate);
      App.saveSettings();
    });
    $('#btn-explore').addEventListener('click', () => {
      State.exploreMode = !State.exploreMode;
      $('#btn-explore').classList.toggle('active', State.exploreMode);
    });

    // Настройки
    $('#surface-mode').addEventListener('change', (e) => {
      State.surfaceMode = e.target.value;
      App.engine.setSurface(State.surfaceMode);
      App.saveSettings();
    });
    $('#quality-mode').addEventListener('change', (e) => {
      State.quality = e.target.value;
      App.engine.setQuality(State.quality);
      App.saveSettings();
    });
    $('#rotation-speed').addEventListener('input', (e) => {
      State.rotationSpeed = Number(e.target.value);
      App.saveSettings();
    });

    // Переключатели
    App.bindToggle('#toggle-rotation', (on) => {
      State.autoRotate = on;
      $('#btn-rotate').classList.toggle('active', on);
      App.saveSettings();
    });
    App.bindToggle('#toggle-borders', (on) => {
      State.showBorders = on;
      if (State.globe) {
        State.globe.polygonStrokeColor(() => on ? 'rgba(77,166,255,0.35)' : 'rgba(77,166,255,0)');
      }
      App.saveSettings();
    });
    App.bindToggle('#toggle-cities', (on) => {
      State.showCities = on;
      if (State.globe) {
        State.globe.pointsData(on ? State.cityMarkers : []);
      }
      App.saveSettings();
    });
    App.bindToggle('#toggle-stars', (on) => {
      State.showStars = on;
      if (State.globe) State.globe.showAtmosphere(on);
      App.saveSettings();
    });

    // Сброс поиска
    dom.searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        dom.searchInput.value = '';
        dom.searchResults.classList.remove('active');
        dom.searchInput.blur();
      }
    });
  }

  static bindToggle(selector, onChange) {
    const el = $(selector);
    if (!el) return;
    el.addEventListener('click', () => {
      const on = !el.classList.contains('on');
      UI.setToggle(el, on);
      onChange(on);
    });
  }

  static toggleCountryList() {
    // Простой список стран в информационной панели
    if (!State.countries.length) return;
    State.listOpen = !State.listOpen;
    if (State.listOpen) {
      const items = State.countries
        .sort((a, b) => (a.translations?.rus?.common || a.name.common).localeCompare(b.translations?.rus?.common || b.name.common))
        .map((c) => `<div class="info-row" data-iso="${c.cca2}" style="cursor:pointer">
          <span class="label">${escapeHtml(c.translations?.rus?.common || c.name.common)}</span>
          <span class="value">${escapeHtml(c.cca2)}</span>
        </div>`)
        .join('');
      dom.infoContent.innerHTML = `<h2>Страны (${State.countries.length})</h2>${items}`;
      dom.infoPanel.classList.add('active');
      dom.infoContent.querySelectorAll('[data-iso]').forEach((row) => {
        row.addEventListener('click', () => {
          const c = State.countriesByIso[row.dataset.iso];
          if (c) App.selectCountry(c, true);
        });
      });
    } else {
      UI.closeInfo();
    }
  }

  static toggleCities() {
    State.showCities = !State.showCities;
    if (State.globe) {
      State.globe.pointsData(State.showCities ? State.cityMarkers : []);
    }
    UI.setToggle($('#toggle-cities'), State.showCities);
    App.saveSettings();
  }
}

// ---------- ЗАПУСК ----------
document.addEventListener('DOMContentLoaded', () => {
  App.init().catch((err) => {
    console.error('Критическая ошибка инициализации:', err);
    UI.showLoaderError('Не удалось запустить приложение. Проверьте подключение к интернету и обновите страницу.');
  });
});

// Предупреждение при потере WebGL-контекста
document.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  UI.showLoaderError('WebGL-контекст потерян. Перезагрузите страницу.');
}, false);
</script>
