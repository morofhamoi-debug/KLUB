<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FORENSIC 3D — Сканирование головы</title>
<style>
:root{
  --bg:#0a0c0e; --panel:#12161a; --panel2:#1a1f24;
  --border:#2a333c; --border2:#3a454f;
  --text:#c8d2dc; --dim:#6b7a88;
  --accent:#00d4aa; --accent-dim:#0a3a33;
  --warn:#ff3b30; --ok:#30d158; --amber:#ffcc00;
  --mono:'SF Mono','Menlo','Consolas',monospace;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:var(--mono);font-size:11px;line-height:1.4;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
}
#app{
  display:flex;flex-direction:column;width:100%;height:100%;
  padding-top:var(--st);padding-bottom:var(--sb);
  padding-left:var(--sl);padding-right:var(--sr);
}

/* TOP BAR */
#topbar{
  display:flex;align-items:center;gap:8px;padding:6px 10px;
  background:var(--panel);border-bottom:1px solid var(--border);
  flex-shrink:0;min-height:42px;
}
#topbar .brand{font-weight:700;font-size:13px;color:#fff;letter-spacing:.5px}
#topbar .module{color:var(--accent);font-size:9px;letter-spacing:1px}
#topbar .spacer{flex:1}
#topbar .stat{text-align:right;font-size:9px;color:var(--dim);line-height:1.3}
#topbar .stat b{color:var(--text);font-weight:500}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--amber)}
.dot.err{background:var(--warn)}
.dot.off{background:var(--dim)}

/* MAIN SCROLL */
#main{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;
}

/* CAMERA SECTION */
#cam-section{
  display:flex;flex-direction:column;background:#000;
  flex-shrink:0;min-height:60vh;
}
#video-wrap{
  flex:1;position:relative;overflow:hidden;background:#000;
  min-height:280px;
}
#video{width:100%;height:100%;object-fit:cover;display:block}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#guide{
  position:absolute;inset:12% 18%;
  border:1px dashed rgba(0,212,170,.5);
  border-radius:4px;pointer-events:none;
}
#guide .corner{
  position:absolute;width:14px;height:14px;
  border-color:var(--accent);border-style:solid;border-width:0;
}
#guide .corner.tl{top:-1px;left:-1px;border-top-width:2px;border-left-width:2px}
#guide .corner.tr{top:-1px;right:-1px;border-top-width:2px;border-right-width:2px}
#guide .corner.bl{bottom:-1px;left:-1px;border-bottom-width:2px;border-left-width:2px}
#guide .corner.br{bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px}
#guide-label{
  position:absolute;top:-20px;left:0;font-size:9px;
  color:var(--accent);letter-spacing:1.5px;font-weight:600;
}
#guide-hint{
  position:absolute;bottom:-22px;left:0;right:0;
  font-size:8px;color:var(--dim);text-align:center;
}

/* CAMERA CONTROLS */
#cam-controls{
  display:flex;gap:6px;padding:8px 10px;
  background:var(--panel);border-top:1px solid var(--border);
  flex-shrink:0;
}
.btn{
  padding:8px 10px;background:var(--panel2);border:1px solid var(--border);
  color:var(--text);font-family:var(--mono);font-size:10px;
  border-radius:3px;cursor:pointer;white-space:nowrap;
  min-height:38px;display:inline-flex;align-items:center;justify-content:center;
  transition:background .15s,border-color .15s;
}
.btn:active{background:var(--accent-dim);border-color:var(--accent)}
.btn.primary{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.flex{flex:1}

/* TOGGLE CAMERA */
#cam-toggle{
  display:flex;border:1px solid var(--border);border-radius:3px;
  overflow:hidden;flex-shrink:0;
}
#cam-toggle button{
  background:var(--panel2);border:none;color:var(--dim);
  padding:8px 10px;font-family:var(--mono);font-size:9px;
  letter-spacing:.5px;cursor:pointer;min-height:38px;
}
#cam-toggle button.active{background:var(--accent-dim);color:var(--accent)}

/* VIEW SLOTS */
#slots-wrap{
  background:var(--panel);padding:8px 10px;
  border-top:1px solid var(--border);
  flex-shrink:0;
}
#slots-title{
  display:flex;justify-content:space-between;
  font-size:8px;color:var(--dim);letter-spacing:1px;margin-bottom:6px;
}
#slots-title b{color:var(--accent)}
#slots{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
}
.slot{
  aspect-ratio:1.1;background:var(--panel2);
  border:1px solid var(--border);border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:8px;color:var(--dim);text-align:center;
  position:relative;overflow:hidden;cursor:pointer;
  transition:border-color .15s,background .15s;
}
.slot.active{border-color:var(--accent);background:var(--accent-dim)}
.slot.filled{border-color:var(--ok)}
.slot .slot-label{z-index:2;font-weight:600;letter-spacing:.5px}
.slot .slot-status{z-index:2;font-size:7px;margin-top:2px;color:var(--dim)}
.slot.filled .slot-status{color:var(--ok)}
.slot .slot-img{
  position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:.45;
}
.slot .slot-del{
  position:absolute;top:2px;right:2px;width:16px;height:16px;
  background:rgba(255,59,48,.8);border-radius:2px;
  color:#fff;font-size:10px;line-height:16px;text-align:center;
  z-index:3;cursor:pointer;display:none;
}
.slot.filled .slot-del{display:block}

/* SAVE BAR */
#save-bar{
  display:flex;gap:6px;padding:8px 10px;
  background:var(--panel);border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);flex-shrink:0;
}

/* LOG */
#log{
  background:var(--bg);padding:6px 10px;
  font-size:9px;color:var(--dim);
  border-bottom:1px solid var(--border);flex-shrink:0;
  max-height:60px;overflow:hidden;
}
#log .last{color:var(--text)}

/* SAVED SCANS */
#saved-section{
  padding:12px 10px 20px;background:var(--bg);
}
#saved-title{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:10px;color:var(--accent);letter-spacing:1.5px;
  padding-bottom:6px;border-bottom:1px solid var(--border);
  margin-bottom:8px;font-weight:600;
}
#saved-title span{color:var(--dim);font-size:8px;font-weight:400}
#saved-list{display:flex;flex-direction:column;gap:6px}
#saved-empty{
  padding:20px 10px;text-align:center;color:var(--dim);
  font-size:9px;border:1px dashed var(--border);border-radius:3px;
}
.scan-card{
  display:flex;gap:8px;padding:6px;background:var(--panel);
  border:1px solid var(--border);border-radius:3px;
  cursor:pointer;transition:border-color .15s;
  align-items:center;
}
.scan-card:active{border-color:var(--accent)}
.scan-thumb{
  width:52px;height:52px;background:var(--panel2);
  border:1px solid var(--border);border-radius:2px;
  background-size:cover;background-position:center;
  flex-shrink:0;
}
.scan-info{flex:1;min-width:0}
.scan-info .name{color:var(--text);font-weight:600;font-size:10px;margin-bottom:3px}
.scan-info .meta{color:var(--dim);font-size:8px;line-height:1.5}
.scan-info .meta b{color:var(--ok);font-weight:500}
.scan-actions{display:flex;gap:4px;flex-shrink:0}
.scan-actions button{
  padding:5px 7px;background:var(--panel2);border:1px solid var(--border);
  color:var(--dim);font-family:var(--mono);font-size:8px;
  border-radius:2px;cursor:pointer;
}
.scan-actions button:active{background:var(--accent-dim);color:var(--accent)}
.scan-actions .del{border-color:#4a1e1e;color:#ff8888}

/* MODAL */
#modal{
  position:fixed;inset:0;background:rgba(0,0,0,.92);
  display:none;z-index:100;padding:var(--st) 10px var(--sb);
  flex-direction:column;
}
#modal.open{display:flex}
#modal-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--border);
  margin-bottom:8px;flex-shrink:0;
}
#modal-head .mtitle{color:var(--accent);font-size:11px;font-weight:600;letter-spacing:1px}
#modal-head .mclose{
  padding:6px 12px;background:var(--panel2);border:1px solid var(--border);
  color:var(--text);font-family:var(--mono);font-size:10px;
  border-radius:3px;cursor:pointer;min-height:36px;
}
#modal-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#modal-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px;
}
#modal-grid .mi{
  aspect-ratio:1;background:var(--panel2);border:1px solid var(--border);
  border-radius:3px;background-size:cover;background-position:center;
  position:relative;
}
#modal-grid .mi .mlabel{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(10,12,14,.85);color:var(--accent);
  font-size:8px;padding:2px 4px;letter-spacing:1px;text-align:center;
}
#modal-meta{
  background:var(--panel);border:1px solid var(--border);
  padding:8px;font-size:9px;line-height:1.6;margin-bottom:8px;
}
#modal-meta .row{display:flex;justify-content:space-between}
#modal-meta .row span:first-child{color:var(--dim)}
#modal-meta .row span:last-child{color:var(--text);font-weight:500}
#modal-actions{display:flex;gap:6px;padding:8px 0;flex-shrink:0}

/* TOAST */
#toast{
  position:fixed;left:50%;bottom:calc(20px + var(--sb));
  transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--accent);
  color:var(--accent);padding:8px 14px;border-radius:3px;
  font-size:10px;letter-spacing:.5px;z-index:200;
  opacity:0;pointer-events:none;transition:opacity .2s;
  max-width:90vw;text-align:center;
}
#toast.show{opacity:1}
#toast.err{border-color:var(--warn);color:var(--warn)}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--border)}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div>
      <div class="brand">FORENSIC 3D</div>
      <div class="module">СКАНИРОВАНИЕ ГОЛОВЫ</div>
    </div>
    <div class="spacer"></div>
    <div class="stat">
      <div><span class="dot off" id="sys-dot"></span><b id="sys-txt">ОЖИДАНИЕ</b></div>
      <div>СЕАНС <b id="timer">00:00</b></div>
    </div>
  </div>

  <div id="main">

    <!-- CAMERA -->
    <div id="cam-section">
      <div id="video-wrap">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlay"></canvas>
        <div id="guide">
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
          <div id="guide-label">ЛОБ</div>
          <div id="guide-hint">Поместите голову в рамку</div>
        </div>
      </div>

      <div id="cam-controls">
        <button class="btn primary flex" id="btn-cam">ВКЛЮЧИТЬ КАМЕРУ</button>
        <div id="cam-toggle">
          <button data-facing="environment" class="active">ЗАДНЯЯ</button>
          <button data-facing="user">ПЕРЕДНЯЯ</button>
        </div>
      </div>

      <div id="cam-controls" style="border-top:none;padding-top:0">
        <button class="btn primary flex" id="btn-capture" disabled>СНЯТЬ КАДР</button>
      </div>

      <!-- SLOTS -->
      <div id="slots-wrap">
        <div id="slots-title">
          <span>РАКУРСЫ СКАНИРОВАНИЯ</span>
          <span><b id="slot-count">0</b> / 6</span>
        </div>
        <div id="slots">
          <div class="slot" data-view="FRONT"><span class="slot-label">ЛОБ</span><span class="slot-status">—</span></div>
          <div class="slot" data-view="LEFT"><span class="slot-label">Л. ПРОФИЛЬ</span><span class="slot-status">—</span></div>
          <div class="slot" data-view="RIGHT"><span class="slot-label">П. ПРОФИЛЬ</span><span class="slot-status">—</span></div>
          <div class="slot" data-view="REAR"><span class="slot-label">ЗАТЫЛОК</span><span class="slot-status">—</span></div>
          <div class="slot" data-view="UPPER"><span class="slot-label">ВЕРХ</span><span class="slot-status">—</span></div>
          <div class="slot" data-view="LOWER"><span class="slot-label">НИЗ</span><span class="slot-status">—</span></div>
        </div>
      </div>

      <div id="save-bar">
        <button class="btn flex" id="btn-reset">СБРОСИТЬ</button>
        <button class="btn primary flex" id="btn-save" disabled>СОХРАНИТЬ СКАН</button>
      </div>

      <div id="log">
        <div class="last" id="log-line">Система готова.</div>
      </div>
    </div>

    <!-- SAVED SCANS -->
    <div id="saved-section">
      <div id="saved-title">
        <span>СОХРАНЁННЫЕ СКАНЫ</span>
        <span id="saved-count">0</span>
      </div>
      <div id="saved-list">
        <div id="saved-empty">Пока нет сохранённых сканов</div>
      </div>
    </div>

  </div>
</div>

<!-- MODAL -->
<div id="modal">
  <div id="modal-head">
    <div class="mtitle" id="modal-title">СКАН</div>
    <button class="mclose" id="modal-close">ЗАКРЫТЬ</button>
  </div>
  <div id="modal-body">
    <div id="modal-grid"></div>
    <div id="modal-meta"></div>
  </div>
  <div id="modal-actions">
    <button class="btn danger flex" id="modal-del">УДАЛИТЬ СКАН</button>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

/* ============================================================
   КОНСТАНТЫ И СОСТОЯНИЕ
   ============================================================ */
const VIEWS = [
  { id:'FRONT', label:'ЛОБ',       hint:'Прямо перед лицом' },
  { id:'LEFT',  label:'Л.ПРОФИЛЬ', hint:'Поверните голову влево' },
  { id:'RIGHT', label:'П.ПРОФИЛЬ', hint:'Поверните голову вправо' },
  { id:'REAR',  label:'ЗАТЫЛОК',   hint:'Спиной к камере' },
  { id:'UPPER', label:'ВЕРХ',      hint:'Наклоните голову вниз' },
  { id:'LOWER', label:'НИЗ',       hint:'Наклоните голову вверх' }
];

const state = {
  sessionStart: Date.now(),
  stream: null,
  facing: 'environment',
  cameraOn: false,
  currentView: 'FRONT',
  frames: {},           // { FRONT: {dataUrl, w, h, ts}, ... }
  scanNumber: 1,
  savedScans: [],
  modalScanId: null
};

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
const $ = id => document.getElementById(id);

function log(msg, isErr) {
  const line = $('log-line');
  line.textContent = `[${new Date().toISOString().substr(11,8)}] ${msg}`;
  line.style.color = isErr ? 'var(--warn)' : 'var(--text)';
}

function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.className = '', 2200);
}

function setSysStatus(txt, kind) {
  $('sys-txt').textContent = txt;
  $('sys-dot').className = 'dot ' + (kind || 'off');
}

function fmtDate(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ============================================================
   IndexedDB — хранилище сканов
   ============================================================ */
const DB_NAME = 'forensic3d';
const DB_VERSION = 1;
const STORE = 'scans';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        db.createObjectStore(STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function dbPut(scan) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(scan);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}

async function dbGetAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = e => reject(e.target.error);
  });
}

async function dbDelete(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}

/* ============================================================
   КАМЕРА
   ============================================================ */
const video = $('video');
const overlay = $('overlay');
const overlayCtx = overlay.getContext('2d');
let rafId = null;

async function startCamera() {
  try {
    if (state.stream) {
      state.stream.getTracks().forEach(t => t.stop());
    }
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: state.facing },
        width: { ideal: 1280 },
        height: { ideal: 960 }
      },
      audio: false
    });
    state.stream = stream;
    video.srcObject = stream;
    await video.play();
    state.cameraOn = true;
    $('btn-cam').textContent = 'ВЫКЛЮЧИТЬ КАМЕРУ';
    $('btn-capture').disabled = false;
    setSysStatus('КАМЕРА АКТИВНА', 'ok');
    log(`Камера включена (${state.facing === 'user' ? 'передняя' : 'задняя'}). Разрешение: ${video.videoWidth}×${video.videoHeight}`);
    startOverlay();
  } catch (err) {
    state.cameraOn = false;
    $('btn-cam').textContent = 'ВКЛЮЧИТЬ КАМЕРУ';
    $('btn-capture').disabled = true;
    setSysStatus('ОШИБКА КАМЕРЫ', 'err');
    log(`Ошибка камеры: ${err.name} — ${err.message}`, true);
    if (err.name === 'NotAllowedError') {
      toast('Доступ к камере запрещён. Разрешите в настройках Safari.', true);
    } else if (err.name === 'NotFoundError') {
      toast('Камера не найдена.', true);
    } else {
      toast('Не удалось включить камеру.', true);
    }
  }
}

function stopCamera() {
  if (state.stream) {
    state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
  }
  video.srcObject = null;
  state.cameraOn = false;
  $('btn-cam').textContent = 'ВКЛЮЧИТЬ КАМЕРУ';
  $('btn-capture').disabled = true;
  setSysStatus('ОЖИДАНИЕ', 'off');
  log('Камера выключена.');
  stopOverlay();
}

async function switchFacing(facing) {
  state.facing = facing;
  document.querySelectorAll('#cam-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.facing === facing);
  });
  if (state.cameraOn) {
    await startCamera();
  }
}

function startOverlay() {
  const draw = () => {
    if (!state.cameraOn) return;
    const w = video.videoWidth || 640;
    const h = video.videoHeight || 480;
    if (overlay.width !== w || overlay.height !== h) {
      overlay.width = w;
      overlay.height = h;
    }
    overlayCtx.clearRect(0, 0, w, h);

    // Техническая сетка
    overlayCtx.strokeStyle = 'rgba(0,212,170,0.07)';
    overlayCtx.lineWidth = 1;
    const step = Math.max(w, h) / 6;
    for (let x = step; x < w; x += step) {
      overlayCtx.beginPath(); overlayCtx.moveTo(x, 0); overlayCtx.lineTo(x, h); overlayCtx.stroke();
    }
    for (let y = step; y < h; y += step) {
      overlayCtx.beginPath(); overlayCtx.moveTo(0, y); overlayCtx.lineTo(w, y); overlayCtx.stroke();
    }

    // Перекрестие в центре
    const cx = w / 2, cy = h / 2;
    overlayCtx.strokeStyle = 'rgba(0,212,170,0.35)';
    overlayCtx.beginPath();
    overlayCtx.moveTo(cx - 14, cy); overlayCtx.lineTo(cx - 4, cy);
    overlayCtx.moveTo(cx + 4, cy); overlayCtx.lineTo(cx + 14, cy);
    overlayCtx.moveTo(cx, cy - 14); overlayCtx.lineTo(cx, cy - 4);
    overlayCtx.moveTo(cx, cy + 4); overlayCtx.lineTo(cx, cy + 14);
    overlayCtx.stroke();

    rafId = requestAnimationFrame(draw);
  };
  draw();
}

function stopOverlay() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
}

/* ============================================================
   ЗАХВАТ КАДРА
   ============================================================ */
function capture() {
  if (!state.cameraOn) { toast('Камера не активна.', true); return; }
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) { toast('Видео ещё не готово.', true); return; }

  const view = state.currentView;

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');

  // Отражаем для передней камеры, чтобы не было зеркала
  if (state.facing === 'user') {
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, w, h);

  const dataUrl = canvas.toDataURL('image/jpeg', 0.82);

  state.frames[view] = { dataUrl, w, h, ts: Date.now() };

  const viewInfo = VIEWS.find(v => v.id === view);
  log(`Снят кадр: ${viewInfo.label} (${w}×${h})`);

  updateSlots();
  advanceView();
  updateSaveButton();
  updateSlotCount();
}

function advanceView() {
  // Переходим к следующему пустому ракурсу
  const next = VIEWS.find(v => !state.frames[v.id]);
  if (next) {
    state.currentView = next.id;
  } else {
    // Все заняты — оставляем текущий
  }
  updateGuide();
  highlightSlot();
}

function removeFrame(view) {
  if (!state.frames[view]) return;
  delete state.frames[view];
  updateSlots();
  updateSaveButton();
  updateSlotCount();
  if (state.currentView === view) {
    state.currentView = view;
  }
  highlightSlot();
  const info = VIEWS.find(v => v.id === view);
  log(`Кадр удалён: ${info.label}`);
}

function updateGuide() {
  const info = VIEWS.find(v => v.id === state.currentView);
  if (!info) return;
  $('guide-label').textContent = info.label;
  $('guide-hint').textContent = info.hint;
}

function highlightSlot() {
  document.querySelectorAll('.slot').forEach(s => {
    s.classList.toggle('active', s.dataset.view === state.currentView);
  });
}

function updateSlots() {
  document.querySelectorAll('.slot').forEach(slot => {
    const view = slot.dataset.view;
    const frame = state.frames[view];
    // Очищаем старое
    slot.querySelectorAll('.slot-img,.slot-del').forEach(el => el.remove());
    if (frame) {
      slot.classList.add('filled');
      slot.querySelector('.slot-status').textContent = '✓';
      const img = document.createElement('div');
      img.className = 'slot-img';
      img.style.backgroundImage = `url(${frame.dataUrl})`;
      slot.appendChild(img);
      const del = document.createElement('div');
      del.className = 'slot-del';
      del.textContent = '×';
      del.onclick = e => { e.stopPropagation(); removeFrame(view); };
      slot.appendChild(del);
    } else {
      slot.classList.remove('filled');
      slot.querySelector('.slot-status').textContent = '—';
    }
  });
}

function updateSlotCount() {
  const n = Object.keys(state.frames).length;
  $('slot-count').textContent = n;
}

function updateSaveButton() {
  const n = Object.keys(state.frames).length;
  $('btn-save').disabled = n < 6;
}

/* ============================================================
   СОХРАНЕНИЕ СКАНА
   ============================================================ */
async function saveScan() {
  const n = Object.keys(state.frames).length;
  if (n < 6) {
    toast(`Снято только ${n} из 6 ракурсов.`, true);
    return;
  }

  const id = 'scan_' + Date.now().toString(36);
  const name = `СКАН ${String(state.scanNumber).padStart(3,'0')}`;
  const ts = Date.now();

  const scan = {
    id,
    name,
    timestamp: ts,
    views: state.frames,
    viewCount: n,
    deviceInfo: {
      facing: state.facing,
      resolution: `${video.videoWidth || 0}×${video.videoHeight || 0}`
    }
  };

  try {
    await dbPut(scan);
    log(`Скан сохранён: ${name} (${n} ракурсов)`);
    toast(`Сохранено: ${name}`);
    state.scanNumber++;
    resetCapture();
    await loadSavedScans();
    // Прокрутить к списку
    $('saved-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    log(`Ошибка сохранения: ${err.message}`, true);
    toast('Не удалось сохранить скан.', true);
  }
}

function resetCapture() {
  state.frames = {};
  state.currentView = 'FRONT';
  updateSlots();
  updateGuide();
  highlightSlot();
  updateSaveButton();
  updateSlotCount();
}

/* ============================================================
   СПИСОК СОХРАНЁННЫХ СКАНОВ
   ============================================================ */
async function loadSavedScans() {
  try {
    const scans = await dbGetAll();
    scans.sort((a, b) => b.timestamp - a.timestamp);
    state.savedScans = scans;
    renderSavedScans();
  } catch (err) {
    log(`Ошибка чтения базы: ${err.message}`, true);
  }
}

function renderSavedScans() {
  const list = $('saved-list');
  $('saved-count').textContent = state.savedScans.length;

  if (state.savedScans.length === 0) {
    list.innerHTML = '<div id="saved-empty">Пока нет сохранённых сканов</div>';
    return;
  }

  list.innerHTML = '';
  state.savedScans.forEach(scan => {
    const card = document.createElement('div');
    card.className = 'scan-card';

    // Превью — первый ракурс
    const firstFrame = scan.views.FRONT || scan.views[Object.keys(scan.views)[0]];
    const thumbUrl = firstFrame ? firstFrame.dataUrl : '';

    card.innerHTML = `
      <div class="scan-thumb" style="background-image:url('${thumbUrl}')"></div>
      <div class="scan-info">
        <div class="name">${escapeHtml(scan.name)}</div>
        <div class="meta">
          ${fmtDate(scan.timestamp)}<br>
          Ракурсов: <b>${scan.viewCount}/6</b>
        </div>
      </div>
      <div class="scan-actions">
        <button class="del" data-del="${scan.id}">УДАЛИТЬ</button>
      </div>
    `;

    card.addEventListener('click', e => {
      if (e.target.dataset.del) return;
      openScanModal(scan.id);
    });

    const delBtn = card.querySelector('[data-del]');
    delBtn.addEventListener('click', async e => {
      e.stopPropagation();
      await deleteScanConfirm(scan.id, scan.name);
    });

    list.appendChild(card);
  });
}

async function deleteScanConfirm(id, name) {
  if (!confirm(`Удалить ${name}?`)) return;
  try {
    await dbDelete(id);
    toast(`Удалено: ${name}`);
    log(`Скан удалён: ${name}`);
    await loadSavedScans();
    if (state.modalScanId === id) closeModal();
  } catch (err) {
    toast('Не удалось удалить скан.', true);
  }
}

/* ============================================================
   МОДАЛЬНОЕ ОКНО ПРОСМОТРА
   ============================================================ */
function openScanModal(id) {
  const scan = state.savedScans.find(s => s.id === id);
  if (!scan) return;
  state.modalScanId = id;

  $('modal-title').textContent = scan.name;

  const grid = $('modal-grid');
  grid.innerHTML = '';
  VIEWS.forEach(v => {
    const frame = scan.views[v.id];
    const cell = document.createElement('div');
    cell.className = 'mi';
    if (frame) {
      cell.style.backgroundImage = `url(${frame.dataUrl})`;
    } else {
      cell.style.display = 'flex';
      cell.style.alignItems = 'center';
      cell.style.justifyContent = 'center';
      cell.style.color = 'var(--dim)';
      cell.style.fontSize = '9px';
      cell.textContent = 'нет кадра';
    }
    const lbl = document.createElement('div');
    lbl.className = 'mlabel';
    lbl.textContent = v.label;
    cell.appendChild(lbl);
    grid.appendChild(cell);
  });

  const meta = $('modal-meta');
  meta.innerHTML = `
    <div class="row"><span>Идентификатор</span><span>${escapeHtml(scan.id)}</span></div>
    <div class="row"><span>Дата и время</span><span>${fmtDate(scan.timestamp)}</span></div>
    <div class="row"><span>Ракурсов</span><span>${scan.viewCount} / 6</span></div>
    <div class="row"><span>Камера</span><span>${scan.deviceInfo && scan.deviceInfo.facing === 'user' ? 'передняя' : 'задняя'}</span></div>
    <div class="row"><span>Разрешение</span><span>${scan.deviceInfo ? scan.deviceInfo.resolution : 'N/A'}</span></div>
  `;

  $('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  $('modal').classList.remove('open');
  state.modalScanId = null;
  document.body.style.overflow = '';
}

/* ============================================================
   ЗАЩИТА ОТ XSS
   ============================================================ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ============================================================
   ТАЙМЕР СЕАНСА
   ============================================================ */
setInterval(() => {
  const s = Math.floor((Date.now() - state.sessionStart) / 1000);
  const m = String(Math.floor(s / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  $('timer').textContent = `${m}:${sec}`;
}, 1000);

/* ============================================================
   СОБЫТИЯ
   ============================================================ */
function bindEvents() {
  // Камера вкл/выкл
  $('btn-cam').addEventListener('click', () => {
    if (state.cameraOn) stopCamera();
    else startCamera();
  });

  // Переключение передняя/задняя
  document.querySelectorAll('#cam-toggle button').forEach(btn => {
    btn.addEventListener('click', () => switchFacing(btn.dataset.facing));
  });

  // Захват
  $('btn-capture').addEventListener('click', capture);

  // Клик по слоту — выбрать ракурс вручную
  document.querySelectorAll('.slot').forEach(slot => {
    slot.addEventListener('click', e => {
      if (e.target.classList.contains('slot-del')) return;
      state.currentView = slot.dataset.view;
      updateGuide();
      highlightSlot();
    });
  });

  // Сброс текущего захвата
  $('btn-reset').addEventListener('click', () => {
    if (Object.keys(state.frames).length === 0) return;
    if (!confirm('Сбросить все снятые кадры текущего скана?')) return;
    resetCapture();
    log('Текущий захват сброшен.');
  });

  // Сохранить скан
  $('btn-save').addEventListener('click', saveScan);

  // Модальное окно
  $('modal-close').addEventListener('click', closeModal);
  $('modal-del').addEventListener('click', async () => {
    if (!state.modalScanId) return;
    const scan = state.savedScans.find(s => s.id === state.modalScanId);
    if (scan) await deleteScanConfirm(scan.id, scan.name);
  });

  // Автоостановка при уходе со страницы
  window.addEventListener('beforeunload', () => {
    if (state.stream) state.stream.getTracks().forEach(t => t.stop());
  });
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
async function init() {
  log('Система запущена. Готово к работе.');
  setSysStatus('ОЖИДАНИЕ', 'off');
  updateGuide();
  highlightSlot();
  updateSlots();
  updateSlotCount();
  updateSaveButton();
  bindEvents();

  try {
    await loadSavedScans();
  } catch (err) {
    log('Не удалось загрузить сохранённые сканы: ' + err.message, true);
  }

  // Предварительная проверка поддержки камеры
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setSysStatus('НЕТ ДОСТУПА К API', 'err');
    $('btn-cam').disabled = true;
    log('Браузер не поддерживает доступ к камере.', true);
  }
}

init();
</script>
