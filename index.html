  /* ==========================================================================
     МОДУЛЬ 2. SaveSystem
     Слоты сохраняются через StorageAdapter.local (уже проверенный канал).
     Индекс слотов — Constants.STORAGE_KEYS.SAVE_INDEX.
     Каждый слот — Constants.STORAGE_KEYS.SAVE_PREFIX + slotId.
     Не создаём второй GameState: работаем через существующий.
     ========================================================================== */

  const SaveSystem = (() => {
    const IDX_KEY = Constants.STORAGE_KEYS.SAVE_INDEX;
    const PREFIX  = Constants.STORAGE_KEYS.SAVE_PREFIX;

    const slotKey = (slotId) => PREFIX + slotId;

    const readIndex = () => {
      const idx = StorageAdapter.local.get(IDX_KEY, null);
      return isPlainObject(idx) ? idx : {};
    };

    const writeIndex = (idx) => StorageAdapter.local.set(IDX_KEY, idx);

    const listSlots = () => {
      const idx = readIndex();
      const out = [];
      const total = Constants.LIMITS.SAVE_SLOTS;
      for (let i = 1; i <= total; i++) {
        const slotId = 'slot' + i;
        const meta = idx[slotId] || null;
        out.push({ slotId, exists: !!meta, meta });
      }
      return out;
    };

    const getMeta = (slotId) => readIndex()[slotId] || null;

    const save = (slotId) => {
      if (!slotId) return false;
      const st = GameState.get();
      if (st.slotId !== slotId) st.slotId = slotId;
      GameState.touch();               // обновит updatedAt и пометит dirty
      const snap = GameState.snapshot();

      const meta = {
        slotId,
        savedAt: Date.now(),
        playtimeMs: st.playtimeMs || 0,
        chapterId: st.chapterId || null,
        schemaVersion: st.schemaVersion,
        appVersion: Constants.APP_VERSION
      };

      const ok = StorageAdapter.local.set(slotKey(slotId), snap);
      if (!ok) {
        // Пробуем резервный канал (IndexedDB), асинхронно.
        try { StorageAdapter.persist(slotKey(slotId), snap); } catch (_) {}
      }

      const idx = readIndex();
      idx[slotId] = meta;
      writeIndex(idx);

      GameState.markClean();
      TopBar.setSaveStatus('Сохранено', 'saved');
      if (saveStatusTimer) clearTimeout(saveStatusTimer);
      saveStatusTimer = setTimeout(() => TopBar.setSaveStatus('Готово', 'idle'), 1800);

      EventBus.emit('save:completed', { slotId, meta, ok });
      Logger.info('save', 'сохранение в слот ' + slotId + ' (' + (ok ? 'ok' : 'fallback') + ')');
      return ok;
    };

    const load = (slotId) => {
      if (!slotId) return false;
      const snap = StorageAdapter.local.get(slotKey(slotId), null);
      if (!isPlainObject(snap)) {
        EventBus.emit('save:load-failed', { slotId, reason: 'not-found' });
        Logger.warn('save', 'снапшот не найден для слота ' + slotId);
        return false;
      }
      if (snap.schemaVersion !== Constants.SAVE_SCHEMA_VERSION) {
        EventBus.emit('save:load-failed', { slotId, reason: 'schema' });
        Logger.warn('save', 'несовместимая схема в слоте ' + slotId);
        return false;
      }
      const ok = GameState.replace(snap, { soft: false });
      if (!ok) return false;
      if (!GameState.get().slotId) GameState.get().slotId = slotId;
      EventBus.emit('save:loaded', { slotId });
      Logger.info('save', 'загружен слот ' + slotId);
      return true;
    };

    const remove = (slotId) => {
      if (!slotId) return false;
      const ok = StorageAdapter.local.remove(slotKey(slotId));
      const idx = readIndex();
      if (idx[slotId]) { delete idx[slotId]; writeIndex(idx); }
      EventBus.emit('save:deleted', { slotId, ok });
      Logger.info('save', 'удалён слот ' + slotId);
      return ok;
    };

    const newGame = (slotId) => {
      if (!slotId) return false;
      const fresh = GameState.createEmpty();
      fresh.slotId = slotId;
      const ok = GameState.replace(fresh, { soft: false });
      if (!ok) return false;
      // Первое сохранение «чистого» слотa сразу, чтобы Continue его видел.
      return save(slotId);
    };

    return { listSlots, getMeta, save, load, remove, newGame };
  })();

  /* ==========================================================================
     МОДУЛЬ 3. ScreenRouter — тонкий роутер поверх MainShell.
     Не создаёт второй UI, только регистрирует экраны в MainShell и переключает.
     ========================================================================== */

  const ScreenRouter = (() => {
    const screens = new Map();      // id → { factory, opts, cachedNode }
    let currentId = null;

    const register = (id, factory, opts) => {
      if (typeof id !== 'string' || typeof factory !== 'function') return false;
      if (screens.has(id)) {
        Logger.warn('router', 'экран уже зарегистрирован, перезаписан: ' + id);
      }
      screens.set(id, {
        factory,
        opts: Object.assign({ cache: false, title: '' }, opts || {}),
        cachedNode: null
      });
      return true;
    };

    const build = (entry, params) => {
      if (entry.opts.cache && entry.cachedNode) return entry.cachedNode;
      let node;
      try { node = entry.factory(params || {}); }
      catch (e) {
        Logger.error('router', 'factory failed for screen', e);
        return null;
      }
      if (!(node instanceof Node)) {
        Logger.error('router', 'factory не вернул DOM-узел');
        return null;
      }
      entry.cachedNode = entry.opts.cache ? node : null;
      return node;
    };

    const show = (id, params) => {
      const entry = screens.get(id);
      if (!entry) { Logger.warn('router', 'экран не зарегистрирован: ' + id); return false; }
      const node = build(entry, params);
      if (!node) return false;

      // Перерегистрируем слот в MainShell, т.к. узел мог быть построен заново.
      if (MainShell.has(id)) MainShell.unregister(id);
      const title = (params && params.title) || entry.opts.title || '';
      MainShell.register(id, node, { title });
      MainShell.show(id);

      currentId = id;
      EventBus.emit('router:shown', { id, title });
      return true;
    };

    return {
      register, show,
      current: () => currentId,
      has: (id) => screens.has(id),
      list: () => Array.from(screens.keys())
    };
  })();

  /* ==========================================================================
     Вспомогательные функции (локальные для части 6, без глобалов).
     ========================================================================== */

  const fmtTime = (ts) => {
    try {
      const d = new Date(ts);
      const pad = (n) => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
             ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    } catch (_) { return '—'; }
  };

  const notifyNotImplemented = (text) => {
    ModalManager.alert({ title: 'Скоро', message: String(text || '') });
  };

  /* ==========================================================================
     МОДУЛЬ 4. MenuScreen
     ========================================================================== */

  const makeMenuScreen = () => {
    const wrap = UIComponents.el('div', { className: 'mc-menu' });

    const hero = UIComponents.el('div', { className: 'mc-menu__hero' });
    hero.appendChild(UIComponents.el('div', { className: 'mc-menu__logo', text: Constants.APP_NAME }));
    hero.appendChild(UIComponents.el('div', { className: 'mc-menu__tag',  text: Constants.APP_TAGLINE }));

    const actions = UIComponents.el('div', { className: 'mc-menu__actions' });

    const slots = SaveSystem.listSlots();
    const hasAnySave = slots.some(s => s.exists);

    const bNew = UIComponents.button({
      label: 'Новая игра',
      variant: 'primary',
      onClick: () => ScreenRouter.show('save-slots', { mode: 'new' })
    });

    const bContinue = UIComponents.button({
      label: 'Продолжить',
      onClick: () => ScreenRouter.show('save-slots', { mode: 'load' })
    });
    if (!hasAnySave) A11y.setDisabled(bContinue, true);

    const bSettings = UIComponents.button({
      label: 'Настройки',
      variant: 'ghost',
      onClick: () => EventBus.emit('ui:open-settings')
    });

    const bAbout = UIComponents.button({
      label: 'Об игре',
      variant: 'ghost',
      onClick: () => ScreenRouter.show('about')
    });

    actions.appendChild(bNew);
    actions.appendChild(bContinue);
    actions.appendChild(bSettings);
    actions.appendChild(bAbout);

    const footer = UIComponents.el('div', {
      className: 'mc-menu__footer',
      text: 'Версия ' + Constants.APP_VERSION + ' · автономный режим · без сетевых запросов'
    });

    wrap.appendChild(hero);
    wrap.appendChild(actions);
    wrap.appendChild(footer);
    return wrap;
  };

  /* ==========================================================================
     МОДУЛЬ 5. SaveSlotsScreen
     Параметры: { mode: 'new' | 'load' }
     ========================================================================== */

  const makeSaveSlotsScreen = (params) => {
    const mode = (params && params.mode) === 'load' ? 'load' : 'new';
    const wrap = UIComponents.el('div', { className: 'mc-slots' });

    const buildSlotRow = (slot, refreshFn) => {
      const row = document.createElement('div');
      row.className = 'mc-slot';
      row.setAttribute('data-empty', slot.exists ? 'false' : 'true');

      const main = document.createElement('div');
      main.className = 'mc-slot__main';
      main.setAttribute('role', 'button');
      main.setAttribute('tabindex', '0');
      main.setAttribute('aria-label', 'Слот ' + slot.slotId +
        (slot.exists ? ', есть сохранение' : ', пусто'));

      const num = UIComponents.el('div', { className: 'mc-slot__num',
        text: slot.slotId.replace('slot', 'СЛОТ ') });

      const title = UIComponents.el('div', { className: 'mc-slot__title',
        text: slot.exists
          ? (slot.meta.chapterId ? String(slot.meta.chapterId) : 'Прогресс сохранён')
          : 'Пусто' });

      const meta = UIComponents.el('div', { className: 'mc-slot__meta',
        text: slot.exists
          ? fmtTime(slot.meta.savedAt) + ' · версия ' + (slot.meta.appVersion || '—')
          : 'Здесь начнётся ваше расследование' });

      main.appendChild(num);
      main.appendChild(title);
      main.appendChild(meta);

      const side = document.createElement('div');
      side.className = 'mc-slot__side';

      if (slot.exists) {
        const del = UIComponents.iconButton({
          label: 'Удалить сохранение',
          icon: '✕',
          tooltip: 'Удалить',
          onClick: (ev) => {
            ev.stopPropagation();
            ModalManager.confirm({
              title: 'Удалить сохранение?',
              message: 'Слот будет очищен. Это действие нельзя отменить.',
              okLabel: 'Удалить',
              cancelLabel: 'Отмена',
              variant: 'danger'
            }).then((ok) => {
              if (ok) {
                SaveSystem.remove(slot.slotId);
                refreshFn();
              }
            });
          }
        });
        side.appendChild(del);
      }

      const activate = () => {
        if (mode === 'load') {
          if (!slot.exists) return;
          const loaded = SaveSystem.load(slot.slotId);
          if (loaded) {
            ScreenRouter.show('game');
          } else {
            ModalManager.alert({
              title: 'Не удалось загрузить',
              message: 'Сохранение повреждено или несовместимо с текущей версией.'
            });
          }
        } else {
          const start = () => {
            SaveSystem.newGame(slot.slotId);
            ScreenRouter.show('game');
          };
          if (slot.exists) {
            ModalManager.confirm({
              title: 'Перезаписать слот?',
              message: 'Сохранение в этом слоте будет заменено новым расследованием.',
              okLabel: 'Начать заново',
              cancelLabel: 'Отмена',
              variant: 'primary'
            }).then((ok) => { if (ok) start(); });
          } else {
            start();
          }
        }
      };

      main.addEventListener('click', activate);
      main.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); activate(); }
      });

      row.appendChild(main);
      row.appendChild(side);
      return row;
    };

    const refresh = () => {
      wrap.textContent = '';

      wrap.appendChild(UIComponents.el('h2', {
        className: 'mc-slots__title',
        text: mode === 'load' ? 'Загрузить игру' : 'Новая игра'
      }));

      const slots = SaveSystem.listSlots();
      for (let i = 0; i < slots.length; i++) {
        wrap.appendChild(buildSlotRow(slots[i], refresh));
      }

      const backRow = UIComponents.el('div', { className: 'mc-slots__back' });
      backRow.appendChild(UIComponents.button({
        label: '← Назад в меню',
        variant: 'ghost',
        onClick: () => ScreenRouter.show('menu')
      }));
      wrap.appendChild(backRow);
    };

    refresh();
    return wrap;
  };

  /* ==========================================================================
     МОДУЛЬ 6. AboutScreen
     ========================================================================== */

  const makeAboutScreen = () => {
    const wrap = UIComponents.el('div', { className: 'mc-about' });

    const autonomy = (MC.Diagnostics && typeof MC.Diagnostics.auditAutonomy === 'function')
      ? MC.Diagnostics.auditAutonomy()

    addItem('Слотов сохранения: <code>' + Constants.LIMITS.SAVE_SLOTS + '</code>');
    addItem('Автономность: <code>' + (autonomy.ok ? 'нарушений не найдено' : 'есть замечания') + '</code>');

    wrap.innerHTML = ''
      + '<h2>MIND CASE</h2>'
      + '<p>Правда всегда оставляет след. Детективная игра в одном HTML-файле: '

      + '<h3>Техническая информация</h3>';

    if (!autonomy.ok) {
      const warn = document.createElement('p');
      warn.style.color = 'var(--mc-warn)';
      warn.textContent = 'Обнаружены внешние ресурсы в DOM: ' +
        autonomy.issues.map(i => i.kind + '×' + i.count).join(', ');
      wrap.appendChild(warn);
    }

    const backRow = UIComponents.el('div', { className: 'mc-slots__back' });
    backRow.appendChild(UIComponents.button({

      variant: 'ghost',
      onClick: () => ScreenRouter.show('menu')
    }));
    wrap.appendChild(backRow);
    return wrap;
  };

  /* ==========================================================================
     МОДУЛЬ 7. GameStubScreen
     Полноценные игровые экраны появятся в следующих частях.
     Пока здесь: место под сюжет, ручное сохранение, выход в меню.
     Сюжет НЕ выдумываем — оставляем явную заглушку.
     ========================================================================== */

  const makeGameStubScreen = () => {
    const wrap = UIComponents.el('div', { className: 'mc-stub' });
    wrap.innerHTML = ''
      + '<h2>РАССЛЕДОВАНИЕ</h2>'
      + '<p>Сюжет, персонажи и улики будут подключены в следующих частях разработки.</p>'
      + '<p>Сейчас доступны: меню, сохранения, настройки интерфейса, адаптация профилей.</p>';

    const actions = UIComponents.el('div', { className: 'mc-stub__actions' });

    const bSave = UIComponents.button({
      label: 'Сохранить',
      variant: 'primary',
      onClick: () => {
        const id = GameState.get().slotId;
        if (id) {
          SaveSystem.save(id);
          A11y.announce('Игра сохранена');
        } else {
          notifyNotImplemented('Сначала выберите слот сохранения в меню.');
        }
      }
    });

    const bMenu = UIComponents.button({
      label: 'В меню',
      variant: 'ghost',
      onClick: () => {
        const id = GameState.get().slotId;
        if (id && GameState.isDirty()) SaveSystem.save(id);
        ScreenRouter.show('menu');
      }
    });

    actions.appendChild(bSave);
    actions.appendChild(bMenu);
    wrap.appendChild(actions);
    return wrap;
  };

  /* ==========================================================================
     МОДУЛЬ 8. MenuWiring — связка событий BottomBar (часть 5) с роутером.
     Никаких новых глобальных обработчиков — только через EventBus и
     существующий document-level keydown.
     ========================================================================== */

  const MenuWiring = (() => {
    let installed = false;
    let autoSaveTimer = 0;

    const scheduleAutoSave = () => {
      if (!GameState.get().slotId) return;
      if (autoSaveTimer) clearTimeout(autoSaveTimer);
      TopBar.setSaveStatus('Сохранение…', 'saving');
      autoSaveTimer = setTimeout(() => {
        autoSaveTimer = 0;
        const id = GameState.get().slotId;
        if (id && GameState.isDirty()) SaveSystem.save(id);
      }, 800);
    };

    const onKeydown = (ev) => {
      if (ev.key !== 'Escape' && ev.key !== 'Esc') return;
      if (ModalManager.isOpen()) return;          // модалку закроет ModalManager
      const cur = ScreenRouter.current();
      if (cur && cur !== 'menu') {
        ev.preventDefault();
        ScreenRouter.show('menu');
      }
    };

    const install = () => {
      if (installed) return;
      installed = true;

      // Регистрация экранов.
      ScreenRouter.register('menu',       makeMenuScreen,     { title: Constants.APP_TAGLINE });
      ScreenRouter.register('save-slots', makeSaveSlotsScreen, { title: 'Сохранения' });
      ScreenRouter.register('about',      makeAboutScreen,     { title: 'Об игре' });
      ScreenRouter.register('game',       makeGameStubScreen,  { title: 'Расследование' });

      // Кнопки нижней панели из части 5.
      EventBus.on('ui:open-menu',     () => ScreenRouter.show('menu'));
      EventBus.on('ui:open-settings', () => notifyNotImplemented(
        'Настройки в этой сборке доступны из главного меню; расширенная панель настроек появится в следующей части.'));
      EventBus.on('ui:open-journal',  () => notifyNotImplemented(
        'Журнал расследования появится вместе с первой главой.'));
      EventBus.on('ui:open-board',    () => notifyNotImplemented(
        'Доска связей станет доступной после появления первых улик.'));

      // Автосохранение по изменению игрового состояния.
      EventBus.on('state:flag',           scheduleAutoSave);

     ========================================================================== */

    footer.appendChild(backBtn);

    return wrap;

  /* ==========================================================================
     МОДУЛЬ 3. SettingsWiring
     Осознанно заменяем обработчик 'ui:open-settings', установленный частью 6

     ========================================================================== */

    let installed = false;

    const install = () => {
      if (installed) return;
      installed = true;

      // Регистрируем экран настроек в существующем роутере части 6.
      ScreenRouter.register('settings', makeSettingsScreen, {
        title: 'Настройки',
        cache: false
      });

      // Снимаем старый обработчик-заглушку части 6 для этого единственного канала.
      EventBus.clear('ui:open-settings');

      // Ставим новый: открыть экран настроек, запомнив предыдущий экран,
      // чтобы кнопка «Назад» вернула пользователя туда, откуда он пришёл.
      EventBus.on('ui:open-settings', () => {
        const cur = ScreenRouter.current();
        if (cur && cur !== 'settings') previousScreenId = cur;
        ScreenRouter.show('settings');
      });

      // Если пользователь выбирает профиль — UIProfileManager уже реагирует
      // через settings:changed, дополнительно просто обновим статус в шапке.
      EventBus.on('settings:changed', () => {
        // Ничего навязчивого: точечная индикация в шапке.
        TopBar.setSaveStatus('Настройки сохранены', 'saved');
        setTimeout(() => {
          // Не перезатираем статус, если он уже изменился на что-то другое.
          const t = document.getElementById('mc-topbar-status');
          if (!t || t.textContent === 'Настройки сохранены') {
            TopBar.setSaveStatus('Готово', 'idle');
          }
        }, 1200);
      });

      // Полезная связка: если пользователь выбрал профиль вручную — убедимся,
      // что UIProfileManager.current() вернёт именно его. UIProfileManager
      // уже подписан на settings:changed, но одноразовый refresh не помешает
      // (например, если событие пришло до полной инициализации).
      try { UIProfileManager.refresh(); } catch (_) {}
    };

    return { install };
  })();

     ИНИЦИАЛИЗАЦИЯ ЧАСТИ 7
     ========================================================================== */

  Part7Styles.install();
  SettingsWiring.install();

  // На случай, если DesignSystem не был применён к текущим настройкам —
  // заставим его перечитать их. DesignSystem.applyAllFromSettings безопасен
  // и уже используется в части 2.
  try { DesignSystem.applyAllFromSettings(); } catch (e) {
    Logger.warn('settings', 'applyAllFromSettings failed', e);
  }

  // Публикуем только специфичное для части 7 — без новых глобальных имён.
  Object.assign(MC, {
    SettingsScreen: { make: makeSettingsScreen },
    SettingsWiring
  });

  Logger.info('app', 'Часть 7 инициализирована: SettingsScreen, SettingsWiring (канал ui:open-settings переназначен)');
  EventBus.emit('part7:ready', { at: Date.now(), profile: UIProfileManager.current() });

})(typeof window !== 'undefined' ? window : this);

     - EvidenceRegistry (реестр определений улик; сюжет наполняется в ч. 9+)
     - EvidenceAPI     (обнаружение/проверка улик, поверх GameState)
     - EvidenceViewer  (модальный просмотрщик: документ/фото/предмет/заметка)
     - JournalScreen   (экран «Журнал» с группировкой по категориям)
     - JournalWiring   (замена заглушки ui:open-journal из части 6)
   Правила:
     - новых глобальных переменных нет, только Object.assign(MC, {...});
     - второй RAF и второй GameState не создаются;
     - определение улики статично (реестр), факт обнаружения — в GameState;
     - внешних загрузок нет; canvas рисуется процедурно модулями части 4;
     - сюжет не выдумывается: реестр улик пуст, пока его не наполнят ч. 9+.
   ========================================================================== */
(function (global) {
  'use strict';

  const MC = global.MindCaseApp;
  if (!MC) {
    try { console.error('[MC][Part8] MindCaseApp не найден. Части 1–7 должны быть загружены раньше.'); }
    catch (_) {}
    return;
  }
  if (MC.__part8Initialized) {
    try { console.warn('[MC][Part8] Часть 8 уже инициализирована, повторный запуск пропущен.'); }
    catch (_) {}
    return;
  }
  Object.defineProperty(MC, '__part8Initialized', {
    value: true, enumerable: false, writable: false, configurable: false
  });

  const { Logger, EventBus, Constants, GameState, UIComponents, ModalManager,
          A11y, ScreenRouter, TopBar, DocumentRenderer, PhotoRenderer,
          ColorUtil, Rand } = MC;
  const { isPlainObject, uid } = MC.util;

  /* ==========================================================================
     МОДУЛЬ 1. Part8Styles

  const Part8Styles = (() => {

    const CSS = [

    const install = () => {

  /* ==========================================================================
     МОДУЛЬ 2. EvidenceRegistry
     Статический реестр определений улик. Части 9+ будут вызывать register().
     Определение:
       {
         id:        строка (уникальна),
         title:     строка,
         category:  'document' | 'photo' | 'item' | 'testimony' | 'note',
         icon:      эмодзи или короткая строка,
         summary:   короткое описание (для карточки),
         detail:    полное описание (в просмотрщике),
         render:    функция(ctx, rect, opts) для canvas-просмотрщика (опц.),
         doc:       опции для DocumentRenderer.drawPaper (опц.),
         photo:     опции для PhotoRenderer.drawPhoto (опц.),
         tags:      массив строк (для фильтрации в будущем),
         chapter:   строка или null
       }
     ========================================================================== */

  const EvidenceRegistry = (() => {
    const defs = new Map();

    const VALID_CATEGORIES = Object.freeze(['document', 'photo', 'item', 'testimony', 'note']);

    const normalize = (raw) => {
      if (!isPlainObject(raw)) return null;
      const id = String(raw.id || '').trim();
      if (!id) return null;
      const category = VALID_CATEGORIES.includes(raw.category) ? raw.category : 'item';
      return {
        id,
        title: String(raw.title || id),
        category,
        icon: String(raw.icon || categoryIcon(category)),
        summary: String(raw.summary || ''),
        detail: String(raw.detail || ''),
        render: typeof raw.render === 'function' ? raw.render : null,
        doc: isPlainObject(raw.doc) ? raw.doc : null,
        photo: isPlainObject(raw.photo) ? raw.photo : null,
        tags: Array.isArray(raw.tags) ? raw.tags.slice() : [],
        chapter: raw.chapter || null
      };
    };

    const categoryIcon = (category) => {
      switch (category) {
        case 'document':  return '📄';
        case 'photo':     return '🖼';
        case 'item':      return '◆';
        case 'testimony': return '💬';
        case 'note':      return '📝';
        default:          return '•';
      }
    };

    const register = (raw) => {
      const def = normalize(raw);
      if (!def) {
        Logger.warn('evidence', 'register: некорректное определение улики', raw);
        return null;
      }
      if (defs.has(def.id)) {
        Logger.warn('evidence', 'улика уже зарегистрирована, перезаписана: ' + def.id);
      }
      defs.set(def.id, def);
      EventBus.emit('evidence:registered', { id: def.id, category: def.category });
      return def;
    };

    const unregister = (id) => defs.delete(id);
    const get = (id) => defs.get(id) || null;
    const has = (id) => defs.has(id);
    const all = () => Array.from(defs.values());
    const ids = () => Array.from(defs.keys());
    const size = () => defs.size;

    return {
      register, unregister, get, has, all, ids, size,
      VALID_CATEGORIES,
      categoryIcon
    };
  })();

  /* ==========================================================================
     МОДУЛЬ 3. EvidenceAPI
     Обнаружение улик во время игры. Определение — в реестре, факт — в GameState.
     ========================================================================== */

  const EvidenceAPI = (() => {
    const isDiscovered = (id) => {
      const list = GameState.get().discoveredEvidence;
      for (let i = 0; i < list.length; i++) if (list[i].id === id) return true;
      return false;
    };

    const discoveredAt = (id) => {
      const list = GameState.get().discoveredEvidence;
      for (let i = 0; i < list.length; i++) if (list[i].id === id) return list[i].t;
      return null;
    };

    const isAnalysed = (id) => !!GameState.get().analysedEvidence[id];

    /** Обнаружить улику. Возвращает true при первом обнаружении. */
    const discover = (id, opts) => {
      const o = opts || {};
      const def = EvidenceRegistry.get(id);
      if (!def) {
        Logger.warn('evidence', 'discover: определение не зарегистрировано: ' + id);
        return false;
      }
      const added = GameState.addEvidence(id);
      if (!added) return false;

      if (o.silent !== true) {
        EventBus.emit('evidence:discovered', { id, def });
        EventBus.emit('ui:set-save-status', { text: 'Новая улика: ' + def.title, kind: 'saved' });
      }
      if (o.autoAnalyse) markAnalysed(id);
      return true;
    };

    const markAnalysed = (id) => {
      if (!isDiscovered(id)) return false;
      const st = GameState.get();
      if (st.analysedEvidence[id]) return false;
      st.analysedEvidence[id] = true;
      GameState.touch();
      EventBus.emit('evidence:analysed', { id });
      return true;
    };

    /** Вернёт список объектов { def, discoveredAt, analysed } для журнала. */
    const listDiscovered = () => {
      const st = GameState.get();
      const out = [];
      for (let i = 0; i < st.discoveredEvidence.length; i++) {
        const row = st.discoveredEvidence[i];
        const def = EvidenceRegistry.get(row.id);
        if (!def) continue; // определение пропало — не ломаемся
        out.push({ def, discoveredAt: row.t, analysed: !!st.analysedEvidence[row.id] });
      }
      // Свежие сверху.
      out.sort((a, b) => (b.discoveredAt || 0) - (a.discoveredAt || 0));
      return out;
    };

    const listByCategory = () => {
      const groups = new Map();
      EvidenceRegistry.VALID_CATEGORIES.forEach((c) => groups.set(c, []));
      const all = listDiscovered();
      for (let i = 0; i < all.length; i++) {
        const it = all[i];
        const c = it.def.category;
        if (!groups.has(c)) groups.set(c, []);
        groups.get(c).push(it);
      }
      return groups;
    };

    return {
      discover, isDiscovered, isAnalysed, markAnalysed, discoveredAt,
      listDiscovered, listByCategory,
      count: () => GameState.get().discoveredEvidence.length
    };
  })();

  /* ==========================================================================
     МОДУЛЬ 4. EvidenceViewer
     Модальный просмотрщик документа/фото. Использует существующий
     ModalManager.open (он же даёт focus trap, Escape, backdrop). Canvas
     рисуется процедурно модулями части 4. Второй RAF не создаём.
     ========================================================================== */

  const EvidenceViewer = (() => {
    let openedId = null;

    const buildCanvas = (def, docOpts, photoOpts) => {
      const canvas = document.createElement('canvas');
      const dpr = Math.min(2, Math.max(1, (global.devicePixelRatio || 1)));
      const logicalW = 720;
      const logicalH = def.category === 'photo' ? 520 : 720;
      canvas.width = logicalW * dpr;
      canvas.height = logicalH * dpr;
      canvas.className = 'mc-evidence-viewer__canvas';
      canvas.style.width = '100%';
      canvas.style.height = 'auto';
      canvas.style.aspectRatio = logicalW + '/' + logicalH;

      const ctx = canvas.getContext('2d');
      if (!ctx) return canvas;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#0b0f14';
      ctx.fillRect(0, 0, logicalW, logicalH);

      try {
        if (typeof def.render === 'function') {
          def.render(ctx, { x: 0, y: 0, w: logicalW, h: logicalH }, def);
        } else if (def.category === 'photo') {
          PhotoRenderer.drawPhoto(ctx, Object.assign({
            x: 24, y: 24, w: logicalW - 48, h: logicalH - 48,
            seed: def.id,
            caption: def.title,
            paint: (c, r) => {
              // Нейтральный фон: если у улики нет своей сцены — тихий градиент.
              const g = c.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
              g.addColorStop(0, '#2b3440');
              g.addColorStop(1, '#10141b');
              c.fillStyle = g;
              c.fillRect(r.x, r.y, r.w, r.h);
            }
          }, def.photo || photoOpts || {}));
        } else if (def.doc) {
          DocumentRenderer.drawPaper(ctx, Object.assign({
            x: 32, y: 24, w: logicalW - 64, h: logicalH - 48,
            seed: def.id,
            title: def.title,
            subtitle: def.summary || '',
            lines: 14,
            lineStyle: 'typed',
            folds: 1
          }, def.doc || docOpts || {}));
        } else {
          // Универсальная карточка для item/testimony/note.
          const rect = { x: 48, y: 48, w: logicalW - 96, h: logicalH - 96 };
          ctx.save();
          ctx.shadowColor = 'rgba(0,0,0,0.6)';
          ctx.shadowBlur = 22;
          ctx.shadowOffsetY = 8;
          ctx.fillStyle = '#141b26';
          ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
          ctx.restore();

          ctx.strokeStyle = 'rgba(79,179,201,0.6)';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(rect.x + 0.5, rect.y + 0.5, rect.w - 1, rect.h - 1);

          ctx.fillStyle = '#4fb3c9';
          ctx.font = 'bold 46px "Courier New", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(def.icon || EvidenceRegistry.categoryIcon(def.category),
                       rect.x + rect.w / 2, rect.y + 120);

          ctx.fillStyle = '#e6edf6';
          ctx.font = 'bold 22px Georgia, serif';
          ctx.fillText(def.title, rect.x + rect.w / 2, rect.y + 200);

          if (def.summary) {
            ctx.fillStyle = '#b7c2d3';
            ctx.font = '15px ui-sans-serif, system-ui, sans-serif';
            ctx.fillText(def.summary, rect.x + rect.w / 2, rect.y + 236);
          }

          if (def.detail) {
            ctx.fillStyle = '#7f8b9e';
            ctx.font = '13px "Courier New", monospace';
            const lines = String(def.detail).split('\n');
            const startY = rect.y + 300;
            const lineH = 20;
            for (let i = 0; i < lines.length && i < 12; i++) {
              ctx.fillText(lines[i], rect.x + rect.w / 2, startY + i * lineH);
            }
          }
        }
      } catch (e) {
        Logger.error('evidence-viewer', 'render failed for ' + def.id, e);
      }

      return canvas;
    };

    const buildToolbar = (def, api) => {
      const bar = document.createElement('div');
      bar.className = 'mc-evidence-viewer__toolbar';

      const analysed = EvidenceAPI.isAnalysed(def.id);
      const btnAnalyse = UIComponents.button({
        label: analysed ? 'Отмечено как изученное' : 'Отметить как изученное',
        variant: analysed ? 'ghost' : 'primary',
        disabled: analysed,
        onClick: () => {
          if (EvidenceAPI.markAnalysed(def.id)) {
            A11y.announce('Улика отмечена как изученная');
            ModalManager.close(api && api.id);
            EventBus.emit('journal:refresh-requested');
          }
        }
      });
      bar.appendChild(btnAnalyse);

      bar.appendChild(UIComponents.button({
        label: 'Закрыть',
        variant: 'ghost',
        onClick: () => ModalManager.close(api && api.id)
      }));

      return bar;
    };

    const buildBody = (def) => {
      const wrap = document.createElement('div');
      wrap.className = 'mc-evidence-viewer';

      const stage = document.createElement('div');
      stage.className = 'mc-evidence-viewer__stage';
      stage.setAttribute('data-zoom', '1');

      const canvas = buildCanvas(def);
      stage.appendChild(canvas);

      // Простой зум колесом/пинчем-по-тапу — без второго RAF.
      let zoom = 1;
      const applyZoom = () => {
        canvas.style.transform = 'scale(' + zoom + ')';
        canvas.style.transition = 'transform 160ms ease';
        stage.setAttribute('data-zoom', zoom > 1.05 ? '2' : '1');
      };
      const onWheel = (ev) => {
        ev.preventDefault();
        const dir = ev.deltaY < 0 ? 1 : -1;
        zoom = Math.min(2.5, Math.max(1, zoom + dir * 0.15));
        applyZoom();
      };
      stage.addEventListener('wheel', onWheel, { passive: false });

      // Двойной клик/тап — вернуть 1× или приблизить 1.6×.
      stage.addEventListener('dblclick', () => {
        zoom = zoom > 1.05 ? 1 : 1.6;
        applyZoom();
      });

      wrap.appendChild(stage);

      if (def.summary) {
        const caption = document.createElement('div');
        caption.className = 'mc-evidence-viewer__caption';
        caption.textContent = def.summary;
        wrap.appendChild(caption);
      }
      if (def.detail) {
        const meta = document.createElement('div');
        meta.className = 'mc-evidence-viewer__meta';
        meta.textContent = def.detail;
        wrap.appendChild(meta);
      }

      return { wrap, canvas, stage, applyZoom, getZoom: () => zoom, setZoom: (z) => { zoom = Math.min(2.5, Math.max(1, z)); applyZoom(); } };
    };

    const open = (id) => {
      const def = EvidenceRegistry.get(id);
      if (!def) {
        ModalManager.alert({ title: 'Улика недоступна', message: 'Определение улики не зарегистрировано.' });
        return false;
      }
      if (!EvidenceAPI.isDiscovered(id)) {
        ModalManager.alert({ title: 'Улика ещё не найдена', message: 'Сначала её нужно обнаружить в игре.' });
        return false;
      }

      const bodyInfo = buildBody(def);
      const modalId = 'evidence-' + def.id + '-' + uid('v').split('-').pop();

      const rec = ModalManager.open({
        id: modalId,
        title: def.title,
        body: bodyInfo.wrap,
        width: 'min(920px, 96vw)',
        closableByBackdrop: true,
        closableByEsc: true,
        actions: [], // кнопки ниже — кастомные
        onClose: () => { if (openedId === id) openedId = null; }
      });

      if (!rec) return false;

      // Вставляем кастомную нижнюю панель в panel после body.
      const panel = rec.panel;
      if (panel) {
        const bar = buildToolbar(def, rec.opts);
        bar.style.marginTop = 'var(--mc-s-3)';
        panel.appendChild(bar);
      }

      openedId = id;
      EventBus.emit('evidence:viewed', { id });
      return true;
    };

    const currentId = () => openedId;

    return { open, currentId };
  })();

  /* ==========================================================================
     МОДУЛЬ 5. JournalScreen
     Регистрируется в существующем ScreenRouter под id 'journal'.
     Пересобирается при каждом показе — так проще, чем подписываться на всё.
     ========================================================================== */

  const makeJournalScreen = () => {
    const wrap = UIComponents.el('div', { className: 'mc-journal' });

    const head = UIComponents.el('div', { className: 'mc-journal__head' });
    head.appendChild(UIComponents.el('h2', { className: 'mc-journal__title', text: 'Журнал расследования' }));

    const discovered = EvidenceAPI.listDiscovered();
    head.appendChild(UIComponents.el('div', {
      className: 'mc-journal__count',
      text: 'Обнаружено улик: ' + discovered.length + ' / ' + EvidenceRegistry.size()
    }));
    wrap.appendChild(head);

    if (discovered.length === 0) {
      const empty = UIComponents.el('div', { className: 'mc-journal__empty' });
      empty.innerHTML = ''
        + '<h3>ЖУРНАЛ ПОКА ПУСТ</h3>'
        + '<p>Улики появятся здесь по мере расследования. '
        + 'Осматривайте предметы, читайте документы и разговаривайте с персонажами.</p>';
      wrap.appendChild(empty);
    } else {
      const groups = EvidenceAPI.listByCategory();
      const labels = {
        document:  'Документы',
        photo:     'Фотографии',
        item:      'Вещественные доказательства',
        testimony: 'Показания',
        note:      'Заметки'
      };

      for (const [cat, list] of groups) {
        if (!list.length) continue;
        const group = UIComponents.el('section', { className: 'mc-journal__group' });
        group.appendChild(UIComponents.el('h3', {
          className: 'mc-journal__group-title',
          text: (labels[cat] || cat) + ' — ' + list.length
        }));

        const grid = UIComponents.el('div', { className: 'mc-journal__list' });
        for (let i = 0; i < list.length; i++) {
          const it = list[i];
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'mc-journal__card';
          card.setAttribute('data-analysed', it.analysed ? 'true' : 'false');
          card.setAttribute('aria-label', 'Открыть улику: ' + it.def.title);

          const ic = document.createElement('span');
          ic.className = 'mc-journal__card-icon';
          ic.setAttribute('aria-hidden', 'true');
          ic.textContent = it.def.icon;
          card.appendChild(ic);

          const title = document.createElement('span');
          title.className = 'mc-journal__card-title';
          title.textContent = it.def.title;
          card.appendChild(title);

  /* ==========================================================================
     МОДУЛЬ 3. PrologueScene
     Собирает CanvasScene для кабинета и подключает хотспоты.
     Мир: 1920×1080. Хотспоты выровнены под RoomDrawer.drawCabinet
     (окно в правой верхней части, дверь слева).
     ========================================================================== */

  const PrologueScene = (() => {
    const WORLD = Object.freeze({ w: 1920, h: 1080 });

    const buildHotspots = (scene) => {
      // Общая функция осмотра: обнаружение + просмотрщик.
      const inspect = (id) => {
        const wasNew = EvidenceAPI.discover(id);
        if (wasNew) {
          TopBar.setSaveStatus('Новая улика', 'saved');
          setTimeout(() => TopBar.setSaveStatus('Готово', 'idle'), 1600);
          A11y.announce('Обнаружена улика');
        }
        EvidenceViewer.open(id);
      };

      // Папка дела — ближе к центру стола.
      scene.addHotspot(Hotspot.create({
        id: 'hs-folder',
        kind: 'prop',
        tooltip: 'Папка дела',
        rect: { x: WORLD.w * 0.36, y: WORLD.h * 0.62, w: WORLD.w * 0.16, h: WORLD.h * 0.10 },
        onInspect: () => inspect(PrologueEvidence.IDS.FOLDER)
      }));

      // Кружка — слева от папки.
      scene.addHotspot(Hotspot.create({
        id: 'hs-mug',
        kind: 'prop',
        tooltip: 'Остывший кофе',
        rect: { x: WORLD.w * 0.24, y: WORLD.h * 0.66, w: WORLD.w * 0.07, h: WORLD.h * 0.07 },
        onInspect: () => inspect(PrologueEvidence.IDS.MUG)
      }));

      // Фотография — справа от папки.
      scene.addHotspot(Hotspot.create({
        id: 'hs-photo',
        kind: 'prop',
        tooltip: 'Фотография',
        rect: { x: WORLD.w * 0.55, y: WORLD.h * 0.62, w: WORLD.w * 0.10, h: WORLD.h * 0.10 },
        onInspect: () => inspect(PrologueEvidence.IDS.PHOTO)
      }));

      // Записка — у телефона, ближе к правому краю.
      scene.addHotspot(Hotspot.create({
        id: 'hs-note',
        kind: 'prop',
        tooltip: 'Записка с номером',
        rect: { x: WORLD.w * 0.68, y: WORLD.h * 0.66, w: WORLD.w * 0.09, h: WORLD.h * 0.07 },
        onInspect: () => inspect(PrologueEvidence.IDS.NOTE)
      }));

      // Окно — атмосферный осмотр без улики.
      scene.addHotspot(Hotspot.create({
        id: 'hs-window',
        kind: 'scenery',
        tooltip: 'Окно',
        rect: { x: WORLD.w * 0.55, y: WORLD.h * 0.10, w: WORLD.w * 0.28, h: WORLD.h * 0.20 },
        onInspect: () => {
          EventBus.emit('ui:set-save-status', { text: 'Дождь не стихает', kind: 'idle' });
          setTimeout(() => EventBus.emit('ui:set-save-status', { text: 'Готово', kind: 'idle' }), 1400);
        }
      }));

      // Дверь — тоже атмосфера.
      scene.addHotspot(Hotspot.create({
        id: 'hs-door',
        kind: 'scenery',
        tooltip: 'Дверь кабинета',
        rect: { x: WORLD.w * 0.06, y: WORLD.h * 0.30, w: WORLD.w * 0.06, h: WORLD.h * 0.42 },
        onInspect: () => {
          EventBus.emit('ui:set-save-status', { text: 'Тишина в коридоре', kind: 'idle' });
          setTimeout(() => EventBus.emit('ui:set-save-status', { text: 'Готово', kind: 'idle' }), 1400);
        }
      }));
    };

    /** Создать сцену внутри переданного контейнера. */
    const create = (container) => {
      const scene = CanvasScene.create({
        parent: container,
        worldWidth: WORLD.w,
        worldHeight: WORLD.h,
        background: '#0b0f14',
        camera: { initialZoom: 0.62, minZoom: 0.5, maxZoom: 1.4, smoothing: 0.12 },
        lighting: {
          ambient: 'rgba(6,10,18,0.42)',
          vignette: 0.6,
          lights: [
            { x: WORLD.w * 0.30, y: WORLD.h * 0.18, radius: 260, color: 'rgba(255,220,160,0.55)', intensity: 0.9, flicker: 0.05 },
            { x: WORLD.w * 0.72, y: WORLD.h * 0.22, radius: 200, color: 'rgba(140,180,220,0.45)', intensity: 0.55 }
          ],
          rainGlass: true,
          rainDensity: 22
        }
      });

      if (!scene) return null;
      if (scene._fallback) return scene; // Canvas недоступен — фабрика вернула fallback.

      // Отрисовка мира.
      scene.onDraw((ctx, cam) => {
        // Кабинет: стена + пол + окно + дверь.
        RoomDrawer.drawCabinet(ctx, { x: 0, y: 0, w: WORLD.w, h: WORLD.h, seed: 'prologue-office' });

        // Стол — простая доска переднего плана.
        const ty = WORLD.h * 0.60;
        const th = WORLD.h * 0.22;
        ctx.save();
        ctx.fillStyle = 'rgba(28,22,16,0.92)';
        ctx.fillRect(WORLD.w * 0.20, ty, WORLD.w * 0.60, th);
        ctx.strokeStyle = 'rgba(90,70,45,0.55)';
        ctx.lineWidth = 2;
        ctx.strokeRect(WORLD.w * 0.20 + 1, ty + 1, WORLD.w * 0.60 - 2, th - 2);
        // Тёплая подсветка стола.
        const g = ctx.createRadialGradient(WORLD.w * 0.50, ty + th * 0.35, 40,
                                           WORLD.w * 0.50, ty + th * 0.35, WORLD.w * 0.32);
        g.addColorStop(0, 'rgba(255,220,160,0.10)');
        g.addColorStop(1, 'rgba(255,220,160,0)');
        ctx.fillStyle = g;
        ctx.fillRect(WORLD.w * 0.20, ty, WORLD.w * 0.60, th);
        ctx.restore();
      });

      // Подпись снизу: подсказка.
      scene.onDrawUI((ctx, cam, vw, vh) => {
        const m = scene.metrics();
        if (!m.hovered) return;
        const hs = scene.findHotspotById(m.hovered);
        if (!hs) return;
        const meta = hs.getMeta();
        const text = meta.tooltip || meta.label || '';
        if (!text) return;

        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.font = '12px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace';
        const tw = ctx.measureText(text).width;
        const pad = 10;
        const bx = (vw - tw) / 2 - pad;
        const by = vh - 46;
        ctx.fillStyle = 'rgba(11,15,20,0.82)';
        ctx.strokeStyle = 'rgba(79,179,201,0.55)';
        ctx.lineWidth = 1;
        const bw = tw + pad * 2;
        const bh = 26;
        // Скруглённый прямоугольник.
        const r = 6;
        ctx.beginPath();
        ctx.moveTo(bx + r, by);
        ctx.lineTo(bx + bw - r, by);
        ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + r);
        ctx.lineTo(bx + bw, by + bh - r);
        ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - r, by + bh);
        ctx.lineTo(bx + r, by + bh);
        ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - r);
        ctx.lineTo(bx, by + r);
        ctx.quadraticCurveTo(bx, by, bx + r, by);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#e6edf6';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, vw / 2, by + bh / 2);
        ctx.restore();
      });

      buildHotspots(scene);
      scene.start();
      return scene;
    };

    return { create, WORLD };
  })();

  /* ==========================================================================
     МОДУЛЬ 4. PrologueScreen
     Фабрика для ScreenRouter. Возвращает DOM-узел экрана 'game'.
     Сцена создаётся ПОСЛЕ того, как узел попал в DOM — этим занимается
     PrologueWiring через подписку на ui:slot-shown.
     ========================================================================== */

  const makePrologueScreen = () => {
    const wrap = document.createElement('div');
    wrap.className = 'mc-prologue';

    const stage = document.createElement('div');
    stage.className = 'mc-prologue__stage';
    stage.setAttribute('data-mc-prologue-stage', '1');
    wrap.appendChild(stage);

    const overlay = document.createElement('div');
    overlay.className = 'mc-prologue__overlay';

    // Верхний блок — вводный текст.
    const banner = document.createElement('div');
    banner.className = 'mc-prologue__banner';
    banner.appendChild(UIComponents.el('div', { className: 'mc-prologue__kicker', text: 'Пролог' }));
    banner.appendChild(UIComponents.el('h2', { className: 'mc-prologue__title',
      text: 'Кабинет следователя' }));
    banner.appendChild(UIComponents.el('p', { className: 'mc-prologue__text',
      text: 'Поздний вечер. За окном не стихает дождь. На столе — вчерашние материалы: ' +
            'папка дела, остывший кофе, фотография и записка с чужим почерком. ' +
            'Наведите курсор на предметы и осмотрите их.' }));
    overlay.appendChild(banner);

    // Средний ряд — пустое место для сцены (сцена лежит под overlay).
    overlay.appendChild(document.createElement('div'));

    // Нижний блок: подсказка и действия.
    const bottom = document.createElement('div');
    bottom.style.display = 'flex';
    bottom.style.flexDirection = 'column';
    bottom.style.gap = 'var(--mc-s-2)';

    const hint = document.createElement('div');
    hint.className = 'mc-prologue__hint';
    hint.textContent = 'Кликните по предмету — открыть. Стрелки — навигация по предметам.';
    bottom.appendChild(hint);

    const actions = document.createElement('div');
    actions.className = 'mc-prologue__actions';

    actions.appendChild(UIComponents.button({
      label: 'Сохранить',
      variant: 'primary',
      onClick: () => {
        const id = GameState.get().slotId;
        if (id && MC.SaveSystem) {
          MC.SaveSystem.save(id);
          A11y.announce('Игра сохранена');
        } else {
          A11y.announce('Сначала выберите слот в меню');
        }
      }
    }));

    actions.appendChild(UIComponents.button({
      label: 'Журнал',
      variant: 'ghost',
      onClick: () => ScreenRouter.show('journal')
    }));

    actions.appendChild(UIComponents.button({
      label: 'В меню',
      variant: 'ghost',
      onClick: () => {
        const id = GameState.get().slotId;
        if (id && MC.SaveSystem && GameState.isDirty()) MC.SaveSystem.save(id);
        ScreenRouter.show('menu');
      }
    }));

    bottom.appendChild(actions);
    overlay.appendChild(bottom);

    wrap.appendChild(overlay);
    return wrap;
  };

  /* ==========================================================================
     МОДУЛЬ 5. PrologueWiring
     - Перерегистрирует 'game' в ScreenRouter (заглушка части 6 заменяется).
     - Создаёт сцену при показе 'game' и освобождает её при уходе с экрана.
     - Подписывается только на существующий канал ui:slot-shown.
     ========================================================================== */

  const PrologueWiring = (() => {
    let installed = false;
    let currentScene = null;
    let sceneHost = null;

    const findStage = () => {
      // #mc-main содержит узел экрана 'game' (mc-prologue) со stage внутри.
      return document.querySelector('.mc-prologue [data-mc-prologue-stage]');
    };

    const destroyScene = () => {
      if (currentScene) {
        try { currentScene.dispose(); } catch (e) { Logger.warn('prologue', 'dispose failed', e); }
      }
      currentScene = null;
      sceneHost = null;

  /* ==========================================================================
     МОДУЛЬ 2. CharacterRegistry
     Статический реестр персонажей. Определение:
       {
         id, name, title, description,
         seed, palette: { bg, fg, accent }, portrait: (ctx, rect, char) => void
       }
     Портрет по умолчанию рисуется PortraitRenderer'ом — если у персонажа
     не задана своя функция portrait.
     ========================================================================== */

  const CharacterRegistry = (() => {
    const chars = new Map();

    const normalize = (raw) => {
      if (!isPlainObject(raw)) return null;
      const id = String(raw.id || '').trim();
      if (!id) return null;
      return {
        id,
        name: String(raw.name || id),
        title: String(raw.title || ''),
        description: String(raw.description || ''),
        seed: String(raw.seed || id),
        palette: isPlainObject(raw.palette) ? Object.assign({
          bg: '#182130', fg: '#e6edf6', accent: '#4fb3c9'
        }, raw.palette) : { bg: '#182130', fg: '#e6edf6', accent: '#4fb3c9' },
        portrait: typeof raw.portrait === 'function' ? raw.portrait : null
      };
    };

    const register = (raw) => {
      const c = normalize(raw);
      if (!c) { Logger.warn('character', 'register: некорректное определение', raw); return null; }
      if (chars.has(c.id)) Logger.warn('character', 'перезапись персонажа: ' + c.id);
      chars.set(c.id, c);
      EventBus.emit('character:registered', { id: c.id });
      return c;
    };

    const unregister = (id) => chars.delete(id);
    const get = (id) => chars.get(id) || null;
    const has = (id) => chars.has(id);
    const all = () => Array.from(chars.values());
    const size = () => chars.size;

    return { register, unregister, get, has, all, size };
  })();

  /* ==========================================================================
     МОДУЛЬ 3. PortraitRenderer
     Рисует статичный портрет-силуэт на переданном canvas'е (один раз).
     Никакого RAF. Не создаёт DOM — только работает с уже готовым контекстом.
     ========================================================================== */

  const PortraitRenderer = (() => {
    const draw = (canvas, char) => {
      if (!canvas || !char) return;
      const dpr = Math.min(2, Math.max(1, global.devicePixelRatio || 1));
      const logicalW = 300;
      const logicalH = 400;
      canvas.width = logicalW * dpr;
      canvas.height = logicalH * dpr;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const pal = char.palette || { bg: '#182130', fg: '#e6edf6', accent: '#4fb3c9' };
      const rng = Rand.fromSeed(char.seed + ':portrait');

      // Фон — вертикальный градиент.
      const g = ctx.createLinearGradient(0, 0, 0, logicalH);
      g.addColorStop(0, ColorUtil.toCss(ColorUtil.shade(pal.bg, 0.08)));
      g.addColorStop(1, ColorUtil.toCss(ColorUtil.shade(pal.bg, -0.22)));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, logicalW, logicalH);

      // Лёгкое шумовое зерно.
      const img = ctx.getImageData(0, 0, logicalW, logicalH);
      const d = img.data;
      const amp = 6;
      for (let i = 0; i < d.length; i += 4) {
        const n = (rng.next() - 0.5) * amp;
        d[i] = Math.max(0, Math.min(255, d[i] + n));
        d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
        d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n));
      }
      ctx.putImageData(img, 0, 0);

      // Кастомный портрет, если задан.
      if (typeof char.portrait === 'function') {
        try { char.portrait(ctx, { x: 0, y: 0, w: logicalW, h: logicalH }, char); }
        catch (e) { Logger.error('portrait', 'custom portrait failed for ' + char.id, e); }
      } else {
        // Силуэт по умолчанию: голова + плечи.
        const cx = logicalW * 0.5;
        const headR = logicalW * 0.20;
        const headY = logicalH * 0.38;

        // Плечи.
        ctx.fillStyle = 'rgba(11,15,20,0.92)';
        ctx.beginPath();
        ctx.moveTo(logicalW * 0.06, logicalH);
        ctx.quadraticCurveTo(cx, logicalH * 0.55, logicalW * 0.94, logicalH);
        ctx.closePath();
        ctx.fill();

        // Голова.
        ctx.beginPath();
        ctx.arc(cx, headY, headR, 0, Math.PI * 2);
        ctx.fill();

        // Очень слабая акцентная подсветка за головой.
        const ag = ctx.createRadialGradient(cx, headY, headR * 0.6, cx, headY, headR * 2.4);
        ag.addColorStop(0, ColorUtil.toCss(pal.accent, 0.10));
        ag.addColorStop(1, ColorUtil.toCss(pal.accent, 0));
        ctx.fillStyle = ag;
        ctx.fillRect(0, 0, logicalW, logicalH);
      }

      // Тонкая рамка-акцент.
      ctx.strokeStyle = ColorUtil.toCss(pal.accent, 0.55);
      ctx.lineWidth = 1.5;
      ctx.strokeRect(0.75, 0.75, logicalW - 1.5, logicalH - 1.5);
    };

    return { draw };
  })();

  /* ==========================================================================
     МОДУЛЬ 4. DialogueGraph
     Реестр графов диалога. Определение:
       {
         entry: 'nodeId',
         nodes: {
           nodeId: {
             speaker: characterId | null,
             text: string | (session) => string,
             choices: [
               { id, label, next, require, effects, once, hideIf }
             ],
             autoNext: 'nodeId' | null,
             onEnter: (session, api) => void,
             evidenceResponses: { [evidenceId]: nodeId },
