<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>3D Multiplayer Room</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <div id="app">

    <!-- ================ МЕНЮ ================ -->
    <div id="menu" class="screen">
      <div class="menu-card">
        <h1>3D Multiplayer</h1>
        <p class="subtitle">Комнатная вечеринка в браузере</p>

        <label for="nameInput">Ваше имя</label>
        <input id="nameInput" type="text" maxlength="20" placeholder="Введите имя" autocomplete="off" />

        <button id="createBtn" class="btn primary">Создать комнату</button>

        <div class="divider"><span>или</span></div>

        <label for="roomInput">Код комнаты</label>
        <input id="roomInput" type="text" maxlength="5" placeholder="ABCDE" autocomplete="off" autocapitalize="characters" />

        <button id="joinBtn" class="btn">Войти по коду</button>

        <div id="error" class="error"></div>

        <div class="status-row">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">Не подключено</span>
        </div>
      </div>
    </div>

    <!-- ================ ИГРА ================ -->
    <div id="game" class="screen hidden">
      <canvas id="renderCanvas" touch-action="none"></canvas>

      <div id="hud">
        <div class="hud-top-left">
          <div class="panel room-info">
            <div class="room-label">Код комнаты</div>
            <div class="room-code-row">
              <span id="roomCodeDisplay">-----</span>
              <button id="copyBtn" class="icon-btn" title="Скопировать">⧉</button>
            </div>
          </div>

          <div class="panel players-panel">
            <div class="players-title">Игроки (<span id="playersCount">0</span>)</div>
            <ul id="playersList"></ul>
            <div class="local-name">Вы: <span id="localName">—</span></div>
          </div>
        </div>

        <div class="hud-top-right">
          <button id="leaveBtn" class="btn small danger">Выйти</button>
          <div class="conn-status"><span id="connStatus">online</span></div>
        </div>

        <div id="notification" class="notification"></div>
      </div>

      <div id="joystick" class="joystick hidden">
        <div id="joystickKnob" class="joystick-knob"></div>
      </div>

      <div id="runBtn" class="run-btn hidden">RUN</div>
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
