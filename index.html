<html lang="ru" data-mc-build="1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="MIND CASE — детективная игра в одном HTML-файле. Полностью автономная, без загрузок из сети.">
<title>MIND CASE — Правда всегда оставляет след</title>
<style>
/* ============================================================
   MIND CASE — Встроенная дизайн-система (часть 1)
   Никаких @import, никаких url(...), никаких внешних шрифтов.
   ============================================================ */

/* ---- Reset ------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  background: var(--mc-bg-0);
  color: var(--mc-fg-0);
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
img, svg, canvas { display: block; max-width: 100%; }
[hidden] { display: none !important; }

/* ---- Токены дизайн-системы -------------------------------- */
:root {
  /* Палитра: глубокий графит, холодный серый, тёмно-синий */
  --mc-bg-0: #0b0f14;   /* базовый фон */
  --mc-bg-1: #111823;   /* панели */
  --mc-bg-2: #182130;   /* приподнятые поверхности */
  --mc-bg-3: #1f2a3b;   /* hover-фон */
  --mc-line-0: #24314a; /* границы */
  --mc-line-1: #33445f; /* акцентные границы */

  --mc-fg-0: #e6edf6;   /* основной текст */
  --mc-fg-1: #b7c2d3;   /* второстепенный */
  --mc-fg-2: #7f8b9e;   /* приглушённый */
  --mc-fg-3: #4e5a6c;   /* отключённый */

  /* Смысловые цвета */
  --mc-accent:   #4fb3c9;  /* бирюза — подтверждённые связи */
  --mc-warn:     #d9a441;  /* янтарь — подозрительные детали */
  --mc-danger:   #c8424b;  /* красный — предупреждения */
  --mc-ok:       #4bbf7b;  /* зелёный — успех */
  --mc-paper:    #ece6d6;  /* молочно-белый — документы */
  --mc-paper-ink:#1c1a16;

  /* Типографика */
  --mc-font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mc-font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;

  --mc-fs-xs: 11px;
  --mc-fs-sm: 13px;
  --mc-fs-md: 15px;
  --mc-fs-lg: 18px;
  --mc-fs-xl: 24px;
  --mc-fs-2xl: 34px;
  --mc-fs-3xl: 48px;

  --mc-lh-tight: 1.15;
  --mc-lh-normal: 1.45;
  --mc-lh-loose: 1.7;

  /* Отступы */
  --mc-s-1: 4px;
  --mc-s-2: 8px;
  --mc-s-3: 12px;
  --mc-s-4: 16px;
  --mc-s-5: 24px;
  --mc-s-6: 32px;
  --mc-s-7: 48px;

  /* Радиусы */
  --mc-r-1: 4px;
  --mc-r-2: 6px;
  --mc-r-3: 10px;
  --mc-r-4: 16px;
  --mc-r-pill: 999px;

  /* Тени */
  --mc-sh-1: 0 1px 2px rgba(0,0,0,.45);
  --mc-sh-2: 0 4px 14px rgba(0,0,0,.55);
  --mc-sh-3: 0 12px 40px rgba(0,0,0,.7);
  --mc-focus: 0 0 0 2px var(--mc-bg-0), 0 0 0 4px var(--mc-accent);

  /* Анимации */
  --mc-t-fast: 120ms;
  --mc-t-mid: 220ms;
  --mc-t-slow: 380ms;
  --mc-ease: cubic-bezier(.2,.7,.2,1);

  /* Безопасные зоны (iOS/Android/ТВ) */
  --mc-safe-t: env(safe-area-inset-top, 0px);
  --mc-safe-r: env(safe-area-inset-right, 0px);
  --mc-safe-b: env(safe-area-inset-bottom, 0px);
  --mc-safe-l: env(safe-area-inset-left, 0px);

  /* Динамически меняемые пользователем (через SettingsStore) */
  --mc-user-font-scale: 1;
  --mc-user-contrast: 0;
}

/* Уважаем системную настройку уменьшения движения */
@media (prefers-reduced-motion: reduce) {
  :root { --mc-t-fast: 0ms; --mc-t-mid: 0ms; --mc-t-slow: 0ms; }
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* Класс-переключатель уменьшения анимаций из настроек */
html.mc-reduced-motion * {
  animation-duration: .001ms !important;
  transition-duration: .001ms !important;
}

/* Класс повышенной контрастности */
html.mc-high-contrast {
  --mc-fg-0: #ffffff;
  --mc-fg-1: #e8eef7;
  --mc-fg-2: #c3ccdb;
  --mc-line-0: #4a5d7e;
  --mc-line-1: #6f8bb4;
}

/* ---- Корневая оболочка ------------------------------------ */
.mc-app {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-rows: auto 1fr auto;
  background: radial-gradient(120% 80% at 50% 0%, #16202f 0%, var(--mc-bg-0) 60%);
  color: var(--mc-fg-0);
  font-size: calc(var(--mc-fs-md) * var(--mc-user-font-scale));
  line-height: var(--mc-lh-normal);
  padding: var(--mc-safe-t) var(--mc-safe-r) var(--mc-safe-b) var(--mc-safe-l);
  isolation: isolate;
}

/* Слои: сцена → UI → модалки → уведомления */
.mc-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.mc-layer > * { pointer-events: auto; }
#mc-scene-layer { z-index: 1; }
#mc-ui-layer    { z-index: 2; display: grid; grid-template-rows: auto 1fr auto; }
#mc-modal-layer { z-index: 3; }
#mc-notify-layer{ z-index: 4; }

/* ---- Базовые компоненты ----------------------------------- */
.mc-btn {
  appearance: none;
  border: 1px solid var(--mc-line-1);
  background: linear-gradient(180deg, var(--mc-bg-2), var(--mc-bg-1));
  color: var(--mc-fg-0);
  padding: 10px 16px;
  border-radius: var(--mc-r-3);
  cursor: pointer;
  font-size: var(--mc-fs-sm);
  letter-spacing: .03em;
  transition: background var(--mc-t-fast) var(--mc-ease),
              border-color var(--mc-t-fast) var(--mc-ease),
              transform var(--mc-t-fast) var(--mc-ease),
              box-shadow var(--mc-t-fast) var(--mc-ease);
  min-height: 40px;
  user-select: none;
}
.mc-btn:hover { background: linear-gradient(180deg, var(--mc-bg-3), var(--mc-bg-2)); }
.mc-btn:active { transform: translateY(1px); }
.mc-btn:focus-visible { outline: none; box-shadow: var(--mc-focus); }
.mc-btn[disabled] { opacity: .5; cursor: not-allowed; }
.mc-btn--primary {
  border-color: var(--mc-accent);
  background: linear-gradient(180deg, #2b6f7d, #1c4c58);
}
.mc-btn--danger { border-color: var(--mc-danger); }
.mc-btn--ghost { background: transparent; border-color: var(--mc-line-0); }

.mc-card {
  background: var(--mc-bg-1);
  border: 1px solid var(--mc-line-0);
  border-radius: var(--mc-r-3);
  padding: var(--mc-s-4);
  box-shadow: var(--mc-sh-1);
}
.mc-card--paper {
  background: var(--mc-paper);
  color: var(--mc-paper-ink);
  border-color: #c9c0a7;
  font-family: var(--mc-font-mono);
}

.mc-kbd {
  font-family: var(--mc-font-mono);
  font-size: var(--mc-fs-xs);
  background: var(--mc-bg-2);
  border: 1px solid var(--mc-line-1);
  border-bottom-width: 2px;
  border-radius: var(--mc-r-1);
  padding: 1px 6px;
  color: var(--mc-fg-0);
}

/* ---- Уведомления ------------------------------------------ */
.mc-notify {
  position: absolute;
  top: calc(var(--mc-s-4) + var(--mc-safe-t));
  right: calc(var(--mc-s-4) + var(--mc-safe-r));
  display: flex; flex-direction: column; gap: var(--mc-s-2);
  max-width: min(380px, 82vw);
}
.mc-notify__item {
  background: var(--mc-bg-2);
  border-left: 3px solid var(--mc-accent);
  border-radius: var(--mc-r-2);
  padding: 10px 14px;
  box-shadow: var(--mc-sh-2);
  font-size: var(--mc-fs-sm);
  animation: mc-slide-in var(--mc-t-mid) var(--mc-ease);
}
.mc-notify__item[data-kind="warn"] { border-left-color: var(--mc-warn); }
.mc-notify__item[data-kind="error"] { border-left-color: var(--mc-danger); }
.mc-notify__item[data-kind="ok"] { border-left-color: var(--mc-ok); }
@keyframes mc-slide-in {
  from { opacity: 0; transform: translateX(20px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ---- Только для скринридеров ------------------------------ */
.mc-sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0);
  white-space: nowrap; border: 0;
}

/* ---- Fallback, если Canvas недоступен --------------------- */
.mc-nocanvas {
  padding: var(--mc-s-5);
  text-align: center;
  color: var(--mc-fg-1);
  font-family: var(--mc-font-mono);
}
</style>
</head>

<!-- ============================================================
     Корневая разметка приложения.
     Слои: scene → ui → modal → notify.
     ============================================================ -->
<div id="mc-app" class="mc-app" role="application" aria-label="MIND CASE — детективная игра">

  <!-- Слой Canvas-сцены (заполнится в Части 3) -->
  <div id="mc-scene-layer" class="mc-layer" aria-hidden="true"></div>

  <!-- Слой основного UI -->
  <div id="mc-ui-layer" class="mc-layer">
    <header id="mc-topbar" role="banner"></header>
    <main id="mc-main" role="main" tabindex="-1"></main>
    <footer id="mc-bottombar" role="contentinfo"></footer>
  </div>

  <!-- Слой модальных окон -->
  <div id="mc-modal-layer" class="mc-layer" aria-hidden="true"></div>

  <!-- Слой уведомлений (aria-live для скринридеров) -->
  <div id="mc-notify-layer" class="mc-layer" aria-live="polite" aria-atomic="false">
    <div id="mc-notify-host" class="mc-notify"></div>
  </div>

  <!-- Регион для озвучивания статусов -->
  <div id="mc-live" class="mc-sr-only" aria-live="polite" aria-atomic="true"></div>

</div>

<!-- ============================================================
     Единый встроенный модуль JavaScript.
     ВНИМАНИЕ: тег <script> НЕ ЗАКРЫВАЕТСЯ в Части 1.
     Закрытие произойдёт в Части 20 вместе с </body></html>.
     Все последующие части продолжают этот же блок.
     ============================================================ -->
<script>
'use strict';
/* ============================================================================
   MIND CASE — единый встроенный модуль JavaScript.
   Часть 1. Фундамент: пространство имён, константы, логгер, шина событий,
   хранилище, состояние игры, детектор платформы, диагностика,
   уведомления, каркас приложения и boot-процедура.

   Правила файла:
   - Никаких внешних загрузок (fetch, XHR, WebSocket, import, src, href).
   - Единственный контролируемый глобальный объект: window.MindCaseApp.
   - Всё остальное инкапсулировано внутри IIFE ниже.
   ========================================================================== */
(function (global) {
  'use strict';

  /* --------------------------------------------------------------------------
     0. Утилиты-помощники, безопасные для любых окружений.
     -------------------------------------------------------------------------- */

  const HAS = (obj, key) => obj && Object.prototype.hasOwnProperty.call(obj, key);

  /** Безопасный structuredClone с резервной реализацией через JSON. */
  const clone = (value) => {
    try {
      if (typeof global.structuredClone === 'function') {
        return global.structuredClone(value);
      }
    } catch (_) { /* игнорируем, уходим в fallback */ }
    try {
      return JSON.parse(JSON.stringify(value));
    } catch (_) {
      return value;
    }
  };

  /** Универсальный clamp. */
  const clamp = (n, min, max) => Math.min(max, Math.max(min, n));

  /** Проверка: значение — простой объект (не null, не массив). */
  const isPlainObject = (v) =>
    v !== null && typeof v === 'object' && !Array.isArray(v);

  /** Безопасный парсинг JSON, возвращающий fallback при ошибке. */
  const safeJSONParse = (text, fallback) => {
    try { return JSON.parse(text); } catch (_) { return fallback; }
  };

  /** Создание короткого уникального идентификатора. */
  const uid = (prefix) => {
    const rnd = Math.random().toString(36).slice(2, 8);
    return (prefix ? prefix + '-' : '') + Date.now().toString(36) + '-' + rnd;
  };

  /** Форматирование времени (для логов). */
  const nowISO = () => new Date().toISOString();

  /* --------------------------------------------------------------------------
     1. Constants — единый источник констант.
     -------------------------------------------------------------------------- */

  const Constants = Object.freeze({
    APP_NAME: 'MIND CASE',
    APP_TAGLINE: 'Правда всегда оставляет след',
    APP_VERSION: '1.0.0-part1',
    SAVE_SCHEMA_VERSION: 1,

    /** Ключи localStorage (резервный канал сохранений). */
    STORAGE_KEYS: Object.freeze({
      SETTINGS: 'mc.settings.v1',
      SAVE_INDEX: 'mc.saves.index.v1',
      SAVE_PREFIX: 'mc.save.',
      BOOT_LOG: 'mc.bootlog.v1'
    }),

    /** Идентификаторы баз данных IndexedDB. */
    IDB: Object.freeze({
      DB_NAME: 'mindcase',
      DB_VERSION: 1,
      STORES: Object.freeze({
        SAVES: 'saves',
        SETTINGS: 'settings',
        LOGS: 'logs'
      })
    }),

    /** Ограничения и лимиты. */
    LIMITS: Object.freeze({
      NOTIFY_MAX: 5,
      LOG_BUFFER: 500,
      SAVE_SLOTS: 3
    }),

    /** Уровни логирования. */
    LOG_LEVELS: Object.freeze({
      TRACE: 10,
      DEBUG: 20,
      INFO: 30,
      WARN: 40,
      ERROR: 50,
      SILENT: 100
    }),

    /** Категории уведомлений. */
    NOTIFY_KINDS: Object.freeze(['info', 'ok', 'warn', 'error']),

    /** Диагностические идентификаторы ошибок. */
    ERR: Object.freeze({
      BOOT_FAIL: 'MC-E-BOOT-01',
      STORAGE_UNAVAILABLE: 'MC-E-STORE-01',
      STATE_CORRUPT: 'MC-E-STATE-01',
      CANVAS_UNAVAILABLE: 'MC-E-CANVAS-01',
      AUDIO_UNAVAILABLE: 'MC-E-AUDIO-01',
      GAMEPAD_UNAVAILABLE: 'MC-E-GPAD-01',
      UNKNOWN: 'MC-E-UNKNOWN'
    }),

    /** Идентификаторы платформенных профилей. */
    PROFILES: Object.freeze({
      DESKTOP: 'desktop',
      MOBILE: 'mobile',
      TABLET: 'tablet',
      TV: 'tv',
      AUTO: 'auto'
    })
  });

  /* --------------------------------------------------------------------------
     2. Logger — уровни, буфер, подписка.
     -------------------------------------------------------------------------- */

  const Logger = (() => {
    const buffer = [];
    const subscribers = new Set();
    let currentLevel = Constants.LOG_LEVELS.DEBUG;

    const levelName = (n) => {
      for (const k of Object.keys(Constants.LOG_LEVELS)) {
        if (Constants.LOG_LEVELS[k] === n) return k;
      }
      return 'LVL' + n;
    };

    const record = (level, scope, message, data) => {
      if (level < currentLevel) return;
      const entry = {
        t: Date.now(),
        ts: nowISO(),
        level,
        levelName: levelName(level),
        scope: scope || 'app',
        message: String(message == null ? '' : message),
        data: data === undefined ? null : safeSerialize(data)
      };
      buffer.push(entry);
      if (buffer.length > Constants.LIMITS.LOG_BUFFER) buffer.shift();

      // Проброс в консоль (без шума в silent-режиме).
      if (currentLevel < Constants.LOG_LEVELS.SILENT) {
        const tag = '[MC][' + entry.levelName + '][' + entry.scope + ']';
        const fn = level >= Constants.LOG_LEVELS.ERROR ? 'error'
                 : level >= Constants.LOG_LEVELS.WARN  ? 'warn'
                 : level >= Constants.LOG_LEVELS.INFO  ? 'info'
                 : 'log';
        try { console[fn](tag, message, entry.data == null ? '' : entry.data); }
        catch (_) { /* консоль может быть недоступна */ }
      }

      for (const fn of subscribers) {
        try { fn(entry); } catch (_) { /* не роняем логгер */ }
      }
    };

    const safeSerialize = (value) => {
      try {
        if (value instanceof Error) {
          return { name: value.name, message: value.message, stack: value.stack };
        }
        return clone(value);
      } catch (_) { return String(value); }
    };

    return {
      setLevel(lvl) { currentLevel = lvl; },
      getLevel() { return currentLevel; },
      trace: (s, m, d) => record(Constants.LOG_LEVELS.TRACE, s, m, d),
      debug: (s, m, d) => record(Constants.LOG_LEVELS.DEBUG, s, m, d),
      info:  (s, m, d) => record(Constants.LOG_LEVELS.INFO,  s, m, d),
      warn:  (s, m, d) => record(Constants.LOG_LEVELS.WARN,  s, m, d),
      error: (s, m, d) => record(Constants.LOG_LEVELS.ERROR, s, m, d),
      subscribe(fn) { subscribers.add(fn); return () => subscribers.delete(fn); },
      getBuffer() { return buffer.slice(); },
      clear() { buffer.length = 0; }
    };
  })();

  /* --------------------------------------------------------------------------
     3. EventBus — слабосвязанные события между модулями.
     -------------------------------------------------------------------------- */

  const EventBus = (() => {
    /** @type {Map<string, Set<Function>>} */
    const map = new Map();

    const on = (event, handler) => {
      if (typeof handler !== 'function') return () => {};
      if (!map.has(event)) map.set(event, new Set());
      map.get(event).add(handler);
      return () => off(event, handler);
    };

    const once = (event, handler) => {
      const wrap = (payload) => { off(event, wrap); try { handler(payload); } catch (e) { Logger.error('bus', 'once handler error', e); } };
      return on(event, wrap);
    };

    const off = (event, handler) => {
      const set = map.get(event);
      if (!set) return false;
      const had = set.delete(handler);
      if (set.size === 0) map.delete(event);
      return had;
    };

    const emit = (event, payload) => {
      const set = map.get(event);
      if (!set || set.size === 0) return 0;
      const snapshot = Array.from(set);
      let handled = 0;
      for (const fn of snapshot) {
        try { fn(payload); handled++; }
        catch (e) {
          Logger.error('bus', 'handler threw for event "' + event + '"', e);
        }
      }
      return handled;
    };

    const clear = (event) => {
      if (event === undefined) map.clear();
      else map.delete(event);
    };

    const listeners = () => {
      const out = {};
      for (const [k, v] of map) out[k] = v.size;
      return out;
    };

    return { on, once, off, emit, clear, listeners };
  })();

  /* --------------------------------------------------------------------------
     4. FeatureDetect — проверка доступных браузерных API.
     -------------------------------------------------------------------------- */

  const FeatureDetect = (() => {
    const detect = () => {
      const features = {
        localStorage: false,
        sessionStorage: false,
        indexedDB: false,
        canvas2d: false,
        webAudio: false,
        gamepad: false,
        pointerEvents: false,
        touchEvents: false,
        resizeObserver: false,
        requestAnimationFrame: false,
        abortController: false,
        structuredClone: false
      };

      try { features.localStorage = !!global.localStorage; } catch (_) {}
      try { features.sessionStorage = !!global.sessionStorage; } catch (_) {}
      try { features.indexedDB = !!(global.indexedDB || global.mozIndexedDB || global.webkitIndexedDB); } catch (_) {}
      try {
        const c = document.createElement('canvas');
        features.canvas2d = !!(c && typeof c.getContext === 'function' && c.getContext('2d'));
      } catch (_) {}
      try {
        features.webAudio = !!(global.AudioContext || global.webkitAudioContext);
      } catch (_) {}
      try { features.gamepad = typeof navigator !== 'undefined' && 'getGamepads' in navigator; } catch (_) {}
      try { features.pointerEvents = typeof global.PointerEvent === 'function'; } catch (_) {}
      try { features.touchEvents = 'ontouchstart' in global || (navigator && navigator.maxTouchPoints > 0); } catch (_) {}
      try { features.resizeObserver = typeof global.ResizeObserver === 'function'; } catch (_) {}
      try { features.requestAnimationFrame = typeof global.requestAnimationFrame === 'function'; } catch (_) {}
      try { features.abortController = typeof global.AbortController === 'function'; } catch (_) {}
      try { features.structuredClone = typeof global.structuredClone === 'function'; } catch (_) {}

      return features;
    };
    const cache = detect();
    return {
      all: () => cache,
      has(name) { return !!cache[name]; },
      refresh() { return detect(); }
    };
  })();

  /* --------------------------------------------------------------------------
     5. StorageAdapter — унифицированный доступ к localStorage/IndexedDB.
     Никаких сетевых запросов; только браузерные API.
     -------------------------------------------------------------------------- */

  const StorageAdapter = (() => {
    const status = {
      local: 'unknown',   // 'ok' | 'unavailable' | 'quota' | 'unknown'
      idb: 'unknown',
      lastError: null
    };

    // --- localStorage ---
    const ls = {
      isAvailable() {
        try {
          const k = '__mc_probe__' + Math.random();
          global.localStorage.setItem(k, '1');
          global.localStorage.removeItem(k);
          return true;
        } catch (_) { return false; }
      },
      get(key, fallback) {
        try {
          const raw = global.localStorage.getItem(key);
          if (raw == null) return fallback;
          return safeJSONParse(raw, fallback);
        } catch (e) {
          Logger.warn('storage', 'localStorage.get failed for ' + key, e);
          return fallback;
        }
      },
      set(key, value) {
        try {
          global.localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (e) {
          status.lastError = e;
          if (e && (e.name === 'QuotaExceededError' || e.code === 22)) {
            status.local = 'quota';
          } else {
            status.local = 'unavailable';
          }
          Logger.warn('storage', 'localStorage.set failed for ' + key, e);
          return false;
        }
      },
      remove(key) {
        try { global.localStorage.removeItem(key); return true; }
        catch (e) { Logger.warn('storage', 'localStorage.remove failed', e); return false; }
      },
      keys() {
        try {
          const out = [];
          for (let i = 0; i < global.localStorage.length; i++) out.push(global.localStorage.key(i));
          return out;
        } catch (_) { return []; }
      }
    };

    // --- IndexedDB: обёртка с promise API ---
    let dbPromise = null;
    const idb = {
      isAvailable() { return FeatureDetect.has('indexedDB'); },
      open() {
        if (!idb.isAvailable()) return Promise.reject(new Error('IndexedDB недоступен'));
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((resolve, reject) => {
          let req;
          try {
            const factory = global.indexedDB || global.mozIndexedDB || global.webkitIndexedDB;
            req = factory.open(Constants.IDB.DB_NAME, Constants.IDB.DB_VERSION);
          } catch (e) { reject(e); return; }
          req.onupgradeneeded = (ev) => {
            try {
              const db = ev.target.result;
              const S = Constants.IDB.STORES;
              if (!db.objectStoreNames.contains(S.SAVES)) {
                db.createObjectStore(S.SAVES, { keyPath: 'id' });
              }
              if (!db.objectStoreNames.contains(S.SETTINGS)) {
                db.createObjectStore(S.SETTINGS, { keyPath: 'id' });
              }
              if (!db.objectStoreNames.contains(S.LOGS)) {
                const store = db.createObjectStore(S.LOGS, { keyPath: 'id', autoIncrement: true });
                store.createIndex('ts', 't', { unique: false });
              }
            } catch (e) {
              Logger.error('storage', 'IDB upgrade failed', e);
            }
          };
          req.onsuccess = () => {
            const db = req.result;
            db.onversionchange = () => { try { db.close(); } catch (_) {} dbPromise = null; };
            resolve(db);
          };
          req.onerror = () => reject(req.error || new Error('IDB open error'));
          req.onblocked = () => Logger.warn('storage', 'IDB open blocked');
        });
        dbPromise.catch(() => { dbPromise = null; });
        return dbPromise;
      },
      tx(storeName, mode) {
        return idb.open().then((db) => {
          const tx = db.transaction(storeName, mode);
          return { db, tx, store: tx.objectStore(storeName) };
        });
      },
      put(storeName, value) {
        return idb.tx(storeName, 'readwrite').then(({ tx, store }) => {
          return new Promise((resolve, reject) => {
            const r = store.put(value);
            r.onsuccess = () => resolve(r.result);
            r.onerror = () => reject(r.error);
            tx.oncomplete = null;
          });
        });
      },
      get(storeName, id) {
        return idb.tx(storeName, 'readonly').then(({ store }) => {
          return new Promise((resolve, reject) => {
            const r = store.get(id);
            r.onsuccess = () => resolve(r.result);
            r.onerror = () => reject(r.error);
          });
        });
      },
      delete(storeName, id) {
        return idb.tx(storeName, 'readwrite').then(({ store }) => {
          return new Promise((resolve, reject) => {
            const r = store.delete(id);
            r.onsuccess = () => resolve();
            r.onerror = () => reject(r.error);
          });
        });
      },
      getAll(storeName) {
        return idb.tx(storeName, 'readonly').then(({ store }) => {
          return new Promise((resolve, reject) => {
            const r = store.getAll();
            r.onsuccess = () => resolve(r.result || []);
            r.onerror = () => reject(r.error);
          });
        });
      }
    };

    const init = () => {
      status.local = ls.isAvailable() ? 'ok' : 'unavailable';
      if (!FeatureDetect.has('indexedDB')) status.idb = 'unavailable';
      else {
        idb.open().then(() => { status.idb = 'ok'; })
                 .catch((e) => { status.idb = 'unavailable'; status.lastError = e; });
      }
      return status;
    };

    return {
      init,
      status: () => Object.assign({}, status),
      local: ls,
      idb,
      persist(key, value) {
        if (status.idb === 'ok') {
          return idb.put(Constants.IDB.STORES.SAVES, { id: key, value, t: Date.now() })
                    .catch(() => { ls.set(key, value); });
        }
        ls.set(key, value);
        return Promise.resolve();
      },
      restore(key, fallback) {
        if (status.idb === 'ok') {
          return idb.get(Constants.IDB.STORES.SAVES, key)
                    .then((row) => (row && HAS(row, 'value')) ? row.value : fallback)
                    .catch(() => ls.get(key, fallback));
        }
        return Promise.resolve(ls.get(key, fallback));
      }
    };
  })();

  /* --------------------------------------------------------------------------
     6. SettingsStore — пользовательские настройки с валидацией и сохранением.
     -------------------------------------------------------------------------- */

  const SettingsStore = (() => {
    const DEFAULTS = Object.freeze({
      profile: Constants.PROFILES.AUTO,
      masterVolume: 0.8,
      musicVolume: 0.6,
      sfxVolume: 0.8,
      subtitle: true,
      fontSize: 'md',
      highContrast: false,
      reducedMotion: false,
      graphicsQuality: 'auto',
      canvasEffects: true,
      stickDeadzone: 0.18,
      cameraSensitivity: 1.0,
      invertY: false,
      navRepeatDelayMs: 220,
      language: 'ru'
    });

    let current = clone(DEFAULTS);
    let loaded = false;

    const normalize = (raw) => {
      const out = clone(DEFAULTS);
      if (!isPlainObject(raw)) return out;
      for (const k of Object.keys(DEFAULTS)) {
        if (!HAS(raw, k)) continue;
        const def = DEFAULTS[k];
        const v = raw[k];
        if (typeof def === 'number' && typeof v === 'number' && isFinite(v)) out[k] = v;
        else if (typeof def === 'boolean' && typeof v === 'boolean') out[k] = v;
        else if (typeof def === 'string' && typeof v === 'string') out[k] = v;
      }
      out.masterVolume    = clamp(out.masterVolume, 0, 1);
      out.musicVolume     = clamp(out.musicVolume, 0, 1);
      out.sfxVolume       = clamp(out.sfxVolume, 0, 1);
      out.stickDeadzone   = clamp(out.stickDeadzone, 0, 0.6);
      out.cameraSensitivity = clamp(out.cameraSensitivity, 0.1, 3);
      out.navRepeatDelayMs = clamp(out.navRepeatDelayMs, 60, 800);
      if (!['sm','md','lg','xl'].includes(out.fontSize)) out.fontSize = 'md';
      if (!['low','mid','high','auto'].includes(out.graphicsQuality)) out.graphicsQuality = 'auto';
      if (!['desktop','mobile','tablet','tv','auto'].includes(out.profile)) out.profile = 'auto';
      return out;
    };

    const applyToDom = () => {
      const root = document.documentElement;
      const scale = current.fontSize === 'sm' ? 0.92
                  : current.fontSize === 'lg' ? 1.12
                  : current.fontSize === 'xl' ? 1.25
                  : 1;
      root.style.setProperty('--mc-user-font-scale', String(scale));
      root.classList.toggle('mc-reduced-motion', !!current.reducedMotion);
      root.classList.toggle('mc-high-contrast', !!current.highContrast);
    };

    const load = () => {
      const raw = StorageAdapter.local.get(Constants.STORAGE_KEYS.SETTINGS, null);
      current = normalize(raw);
      loaded = true;
      applyToDom();
      EventBus.emit('settings:loaded', clone(current));
      return clone(current);
    };

    const save = () => {
      StorageAdapter.local.set(Constants.STORAGE_KEYS.SETTINGS, current);
      EventBus.emit('settings:saved', clone(current));
    };

    const set = (patch) => {
      if (!isPlainObject(patch)) return clone(current);
      current = normalize(Object.assign({}, current, patch));
      applyToDom();
      save();
      EventBus.emit('settings:changed', clone(current));
      return clone(current);
    };

    const reset = () => {
      current = clone(DEFAULTS);
      applyToDom();
      save();
      EventBus.emit('settings:changed', clone(current));
      return clone(current);
    };

    return {
      DEFAULTS: clone(DEFAULTS),
      load, save, set, reset,
      all: () => clone(current),
      get: (k) => (HAS(current, k) ? current[k] : undefined),
      isLoaded: () => loaded
    };
  })();

  /* --------------------------------------------------------------------------
     7. GameState — единственный источник игрового состояния.
     -------------------------------------------------------------------------- */

  const GameState = (() => {
    const createEmpty = () => ({
      schemaVersion: Constants.SAVE_SCHEMA_VERSION,
      createdAt: Date.now(),
      updatedAt: Date.now(),
      slotId: null,
      chapterId: null,
      chapterStartedAt: null,
      discoveredEvidence: [],
      analysedEvidence: {},
      unlockedDocuments: [],
      testimonies: [],
      storyFlags: {},
      boardConnections: [],
      boardLayout: {},
      notes: {},
      decisions: [],
      interviews: {},
      locationState: {},
      timeline: [],
      achievedEndings: [],
      achievements: {},
      playtimeMs: 0,
      meta: {
        version: Constants.APP_VERSION
      }
    });

    let state = createEmpty();
    let dirty = false;

    const touch = () => { state.updatedAt = Date.now(); dirty = true; };

    const get = () => state;
    const snapshot = () => clone(state);

    const replace = (next, opts) => {
      if (!isPlainObject(next) || next.schemaVersion !== Constants.SAVE_SCHEMA_VERSION) {
        Logger.warn('state', 'replace rejected: incompatible schema');
        EventBus.emit('state:rejected', { reason: 'schema' });
        return false;
      }
      state = next;
      dirty = true;
      EventBus.emit('state:replaced', { soft: !!(opts && opts.soft) });
      return true;
    };

    const reset = () => {
      state = createEmpty();
      dirty = true;
      EventBus.emit('state:reset');
      return snapshot();
    };

    const isDirty = () => dirty;
    const markClean = () => { dirty = false; };

    const hasFlag = (name) => !!state.storyFlags[name];
    const setFlag = (name, value) => {
      state.storyFlags[name] = value === undefined ? true : value;
      touch();
      EventBus.emit('state:flag', { name, value: state.storyFlags[name] });
    };

    const addEvidence = (id) => {
      if (!id) return false;
      if (state.discoveredEvidence.some(e => e.id === id)) return false;
      state.discoveredEvidence.push({ id, t: Date.now() });
      touch();
      EventBus.emit('state:evidence-added', { id });
      return true;
    };

    const addTimeline = (label, meta) => {
      const entry = { id: uid('tl'), t: Date.now(), label: String(label || ''), meta: meta || null };
      state.timeline.push(entry);
      touch();
      EventBus.emit('state:timeline', entry);
      return entry;
    };

    return {
      createEmpty,
      get, snapshot, replace, reset,
      isDirty, markClean,
      hasFlag, setFlag,
      addEvidence, addTimeline,
      touch
    };
  })();

  /* --------------------------------------------------------------------------
     8. PlatformDetector — определение профиля платформы.
     -------------------------------------------------------------------------- */

  const PlatformDetector = (() => {
    const detectOnce = () => {
      const ua = (navigator && navigator.userAgent) || '';
      const w = global.innerWidth || 1024;
      const h = global.innerHeight || 768;
      const shortSide = Math.min(w, h);
      const longSide  = Math.max(w, h);
      const touch = FeatureDetect.has('touchEvents') || FeatureDetect.has('pointerEvents') && navigator.maxTouchPoints > 0;

      let profile = Constants.PROFILES.DESKTOP;

      const looksLikeTV = /SmartTV|Tizen|Web0S|WebOS|HbbTV|NetCast|Viera|BRAVIA|AFTB|AFTM|AFTT|AppleTV|GoogleTV|CrKey|Roku/i.test(ua);
      const looksLikeTablet = /iPad/i.test(ua) ||
        (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ||
        (/(Android)/i.test(ua) && !/Mobile/i.test(ua));

      if (looksLikeTV || (longSide >= 1600 && !touch && /TV/i.test(ua))) {
        profile = Constants.PROFILES.TV;
      } else if (looksLikeTablet || (touch && shortSide >= 600 && longSide >= 900)) {
        profile = Constants.PROFILES.TABLET;
      } else if (touch && shortSide < 600) {
        profile = Constants.PROFILES.MOBILE;
      } else if (/Mobi|Android.+Mobile|iPhone|iPod/i.test(ua)) {
        profile = Constants.PROFILES.MOBILE;
      } else {
        profile = Constants.PROFILES.DESKTOP;
      }

      return {
        profile,
        viewport: { w, h, shortSide, longSide },
        touch,
        uaFamily: profile,
        orientation: w >= h ? 'landscape' : 'portrait',
        dpr: (global.devicePixelRatio || 1)
      };
    };

    let info = detectOnce();
    const subscribers = new Set();

    const notify = () => {
      const next = detectOnce();
      info = next;
      for (const fn of subscribers) { try { fn(clone(info)); } catch (_) {} }
    };

    let rafId = 0;
    const schedule = () => {
      if (rafId) return;
      const scheduleFn = global.requestAnimationFrame || ((fn) => setTimeout(fn, 16));
      rafId = scheduleFn(() => { rafId = 0; notify(); });
    };

    const attach = () => {
      global.addEventListener('resize', schedule, { passive: true });
      global.addEventListener('orientationchange', schedule, { passive: true });
    };

    return {
      current: () => clone(info),
      subscribe(fn) { subscribers.add(fn); return () => subscribers.delete(fn); },
      attach
    };
  })();

  /* --------------------------------------------------------------------------
     9. Diagnostics — централизованный журнал ошибок и состояний.
     -------------------------------------------------------------------------- */

  const Diagnostics = (() => {
    const incidents = [];
    const MAX = 200;

    const push = (code, scope, message, detail) => {
      const item = {
        id: uid('diag'),
        t: Date.now(),
        ts: nowISO(),
        code: code || Constants.ERR.UNKNOWN,
        scope: scope || 'app',
        message: String(message || ''),
        detail: detail == null ? null : (detail instanceof Error
          ? { name: detail.name, message: detail.message, stack: detail.stack }
          : safe(detail))
      };
      incidents.push(item);
      if (incidents.length > MAX) incidents.shift();
      Logger.error(scope || 'diag', '[' + item.code + '] ' + item.message, item.detail);
      EventBus.emit('diag:incident', item);
      return item;
    };

    const safe = (v) => { try { return clone(v); } catch (_) { return String(v); } };

    const all = () => incidents.slice();
    const clear = () => { incidents.length = 0; };
    const count = () => incidents.length;

    const auditAutonomy = () => {
      const report = {
        ok: true,
        issues: [],
        checkedAt: nowISO()
      };
      try {
        const externalScripts = Array.from(document.querySelectorAll('script[src]'));
        if (externalScripts.length) {
          report.ok = false;
          report.issues.push({ kind: 'script[src]', count: externalScripts.length });
        }
        const externalLinks = Array.from(document.querySelectorAll('link[href]'))
          .filter(el => !/^data:/i.test(el.getAttribute('href') || ''));
        if (externalLinks.length) {
          report.ok = false;
          report.issues.push({ kind: 'link[href]', count: externalLinks.length });
        }
        const externalImgs = Array.from(document.querySelectorAll('img[src]'))
          .filter(el => !/^data:/i.test(el.getAttribute('src') || ''));
        if (externalImgs.length) {
          report.ok = false;
          report.issues.push({ kind: 'img[src]', count: externalImgs.length });
        }
        const externalMedia = Array.from(document.querySelectorAll('audio[src],video[src],iframe[src]'));
        if (externalMedia.length) {
          report.ok = false;
          report.issues.push({ kind: 'media/iframe[src]', count: externalMedia.length });
        }
      } catch (e) {
        report.issues.push({ kind: 'dom-audit-error', error: String(e && e.message || e) });
      }
      return report;
    };

    return { push, all, clear, count, auditAutonomy };
  })();

  /* --------------------------------------------------------------------------
     10. NotificationManager — ненавязчивые уведомления в углу.
     -------------------------------------------------------------------------- */

  const NotificationManager = (() => {
    let host = null;

    const ensureHost = () => {
      if (host) return host;
      host = document.getElementById('mc-notify-host');
      return host;
    };

    const notify = (message, opts) => {
      const h = ensureHost();
      if (!h) return null;
      const options = Object.assign({ kind: 'info', timeoutMs: 4200 }, opts || {});
      if (!Constants.NOTIFY_KINDS.includes(options.kind)) options.kind = 'info';

      while (h.children.length >= Constants.LIMITS.NOTIFY_MAX) {
        h.removeChild(h.firstChild);
      }

      const el = document.createElement('div');
      el.className = 'mc-notify__item';
      el.setAttribute('data-kind', options.kind);
      el.setAttribute('role', options.kind === 'error' ? 'alert' : 'status');
      el.textContent = String(message);

      h.appendChild(el);

      let timer = 0;
      const dismiss = () => {
        if (timer) { clearTimeout(timer); timer = 0; }
        el.style.transition = 'opacity 200ms ease';
        el.style.opacity = '0';
        setTimeout(() => { try { el.remove(); } catch (_) {} }, 220);
      };
      if (options.timeoutMs > 0) timer = setTimeout(dismiss, options.timeoutMs);

      el.addEventListener('click', dismiss, { once: true });
      return { dismiss, element: el };
    };

    const live = (text) => {
      const region = document.getElementById('mc-live');
      if (!region) return;
      region.textContent = '';
      setTimeout(() => { region.textContent = String(text || ''); }, 30);
    };

    return { notify, live };
  })();

  /* 11. App — немедленная инициализация без экрана загрузки */
  const App = (() => {
    const status = {
      phase: 'ready',
      startedAt: Date.now(),
      bootError: null
    };

    const initApp = () => {
      Logger.info('app', 'instant start');
      const audit = Diagnostics.auditAutonomy();
      if (!audit.ok) {
        Logger.warn('app', 'autonomy audit issues', audit.issues);
      }
      StorageAdapter.init();
      try { SettingsStore.load(); } catch (e) {
        Diagnostics.push(Constants.ERR.STORAGE_UNAVAILABLE, 'settings', 'Не удалось загрузить настройки', e);
      }
      try { PlatformDetector.attach(); } catch (e) { Logger.warn('app', 'platform attach failed', e); }
      EventBus.emit('app:ready', { at: Date.now() });
    };

    const start = () => {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp, { once: true });
      } else {
        initApp();
      }
    };

    return {
      status: () => Object.assign({}, status),
      start
    };
  })();

  /* --------------------------------------------------------------------------
     12. Публичный namespace — единственный контролируемый глобальный объект.
     -------------------------------------------------------------------------- */

  const MindCaseApp = {
    Constants,
    Logger,
    EventBus,
    FeatureDetect,
    StorageAdapter,
    SettingsStore,
    GameState,
    PlatformDetector,
    Diagnostics,
    NotificationManager,
    App,
    util: { clone, clamp, uid, safeJSONParse, isPlainObject, HAS, nowISO }
  };

  if (global.MindCaseApp && global.MindCaseApp.__initialized) {
    Logger.warn('app', 'MindCaseApp уже инициализирован, повторная инициализация пропущена');
  } else {
    Object.defineProperty(MindCaseApp, '__initialized', {
      value: true, enumerable: false, writable: false, configurable: false
    });
    global.MindCaseApp = MindCaseApp;

    global.addEventListener('error', (ev) => {
      try {
        Diagnostics.push(Constants.ERR.UNKNOWN, 'window', ev.message || 'Uncaught error', ev.error);
      } catch (_) {}
    });
    global.addEventListener('unhandledrejection', (ev) => {
      try {
        Diagnostics.push(Constants.ERR.UNKNOWN, 'promise', 'Unhandled rejection', ev.reason);
      } catch (_) {}
    });

    App.start();
  }

})(typeof window !== 'undefined' ? window : this);

<script>

/* ============================================================================
   MIND CASE — Часть 2. Базовая дизайн-система.

(function (global) {

  /* ==========================================================================
     МОДУЛЬ 1. DesignSystem

  const DesignSystem = (() => {
    const TOKENS = Object.freeze({
      colors: {
        'bg-0': '#0b0f14',
        'bg-1': '#111823',
        'bg-2': '#182130',
        'bg-3': '#1f2a3b',
        'line-0': '#24314a',
        'line-1': '#33445f',

        'fg-2': '#7f8b9e',
        'fg-3': '#4e5a6c',
        'accent': '#4fb3c9',
        'warn': '#d9a441',
        'danger': '#c8424b',
        'ok': '#4bbf7b',
        'paper': '#ece6d6',
        'paper-ink': '#1c1a16'
      },
      radii: { r1: '4px', r2: '6px', r3: '10px', r4: '16px', pill: '999px' },

    });

    const root = document.documentElement;

    const setVar = (name, value) => {
      try { root.style.setProperty(name, String(value)); return true; }
      catch (_) { return false; }
    };

    const getVar = (name) => {
      try { return getComputedStyle(root).getPropertyValue(name).trim(); }
      catch (_) { return ''; }
    };

    const applyProfile = (profile) => {
      root.setAttribute('data-mc-profile', String(profile || Constants.PROFILES.AUTO));
      EventBus.emit('design:profile-applied', { profile });
    };

    const applyContrast = (enabled) => {
      root.classList.toggle('mc-high-contrast', !!enabled);
      EventBus.emit('design:contrast-changed', { enabled: !!enabled });
    };

    const applyMotion = (reduced) => {
      root.classList.toggle('mc-reduced-motion', !!reduced);
      EventBus.emit('design:motion-changed', { reduced: !!reduced });
    };

    const applyFontScale = (scale) => {
      const s = clamp(Number(scale) || 1, 0.8, 1.6);
      setVar('--mc-user-font-scale', s);
      EventBus.emit('design:font-scale-changed', { scale: s });
    };

    const applyAllFromSettings = () => {
      const s = SettingsStore.all();
      const scale = s.fontSize === 'sm' ? 0.92
                  : s.fontSize === 'lg' ? 1.12
                  : s.fontSize === 'xl' ? 1.25
                  : 1;
      applyFontScale(scale);
      applyContrast(!!s.highContrast);
      applyMotion(!!s.reducedMotion);
      applyProfile(s.profile);
    };

    // Подписываемся на изменения настроек однократно.
    EventBus.on('settings:changed', applyAllFromSettings);
    EventBus.on('settings:loaded', applyAllFromSettings);

    return {
      TOKENS,
      setVar, getVar,
      applyProfile, applyContrast, applyMotion, applyFontScale,
      applyAllFromSettings
    };
  })();

  /* ==========================================================================
     МОДУЛЬ 2. FocusManager
     Единая точка управления фокусом: запоминание последнего элемента,
     корректный focus trap для модальных окон, управление кольцом фокуса
     и навигация по Tab в пределах контейнера.
     ========================================================================== */

  const FocusManager = (() => {
    /** Стек сохранённых фокусов для вложенных модалок. */
    const stack = [];
    /** Текущий активный контейнер-ловушка фокуса (если есть). */
    let trapContainer = null;
    /** Обработчик keydown, установленный на документ. */
    let onKeydown = null;

    const FOCUSABLE_SELECTOR = [
      'a[href]',
      'button:not([disabled])',
      'input:not([disabled]):not([type="hidden"])',
      'select:not([disabled])',
      'textarea:not([disabled])',
      '[tabindex]:not([tabindex="-1"])',
      '[contenteditable="true"]'
    ].join(',');

    const getFocusable = (container) => {
      if (!container) return [];
      const nodes = container.querySelectorAll(FOCUSABLE_SELECTOR);
      const out = [];
      for (const el of nodes) {
        if (el.offsetParent !== null || el === document.activeElement) {
          if (!el.hasAttribute('aria-hidden') && el.tabIndex !== -1) out.push(el);
        }
      }
      return out;
    };

    const saveFocus = () => {
      const active = document.activeElement;
      stack.push(active && active !== document.body ? active : null);
      return active;
    };

    const restoreFocus = () => {
      const el = stack.pop();
      if (el && typeof el.focus === 'function' && document.contains(el)) {
        try { el.focus({ preventScroll: false }); } catch (_) { try { el.focus(); } catch (__) {} }
      }
    };

    const clearStack = () => { stack.length = 0; };

    const focusFirst = (container) => {
      const list = getFocusable(container || document.body);
      if (list.length) {
        try { list[0].focus(); } catch (_) {}
        return list[0];
      }
      return null;
    };

    const focusLast = (container) => {
      const list = getFocusable(container || document.body);
      if (list.length) {
        try { list[list.length - 1].focus(); } catch (_) {}
        return list[list.length - 1];
      }
      return null;
    };

    const trap = (container) => {
      if (!container) return () => {};
      saveFocus();
      trapContainer = container;

      const handler = (ev) => {
        if (ev.key !== 'Tab') return;
        const list = getFocusable(container);
        if (list.length === 0) { ev.preventDefault(); return; }
        const first = list[0];
        const last = list[list.length - 1];
        const active = document.activeElement;

        if (ev.shiftKey && (active === first || !container.contains(active))) {
          ev.preventDefault();
          try { last.focus(); } catch (_) {}
        } else if (!ev.shiftKey && (active === last || !container.contains(active))) {
          ev.preventDefault();
          try { first.focus(); } catch (_) {}
        }
      };
      document.addEventListener('keydown', handler, true);
      onKeydown = handler;

      // Ставим фокус на первый интерактивный элемент.
      focusFirst(container);

      return () => {
        if (onKeydown) { document.removeEventListener('keydown', onKeydown, true); onKeydown = null; }
        trapContainer = null;
        restoreFocus();
      };
    };

    const move = (direction, container) => {
      const scope = container || trapContainer || document.body;
      const list = getFocusable(scope);
      if (!list.length) return null;
      const active = document.activeElement;
      let idx = list.indexOf(active);
      if (idx === -1) idx = 0;
      else idx = (idx + (direction === 'prev' ? -1 : 1) + list.length) % list.length;
      try { list[idx].focus(); } catch (_) {}
      return list[idx];
    };

    return {
      FOCUSABLE_SELECTOR,
      getFocusable,
      saveFocus, restoreFocus, clearStack,
      focusFirst, focusLast, trap, move,
      current: () => document.activeElement,
      container: () => trapContainer
    };
  })();

  /* ==========================================================================
     МОДУЛЬ 3. A11y
     Хелперы доступности: озвучивание, семантика, стабильный id.
     ========================================================================== */

  const A11y = (() => {
    let idCounter = 0;
    const nextId = (prefix) => (prefix || 'a11y') + '-' + (++idCounter).toString(36) + '-' + uid().split('-').pop();

    const announce = (text, priority) => {
      const region = priority === 'assertive'
        ? document.getElementById('mc-live-alert') || document.getElementById('mc-live')
        : document.getElementById('mc-live');
      if (!region) return;
      region.textContent = '';
      setTimeout(() => { region.textContent = String(text || ''); }, 30);
    };

    const describe = (el, text) => {
      if (!el) return null;
      const id = nextId('desc');
      let span = document.getElementById(id);
      if (!span) {
        span = document.createElement('span');
        span.id = id;
        span.className = 'mc-sr-only';
        span.textContent = String(text || '');
        el.appendChild(span);
      } else {
        span.textContent = String(text || '');
      }
      el.setAttribute('aria-describedby', id);
      return id;
    };

    const label = (el, text) => {
      if (!el) return null;
      const id = nextId('lbl');
      let span = document.getElementById(id);
      if (!span) {
        span = document.createElement('span');
        span.id = id;
        span.className = 'mc-sr-only';
        span.textContent = String(text || '');
        el.appendChild(span);
      } else {
        span.textContent = String(text || '');
      }
      el.setAttribute('aria-label', String(text || ''));
      return id;
    };

    const setHidden = (el, hidden) => {
      if (!el) return;
      if (hidden) el.setAttribute('aria-hidden', 'true');
      else el.removeAttribute('aria-hidden');
    };

    const setBusy = (el, busy) => {
      if (!el) return;
      if (busy) el.setAttribute('aria-busy', 'true');
      else el.removeAttribute('aria-busy');
    };

    const setDisabled = (el, disabled) => {
      if (!el) return;
      el.toggleAttribute('disabled', !!disabled);
      if (disabled) el.setAttribute('aria-disabled', 'true');
      else el.removeAttribute('aria-disabled');
    };

    return { nextId, announce, describe, label, setHidden, setBusy, setDisabled };
  })();

  /* ==========================================================================
     МОДУЛЬ 4. TooltipManager
     Простые встроенные подсказки: без внешних библиотек, с учётом
     положения элемента в окне, автоскрытие, поддержка touch (по долгому тапу).
     ========================================================================== */

  const TooltipManager = (() => {
    let hostEl = null;
    let currentTarget = null;
    let showTimer = 0;
    let hideTimer = 0;
    let longPressTimer = 0;
    const HOVER_DELAY = 320;
    const HIDE_DELAY = 120;

    const ensureHost = () => {
      if (hostEl && document.body.contains(hostEl)) return hostEl;
      hostEl = document.createElement('div');
      hostEl.className = 'mc-tooltip';
      hostEl.setAttribute('role', 'tooltip');
      hostEl.setAttribute('aria-hidden', 'true');
      hostEl.style.position = 'fixed';
      hostEl.style.zIndex = '9999';
      hostEl.style.pointerEvents = 'none';
      hostEl.style.padding = '6px 10px';
      hostEl.style.borderRadius = '6px';
      hostEl.style.background = 'rgba(20,28,40,0.96)';
      hostEl.style.color = '#e6edf6';
      hostEl.style.fontSize = '12px';
      hostEl.style.lineHeight = '1.35';
      hostEl.style.maxWidth = '280px';
      hostEl.style.boxShadow = '0 6px 18px rgba(0,0,0,.6)';
      hostEl.style.border = '1px solid rgba(79,179,201,.35)';
      hostEl.style.transition = 'opacity 140ms ease';
      hostEl.style.opacity = '0';
      document.body.appendChild(hostEl);
      return hostEl;
    };

    const place = (target, host) => {
      const r = target.getBoundingClientRect();
      const vw = global.innerWidth || 1024;
      const vh = global.innerHeight || 768;
      host.style.left = '0px';
      host.style.top = '0px';
      const hr = host.getBoundingClientRect();
      let x = r.left + r.width / 2 - hr.width / 2;
      let y = r.top - hr.height - 8;
      if (y < 4) y = r.bottom + 8;
      x = clamp(x, 6, vw - hr.width - 6);
      y = clamp(y, 6, vh - hr.height - 6);
      host.style.left = x + 'px';
      host.style.top = y + 'px';
    };

    const show = (target) => {
      const text = target && target.getAttribute('data-mc-tooltip');
      if (!text) return;
      const host = ensureHost();
      host.textContent = text;
      host.setAttribute('aria-hidden', 'false');
      host.style.opacity = '1';
      place(target, host);
      currentTarget = target;
    };

    const hide = () => {
      if (!hostEl) return;
      hostEl.style.opacity = '0';
      hostEl.setAttribute('aria-hidden', 'true');
      currentTarget = null;
    };

    const scheduleShow = (target) => {
      if (hideTimer) { clearTimeout(hideTimer); hideTimer = 0; }
      if (showTimer) clearTimeout(showTimer);
      showTimer = setTimeout(() => show(target), HOVER_DELAY);
    };

    const scheduleHide = () => {
      if (showTimer) { clearTimeout(showTimer); showTimer = 0; }
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(hide, HIDE_DELAY);
    };

    const onPointerOver = (ev) => {
      const t = ev.target && ev.target.closest && ev.target.closest('[data-mc-tooltip]');
      if (!t) return;
      scheduleShow(t);
    };
    const onPointerOut = (ev) => {
      const t = ev.target && ev.target.closest && ev.target.closest('[data-mc-tooltip]');
      if (!t) return;
      scheduleHide();
    };
    const onFocusIn = (ev) => {
      const t = ev.target && ev.target.closest && ev.target.closest('[data-mc-tooltip]');
      if (t) show(t);
    };
    const onFocusOut = () => { hide(); };

    const onTouchStart = (ev) => {
      const t = ev.target && ev.target.closest && ev.target.closest('[data-mc-tooltip]');
      if (!t) return;
      if (longPressTimer) clearTimeout(longPressTimer);
      longPressTimer = setTimeout(() => show(t), 480);
    };
    const onTouchEnd = () => {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = 0; }
      scheduleHide();
    };

    const attach = (root) => {
      const scope = root || document;
      scope.addEventListener('pointerover', onPointerOver);
      scope.addEventListener('pointerout', onPointerOut);
      scope.addEventListener('focusin', onFocusIn);
      scope.addEventListener('focusout', onFocusOut);
      scope.addEventListener('touchstart', onTouchStart, { passive: true });
      scope.addEventListener('touchend', onTouchEnd, { passive: true });
      scope.addEventListener('touchcancel', onTouchEnd, { passive: true });
    };

    const detach = (root) => {
      const scope = root || document;
      scope.removeEventListener('pointerover', onPointerOver);
      scope.removeEventListener('pointerout', onPointerOut);
      scope.removeEventListener('focusin', onFocusIn);
      scope.removeEventListener('focusout', onFocusOut);
      scope.removeEventListener('touchstart', onTouchStart);
      scope.removeEventListener('touchend', onTouchEnd);
      scope.removeEventListener('touchcancel', onTouchEnd);
    };

    // Скрываем при скролле, т.к. позиция становится неактуальной.
    global.addEventListener('scroll', hide, { passive: true, capture: true });

    return { attach, detach, show, hide };
  })();

  /* ==========================================================================
     МОДУЛЬ 5. ModalManager
     Стек модальных окон. Escape закрывает верхнюю. Backdrop кликом закрывает
     только если окно помечено closableByBackdrop. Фокус трапится автоматически.
     ========================================================================== */

  const ModalManager = (() => {
    const layer = document.getElementById('mc-modal-layer');
    const stack = [];

    const createBackdrop = () => {
      const bd = document.createElement('div');
      bd.className = 'mc-modal-backdrop';
      bd.style.position = 'absolute';
      bd.style.inset = '0';
      bd.style.background = 'rgba(4,8,14,0.72)';
      bd.style.backdropFilter = 'blur(3px)';
      bd.style.pointerEvents = 'auto';
      bd.style.opacity = '0';
      bd.style.transition = 'opacity var(--mc-t-mid) var(--mc-ease)';
      requestAnimationFrame(() => { bd.style.opacity = '1'; });
      return bd;
    };

    const open = (options) => {
      if (!layer) {
        Logger.error('modal', 'Нет слоя #mc-modal-layer — модалка не открыта');
        return null;
      }
      const opts = Object.assign({
        id: uid('modal'),
        title: '',
        body: null,
        actions: [],
        closableByBackdrop: true,
        closableByEsc: true,
        width: 'auto',
        className: '',
        onClose: null
      }, options || {});

      // Если модалка с таким id уже открыта — не открываем повторно.
      if (stack.some(m => m.opts.id === opts.id)) return stack.find(m => m.opts.id === opts.id);

      const backdrop = createBackdrop();
      const wrap = document.createElement('div');
      wrap.className = 'mc-modal ' + (opts.className || '');
      wrap.setAttribute('role', 'dialog');
      wrap.setAttribute('aria-modal', 'true');
      wrap.style.position = 'absolute';
      wrap.style.inset = '0';
      wrap.style.display = 'grid';
      wrap.style.placeItems = 'center';
      wrap.style.padding = 'calc(var(--mc-s-4) + var(--mc-safe-t)) calc(var(--mc-s-4) + var(--mc-safe-r)) calc(var(--mc-s-4) + var(--mc-safe-b)) calc(var(--mc-s-4) + var(--mc-safe-l))';

      const panel = document.createElement('div');
      panel.className = 'mc-modal__panel mc-card';
      panel.style.minWidth = 'min(420px, 92vw)';
      panel.style.maxWidth = opts.width === 'auto' ? 'min(720px, 92vw)' : opts.width;
      panel.style.maxHeight = '90vh';
      panel.style.overflow = 'auto';
      panel.style.background = 'var(--mc-bg-1)';
      panel.style.padding = 'var(--mc-s-5)';
      panel.style.boxShadow = 'var(--mc-sh-3)';
      panel.style.opacity = '0';
      panel.style.transform = 'translateY(8px)';
      panel.style.transition = 'opacity var(--mc-t-mid) var(--mc-ease), transform var(--mc-t-mid) var(--mc-ease)';

      // Заголовок
      if (opts.title) {
        const h = document.createElement('h2');
        h.className = 'mc-modal__title';
        h.id = opts.id + '-title';
        h.textContent = String(opts.title);
        h.style.margin = '0 0 var(--mc-s-4) 0';
        h.style.fontSize = 'var(--mc-fs-lg)';
        h.style.letterSpacing = '.04em';
        panel.appendChild(h);
        wrap.setAttribute('aria-labelledby', h.id);
      }

      // Тело
      const body = document.createElement('div');
      body.className = 'mc-modal__body';
      if (opts.body instanceof Node) body.appendChild(opts.body);
      else if (typeof opts.body === 'string') body.innerHTML = opts.body;
      panel.appendChild(body);

      // Кнопки действий
      if (Array.isArray(opts.actions) && opts.actions.length) {
        const bar = document.createElement('div');
        bar.className = 'mc-modal__actions';
        bar.style.display = 'flex';
        bar.style.gap = 'var(--mc-s-2)';
        bar.style.justifyContent = 'flex-end';
        bar.style.marginTop = 'var(--mc-s-5)';
        bar.style.flexWrap = 'wrap';
        for (const a of opts.actions) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'mc-btn' + (a.variant === 'primary' ? ' mc-btn--primary' : a.variant === 'danger' ? ' mc-btn--danger' : a.variant === 'ghost' ? ' mc-btn--ghost' : '');
          btn.textContent = String(a.label || '');
          btn.addEventListener('click', (ev) => {
            if (typeof a.onClick === 'function') {
              const res = a.onClick(ev, api);
              if (res === false) return; // отменяем закрытие
            }
            if (a.close !== false) close(opts.id);
          });
          bar.appendChild(btn);
        }
        panel.appendChild(bar);
      }

      wrap.appendChild(panel);
      layer.appendChild(backdrop);
      layer.appendChild(wrap);

      // Анимация появления.
      requestAnimationFrame(() => {
        panel.style.opacity = '1';
        panel.style.transform = 'translateY(0)';
      });

      // Backdrop click.
      if (opts.closableByBackdrop) {
        backdrop.addEventListener('click', () => close(opts.id));
      } else {
        backdrop.style.cursor = 'default';
      }

      // Trap фокуса.
      const release = FocusManager.trap(panel);

      const record = {
        opts,
        backdrop,
        wrap,
        panel,
        release
      };
      stack.push(record);
      EventBus.emit('modal:opened', { id: opts.id, title: opts.title });
      A11y.announce(opts.title || 'Открыто диалоговое окно');
      return record;
    };

    const close = (id) => {
      let idx = -1;
      if (id) idx = stack.findIndex(m => m.opts.id === id);
      else idx = stack.length - 1;
      if (idx === -1) return false;
      const rec = stack.splice(idx, 1)[0];

      try { rec.panel.style.opacity = '0'; rec.panel.style.transform = 'translateY(8px)'; } catch (_) {}
      try { rec.backdrop.style.opacity = '0'; } catch (_) {}

      setTimeout(() => {
        try { rec.wrap.remove(); } catch (_) {}
        try { rec.backdrop.remove(); } catch (_) {}
        if (typeof rec.release === 'function') rec.release();
        if (typeof rec.opts.onClose === 'function') {
          try { rec.opts.onClose(); } catch (e) { Logger.error('modal', 'onClose threw', e); }
        }
        EventBus.emit('modal:closed', { id: rec.opts.id });
      }, 200);

      return true;
    };

    const closeTop = () => close(null);
    const closeAll = () => { while (stack.length) close(null); };

    // Escape закрывает верхнюю модалку.
    document.addEventListener('keydown', (ev) => {
      if (ev.key !== 'Escape' && ev.key !== 'Esc') return;
      const top = stack[stack.length - 1];
      if (!top) return;
      if (!top.opts.closableByEsc) return;
      ev.preventDefault();
      ev.stopPropagation();
      closeTop();
    }, true);

    const confirm = (opts) => new Promise((resolve) => {
      const o = Object.assign({
        title: 'Подтверждение',
        message: '',
        okLabel: 'Да',
        cancelLabel: 'Отмена',
        variant: 'primary'
      }, opts || {});
      open({
        id: uid('confirm'),
        title: o.title,
        body: o.message,
        closableByBackdrop: false,
        closableByEsc: true,
        actions: [
          { label: o.cancelLabel, variant: 'ghost', onClick: () => resolve(false) },
          { label: o.okLabel, variant: o.variant, onClick: () => resolve(true) }
        ]
      });
    });

    const alert = (opts) => new Promise((resolve) => {
      const o = Object.assign({
        title: 'Сообщение',
        message: '',
        okLabel: 'Понятно'
      }, opts || {});
      open({
        id: uid('alert'),
        title: o.title,
        body: o.message,
        closableByBackdrop: true,
        closableByEsc: true,
        actions: [
          { label: o.okLabel, variant: 'primary', onClick: () => resolve(true) }
        ]
      });
    });

    const prompt = (opts) => new Promise((resolve) => {
      const o = Object.assign({
        title: 'Ввод',
        message: '',
        placeholder: '',
        defaultValue: '',
        okLabel: 'Принять',
        cancelLabel: 'Отмена',
        multiline: false
      }, opts || {});
      const wrap = document.createElement('div');
      if (o.message) {
        const p = document.createElement('p');
        p.style.margin = '0 0 var(--mc-s-3) 0';
        p.style.color = 'var(--mc-fg-1)';
        p.textContent = o.message;
        wrap.appendChild(p);
      }
      const field = o.multiline ? document.createElement('textarea') : document.createElement('input');
      field.className = 'mc-input';
      field.style.width = '100%';
      field.style.padding = '10px 12px';
      field.style.background = 'var(--mc-bg-0)';
      field.style.color = 'var(--mc-fg-0)';
      field.style.border = '1px solid var(--mc-line-1)';
      field.style.borderRadius = 'var(--mc-r-2)';
      field.style.fontFamily = 'inherit';
      if (!o.multiline) field.type = 'text';
      field.placeholder = o.placeholder;
      field.value = o.defaultValue;
      if (o.multiline) { field.rows = 5; field.style.resize = 'vertical'; }
      wrap.appendChild(field);

      const rec = open({
        id: uid('prompt'),
        title: o.title,
        body: wrap,
        closableByBackdrop: false,
        closableByEsc: true,
        actions: [
          { label: o.cancelLabel, variant: 'ghost', onClick: () => resolve(null) },
          { label: o.okLabel, variant: 'primary', onClick: () => resolve(field.value) }
        ]
      });
      setTimeout(() => { try { field.focus(); field.select && field.select(); } catch (_) {} }, 100);
      if (!rec) resolve(null);
    });

    return { open, close, closeTop, closeAll, confirm, alert, prompt, isOpen: () => stack.length > 0, stackSize: () => stack.length };
  })();

  /* ==========================================================================
     МОДУЛЬ 6. UIComponents
     Фабрики базовых UI-элементов. Ничего не рисуют в DOM сами — возвращают
     готовые узлы, чтобы вызывающий код сам решал, куда их вставлять.
     ========================================================================== */

  const UIComponents = (() => {
    const el = (tag, opts, children) => {
      const node = document.createElement(tag);
      const o = opts || {};
      if (o.className) node.className = o.className;
      if (o.text != null) node.textContent = String(o.text);
      if (o.html != null) node.innerHTML = String(o.html);
      if (o.attrs && isPlainObject(o.attrs)) {
        for (const k of Object.keys(o.attrs)) {
          const v = o.attrs[k];
